<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>samson 量化情报台 - 2026-11-20</title>
  <style>
    :root {
      --bg: #ffffff;
      --panel: #ffffff;
      --ink: #202124;
      --muted: #5f6368;
      --line: #dadce0;
      --blue: #1a73e8;
      --red: #ea4335;
      --yellow: #fbbc04;
      --green: #34a853;
      --blue-soft: #e8f0fe;
      --green-soft: #e6f4ea;
      --yellow-soft: #fef7e0;
      --red-soft: #fce8e6;
      --shadow: 0 1px 2px rgba(60, 64, 67, 0.16), 0 8px 24px rgba(60, 64, 67, 0.10);
      --radius: 16px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background:
        radial-gradient(circle at top left, rgba(66, 133, 244, 0.07), transparent 30%),
        radial-gradient(circle at top right, rgba(251, 188, 4, 0.08), transparent 26%),
        var(--bg);
      color: var(--ink);
      font-family: "Google Sans", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    button,
    input,
    select {
      font: inherit;
    }

    .shell {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 5;
      display: grid;
      grid-template-columns: minmax(220px, 1fr) minmax(280px, 620px);
      gap: 24px;
      align-items: center;
      padding: 16px 32px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(18px);
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 12px;
      min-width: 0;
    }

    .brand h1 {
      display: flex;
      gap: 10px;
      align-items: center;
      margin: 0;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.02em;
      white-space: nowrap;
    }

    .brand h1::before {
      content: "";
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background:
        conic-gradient(from 0deg, var(--blue) 0 25%, var(--red) 0 50%, var(--yellow) 0 75%, var(--green) 0 100%);
      box-shadow: inset 0 0 0 7px #fff;
    }

    .date-pill {
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 170px 170px 150px;
      gap: 10px;
    }

    .control {
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel);
      color: var(--ink);
      padding: 0 12px;
      outline: none;
    }

    .control:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.14);
    }

    .layout {
      display: grid;
      grid-template-columns: 260px minmax(420px, 1fr) 420px;
      gap: 22px;
      padding: 24px 32px 36px;
    }

    .rail,
    .detail {
      position: sticky;
      top: 86px;
      height: calc(100vh - 112px);
      overflow: auto;
    }

    .rail,
    .detail,
    .feed {
      min-width: 0;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 18px;
    }

    .metric {
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--panel);
      padding: 12px;
      box-shadow: 0 1px 2px rgba(60, 64, 67, 0.08);
    }

    .metric:nth-child(1) { border-top: 3px solid var(--blue); }
    .metric:nth-child(2) { border-top: 3px solid var(--red); }
    .metric:nth-child(3) { border-top: 3px solid var(--yellow); }
    .metric:nth-child(4) { border-top: 3px solid var(--green); }

    .metric b {
      display: block;
      font-size: 22px;
      line-height: 1;
    }

    .metric span {
      display: block;
      margin-top: 7px;
      color: var(--muted);
      font-size: 12px;
    }

    .section-label {
      margin: 18px 0 8px;
      color: var(--blue);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .category-list {
      display: grid;
      gap: 7px;
    }

    .category-button {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
      width: 100%;
      min-height: 38px;
      border: 1px solid transparent;
      border-radius: 999px;
      background: transparent;
      color: var(--ink);
      padding: 8px 10px;
      text-align: left;
      cursor: pointer;
    }

    .category-button:hover,
    .category-button.active {
      border-color: transparent;
      background: var(--blue-soft);
      color: #174ea6;
    }

    .count {
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .source-list {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .source-list li {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
      font-size: 13px;
    }

    .feed-header {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      margin-bottom: 12px;
    }

    .feed-header h2 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
    }

    .result-count {
      color: var(--muted);
      font-size: 13px;
    }

    .items {
      display: grid;
      gap: 10px;
    }

    .section-group-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 2px 4px;
      margin-top: 10px;
      border-bottom: 2px solid var(--line);
    }

    .section-group-header:first-child {
      margin-top: 0;
    }

    .section-group-title {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .section-group-header[data-section="deep_learning_quant"] .section-group-title { color: var(--blue); }
    .section-group-header[data-section="ai_quant_tools"] .section-group-title { color: var(--green); }
    .section-group-header[data-section="daily_news"] .section-group-title { color: var(--yellow); }

    .section-group-count {
      color: var(--muted);
      font-size: 12px;
    }

    .item {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--panel);
      box-shadow: 0 1px 2px rgba(60, 64, 67, 0.10);
      padding: 18px;
      cursor: pointer;
      transition: border-color 140ms ease, transform 140ms ease, box-shadow 140ms ease;
    }

    .item::before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 4px;
      background: linear-gradient(90deg, var(--blue), var(--red), var(--yellow), var(--green));
    }

    .item[data-section="deep_learning_quant"]::before { background: var(--blue); }
    .item[data-section="ai_quant_tools"]::before { background: var(--green); }
    .item[data-section="daily_news"]::before { background: var(--yellow); }

    .item:hover,
    .item.active {
      border-color: #c6dafc;
      box-shadow: var(--shadow);
      transform: translateY(-2px);
    }

    .item-top {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 14px;
      align-items: start;
    }

    .item h3 {
      margin: 0;
      font-size: 16px;
      line-height: 1.28;
    }

    .score {
      min-width: 54px;
      border-radius: 999px;
      background: var(--blue-soft);
      color: #174ea6;
      padding: 6px 8px;
      text-align: center;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 10px 0;
      color: var(--muted);
      font-size: 12px;
    }

    .tag {
      border: 1px solid transparent;
      border-radius: 999px;
      background: #f1f3f4;
      padding: 3px 8px;
    }

    .tag:nth-child(1) { background: var(--blue-soft); color: #174ea6; }
    .tag:nth-child(2) { background: var(--green-soft); color: #137333; }
    .tag:nth-child(3) { background: var(--yellow-soft); color: #8a5a00; }
    .tag:nth-child(4) { background: var(--red-soft); color: #b3261e; }

    .summary {
      margin: 0;
      color: #30342d;
      font-size: 14px;
      line-height: 1.45;
    }

    .reference-link {
      display: inline-flex;
      width: fit-content;
      border-top: 1px solid var(--line);
      color: var(--blue);
      padding-top: 9px;
      text-decoration: none;
      font-size: 13px;
      font-weight: 800;
    }

    .reader-format {
      display: grid;
      gap: 10px;
      margin-top: 10px;
    }

    .reader-format.compact {
      gap: 8px;
    }

    .reader-block {
      border-top: 1px solid var(--line);
      padding-top: 9px;
    }

    .reader-block:first-child {
      border-top: 0;
      padding-top: 0;
    }

    .reader-block h4 {
      margin: 0 0 5px;
      color: var(--blue);
      font-size: 12px;
      font-weight: 700;
    }

    .reader-block p,
    .reader-block li {
      margin: 0;
      color: #30342d;
      font-size: 13px;
      line-height: 1.5;
    }

    .reader-block ol {
      margin: 0;
      padding-left: 18px;
    }

    .reader-reference {
      color: var(--blue);
      text-decoration: none;
      font-size: 13px;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .reference-url {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .detail {
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--panel);
      box-shadow: var(--shadow);
      padding: 18px;
    }

    .detail h2 {
      margin: 0 0 12px;
      font-size: 20px;
      line-height: 1.2;
    }

    .detail-block {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
    }

    .detail-block h3 {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.02em;
    }

    .detail-block p,
    .detail-block li {
      color: #30342d;
      font-size: 14px;
      line-height: 1.55;
    }

    .detail-block ul {
      margin: 0;
      padding-left: 18px;
    }

    .breakdown {
      display: grid;
      gap: 8px;
    }

    .bar {
      display: grid;
      grid-template-columns: 118px 1fr 40px;
      gap: 8px;
      align-items: center;
      color: var(--muted);
      font-size: 12px;
    }

    .bar-track {
      height: 7px;
      overflow: hidden;
      border-radius: 999px;
      background: #e7eadf;
    }

    .bar-fill {
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--blue), var(--green), var(--yellow), var(--red));
    }

    .open-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 38px;
      margin-top: 16px;
      border: 1px solid var(--blue);
      border-radius: var(--radius);
      color: var(--blue);
      text-decoration: none;
      padding: 0 12px;
      font-weight: 700;
    }

    .feedback-row {
      display: flex;
      gap: 6px;
      align-items: center;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--line);
    }

    .feedback-btn {
      background: #f1f3f4;
      border: 1px solid transparent;
      border-radius: 999px;
      padding: 3px 10px;
      font-size: 13px;
      cursor: pointer;
      transition: background 120ms, border-color 120ms;
    }

    .feedback-btn:hover { background: var(--blue-soft); }
    .feedback-btn.active-up { background: var(--green-soft); border-color: var(--green); }
    .feedback-btn.active-down { background: var(--red-soft); border-color: var(--red); }

    .feedback-hint {
      color: var(--muted);
      font-size: 11px;
    }

    .empty {
      border: 1px dashed var(--line);
      border-radius: var(--radius);
      padding: 28px;
      color: var(--muted);
      background: var(--panel);
    }

    @media (max-width: 1180px) {
      .layout {
        grid-template-columns: 220px 1fr;
      }

      .detail {
        position: static;
        grid-column: 1 / -1;
        height: auto;
      }
    }

    @media (max-width: 820px) {
      .topbar {
        grid-template-columns: 1fr;
        padding: 14px;
      }

      .brand {
        display: grid;
        gap: 4px;
      }

      .brand h1 {
        white-space: normal;
        font-size: 21px;
      }

      .controls {
        grid-template-columns: 1fr;
      }

      .layout {
        grid-template-columns: 1fr;
        padding: 14px;
      }

      .rail,
      .detail {
        position: static;
        height: auto;
      }

      .metric-grid {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>

sight-driven video agent that transforms long-video reasoning from reactive retrieval into predictive exploration. Rather than blindly probing the timeline, ForeSeek forms visually grounded expectations over unseen temporal regions, verifies them through targeted observations, and continuously refines its search based on emerging evidence, where failed expectations serve as informative signals for principled backtracking. Furthermore, we develop a two-stage training framework that equips MLLMs with foresight-guided reasoning and efficient decision making. Extensive experiments on five long-video benchmarks demonstrate that ForeSeek consistently improves the efficiency--accuracy trade-off of long-video reasoning, achieving competitive or superior accuracy while observing $2.5$--$4.4\\times$ fewer frames than the strongest search-based agent. Code is available at https://github.com/harry0021/ForeSeek", "abstract": "Long-form video understanding, as a fundamental yet crucial vision task, is being revolutionized by multimodal large language model (MLLM)-based video agents. However, the retrieval-driven nature inherent to these agents creates a significant bottleneck, forcing them to reactively fetch clips based on local saliency without a global temporal plan. To address this, we present ForeSeek, a foresight-driven video agent that transforms long-video reasoning from reactive retrieval into predictive exploration. Rather than blindly probing the timeline, ForeSeek forms visually grounded expectations over unseen temporal regions, verifies them through targeted observations, and continuously refines its search based on emerging evidence, where failed expectations serve as informative signals for principled backtracking. Furthermore, we develop a two-stage training framework that equips MLLMs with foresight-guided reasoning and efficient decision making. Extensive experiments on five long-video benchmarks demonstrate that ForeSeek consistently improves the efficiency--accuracy trade-off of long-video reasoning, achieving competitive or superior accuracy while observing $2.5$--$4.4\\times$ fewer frames than the strongest search-based agent. Code is available at https://github.com/harry0021/ForeSeek", "content_hash": "19f6cc15eeebb642f4bf3f34507b686321a4440ed47f5fc668e9ec996dbb8f4b", "category": "LLM / Agents for Quant", "tags": ["agent", "large language model", "reasoning"], "language": "en", "metadata": {"arxiv_categories": ["cs.AI"]}, "one_line_summary": "把视频 agent 从「见什么抓什么」改成「先预测、再定点验证、落空即回溯」，在五个长视频基准上精度持平或更高，采样帧数比最强搜索 agent 少 2.5–4.4 倍", "technical_summary": "长视频理解的现有 agent 是检索驱动的：按局部显著性一帧帧盲目取片段，没有全局时间规划，导致帧预算被大量浪费。ForeSeek 反过来先对「还没看过的时间区间」生成有视觉依据的预期（比如某段应该出现什么事件），再用定点采样去验证；预期落空不是错误，而是被当作回溯信号，推动 agent 重新规划搜索路径。配套的是一个两阶段训练框架，第一阶段教会模型前瞻式推理，第二阶段优化决策效率（何时停、往哪跳）。在五个长视频基准上，精度与最强搜索式 agent 持平或更高，同时观测帧数只有后者的 1/2.5 到 1/4.4，代码已放在 github.com/harry0021/ForeSeek。", "key_points": ["预期落空被当作回溯信号而非失败，五基准精度持平或更高，帧数仅为最强搜索 agent 的 1/2.5–1/4.4", "代码开源（harry0021/ForeSeek），但需 MLLM 两阶段微调加视频抽帧管线，复现算力与工程成本中等偏高", "全部实验都在视频 QA 基准上，没有任何金融数据或成本/收益口径验证，跨域迁移完全未测"], "quant_relevance": "研究工具 / 工作流提效：给「预算受限的信息检索 agent」提供了一套可复用的预测—验证—回溯控制循环；数据工程：长视频/监控/路演录像这类另类数据的低成本抽样方案", "possible_use_case": "把这套预测—验证—回溯循环搬到 10-K / 招股书 / 电话会转写的长文档 agent 上：先让模型对「产能扩张可能写在哪一节」生成预期，再定点读取该段落，命中就继续、落空就回跳到上一层目录重规划，目标是单份文档的 token 消耗压到现有 RAG agent 的 1/3，同时记录答案准确率是否下降；先拿 200 份年报做离线对照实验再决定是否上线。", "limitations": "实验对象是长视频问答基准，评价指标是 QA 准确率，没有任何金融数据集、交易成本或因子有效性口径；把「帧预算」映射成「token 预算或数据采购预算」是类比而非原文验证，金融文本的信号稀疏度远高于视频事件，预期落空的频率会大幅上升，回溯可能退化成穷举；两阶段训练需微调 MLLM，复现门槛不低；基准本身存在训练集泄漏与标注噪声的常见风险，2.5–4.4 倍效率优势需要在自有数据上重测才可信。", "read_priority": "中", "key_figures_md": "- **效率—精度权衡主图（arXiv HTML 版，见 https://arxiv.org/html/2611.26024）**：横轴为观测帧数、纵轴为基准准确率，ForeSeek 曲线整体位于搜索式 agent 的左上方，帧数减少 2.5–4.4 倍而准确率不降\n- **五基准结果汇总表（同上 HTML 版）**：五个长视频基准上 ForeSeek 与最强搜索 agent 的准确率逐项对比，以及对应的平均采样帧数\n- [原文图表（HTML版）](https://arxiv.org/html/2611.26024)", "relevance_score": 6.6, "novelty_score": 9.78, "academic_score": 10.0, "discussion_score": 2.0, "actionable_score": 7.5, "final_score": 7.236, "display_title": "量化大模型 / 智能体研究论文", "tldr": "把视频 agent 从「见什么抓什么」改成「先预测、再定点验证、落空即回溯」，在五个长视频基准上精度持平或更高，采样帧数比最强搜索 agent 少 2.5–4.4 倍", "core_value": "对你的量化工作帮助：把它拆成一个量化大模型 / 智能体复现任务，先验证量化大模型 / 智能体是否真的带来样本外提升，再检查交易成本、数据泄漏和换手约束。", "key_points_list": ["预期落空被当作回溯信号而非失败，五基准精度持平或更高，帧数仅为最强搜索 agent 的 1/2.5–1/4.4", "代码开源（harry0021/ForeSeek），但需 MLLM 两阶段微调加视频抽帧管线，复现算力与工程成本中等偏高", "全部实验都在视频 QA 基准上，没有任何金融数据或成本/收益口径验证，跨域迁移完全未测"], "reference_url": "http://arxiv.org/abs/2611.26024v1", "report_sections": ["ai_quant_tools"], "report_section_labels": ["AI 量化工具"], "category_label": "量化大模型 / 智能体", "priority_label": "中", "source_type_label": "论文"}, {"id": "fc0d7a85cb1806c26d26a4ad19b9a63067615eff0e64938ad926953af103934d", "source": "arXiv", "source_type": "paper", "title": "Quantum Calibration of Local-Volatility Surfaces from Sparse Option Quotes", "url": "http://arxiv.org/abs/2611.25344v1", "authors": ["Kentaro Hoshisashi"], "published_at": "2026-11-19", "collected_at": "2026-11-20T03:52:39Z", "raw_text": "Calibrating a volatility surface from sparse option prices requires repeated solutions of a pricing equation as the volatility parameters change. We implement a hybrid quantum and classical method for this inverse problem using the Dupire local-volatility model. A positive coefficient representation specifies the local variance, and linear combinations of Hamiltonian simulations approximate the associated pricing evolution. The circuit propagates through successive maturity intervals and evaluates discrepancies at the observed strikes. Measurement counts provide the objective values used by a classical optimiser to update the volatility coefficients. We implement this calibration cycle in a logical gate simulator and assess it alongside classical pricing solvers and alternative surface models. Multiple-maturity synthetic examples illustrate the reconstruction of smiles and skews, while a separate small circuit experiment tests the complete measured calibration. The comparisons quantify the effects of model flexibility, pricing approximation and measurement precision. Recorded gate counts and sampling budgets identify the main computational costs of the implementation.", "abstract": "Calibrating a volatility surface from sparse option prices requires repeated solutions of a pricing equation as the volatility parameters change. We implement a hybrid quantum and classical method for this inverse problem using the Dupire local-volatility model. A positive coefficient representation specifies the local variance, and linear combinations of Hamiltonian simulations approximate the associated pricing evolution. The circuit propagates through successive maturity intervals and evaluates discrepancies at the observed strikes. Measurement counts provide the objective values used by a classical optimiser to update the volatility coefficients. We implement this calibration cycle in a logical gate simulator and assess it alongside classical pricing solvers and alternative surface models. Multiple-maturity synthetic examples illustrate the reconstruction of smiles and skews, while a separate small circuit experiment tests the complete measured calibration. The comparisons quantify the effects of model flexibility, pricing approximation and measurement precision. Recorded gate counts and sampling budgets identify the main computational costs of the implementation.", "content_hash": "f66a0d0de6693a8cc0c7d17110032d3d928aef30d350c1eb1530f62cf1a433a3", "category": "Options / Volatility", "tags": ["option", "pricing", "simulator", "variance", "volatility"], "language": "en", "metadata": {"arxiv_categories": ["q-fin.CP"]}, "one_line_summary": "用哈密顿量模拟的线性组合分段传播 Dupire 局部方差，在逻辑门模拟器上校准稀疏期权报价的波动率曲面，摘要未给出精度或加速比", "technical_summary": "要解决的问题是：稀疏期权报价下每更新一次波动率参数，就要重解一遍定价方程，校准成本随参数维度快速上升。做法是把 Dupire 局部波动率模型中的局部方差写成正系数表示（平方形式保证非负），并用若干哈密顿量模拟的线性组合（LCU 型分解）来近似对应的定价演化算符；线路按期限区间逐段向前传播，在每个观测执行价上计算模型价与市场价的偏差，把测量计数转成目标函数值，交给经典优化器更新波动率系数，形成「量子估值 + 经典优化」的闭环。实验分两块：多期限合成算例用于重建微笑与偏斜形态，另有一个小规模线路做完整含测量的校准测试，全部在逻辑门模拟器上完成，并与经典定价求解器、替代曲面模型（参数化曲面）做对照；成本用记录的量子门数与采样预算衡量。摘要只说明对比量化了「模型灵活性、定价近似误差、测量精度」三者的影响，没有披露任何夏普、定价误差、加速倍数或门数的具体数值。", "key_points": ["分段哈密顿量模拟传播局部方差演化，测量计数驱动经典优化器更新系数；原文缺乏量化指标，结论待复核", "仅逻辑门模拟器加合成多期限报价，无真实期权链；复现需量子线路模拟栈与 Dupire 正演求解器", "理想模拟器无硬件噪声，未计入买卖价差与离散股息，也未证明对经典有限差分的实际加速"], "quant_relevance": "研究工具 / 工作流提效（定价方程反复求解的加速探索）；风险建模（稀疏报价下的波动率曲面校准）", "possible_use_case": "短期不可落地交易。可操作的跟进方式是：把同一套稀疏执行价报价数据（例如某指数期权 5 个期限 × 7 个执行价）喂给现有 CPU 端 Dupire 校准器（QuantLib LocalVolSurface 的有限差分正演），记录经典侧的目标函数评估次数与耗时，再与文中报告的门数/采样预算换算对比，先判定这条路线在 3–5 年内是否有成本交叉点。", "limitations": "全文在逻辑门模拟器上运行，等于零噪声、全连通、无退相干与读取误差的理想硬件假设，实际量子设备上的测量精度会显著劣化目标函数；数据全部为合成的多期限算例，没有真实期权链的买卖价差、离散股息、美式提前行权与流动性缺失问题；未给出任何定价误差（如 IV 均方根误差）或 wall-clock 加速数字，无法判断相对经典有限差分/蒙特卡洛的竞争力；稀疏报价下局部波动率本身是不适定反问题，需要正则化，文中未说明如何处理解的稳定性与过拟合；摘要信息密度低，具体图表与数值须查 arXiv HTML 版（https://arxiv.org/html/2611.25344）核实，本摘要基于定性描述。", "read_priority": "低", "key_figures_md": "", "relevance_score": 7.8, "novelty_score": 9.78, "academic_score": 9.982, "discussion_score": 2.0, "actionable_score": 5.5, "final_score": 7.193, "display_title": "期权、定价、方差、波动率研究论文", "tldr": "用哈密顿量模拟的线性组合分段传播 Dupire 局部方差，在逻辑门模拟器上校准稀疏期权报价的波动率曲面，摘要未给出精度或加速比", "core_value": "对你的量化工作帮助：把它拆成一个期权 / 波动率复现任务，先验证期权、定价、方差、波动率是否真的带来样本外提升，再检查交易成本、数据泄漏和换手约束。", "key_points_list": ["分段哈密顿量模拟传播局部方差演化，测量计数驱动经典优化器更新系数；原文缺乏量化指标，结论待复核", "仅逻辑门模拟器加合成多期限报价，无真实期权链；复现需量子线路模拟栈与 Dupire 正演求解器", "理想模拟器无硬件噪声，未计入买卖价差与离散股息，也未证明对经典有限差分的实际加速"], "reference_url": "http://arxiv.org/abs/2611.25344v1", "report_sections": ["ai_quant_tools"], "report_section_labels": ["AI 量化工具"], "category_label": "期权 / 波动率", "priority_label": "低", "source_type_label": "论文"}, {"id": "30709f8b76d53878469da4abb519cd719592979ac5c8ffd45d5c3fd792533525", "source": "arXiv", "source_type": "paper", "title": "A joint framework for SPX, VIX and VXX", "url": "http://arxiv.org/abs/2611.25047v1", "authors": ["Martino Grasselli", "Andrea Stanghellini", "Sara Svaluto-Ferro"], "published_at": "2026-11-18", "collected_at": "2026-11-20T03:52:39Z", "raw_text": "Options on VXX bring the dynamics of the VIX futures curve into the joint SPX-VIX calibration problem. We construct a common model by specifying the VIX and then recovering instantaneous SPX variance from the requirement that its risk-neutral conditional expected average over the next thirty days equals the squared VIX. With truncated signatures of time-extended polynomial diffusions, this recovery reduces to finite-dimensional linear algebra and gives explicit access to the futures underlying VXX. The same specification therefore governs equity variance and rolling volatility exposure. To accommodate flexible specifications while respecting variance nonnegativity, we develop a regularized model and quantify the pricing errors of its tractable VIX and VXX proxies. Applications to short-dated option smiles illustrate joint calibration across the three markets, with Monte Carlo estimates of the proxy error bounds well below quoted bid-ask spreads.", "abstract": "Options on VXX bring the dynamics of the VIX futures curve into the joint SPX-VIX calibration problem. We construct a common model by specifying the VIX and then recovering instantaneous SPX variance from the requirement that its risk-neutral conditional expected average over the next thirty days equals the squared VIX. With truncated signatures of time-extended polynomial diffusions, this recovery reduces to finite-dimensional linear algebra and gives explicit access to the futures underlying VXX. The same specification therefore governs equity variance and rolling volatility exposure. To accommodate flexible specifications while respecting variance nonnegativity, we develop a regularized model and quantify the pricing errors of its tractable VIX and VXX proxies. Applications to short-dated option smiles illustrate joint calibration across the three markets, with Monte Carlo estimates of the proxy error bounds well below quoted bid-ask spreads.", "content_hash": "e5524b10560614cef67939e8f57f828c4fddd3f227d52ac1cf2dbe5f341a7a59", "category": "Options / Volatility", "tags": ["exposure", "option", "pricing", "risk", "variance", "volatility"], "language": "en", "metadata": {"arxiv_categories": ["q-fin.MF"]}, "one_line_summary": "把 VXX 期权纳入 SPX-VIX 联合校准，用截断签名将瞬时方差恢复化为有限维线性代数，短期限微笑代理误差低于买卖价差", "technical_summary": "解决 SPX、VIX 与 VXX 三市场期权无法统一校准的问题：先指定 VIX 过程，再利用 SPX 瞬时方差在风险中性下未来 30 天条件期望均值等于 VIX 平方的约束反解瞬时方差。方法使用时间扩展多项式扩散的截断签名，使反解退化为有限维线性代数，并显式得到 VXX 所依赖的 VIX 期货。为兼顾灵活性与方差非负，构造正则化模型，并量化可处理 VIX/VXX 代理的定价误差。短期限期权微笑展示三市场联合校准，Monte Carlo 估计的代理误差界低于市场报价买卖价差。", "key_points": ["指定 VIX 后按 30 天风险中性均值约束反解 SPX 瞬时方差，截断签名把恢复化为有限维线性代数并显式得到 VIX 期货。", "需 SPX/VIX/VXX 期权及 VIX 期货数据；正则化保证方差非负，Monte Carlo 代理误差界低于买卖价差，校准可复现。", "局限：仅展示短期限微笑，未给跨期限/压力期样本外结果；代理误差虽低于价差，但未计模型风险、参数不稳定与实盘对冲成本。"], "quant_relevance": "风险建模：为 SPX/VIX/VXX 联动定价与波动率对冲提供统一校准框架；研究工具：签名方法把高维校准降为有限维线性代数。", "possible_use_case": "在现有 SPX-VIX 校准流程中加入 VXX 期权与 VIX 期货曲线约束，用于短期限 VXX 期权做市报价和 delta/vega 对冲。", "limitations": "原文仅报告短期限期权微笑与 Monte Carlo 代理误差界；未给出跨多年样本外校准、参数稳定性、买卖价差之外的对冲/交易成本，正则化与截断阶数选择可能过拟合；VXX 产品规则和期货展期需单独建模。", "read_priority": "中", "key_figures_md": "- **短期限期权微笑图（HTML 全文内）**：SPX、VIX、VXX 三市场联合校准的短期限期权微笑拟合效果\n- **代理误差界表/图（HTML 全文内）**：Monte Carlo 估计的 VIX/VXX 代理定价误差界与报价买卖价差对比\n- [原文图表（HTML版）](https://arxiv.org/html/2611.25047)", "relevance_score": 8.5, "novelty_score": 9.565, "academic_score": 9.699, "discussion_score": 2.0, "actionable_score": 4.5, "final_score": 7.118, "display_title": "期权、定价、风险、方差研究论文", "tldr": "把 VXX 期权纳入 SPX-VIX 联合校准，用截断签名将瞬时方差恢复化为有限维线性代数，短期限微笑代理误差低于买卖价差", "core_value": "对你的量化工作帮助：把它拆成一个期权 / 波动率复现任务，先验证期权、定价、风险、方差是否真的带来样本外提升，再检查交易成本、数据泄漏和换手约束。", "key_points_list": ["指定 VIX 后按 30 天风险中性均值约束反解 SPX 瞬时方差，截断签名把恢复化为有限维线性代数并显式得到 VIX 期货。", "需 SPX/VIX/VXX 期权及 VIX 期货数据；正则化保证方差非负，Monte Carlo 代理误差界低于买卖价差，校准可复现。", "局限：仅展示短期限微笑，未给跨期限/压力期样本外结果；代理误差虽低于价差，但未计模型风险、参数不稳定与实盘对冲成本。"], "reference_url": "http://arxiv.org/abs/2611.25047v1", "report_sections": ["ai_quant_tools"], "report_section_labels": ["AI 量化工具"], "category_label": "期权 / 波动率", "priority_label": "中", "source_type_label": "论文"}, {"id": "a28ce2b704550023392bb5ebe185e194ac6013153d48ec9e9e3b67aede886c8f", "source": "arXiv", "source_type": "paper", "title": "Falsifiable Compositional Reasoning in Time Series Forecasting", "url": "http://arxiv.org/abs/2611.25388v1", "authors": ["Hao Xue"], "published_at": "2026-11-19", "collected_at": "2026-11-20T03:54:20Z", "raw_text": "Time series foundation models as well as the language-guided analytical agents achieve strong accuracy on standard chronological benchmarks. However, models that rank highest on historical validation splits often degrade across non-stationary regime transitions. We hypothesise that this gap arises from using historical backtesting as an open-ended search and model-selection objective instead of using it to test pre-specified compositional assumptions. Real-world time series are generated by recurring latent primitives that co-move within finite historical windows. Under strong historical co-movement, chronological holdout error cannot separate predictors that learn invariant couplings among primitives from predictors that fit transient historical correlations. Searching over large pools of architectures, hyperparameters, or chain-of-thought rules further biases selection toward historical shortcuts. Through theoretical analysis and diagnostic experiments on a controlled multi-primitive benchmark and German day-ahead electricity prices, we show that expanding validation search fails to improve out-of-regime accuracy, and that decomposing primitives without an ex-ante falsification test still breaks down when residual correlations shift. Hence, we propose formulating time series forecasting and reasoning around falsifiable compositional hypotheses that combine neural primitive encoders, explicit coupling constraints, and training-calibrated falsification tests.", "abstract": "Time series foundation models as well as the language-guided analytical agents achieve strong accuracy on standard chronological benchmarks. However, models that rank highest on historical validation splits often degrade across non-stationary regime transitions. We hypothesise that this gap arises from using historical backtesting as an open-ended search and model-selection objective instead of using it to test pre-specified compositional assumptions. Real-world time series are generated by recurring latent primitives that co-move within finite historical windows. Under strong historical co-movement, chronological holdout error cannot separate predictors that learn invariant couplings among primitives from predictors that fit transient historical correlations. Searching over large pools of architectures, hyperparameters, or chain-of-thought rules further biases selection toward historical shortcuts. Through theoretical analysis and diagnostic experiments on a controlled multi-primitive benchmark and German day-ahead electricity prices, we show that expanding validation search fails to improve out-of-regime accuracy, and that decomposing primitives without an ex-ante falsification test still breaks down when residual correlations shift. Hence, we propose formulating time series forecasting and reasoning around falsifiable compositional hypotheses that combine neural primitive encoders, explicit coupling constraints, and training-calibrated falsification tests.", "content_hash": "2aa1691ee230e829d64972f57b94590e98becc2b053d8f6bbe52e43dd9514a61", "category": "Machine Learning for Finance", "tags": ["backtesting", "chain-of-thought", "forecasting", "neural", "reasoning", "time series"], "language": "en", "metadata": {"arxiv_categories": ["cs.AI"]}, "one_line_summary": "可证伪基元耦合假设替代开放式回测搜索：德国日前电价上扩大验证搜索不提升跨 regime 精度", "technical_summary": "历史回测被当成开放式搜索和模型选择目标，导致高验证集排名的预测器在非平稳 regime 切换后失效。用受控多基元基准和德国日前电价做诊断：扩大验证搜索不能提升跨 regime 精度；只分解潜在基元、不做事前证伪，残差相关性一漂移就崩。主张围绕可证伪的组合假设建模：神经基元编码器 + 显式耦合约束 + 训练期校准的证伪检验。原文未给出夏普、精度或收益数字。", "key_points": ["原文无夏普/精度数字；德国日前电价实验显示扩大验证搜索不提升跨 regime 精度", "需先定义潜在基元与耦合约束；无代码，复现难度高，但德国电价数据可获取", "仅摘要级信息，无样本外数值、交易成本与过拟合检验；电价结论迁移到股票期货未验证"], "quant_relevance": "风险建模 / 研究工具 / 工作流提效", "possible_use_case": "在现有因子或模型回测流程中加入事前可证伪检验：先固定基元耦合假设，再用滚动 regime 外样本检验，淘汰仅靠历史相关性入选的模型。", "limitations": "目前仅为摘要级信息，无样本外夏普/精度、交易成本、滑点与多重检验校正；德国日前电价结论迁移到股票、期货、外汇未验证；无代码与数据拆分细节，复现风险高。", "read_priority": "中", "key_figures_md": "- **HTML 版**：原文图表见 https://arxiv.org/html/2611.25388（摘要未给出具体图号与指标）\n- [原文图表（HTML版）](https://arxiv.org/html/2611.25388)", "relevance_score": 6.6, "novelty_score": 9.78, "academic_score": 10.0, "discussion_score": 2.0, "actionable_score": 6.5, "final_score": 7.036, "display_title": "回测、预测、时间序列研究论文", "tldr": "可证伪基元耦合假设替代开放式回测搜索：德国日前电价上扩大验证搜索不提升跨 regime 精度", "core_value": "对你的量化工作帮助：把它拆成一个金融机器学习复现任务，先验证回测、预测、时间序列是否真的带来样本外提升，再检查交易成本、数据泄漏和换手约束。", "key_points_list": ["原文无夏普/精度数字；德国日前电价实验显示扩大验证搜索不提升跨 regime 精度", "需先定义潜在基元与耦合约束；无代码，复现难度高，但德国电价数据可获取", "仅摘要级信息，无样本外数值、交易成本与过拟合检验；电价结论迁移到股票期货未验证"], "reference_url": "http://arxiv.org/abs/2611.25388v1", "report_sections": ["ai_quant_tools"], "report_section_labels": ["AI 量化工具"], "category_label": "金融机器学习", "priority_label": "中", "source_type_label": "论文"}, {"id": "3aaf49a178d7def852db238800b3d4cf1c6fda47837f0ba83d64768a3c674f8c", "source": "The Block", "source_type": "crypto_news", "title": "Tokenized Stocks Shrug Off the Crypto Selloff", "url": "https://www.theblock.co/newsletters/tokenization-briefing/2026-11-19-tokenized-stocks-shrug-off-crypto-selloff-442829", "authors": [], "published_at": "2026-11-19", "collected_at": "2026-11-20T04:00:50Z", "raw_text": "Tokenized Stocks Shrug Off the Crypto Selloff Bitcoin fell as low as $62k late Saturday, its sixth straight weekly decline. Meanwhile, tokenized stocks crossed $4 billion in onchain value for the first time on Nov 11. Tokenized stocks are now roughly five times their value on January 1. Tokenized stocks track equity prices, not crypto,   <script>
    const payload = JSON.parse(document.getElementById('dashboard-data').textContent);
    const items = payload.items || [];
    const categoryLabels = payload.category_labels || {};
    const priorityLabels = payload.priority_labels || {};
    const sourceTypeLabels = payload.source_type_labels || {};
    const state = {
      query: '',
      section: 'All',
      category: 'All',
      sort: 'score',
      activeId: items[0]?.id || null,
    };

    const priorityRank = { High: 3, Medium: 2, Low: 1, '高': 3, '中': 2, '低': 1 };
    const $ = (id) => document.getElementById(id);

    // --- Feedback ---
    const _feedbackStore = JSON.parse(localStorage.getItem('quant-feedback') || '{}');
    function getFeedback(id) { return _feedbackStore[id] || 0; }
    function setFeedback(id, signal) {
      if (_feedbackStore[id] === signal) { delete _feedbackStore[id]; signal = 0; }
      else { _feedbackStore[id] = signal; }
      localStorage.setItem('quant-feedback', JSON.stringify(_feedbackStore));
      fetch('http://localhost:8080/feedback', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id, signal }),
      }).catch(() => {});
    }

    function init() {
      $('report-date').textContent = payload.report_date + ' - 主力源：arXiv / 知乎 / QuantML / 大型论坛 - 生成时间 ' + payload.generated_at;
      $('metric-items').textContent = items.length;
      $('metric-categories').textContent = new Set(items.map((item) => item.category)).size;
      $('metric-high').textContent = items.filter((item) => priorityLabel(item.read_priority) === '高').length;
      $('metric-avg').textContent = averageScore(items).toFixed(1);

      buildSectionControls();
      buildCategoryControls();
      buildSourceList();
      bindControls();
      render();
    }

    function bindControls() {
      $('search').addEventListener('input', (event) => {
        state.query = event.target.value.trim().toLowerCase();
        render();
      });
      $('category-select').addEventListener('change', (event) => {
        state.category = event.target.value;
        render();
      });
      $('section-select').addEventListener('change', (event) => {
        state.section = event.target.value;
        render();
      });
      $('sort-select').addEventListener('change', (event) => {
        state.sort = event.target.value;
        render();
      });
    }

    function buildCategoryControls() {
      const counts = countBy(items, 'category');
      const categories = Object.keys(counts).sort();
      const select = $('category-select');
      select.innerHTML = option('All', `全部细分标签 (${items.length})`) +
        categories.map((category) => option(category, `${categoryLabel(category)} (${counts[category]})`)).join('');

      const list = $('category-list');
      list.innerHTML = categoryButton('All', items.length) +
        categories.map((category) => categoryButton(category, counts[category])).join('');

      list.querySelectorAll('button').forEach((button) => {
        button.addEventListener('click', () => {
          state.category = button.dataset.category;
          select.value = state.category;
          if (state.category === 'All') {
            state.section = 'All';
            $('section-select').value = 'All';
          }
          render();
        });
      });
    }

    function buildSectionControls() {
      const counts = payload.section_counts || {};
      const sections = payload.sections || [];
      const select = $('section-select');
      select.innerHTML = option('All', `全部主线 (${items.length})`) +
        sections
          .filter((section) => counts[section.key])
          .map((section) => option(section.key, `${section.label} (${counts[section.key]})`))
          .join('');

      const list = $('section-list');
      list.innerHTML = sectionButton('All', '全部', items.length) +
        sections
          .filter((section) => counts[section.key])
          .map((section) => sectionButton(section.key, section.label, counts[section.key]))
          .join('');

      list.querySelectorAll('button').forEach((button) => {
        button.addEventListener('click', () => {
          state.section = button.dataset.section;
          select.value = state.section;
          if (state.section === 'All') {
            state.category = 'All';
            $('category-select').value = 'All';
          }
          render();
        });
      });
    }

    function buildSourceList() {
      const stats = payload.source_stats || {};
      const entries = Object.entries(stats)
        .filter(([source]) => !source.startsWith('fetched:'))
        .sort((a, b) => b[1] - a[1]);
      $('source-list').innerHTML = entries.length
        ? entries.map(([source, count]) => `<li><span>${escapeHtml(source)}</span><b>${count}</b></li>`).join('')
        : '<li><span>暂无来源统计</span><b>0</b></li>';
    }

    function render() {
      let visible = items.filter(matchesFilters);
      visible = sortItems(visible);
      if (!visible.some((item) => item.id === state.activeId)) {
        state.activeId = visible[0]?.id || null;
      }

      $('feed-title').textContent = feedTitle();
      $('result-count').textContent = `展示 ${visible.length} 条 - 两条主线每条最多 ${payload.report_config.max_items_per_category} 条`;
      renderSectionActive();
      renderCategoryActive();
      renderItems(visible);
      renderDetail(visible.find((item) => item.id === state.activeId) || visible[0]);
    }

    function matchesFilters(item) {
      const sectionMatch = state.section === 'All' || (item.report_sections || []).includes(state.section);
      if (!sectionMatch) return false;
      const categoryMatch = state.category === 'All' || item.category === state.category;
      if (!categoryMatch) return false;
      if (!state.query) return true;
      const haystack = [
        item.title,
        item.display_title,
        item.source,
        item.source_type,
        item.category,
        categoryLabel(item.category),
        sectionLabel(item.report_sections?.[0]),
        sourceTypeLabel(item.source_type),
        priorityLabel(item.read_priority),
        item.one_line_summary,
        item.technical_summary,
        item.quant_relevance,
        item.possible_use_case,
        item.tldr,
        item.core_value,
        ...(item.key_points_list || []),
        item.reference_url,
      ].join(' ').toLowerCase();
      return haystack.includes(state.query);
    }

    function sortItems(list) {
      return [...list].sort((a, b) => {
        if (state.sort === 'priority') {
          return (priorityRank[b.read_priority] || 0) - (priorityRank[a.read_priority] || 0)
            || b.final_score - a.final_score;
        }
        if (state.sort === 'source') {
          return a.source.localeCompare(b.source) || b.final_score - a.final_score;
        }
        return b.final_score - a.final_score;
      });
    }

    function renderCategoryActive() {
      document.querySelectorAll('.category-button').forEach((button) => {
        button.classList.toggle('active', button.dataset.category === state.category);
      });
    }

    function renderSectionActive() {
      document.querySelectorAll('.section-button').forEach((button) => {
        button.classList.toggle('active', button.dataset.section === state.section);
      });
    }

    function itemCard(item) {
      const sec = item.report_sections?.[0] || 'other';
      const sig = getFeedback(item.id);
      return `
        <article class="item ${item.id === state.activeId ? 'active' : ''}"
                 data-id="${escapeAttr(item.id)}"
                 data-section="${escapeAttr(sec)}">
          <div class="item-top">
            <h3>${escapeHtml(item.display_title || item.title)}</h3>
            <div class="score">${Number(item.final_score).toFixed(1)}</div>
          </div>
          <div class="meta">
            <span class="tag">${escapeHtml(categoryLabel(item.category))}</span>
            <span class="tag">${escapeHtml(item.source)}</span>
            <span class="tag">${escapeHtml(priorityLabel(item.read_priority))}</span>
          </div>
          ${readerFormat(item, true)}
          <div class="feedback-row">
            <button class="feedback-btn ${sig === 1 ? 'active-up' : ''}" data-feedback="1" title="有用">👍</button>
            <button class="feedback-btn ${sig === -1 ? 'active-down' : ''}" data-feedback="-1" title="跳过">👎</button>
            <span class="feedback-hint">${sig === 1 ? '已标记有用' : sig === -1 ? '已标记跳过' : ''}</span>
          </div>
        </article>
      `;
    }

    function sectionGroupHeader(section, count) {
      return `
        <div class="section-group-header" data-section="${escapeAttr(section.key)}">
          <span class="section-group-title">${escapeHtml(section.label)}</span>
          <span class="section-group-count">${count} 条</span>
        </div>
      `;
    }

    function renderItems(visible) {
      const container = $('items');
      if (!visible.length) {
        container.innerHTML = '<div class="empty">当前筛选条件下没有匹配内容。</div>';
        return;
      }

      let html = '';
      if (state.section === 'All') {
        // Group by section in defined order, with a header for each group
        const grouped = {};
        for (const item of visible) {
          const sec = item.report_sections?.[0] || 'other';
          if (!grouped[sec]) grouped[sec] = [];
          grouped[sec].push(item);
        }
        for (const section of (payload.sections || [])) {
          const group = grouped[section.key];
          if (!group || !group.length) continue;
          html += sectionGroupHeader(section, group.length);
          html += group.map((item) => itemCard(item)).join('');
        }
        // Append any items that fell into 'other' (shouldn't normally happen)
        if (grouped['other']?.length) {
          html += grouped['other'].map((item) => itemCard(item)).join('');
        }
      } else {
        html = visible.map((item) => itemCard(item)).join('');
      }

      container.innerHTML = html;
      container.querySelectorAll('.item').forEach((node) => {
        node.addEventListener('click', () => {
          state.activeId = node.dataset.id;
          render();
        });
      });
      container.querySelectorAll('.feedback-btn').forEach((btn) => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const itemNode = btn.closest('.item');
          setFeedback(itemNode.dataset.id, parseInt(btn.dataset.feedback, 10));
          render();
        });
      });
    }

    function renderDetail(item) {
      const detail = $('detail');
      if (!item) {
        detail.innerHTML = '<div class="empty">选择一条内容查看详情。</div>';
        return;
      }

      detail.innerHTML = `
        <h2>${escapeHtml(item.display_title || item.title)}</h2>
        <div class="meta">
          <span class="tag">${escapeHtml(categoryLabel(item.category))}</span>
          <span class="tag">${escapeHtml(sourceTypeLabel(item.source_type))}</span>
          <span class="tag">${escapeHtml(priorityLabel(item.read_priority))}</span>
        </div>

        ${readerFormat(item, false)}

        <div class="detail-block">
          <h3>评分拆解</h3>
          <div class="breakdown">
            ${bar('相关性', item.relevance_score)}
            ${bar('新颖度', item.novelty_score)}
            ${bar('学术性', item.academic_score)}
            ${bar('讨论度', item.discussion_score)}
            ${bar('可行动性', item.actionable_score)}
          </div>
        </div>

      `;
    }

    function readerFormat(item, compact) {
      const points = itemKeyPoints(item);
      return `
        <div class="reader-format ${compact ? 'compact' : ''}">
          <div class="reader-block">
            <h4>1. 这篇文章的太长不读</h4>
            <p>${escapeHtml(item.tldr || item.one_line_summary || '')}</p>
          </div>
          <div class="reader-block">
            <h4>2. 核心价值，对我量化的工作能够提供什么样的帮助</h4>
            <p>${escapeHtml(item.core_value || '')}</p>
          </div>
          <div class="reader-block">
            <h4>3. 关键核心点 / 论文或帖子摘要</h4>
            <ol>${points.map((point) => `<li>${escapeHtml(point)}</li>`).join('')}</ol>
          </div>
          <div class="reader-block">
            <h4>4. 原文链接</h4>
            ${referenceHtml(item)}
          </div>
        </div>
      `;
    }

    function itemKeyPoints(item) {
      const points = Array.isArray(item.key_points_list)
        ? item.key_points_list
        : (Array.isArray(item.key_points) ? item.key_points : []);
      const clean = points.filter(Boolean).slice(0, 3);
      return clean.length ? clean : ['需要打开原文进一步确认方法、数据和适用边界。'];
    }

    function referenceHtml(item) {
      const url = item.reference_url || '';
      if (!url) return '<p>暂无可打开链接</p>';
      return `
        <a class="reader-reference" href="${escapeAttr(url)}" target="_blank" rel="noopener noreferrer">打开原文</a>
        <small class="reference-url">${escapeHtml(url)}</small>
      `;
    }

    function bar(label, value) {
      const score = Number(value || 0);
      const width = Math.max(0, Math.min(100, score * 10));
      return `
        <div class="bar">
          <span>${label}</span>
          <div class="bar-track"><div class="bar-fill" style="width: ${width}%"></div></div>
          <b>${score.toFixed(1)}</b>
        </div>
      `;
    }

    function countBy(list, key) {
      return list.reduce((acc, item) => {
        acc[item[key]] = (acc[item[key]] || 0) + 1;
        return acc;
      }, {});
    }

    function averageScore(list) {
      if (!list.length) return 0;
      return list.reduce((sum, item) => sum + Number(item.final_score || 0), 0) / list.length;
    }

    function option(value, label) {
      return `<option value="${escapeAttr(value)}">${escapeHtml(label)}</option>`;
    }

    function sectionButton(section, label, count) {
      return `
        <button class="category-button section-button" type="button" data-section="${escapeAttr(section)}">
          <span>${escapeHtml(label)}</span>
          <span class="count">${count}</span>
        </button>
      `;
    }

    function categoryButton(category, count) {
      return `
        <button class="category-button" type="button" data-category="${escapeAttr(category)}">
          <span>${escapeHtml(category === 'All' ? '全部' : categoryLabel(category))}</span>
          <span class="count">${count}</span>
        </button>
      `;
    }

    function categoryLabel(category) {
      return categoryLabels[category] || category;
    }

    function sectionLabel(sectionKey) {
      const section = (payload.sections || []).find((item) => item.key === sectionKey);
      return section ? section.label : '其他';
    }

    function feedTitle() {
      const parts = [];
      if (state.section !== 'All') parts.push(sectionLabel(state.section));
      if (state.category !== 'All') parts.push(categoryLabel(state.category));
      return parts.length ? parts.join(' / ') : '今日情报';
    }

    function priorityLabel(priority) {
      return priorityLabels[priority] || priority;
    }

    function sourceTypeLabel(sourceType) {
      return sourceTypeLabels[sourceType] || sourceType;
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function escapeAttr(value) {
      return escapeHtml(value).replaceAll('`', '&#096;');
    }

    init();
  </script>
</body>
</html>
