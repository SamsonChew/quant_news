<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />

  <title>samson 量化情报台 - 2026-11-25</title>
  <style>
    :root {
      --bg: #ffffff;
      --panel: #ffffff;
      --ink: #202124;
      --muted: #5f6368;
      --line: #dadce0;
      --blue: #1a73e8;
      --red: #ea4335;
      --yellow: #fbbc04;
      --green: #34a853;
      --blue-soft: #e8f0fe;
      --green-soft: #e6f4ea;
      --yellow-soft: #fef7e0;
      --red-soft: #fce8e6;
      --shadow: 0 1px 2px rgba(60, 64, 67, 0.16), 0 8px 24px rgba(60, 64, 67, 0.10);
      --radius: 16px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background:
        radial-gradient(circle at top left, rgba(66, 133, 244, 0.07), transparent 30%),
        radial-gradient(circle at top right, rgba(251, 188, 4, 0.08), transparent 26%),
        var(--bg);
      color: var(--ink);
      font-family: "Google Sans", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    button,
    input,
    select {
      font: inherit;
    }

    .shell {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 5;
      display: grid;
      grid-template-columns: minmax(220px, 1fr) minmax(280px, 620px);
      gap: 24px;
      align-items: center;
      padding: 16px 32px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(18px);
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 12px;
      min-width: 0;
    }

    .brand h1 {
      display: flex;
      gap: 10px;
      align-items: center;
      margin: 0;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.02em;
      white-space: nowrap;
    }

    .brand h1::before {
      content: "";
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background:
        conic-gradient(from 0deg, var(--blue) 0 25%, var(--red) 0 50%, var(--yellow) 0 75%, var(--green) 0 100%);
      box-shadow: inset 0 0 0 7px #fff;
    }

    .date-pill {
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 170px 170px 150px;
      gap: 10px;
    }

    .control {
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel);
      color: var(--ink);
      padding: 0 12px;
      outline: none;
    }

    .control:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.14);
    }

    .layout {
      display: grid;
      grid-template-columns: 260px minmax(420px, 1fr) 420px;
      gap: 22px;
      padding: 24px 32px 36px;
    }

    .rail,
    .detail {
      position: sticky;
      top: 86px;
      height: calc(100vh - 112px);
      overflow: auto;
    }

    .rail,
    .detail,
    .feed {
      min-width: 0;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 18px;
    }

    .metric {
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--panel);
      padding: 12px;
      box-shadow: 0 1px 2px rgba(60, 64, 67, 0.08);
    }

    .metric:nth-child(1) { border-top: 3px solid var(--blue); }
    .metric:nth-child(2) { border-top: 3px solid var(--red); }
    .metric:nth-child(3) { border-top: 3px solid var(--yellow); }
    .metric:nth-child(4) { border-top: 3px solid var(--green); }

    .metric b {
      display: block;
      font-size: 22px;
      line-height: 1;
    }

    .metric span {
      display: block;
      margin-top: 7px;
      color: var(--muted);
      font-size: 12px;
    }

    .section-label {
      margin: 18px 0 8px;
      color: var(--blue);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .category-list {
      display: grid;
      gap: 7px;
    }

    .category-button {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
      width: 100%;
      min-height: 38px;
      border: 1px solid transparent;
      border-radius: 999px;
      background: transparent;
      color: var(--ink);
      padding: 8px 10px;
      text-align: left;
      cursor: pointer;
    }

    .category-button:hover,
    .category-button.active {
      border-color: transparent;
      background: var(--blue-soft);
      color: #174ea6;
    }

    .count {
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .source-list {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .source-list li {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
      font-size: 13px;
    }

    .feed-header {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      margin-bottom: 12px;
    }

    .feed-header h2 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
    }

    .result-count {
      color: var(--muted);
      font-size: 13px;
    }

    .items {
      display: grid;
      gap: 10px;
    }

    .section-group-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 2px 4px;
      margin-top: 10px;
      border-bottom: 2px solid var(--line);
    }

    .section-group-header:first-child {
      margin-top: 0;
    }

    .section-group-title {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .section-group-header[data-section="deep_learning_quant"] .section-group-title { color: var(--blue); }
    .section-group-header[data-section="ai_quant_tools"] .section-group-title { color: var(--green); }
    .section-group-header[data-section="daily_news"] .section-group-title { color: var(--yellow); }

    .section-group-count {
      color: var(--muted);
      font-size: 12px;
    }

    .item {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--panel);
      box-shadow: 0 1px 2px rgba(60, 64, 67, 0.10);
      padding: 18px;
      cursor: pointer;
      transition: border-color 140ms ease, transform 140ms ease, box-shadow 140ms ease;
    }

    .item::before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 4px;
      background: linear-gradient(90deg, var(--blue), var(--red), var(--yellow), var(--green));
    }

    .item[data-section="deep_learning_quant"]::before { background: var(--blue); }
    .item[data-section="ai_quant_tools"]::before { background: var(--green); }
    .item[data-section="daily_news"]::before { background: var(--yellow); }

    .item:hover,
    .item.active {
      border-color: #c6dafc;
      box-shadow: var(--shadow);
      transform: translateY(-2px);
    }

    .item-top {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 14px;
      align-items: start;
    }

    .item h3 {
      margin: 0;
      font-size: 16px;
      line-height: 1.28;
    }

    .score {
      min-width: 54px;
      border-radius: 999px;
      background: var(--blue-soft);
      color: #174ea6;
      padding: 6px 8px;
      text-align: center;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 10px 0;
      color: var(--muted);
      font-size: 12px;
    }

    .tag {
      border: 1px solid transparent;
      border-radius: 999px;
      background: #f1f3f4;
      padding: 3px 8px;
    }

    .tag:nth-child(1) { background: var(--blue-soft); color: #174ea6; }
    .tag:nth-child(2) { background: var(--green-soft); color: #137333; }
    .tag:nth-child(3) { background: var(--yellow-soft); color: #8a5a00; }
    .tag:nth-child(4) { background: var(--red-soft); color: #b3261e; }

    .summary {
      margin: 0;
      color: #30342d;
      font-size: 14px;
      line-height: 1.45;
    }

    .reference-link {
      display: inline-flex;
      width: fit-content;
      border-top: 1px solid var(--line);
      color: var(--blue);
      padding-top: 9px;
      text-decoration: none;
      font-size: 13px;
      font-weight: 800;
    }

    .reader-format {
      display: grid;
      gap: 10px;
      margin-top: 10px;
    }

    .reader-format.compact {
      gap: 8px;
    }

    .reader-block {
      border-top: 1px solid var(--line);
      padding-top: 9px;
    }

    .reader-block:first-child {
      border-top: 0;
      padding-top: 0;
    }

    .reader-block h4 {
      margin: 0 0 5px;
      color: var(--blue);
      font-size: 12px;
      font-weight: 700;
    }

    .reader-block p,
    .reader-block li {
      margin: 0;
      color: #30342d;
      font-size: 13px;
      line-height: 1.5;
    }

    .reader-block ol {
      margin: 0;
      padding-left: 18px;
    }

    .reader-reference {
      color: var(--blue);
      text-decoration: none;
      font-size: 13px;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .reference-url {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .detail {
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--panel);
      box-shadow: var(--shadow);
      padding: 18px;
    }

    .detail h2 {
      margin: 0 0 12px;
      font-size: 20px;
      line-height: 1.2;
    }

    .detail-block {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
    }

    .detail-block h3 {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.02em;
    }

    .detail-block p,
    .detail-block li {
      color: #30342d;
      font-size: 14px;
      line-height: 1.55;
    }

    .detail-block ul {
      margin: 0;
      padding-left: 18px;
    }

    .breakdown {
      display: grid;
      gap: 8px;
    }

    .bar {
      display: grid;
      grid-template-columns: 118px 1fr 40px;
      gap: 8px;
      align-items: center;
      color: var(--muted);
      font-size: 12px;
    }

    .bar-track {
      height: 7px;
      overflow: hidden;
      border-radius: 999px;
      background: #e7eadf;
    }

    .bar-fill {
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--blue), var(--green), var(--yellow), var(--red));
    }

    .open-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 38px;
      margin-top: 16px;
      border: 1px solid var(--blue);
      border-radius: var(--radius);
      color: var(--blue);
      text-decoration: none;
      padding: 0 12px;
      font-weight: 700;
    }

    .feedback-row {
      display: flex;
      gap: 6px;
      align-items: center;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--line);
    }

    .feedback-btn {
      background: #f1f3f4;
      border: 1px solid transparent;
      border-radius: 999px;
      padding: 3px 10px;
      font-size: 13px;
      cursor: pointer;
      transition: background 120ms, border-color 120ms;
    }

    .feedback-btn:hover { background: var(--blue-soft); }
    .feedback-btn.active-up { background: var(--green-soft); border-color: var(--green); }
    .feedback-btn.active-down { background: var(--red-soft); border-color: var(--red); }

    .feedback-hint {
      color: var(--muted);
      font-size: 11px;
    }

    .empty {
      border: 1px dashed var(--line);
      border-radius: var(--radius);
      padding: 28px;
      color: var(--muted);
      background: var(--panel);
    }

    @media (max-width: 1180px) {
      .layout {
        grid-template-columns: 220px 1fr;
      }

      .detail {
        position: static;
        grid-column: 1 / -1;
        height: auto;
      }
    }

    @media (max-width: 820px) {
      .topbar {
        grid-template-columns: 1fr;
        padding: 14px;
      }

      .brand {
        display: grid;
        gap: 4px;
      }

      .brand h1 {
        white-space: normal;
        font-size: 21px;
      }

      .controls {
        grid-template-columns: 1fr;
      }

      .layout {
        grid-template-columns: 1fr;
        padding: 14px;
      }

      .rail,
      .detail {
        position: static;
        height: auto;
      }

      .metric-grid {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>

del must assess whether retrieved documents satisfy users' information needs under complex, multi-dimensional criteria. However, directly applying large language models (LLMs) to this task remains challenging because conventional supervised fine-tuning (SFT) provides limited supervision for domain-specific judgment rationales, while standard trajectory-level reinforcement learning (RL) objectives do not explicitly enforce margin separation among adjacent ordinal relevance labels. Moreover, although such reasoning can be useful during training, chain-of-thought (CoT) reasoning is impractical for latency-sensitive online ranking. These challenges make it difficult to resolve ambiguous decision boundaries. We propose a three-stage framework LARF (Learning-Aligned Reasoning Framework for Search Relevance): it first performs cold-start SFT on strategically selected samples with multi-agent guided CoT rationales, then applies discriminative GRPO with attribute-wise, list-wise, and rule-consistency rewards together with a margin loss on the terminal relevance token, and finally distills the teacher into a dual-head student whose classification heads are retained for non-autoregressive inference. On a human-annotated web search relevance benchmark with approximately 300K training and 16K test instances, LARF-8B improves six-class classification accuracy by 5.78 percentage points and NDCG by 5.05 points, while the classification-only serving path reduces inference latency by 82.9\\%. These results indicate that aligning structured reasoning, terminal decision optimization, and classification-head distillation can provide an effective accuracy--efficiency trade-off for industrial search relevance modeling.", "abstract": "Query-document relevance estimation is a core component of AI-native search systems, where a model must assess whether retrieved documents satisfy users' information needs under complex, multi-dimensional criteria. However, directly applying large language models (LLMs) to this task remains challenging because conventional supervised fine-tuning (SFT) provides limited supervision for domain-specific judgment rationales, while standard trajectory-level reinforcement learning (RL) objectives do not explicitly enforce margin separation among adjacent ordinal relevance labels. Moreover, although such reasoning can be useful during training, chain-of-thought (CoT) reasoning is impractical for latency-sensitive online ranking. These challenges make it difficult to resolve ambiguous decision boundaries. We propose a three-stage framework LARF (Learning-Aligned Reasoning Framework for Search Relevance): it first performs cold-start SFT on strategically selected samples with multi-agent guided CoT rationales, then applies discriminative GRPO with attribute-wise, list-wise, and rule-consistency rewards together with a margin loss on the terminal relevance token, and finally distills the teacher into a dual-head student whose classification heads are retained for non-autoregressive inference. On a human-annotated web search relevance benchmark with approximately 300K training and 16K test instances, LARF-8B improves six-class classification accuracy by 5.78 percentage points and NDCG by 5.05 points, while the classification-only serving path reduces inference latency by 82.9\\%. These results indicate that aligning structured reasoning, terminal decision optimization, and classification-head distillation can provide an effective accuracy--efficiency trade-off for industrial search relevance modeling.", "content_hash": "7cecfd1eed1f458b7c0c60a06b77cbda355c705b0648de8543e6c952532041a0", "category": "LLM / Agents for Quant", "tags": ["agent", "chain-of-thought", "grpo", "optimization", "reasoning", "reinforcement learning"], "language": "en", "metadata": {"arxiv_categories": ["cs.IR"]}, "one_line_summary": "用多智能体 CoT 冷启动 + GRPO 判别训练 + 分类头蒸馏把 8B LLM 变成六档相关性打分器，准确率 +5.78pp、NDCG +5.05、线上延迟降 82.9%", "technical_summary": "要解决的是 LLM 直接做 query-document 相关性判定时决策边界模糊：SFT 对领域判断理由监督不足，轨迹级 RL 又不显式拉开相邻序数标签的间距，而 CoT 在线排序太慢。做法分三段：先用多智能体生成的 CoT 理由在精选样本上做冷启动 SFT；再用判别式 GRPO，奖励由属性级、列表级、规则一致性三部分组成，并在终位相关性 token 上加 margin loss；最后蒸馏成保留分类头的双头学生，走非自回归推理。在约 30 万训练、1.6 万测试的人工标注网页搜索相关性基准上，LARF-8B 六分类准确率提升 5.78 个百分点、NDCG 提升 5.05 点，纯分类 serving 路径推理延迟下降 82.9%。", "key_points": ["三阶段流水线：多智能体 CoT 冷启动 SFT → 属性/列表/规则一致性奖励的判别式 GRPO 加终位 margin loss → 双头学生蒸馏，六分类准确率 +5.78pp、NDCG +5.05。", "约 300K 训练 / 16K 测试人工标注样本、8B 规模即可复现，蒸馏后只走分类头非自回归推理，延迟降 82.9%，但依赖多智能体 CoT 标注与 GRPO 训练栈，工程量不小。", "只在通用网页搜索相关性数据上验证，无金融语料与实盘排序收益测试；六档标签的等距 margin 假设未必适配多维金融相关性，CoT 标注成本高且易带入标注者偏差。"], "quant_relevance": "研究工具 / 工作流提效；数据工程（资讯与研报的相关性过滤、RAG 重排）", "possible_use_case": "把「新闻/研报 → 是否与某标的或主题相关」定义成 4–6 档序数标签，标注 2–3 万条后照搬三阶段流程训练一个 8B 相关性打分器：教师 CoT 用于离线难例审核，学生分类头用于每日全量资讯流打分与 RAG 重排，先与现有 BM25/embedding 基线在 NDCG@10 上对比。", "limitations": "训练与测试均为通用网页搜索相关性标注，迁移到金融文本需重新标注且标注一致性更差；margin loss 假设标签序关系线性可分，金融相关性常是多维加权，序数假设可能不成立；分类头蒸馏丢掉推理链，线上无法解释打分为何低，合规审查时缺少依据；摘要未给出延迟绝对值、吞吐和单条成本，也未给出排序改善带来的下游业务指标；若多智能体生成的 CoT 理由本身有偏，冷启动 SFT 会把偏差固化进学生模型。", "read_priority": "中", "key_figures_md": "- **主结果表（摘要未标号，见 HTML 版）**：LARF-8B 与 SFT / 标准 RL 基线在六分类准确率、NDCG 上的对比，准确率 +5.78pp、NDCG +5.05\n- **消融表（摘要未标号，见 HTML 版）**：属性级 / 列表级 / 规则一致性三类奖励与终位 margin loss 的逐项贡献\n- **效率对比（摘要未标号，见 HTML 版）**：教师 CoT 自回归路径 vs 双头学生分类头路径的推理延迟，后者降 82.9%\n- [原文图表（HTML版）](https://arxiv.org/html/2611.32125)", "relevance_score": 7.8, "novelty_score": 9.78, "academic_score": 10.0, "discussion_score": 2.0, "actionable_score": 6.5, "final_score": 7.396, "display_title": "优化、强化学习、多智能体、大模型研究论文", "tldr": "用多智能体 CoT 冷启动 + GRPO 判别训练 + 分类头蒸馏把 8B LLM 变成六档相关性打分器，准确率 +5.78pp、NDCG +5.05、线上延迟降 82.9%", "core_value": "对你的量化工作帮助：把它拆成一个量化大模型 / 智能体复现任务，先验证优化、强化学习、多智能体、大模型是否真的带来样本外提升，再检查交易成本、数据泄漏和换手约束。", "key_points_list": ["三阶段流水线：多智能体 CoT 冷启动 SFT → 属性/列表/规则一致性奖励的判别式 GRPO 加终位 margin loss → 双头学生蒸馏，六分类准确率 +5.78pp、NDCG +5.05。", "约 300K 训练 / 16K 测试人工标注样本、8B 规模即可复现，蒸馏后只走分类头非自回归推理，延迟降 82.9%，但依赖多智能体 CoT 标注与 GRPO 训练栈，工程量不小。", "只在通用网页搜索相关性数据上验证，无金融语料 by 15%. We release Vernier, which runs this report with one command on any leaderboard that publishes per-dataset scores: https://github.com/therealram18/vernier", "abstract": "A foundation model for time series is pretrained once and then asked to forecast series it has never seen, so the evidence for it is its score on held-out datasets. Such datasets are scarce, and a few public leaderboards carry most comparisons, yet none of them states how small a difference its datasets can detect. We call that quantity the resolution of a board and introduce Vernier, a tool that computes it from the files a board already publishes. Vernier also reports which entries a board cannot separate from its leader and whether its order changes when unrelated parties submit. GIFT-Eval resolves 6.8 rank places, and its displayed neighbours sit 0.91 apart. The ten places of its top ten hold fewer than two resolvable steps. fev-bench, Chronos Benchmark II and TIME show the same pattern: their resolution is 3.6 to 19 times the gap between neighbours. With each of its 2,554 series as an independent source, BOOM is the one board that resolves its top ten. Below the resolution the order depends on who else submitted: across four boards, rules that rank against the pool reversed 43 top-ten pairs with neither entry rerun, in one update in seven. Boards also do not record how much history a model receives. On 70 configurations, shortening it raised the error of three of four open models, two of them by 15%. We release Vernier, which runs this report with one command on any leaderboard that publishes per-dataset scores: https://github.com/therealram18/vernier", "content_hash": "cdc4dd1e84272a09ba4fb9ae08fe0c501bc900c239445826d1c8be59022d4aab", "category": "Machine Learning for Finance", "tags": ["dataset", "forecasting", "foundation model", "time series"], "language": "en", "metadata": {"arxiv_categories": ["cs.LG", "stat.ME"]}, "one_line_summary": "开源 Vernier 计算预测榜单分辨率：GIFT-Eval 仅能分辨 6.8 个排名位，前十不足两个可分辨步长", "technical_summary": "零样本时间序列基础模型靠少量公开榜单的留出集分数比较，但榜单未说明能检测多小的差异。Vernier 直接从榜单已发布的逐数据集分数计算“分辨率”，并标出无法与榜首区分的条目、以及提交池变化时排名是否翻转。GIFT-Eval 的分辨率为 6.8 个排名位，相邻条目仅差 0.91，前十不足两个可分辨步长；fev-bench、Chronos Benchmark II、TIME 的分辨率是相邻差距的 3.6–19 倍。BOOM 用 2,554 条序列作为独立来源，是唯一能分辨前十的榜单。四个榜单中按提交池排名在未重跑任何模型时反转了 43 对前十名次，七次更新出现一次；缩短历史长度在 70 组配置中使 3/4 开源模型误差上升，其中两个上升 15%。", "key_points": ["Vernier 用已发布逐数据集分数算榜单分辨率；GIFT-Eval 仅 6.8 个名次，前十里不足两个可分辨步长。", "工具开源，一条命令可跑任意发布逐数据集分数的榜单；需有 per-dataset 分数，复现门槛低。", "分辨率以下排名会随提交池反转：四榜 43 对前十名次在未重跑时翻转，历史长度等元数据缺失。"], "quant_relevance": "研究工具 / 工作流提效；因子 / alpha 信号（时间序列预测模型选型）", "possible_use_case": "在内部因子/预测模型评测中接入 Vernier，对自建 leaderboard 的 per-dataset IC/RMSE 计算分辨率，规定只有超过可分辨步长的提升才进入实盘候选。", "limitations": "仅评估榜单统计分辨率，不检验模型在交易成本、滑点下的净收益；BOOM 结论依赖 2,554 条序列独立假设；缺少金融高频/低频分布漂移测试，需用 A 股/美股数据复核。", "read_priority": "高", "key_figures_md": "- **HTML 原文图表**：GIFT-Eval、fev-bench、Chronos Benchmark II、TIME 的分辨率与相邻差距倍数对比，以及 BOOM 前十可分辨性\n- **HTML 原文图表**：70 组历史长度配置下开源模型误差变化，两个模型误差上升 15%\n- [原文图表（HTML版）](https://arxiv.org/html/2611.31619)", "relevance_score": 6.6, "novelty_score": 9.565, "academic_score": 10.0, "discussion_score": 2.0, "actionable_score": 7.5, "final_score": 7.193, "display_title": "预测、时间序列研究论文", "tldr": "开源 Vernier 计算预测榜单分辨率：GIFT-Eval 仅能分辨 6.8 个排名位，前十不足两个可分辨步长", "core_value": "对你的量化工作帮助：把它拆成一个金融机器学习复现任务，先验证预测、时间序列是否真的带来样本外提升，再检查交易成本、数据泄漏和换手约束。", "key_points_list": ["Vernier 用已发布逐数据集分数算榜单分辨率；GIFT-Eval 仅 6.8 个名次，前十里不足两个可分辨步长。", "工具开源，一条命令可跑任意发布逐数据集分数的榜单；需有 per-dataset 分数，复现门槛低。", "分辨率以下排名会随提交池反转：四榜 43 对前十名次在未重跑时翻转，历史长度等元数据缺失。"], "reference_url": "http://arxiv.org/abs/2611.31619v1", "report_sections": ["ai_quant_tools"], "report_section_labels": ["AI 量化工具"], "category_label": "金融机器学习", "priority_label": "高", "source_type_label": "论文"}, {"id": "eec5a237ce27ece5497113962c7415498aa0adc8d169e25bd676e3ad6999283e", "source": "arXiv", "source_type": "paper", "title": "Cleaning correlation matrices with external information: the Maximum Variance estimat", "url": "http://arxiv.org/abs/2611.30843v2", "authors": ["Sébastien Valeyre"], "published_at": "2026-11-23", "collected_at": "2026-11-25T05:14:22Z", "raw_text": "Rotationally invariant estimators clean the eigenvalues of an empirical correlation matrix but keep its noisy eigenvectors. We study an estimator that corrects the eigenvectors by using external information, namely a partition of the assets into groups such as asset classes or regions. The Maximum Variance (MaxVar) estimator restricts the leading eigenvectors to linear combinations of the maximum-variance portfolios of the groups and replaces the rest of the spectrum by a single eigenvalue. It is a factor model with about n parameters instead of n2/2, and it is positive de nite even when the number of observations is smaller than the number of assets n. We apply it to the correlation matrix of 47 futures on stock indices, bonds and currencies, with the three asset classes as groups. In an illustrative Monte Carlo test, in which the reference matrix has the structure assumed by the estimator, the distance to the reference is reduced by one third with respect to the empirical matrix, against less than 10% for the rotationally invariant estimator. The decisive test is the performance of a portfolio on real data: over 1993-2018, the Sharpe ratio of the risk parity portfolio, which involves the inverse of the matrix, is 1.28 with the MaxVar estimator, 1.24 with the rotationally invariant estimator and 1.17 with the empirical matrix, and the advantage increases when the estimation window is shortened.", "abstract": "Rotationally invariant estimators clean the eigenvalues of an empirical correlation matrix but keep its noisy eigenvectors. We study an estimator that corrects the eigenvectors by using external information, namely a partition of the assets into groups such as asset classes or regions. The Maximum Variance (MaxVar) estimator restricts the leading eigenvectors to linear combinations of the maximum-variance portfolios of the groups and replaces the rest of the spectrum by a single eigenvalue. It is a factor model with about n parameters instead of n2/2, and it is positive de nite even when the number of observations is smaller than the number of assets n. We apply it to the correlation matrix of 47 futures on stock indices, bonds and currencies, with the three asset classes as groups. In an illustrative Monte Carlo test, in which the reference matrix has the structure assumed by the estimator, the distance to the reference is reduced by one third with respect to the empirical matrix, against less than 10% for the rotationally invariant estimator. The decisive test is the performance of a portfolio on real data: over 1993-2018, the Sharpe ratio of the risk parity portfolio, which involves the inverse of the matrix, is 1.28 with the MaxVar estimator, 1.24 with the rotationally invariant estimator and 1.17 with the empirical matrix, and the advantage increases when the estimation window is shortened.", "content_hash": "ada713b9961678b56afd06eb1069f6e827baa06989954b5bf3f62aaeb3f4c9e5", "category": "Portfolio Construction", "tags": ["factor", "portfolio", "risk", "risk parity", "variance"], "language": "en", "metadata": {"arxiv_categories": ["q-fin.PM"]}, "one_line_summary": "用资产类别分组修正相关矩阵特征向量：MaxVar 在 47 个期货风险平价组合上夏普 1.28，高于经验矩阵 1.17", "technical_summary": "解决经验相关矩阵在资产数接近或超过观测数时特征向量噪声大、旋转不变估计只清洗特征值的问题。MaxVar 要求前几个特征向量落在各组最大方差组合张成的空间内，其余谱压缩为单一特征值，参数约 n 个而非 n^2/2，且在 T\u003cn 时仍正定。用 47 个股指、债券、外汇期货，按三类资产分组；Monte Carlo 中与参考矩阵距离比经验矩阵缩小约三分之一，旋转不变估计不到 10%。真实数据 1993–2018 风险平价组合夏普 1.28，对比旋转不变 1.24、经验矩阵 1.17，窗口越短优势越大。", "key_points": ["MaxVar 将相关矩阵前特征向量约束到三类资产最大方差组合张成空间，1993–2018 风险平价夏普 1.28，经验矩阵 1.17。", "只需资产分组标签和收益序列，估计量正定且参数约 n 个，适合风险平价/最小方差组合；未见公开代码，需自行实现。", "仅 47 个期货、3 类分组、单一风险平价回测，未计交易成本与换手；分组错误或资产类别漂移时优势可能反转。"], "quant_relevance": "组合构建 / 权重优化；风险建模", "possible_use_case": "在风险平价流程中，把样本相关矩阵替换为 MaxVar 矩阵：按行业/资产类别分组，滚动窗口估计，先在中证行业指数与股指/债券/商品期货池回测换手和成本。", "limitations": "样本仅 47 个期货、三类资产、1993–2018；回测只报告风险平价夏普，未计交易成本、换手和容量；Monte Carlo 参考矩阵假定与估计器同结构，外部信息分组错误或资产类别漂移时优势可能消失；短窗口优势需更多市场验证。", "read_priority": "高", "key_figures_md": "- **Figure/Table（摘要未编号）**：Monte Carlo 相关矩阵距离对比与 1993–2018 风险平价夏普对比；原图见 https://arxiv.org/html/2611.30843\n- [原文图表（HTML版）](https://arxiv.org/html/2611.30843)", "relevance_score": 6.8, "novelty_score": 9.565, "academic_score": 10.0, "discussion_score": 2.0, "actionable_score": 6.5, "final_score": 7.053, "display_title": "因子、组合、风险、风险平价研究论文", "tldr": "用资产类别分组修正相关矩阵特征向量：MaxVar 在 47 个期货风险平价组合上夏普 1.28，高于经验矩阵 1.17", "core_value": "对你的量化工作帮助：把它拆成一个组合构建复现任务，先验证因子、组合、风险、风险平价是否真的带来样本外提升，再检查交易成本、数据泄漏和换手约束。", "key_points_list": ["MaxVar 将相关矩阵前特征向量约束到三类资产最大方差组合张成空间，1993–2018 风险平价夏普 1.28，经验矩阵 1.17。", "只需资产分组标签和收益序列，估计量正定且参数约 n 个，适合风险平价/最小方差组合；未见公开代码，需自行实现。", "仅 47 个期货、3 类分组、单一风险平价回测，未计交易成本与换手；分组错误或资产类别漂移时优势可能反转。"], "reference_url": "http://arxiv.org/abs/2611.30843v2", "report_sections": ["ai_quant_tools"], "report_section_labels": ["AI 量化工具"], "category_label": "组合构建", "priority_label": "高", "source_type_label": "论文"}, {"id": "2008ce9428228481f84b0a7feea8d74f522bc17ca55f4f8458798726b8a57255", "source": "arXiv", "source_type": "paper", "title": "Rethinking Universal Time Series Foundation Models from Unified Representations to Shared Dynamics (UniTFU)", "url": "http://arxiv.org/abs/2611.31921v1", "authors": ["Shuxin Li", "Yingjie Zhou", "Le Zhang", "Jingyuan Xia", "Shengxi Li", "Ce Zhu", "Anderson Rocha"], "published_at": "2026-11-24", "collected_at": "2026-11-25T05:15:39Z", "raw_text": "Time series foundation models (TSFMs) have attracted increasing attention in cross-domain forecasting. Existing works mainly rely on large-scale pre-training and general modeling paradigms. However, the former heavily relies on the diversity and domain coverage of pre-training data. Meanwhile, the latter learns unified representations across heterogeneous domains without explicitly identifying the temporal regularities shared among them, limiting robust cross-domain generalization. This work explores cross-domain generalization by characterizing commonalities in recurring local dynamics across domains, rather than relying solely on implicitly learned temporal representations. To capture such cross-domain commonalities, we propose Time Series Foundation Units (TFUs) as reusable building blocks discovered from multi-scale temporal segments, each characterizing a recurring local dynamic pattern shared across domains. Building on TFUs, we develop a unified time series foundation model (UniTFU) that explicitly reuses and composes shared temporal regularities across domains for forecasting. Experiments on seven public datasets show that UniTFU substantially outperforms existing TSFMs in cross-domain forecasting and can efficiently adapt to target-domain dynamics by updating its reusable components with limited target data. UniTFU also achieves strong forecasting performance compared with state-of-the-art methods.", "abstract": "Time series foundation models (TSFMs) have attracted increasing attention in cross-domain forecasting. Existing works mainly rely on large-scale pre-training and general modeling paradigms. However, the former heavily relies on the diversity and domain coverage of pre-training data. Meanwhile, the latter learns unified representations across heterogeneous domains without explicitly identifying the temporal regularities shared among them, limiting robust cross-domain generalization. This work explores cross-domain generalization by characterizing commonalities in recurring local dynamics across domains, rather than relying solely on implicitly learned temporal representations. To capture such cross-domain commonalities, we propose Time Series Foundation Units (TFUs) as reusable building blocks discovered from multi-scale temporal segments, each characterizing a recurring local dynamic pattern shared across domains. Building on TFUs, we develop a unified time series foundation model (UniTFU) that explicitly reuses and composes shared temporal regularities across domains for forecasting. Experiments on seven public datasets show that UniTFU substantially outperforms existing TSFMs in cross-domain forecasting and can efficiently adapt to target-domain dynamics by updating its reusable components with limited target data. UniTFU also achieves strong forecasting performance compared with state-of-the-art methods.", "content_hash": "55f90f9e4780eed7ab47dca118e387d147dbc84dff3e6d73fba8bd21909d8ed3", "category": "Machine Learning for Finance", "tags": ["forecasting", "foundation model", "time series"], "language": "en", "metadata": {"arxiv_categories": ["cs.LG"]}, "one_line_summary": "UniTFU 用「可复用时间序列基础单元（TFU）」替代统一表征做跨域预测，在 7 个公开数据集上跑赢现有 TSFM", "technical_summary": "现有时间序列基础模型（TSFM）靠堆大规模预训练数据，或靠一个统一表征硬吃异质域，没有显式刻画各域共享的时间规律，跨域泛化不稳。UniTFU 先把序列切成多尺度时间片段，从中归纳出反复出现的局部动态模式，作为可复用的「时间序列基础单元」（TFU），再按需组合这些单元做预测，等于把共享动态显式参数化而不是隐式学出来。在 7 个公开数据集上，跨域预测显著优于现有 TSFM，且只用少量目标域数据更新可复用单元即可适配新域。摘要未给出任何具体精度、误差下降幅度或数据集名称。", "key_points": ["核心思路是把跨域共性拆成多尺度片段上反复出现的局部动态模式（TFU），显式复用组合而非隐式统一表征，7 个公开数据集跨域预测优于现有 TSFM，但摘要未披露任何误差或排名数字", "可用性在于「少量目标域数据微调可复用单元」这一适配路径：如果 TFU 真能跨域迁移，金融序列可用少量本域数据低成本适配，不需要重建大模型；但摘要未提代码、参数量、训练成本，复现门槛未知", "摘要零量化指标、零数据集名称、零基线列表，'substantially outperforms'属定性描述；跨域基准多为合成或平稳序列，金融序列的非平稳与低信噪比是否被覆盖无法判断，迁移到日频/分钟频因子前必须自行复现验证"], "quant_relevance": "因子 / alpha 信号；研究工具 / 工作流提效", "possible_use_case": "把 TFU 的「多尺度片段 + 可复用局部模式」结构移植到现有因子模型：先在多品种分钟线切片上聚类出共享局部形态单元，冻结单元库后只用目标品种最近 6 个月数据微调，做次日收益方向预测并与现有 GBDT 基线对比 IC。", "limitations": "仅拿到摘要，全文的性能数字、数据集构成、基线清单、代码开放情况均未知；摘要中的「显著优于」没有误差指标支撑，无法判断是 MSE 小幅改善还是量级提升；论文无金融数据实验证据，跨域增益能否迁移到低信噪比、非平稳、含跳空的行情序列存疑；少样本微调的适配成本与过拟合风险未量化。", "read_priority": "中", "key_figures_md": "", "relevance_score": 6.6, "novelty_score": 9.78, "academic_score": 10.0, "discussion_score": 2.0, "actionable_score": 6.5, "final_score": 7.036, "display_title": "预测、时间序列、注意力机制研究论文", "tldr": "UniTFU 用「可复用时间序列基础单元（TFU）」替代统一表征做跨域预测，在 7 个公开数据集上跑赢现有 TSFM", "core_value": "对你的量化工作帮助：把它拆成一个金融机器学习复现任务，先验证预测、时间序列、注意力机制是否真的带来样本外提升，再检查交易成本、数据泄漏和换手约束。", "key_points_list": ["核心思路是把跨域共性拆成多尺度片段上反复出现的局部动态模式（TFU），显式复用组合而非隐式统一表征，7 个公开数据集跨域预测优于现有 TSFM，但摘要未披露任何误差或排名数字", "可用性在于「少量目标域数据微调可复用单元」这一适配路径：如果 TFU 真能跨域迁移，金融序列可用少量本域数据低成本适配，不需要重建大模型；但摘要未提代码、参数量、训练成本，复现门槛未知", "摘要零量化指标、零数据集名称、零基线列表，'substantially outperforms'属定性描述；跨域基准多为合成或平稳序列，金融序列的非平稳与低信噪比是否被覆盖无法判断，迁移到日频/分钟频因子前必须自行复现验证"], "reference_url": "http://arxiv.org/abs/2611.31921v1", "report_sections": ["ai_quant_tools"], "report_section_labels": ["AI 量化工具"], "category_label": "金融机器学习", "priority_label": "中", "source_type_label": "论文"}, {"id": "10b2cf8e2c6aae7da78ef753eba37f562a307a9cd01b0d0e5503fbd1aabafe2e", "source": "arXiv", "source_type": "paper", "title": "Pretrained Tabular Features and the Measurement of Financial Proximity", "url": "http://arxiv.org/abs/2611.31491v1", "authors": ["Marcus Gawronsky"], "published_at": "2026-11-23", "collected_at": "2026-11-25T05:14:22Z", "raw_text": "Spatial arbitrage pricing theory (S-APT) extends factor models to allow returns to spill over between connected firms, beyond what common risk factors explain. In recent years, tabular foundation models (TFMs) have matched or outperformed tuned gradient-boosted and bagged ensembles on small and medium-sized tabular benchmarks. Although their predictive performance is strong, these models reveal little about what they have learned, which limits their use in regulated financial applications that require explanation. Internal representations are widely used to probe what neural networks learn and to measure similarity. In this paper, we use the frozen representations of four TFMs as a measure of financial dissimilarity in a spatial asset-pricing model of US equities from 2011 to 2025, and find that their estimated gains over a direct distance between the same disclosures become consistently positive once broad SEC filing data are included. This reframes tabular foundation models from black-box predictors into instruments for measuring economic structure, with immediate applications to peer selection, risk attribution and network-based asset pricing. More broadly, our findings suggest that the internal representations of foundation models, not only their predictions, deserve study as economic objects, opening a new line of research on what pretrained models know about firms.", "abstract": "Spatial arbitrage pricing theory (S-APT) extends factor models to allow returns to spill over between connected firms, beyond what common risk factors explain. In recent years, tabular foundation models (TFMs) have matched or outperformed tuned gradient-boosted and bagged ensembles on small and medium-sized tabular benchmarks. Although their predictive performance is strong, these models reveal little about what they have learned, which limits their use in regulated financial applications that require explanation. Internal representations are widely used to probe what neural networks learn and to measure similarity. In this paper, we use the frozen representations of four TFMs as a measure of financial dissimilarity in a spatial asset-pricing model of US equities from 2011 to 2025, and find that their estimated gains over a direct distance between the same disclosures become consistently positive once broad SEC filing data are included. This reframes tabular foundation models from black-box predictors into instruments for measuring economic structure, with immediate applications to peer selection, risk attribution and network-based asset pricing. More broadly, our findings suggest that the internal representations of foundation models, not only their predictions, deserve study as economic objects, opening a new line of research on what pretrained models know about firms.", "content_hash": "9d5dff3e3df564abceba5cc668d904b6de14aae8d11e535eb1fc38f69116257b", "category": "Alpha / Factor Research", "tags": ["factor", "neural", "pricing", "risk"], "language": "en", "metadata": {"arxiv_categories": ["q-fin.PR"]}, "one_line_summary": "把 4 个表格基础模型的冻结表征当作企业间「财务距离」，在 2011–2025 年美股 S-APT 中纳入 SEC 全量申报数据后，其相对披露直接距离的定价增益持续为正", "technical_summary": "空间套利定价理论（S-APT）允许收益在关联企业之间外溢，前提是能找到一张靠谱的「企业关联图」，但传统做法只能靠行业分类或披露文本的字面距离。这篇把 4 个表格基础模型的冻结内部表征直接当作企业间不相似度，喂进 2011–2025 年美股的 S-APT 空间权重矩阵，再与同一批披露数据上的直接距离做对照。结论是：当披露样本只覆盖少量数据时，预训练表征的优势不稳定；一旦接入 SEC 的宽口径申报数据，TFM 距离相对直接距离的估计增益就持续为正。作者据此主张，基础模型的内部表征本身可以当作「经济对象」来测量经济结构，而不只是做黑箱预测。需要注意，摘要只给出「持续为正」的定性表述，没有披露增益幅度、t 值或夏普差异。", "key_points": ["4 个 TFM 冻结表征 + 2011–2025 年美股 + SEC 全量申报数据，空间权重的估计增益相对直接距离持续为正，但摘要未给幅度数字", "只要冻结表征、不训练、不调参，接入成本低；难点在 SEC 申报数据的清洗对齐，以及四款 TFM 的型号与预处理未在摘要中列明，复现需回原文确认", "仅美股单一市场、2011–2025 单一区间，无样本外切分说明；无交易成本与组合层面回测，增益是否转化为可交易 alpha 未验证"], "quant_relevance": "因子 / alpha 信号；风险建模（peer 网络、风险归因）", "possible_use_case": "取四款表格基础模型对全 A 年报财务表格做冻结表征，计算股票两两余弦距离，按行业内 top-k 近邻构建 peer 网络权重，替换现有的行业等权或市值权重，先在中证 800 上跑一轮「行业中性 + 市值中性」后的残差动量 / 盈余动量测试，看 IC 是否比行业分类版本提升。", "limitations": "摘要只有定性结论，缺增益幅度、显著性检验和样本外切分；四款 TFM 的具体型号、训练语料与表格预处理未披露，复现路径不闭合；披露频率低（年报 / 季报），网络权重更新慢，难以支撑高频或短周期策略；仅美股单一市场，A 股披露口径和财务表格结构差异大，迁移需重新验证；论文未涉及交易成本与组合构建，从「增益为正」到「可交易 alpha」之间还差一步。", "read_priority": "中", "key_figures_md": "- **Figure（HTML 版待核，见 https://arxiv.org/html/2611.31491）**：四个 TFM 冻结表征构建的空间权重 vs 同批披露的直接距离权重，在 S-APT 中的估计增益随披露数据覆盖度变化\n- **Table（HTML 版待核）**：2011–2025 年美股样本上各 TFM 型号与直接距离基准的增益汇总，含是否接入 SEC 全量申报数据的对照\n- [原文图表（HTML版）](https://arxiv.org/html/2611.31491)", "relevance_score": 4.9, "novelty_score": 9.565, "academic_score": 10.0, "discussion_score": 2.0, "actionable_score": 6.5, "final_score": 6.483, "display_title": "因子、定价、风险研究论文", "tldr": "把 4 个表格基础模型的冻结表征当作企业间「财务距离」，在 2011–2025 年美股 S-APT 中纳入 SEC 全量申报数据后，其相对披露直接距离的定价增益持续为正", "core_value": "对你的量化工作帮助：把它拆成一个阿尔法 / 因子研究复现任务，先验证因子、定价、风险是否真的带来样本外提升，再检查交易成本、数据泄漏和换手约束。", "key_points_list": ["4 个 TFM 冻结表征 + 2011–2025 年美股 + SEC 全量申报数据，空间权重的估计增益相对直接距离持续为正，但摘要未给幅度数字", "只要冻结表征、不训练、不调参，接入成本低；难点在 SEC 申报数据的清洗对齐，以及四款 TFM 的型号与预处理未在摘要中列明，复现需回原文确认", "仅美股单一市场、2011–2025 单一区间，无样本外切分说明；无交易成本与组合层面回测，增益是否转化为可交易阿尔法未验证"], "reference_url": "http://ar inDesk、CoinTelegraph、The Block、Decrypt、Blockworks 等主流媒体当日最重要的 Crypto 市场报道。"}], "category_labels": {"Alpha / Factor Research": "阿尔法 / 因子研究", "Statistical Arbitrage": "统计套利", "Portfolio Construction": "组合构建", "Risk Management": "风险管理", "Options / Volatility": "期权 / 波动率", "Market Microstructure": "市场微观结构", "Execution / Transaction Cost": "交易执行 / 交易成本", "Machine Learning for Finance": "金融机器学习", "LLM / Agents for Quant": "量化大模型 / 智能体", "Crypto Quant": "加密资产量化", "Data Engineering": "数据工程", "Backtesting / Research Tools": "回测 / 研究工具", "Industry / Career": "行业 / 职业 / 合规", "Unclassified": "未分类"}, "priority_labels": {"High": "高", "Medium": "中", "Low": "低", "高": "高", "中": "中", "低": "低"}, "source_type_labels": {"paper": "论文", "forum": "论坛", "github": "代码仓库", "blog": "博客", "news": "新闻", "social": "社交媒体", "zhihu": "知乎", "x": "X", "quantml": "QuantML", "crypto_news": "加密市场新闻"}, "report_config": {"max_items_per_category": 5, "max_total_items": 60, "executive_brief_items": 5}}</script>
  <script>
    const payload = JSON.parse(document.getElementById('dashboard-data').textContent);
    const items = payload.items || [];
    const categoryLabels = payload.category_labels || {};
    const priorityLabels = payload.priority_labels || {};
    const sourceTypeLabels = payload.source_type_labels || {};
    const state = {
      query: '',
      section: 'All',
      category: 'All',
      sort: 'score',
      activeId: items[0]?.id || null,
    };

    const priorityRank = { High: 3, Medium: 2, Low: 1, '高': 3, '中': 2, '低': 1 };
    const $ = (id) => document.getElementById(id);

    // --- Feedback ---
    const _feedbackStore = JSON.parse(localStorage.getItem('quant-feedback') || '{}');
    function getFeedback(id) { return _feedbackStore[id] || 0; }
    function setFeedback(id, signal) {
      if (_feedbackStore[id] === signal) { delete _feedbackStore[id]; signal = 0; }
      else { _feedbackStore[id] = signal; }
      localStorage.setItem('quant-feedback', JSON.stringify(_feedbackStore));
      fetch('http://localhost:8080/feedback', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id, signal }),
      }).catch(() => {});
    }

    function init() {
      $('report-date').textContent = payload.report_date + ' - 主力源：arXiv / 知乎 / QuantML / 大型论坛 - 生成时间 ' + payload.generated_at;
      $('metric-items').textContent = items.length;
      $('metric-categories').textContent = new Set(items.map((item) => item.category)).size;
      $('metric-high').textContent = items.filter((item) => priorityLabel(item.read_priority) === '高').length;
      $('metric-avg').textContent = averageScore(items).toFixed(1);

      buildSectionControls();
      buildCategoryControls();
      buildSourceList();
      bindControls();
      render();
    }

    function bindControls() {
      $('search').addEventListener('input', (event) => {
        state.query = event.target.value.trim().toLowerCase();
        render();
      });
      $('category-select').addEventListener('change', (event) => {
        state.category = event.target.value;
        render();
      });
      $('section-select').addEventListener('change', (event) => {
        state.section = event.target.value;
        render();
      });
      $('sort-select').addEventListener('change', (event) => {
        state.sort = event.target.value;
        render();
      });
    }

    function buildCategoryControls() {
      const counts = countBy(items, 'category');
      const categories = Object.keys(counts).sort();
      const select = $('category-select');
      select.innerHTML = option('All', `全部细分标签 (${items.length})`) +
        categories.map((category) => option(category, `${categoryLabel(category)} (${counts[category]})`)).join('');

      const list = $('category-list');
      list.innerHTML = categoryButton('All', items.length) +
        categories.map((category) => categoryButton(category, counts[category])).join('');

      list.querySelectorAll('button').forEach((button) => {
        button.addEventListener('click', () => {
          state.category = button.dataset.category;
          select.value = state.category;
          if (state.category === 'All') {
            state.section = 'All';
            $('section-select').value = 'All';
          }
          render();
        });
      });
    }

    function buildSectionControls() {
      const counts = payload.section_counts || {};
      const sections = payload.sections || [];
      const select = $('section-select');
      select.innerHTML = option('All', `全部主线 (${items.length})`) +
        sections
          .filter((section) => counts[section.key])
          .map((section) => option(section.key, `${section.label} (${counts[section.key]})`))
          .join('');

      const list = $('section-list');
      list.innerHTML = sectionButton('All', '全部', items.length) +
        sections
          .filter((section) => counts[section.key])
          .map((section) => sectionButton(section.key, section.label, counts[section.key]))
          .join('');

      list.querySelectorAll('button').forEach((button) => {
        button.addEventListener('click', () => {
          state.section = button.dataset.section;
          select.value = state.section;
          if (state.section === 'All') {
            state.category = 'All';
            $('category-select').value = 'All';
          }
          render();
        });
      });
    }

    function buildSourceList() {
      const stats = payload.source_stats || {};
      const entries = Object.entries(stats)
        .filter(([source]) => !source.startsWith('fetched:'))
        .sort((a, b) => b[1] - a[1]);
      $('source-list').innerHTML = entries.length
        ? entries.map(([source, count]) => `<li><span>${escapeHtml(source)}</span><b>${count}</b></li>`).join('')
        : '<li><span>暂无来源统计</span><b>0</b></li>';
    }

    function render() {
      let visible = items.filter(matchesFilters);
      visible = sortItems(visible);
      if (!visible.some((item) => item.id === state.activeId)) {
        state.activeId = visible[0]?.id || null;
      }

      $('feed-title').textContent = feedTitle();
      $('result-count').textContent = `展示 ${visible.length} 条 - 两条主线每条最多 ${payload.report_config.max_items_per_category} 条`;
      renderSectionActive();
      renderCategoryActive();
      renderItems(visible);
      renderDetail(visible.find((item) => item.id === state.activeId) || visible[0]);
    }

    function matchesFilters(item) {
      const sectionMatch = state.section === 'All' || (item.report_sections || []).includes(state.section);
      if (!sectionMatch) return false;
      const categoryMatch = state.category === 'All' || item.category === state.category;
      if (!categoryMatch) return false;
      if (!state.query) return true;
      const haystack = [
        item.title,
        item.display_title,
        item.source,
        item.source_type,
        item.category,
        categoryLabel(item.category),
        sectionLabel(item.report_sections?.[0]),
        sourceTypeLabel(item.source_type),
        priorityLabel(item.read_priority),
        item.one_line_summary,
        item.technical_summary,
        item.quant_relevance,
        item.possible_use_case,
        item.tldr,
        item.core_value,
        ...(item.key_points_list || []),
        item.reference_url,
      ].join(' ').toLowerCase();
      return haystack.includes(state.query);
    }

    function sortItems(list) {
      return [...list].sort((a, b) => {
        if (state.sort === 'priority') {
          return (priorityRank[b.read_priority] || 0) - (priorityRank[a.read_priority] || 0)
            || b.final_score - a.final_score;
        }
        if (state.sort === 'source') {
          return a.source.localeCompare(b.source) || b.final_score - a.final_score;
        }
        return b.final_score - a.final_score;
      });
    }

    function renderCategoryActive() {
      document.querySelectorAll('.category-button').forEach((button) => {
        button.classList.toggle('active', button.dataset.category === state.category);
      });
    }

    function renderSectionActive() {
      document.querySelectorAll('.section-button').forEach((button) => {
        button.classList.toggle('active', button.dataset.section === state.section);
      });
    }

    function itemCard(item) {
      const sec = item.report_sections?.[0] || 'other';
      const sig = getFeedback(item.id);
      return `
        <article class="item ${item.id === state.activeId ? 'active' : ''}"
                 data-id="${escapeAttr(item.id)}"
                 data-section="${escapeAttr(sec)}">
          <div class="item-top">
            <h3>${escapeHtml(item.display_title || item.title)}</h3>
            <div class="score">${Number(item.final_score).toFixed(1)}</div>
          </div>
          <div class="meta">
            <span class="tag">${escapeHtml(categoryLabel(item.category))}</span>
            <span class="tag">${escapeHtml(item.source)}</span>
            <span class="tag">${escapeHtml(priorityLabel(item.read_priority))}</span>
          </div>
          ${readerFormat(item, true)}
          <div class="feedback-row">
            <button class="feedback-btn ${sig === 1 ? 'active-up' : ''}" data-feedback="1" title="有用">👍</button>
            <button class="feedback-btn ${sig === -1 ? 'active-down' : ''}" data-feedback="-1" title="跳过">👎</button>
            <span class="feedback-hint">${sig === 1 ? '已标记有用' : sig === -1 ? '已标记跳过' : ''}</span>
          </div>
        </article>
      `;
    }

    function sectionGroupHeader(section, count) {
      return `
        <div class="section-group-header" data-section="${escapeAttr(section.key)}">
          <span class="section-group-title">${escapeHtml(section.label)}</span>
          <span class="section-group-count">${count} 条</span>
        </div>
      `;
    }

    function renderItems(visible) {
      const container = $('items');
      if (!visible.length) {
        container.innerHTML = '<div class="empty">当前筛选条件下没有匹配内容。</div>';
        return;
      }

      let html = '';
      if (state.section === 'All') {
        // Group by section in defined order, with a header for each group
        const grouped = {};
        for (const item of visible) {
          const sec = item.report_sections?.[0] || 'other';
          if (!grouped[sec]) grouped[sec] = [];
          grouped[sec].push(item);
        }
        for (const section of (payload.sections || [])) {
          const group = grouped[section.key];
          if (!group || !group.length) continue;
          html += sectionGroupHeader(section, group.length);
          html += group.map((item) => itemCard(item)).join('');
        }
        // Append any items that fell into 'other' (shouldn't normally happen)
        if (grouped['other']?.length) {
          html += grouped['other'].map((item) => itemCard(item)).join('');
        }
      } else {
        html = visible.map((item) => itemCard(item)).join('');
      }

      container.innerHTML = html;
      container.querySelectorAll('.item').forEach((node) => {
        node.addEventListener('click', () => {
          state.activeId = node.dataset.id;
          render();
        });
      });
      container.querySelectorAll('.feedback-btn').forEach((btn) => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const itemNode = btn.closest('.item');
          setFeedback(itemNode.dataset.id, parseInt(btn.dataset.feedback, 10));
          render();
        });
      });
    }

    function renderDetail(item) {
      const detail = $('detail');
      if (!item) {
        detail.innerHTML = '<div class="empty">选择一条内容查看详情。</div>';
        return;
      }

      detail.innerHTML = `
        <h2>${escapeHtml(item.display_title || item.title)}</h2>
        <div class="meta">
          <span class="tag">${escapeHtml(categoryLabel(item.category))}</span>
          <span class="tag">${escapeHtml(sourceTypeLabel(item.source_type))}</span>
          <span class="tag">${escapeHtml(priorityLabel(item.read_priority))}</span>
        </div>

        ${readerFormat(item, false)}

        <div class="detail-block">
          <h3>评分拆解</h3>
          <div class="breakdown">
            ${bar('相关性', item.relevance_score)}
            ${bar('新颖度', item.novelty_score)}
            ${bar('学术性', item.academic_score)}
            ${bar('讨论度', item.discussion_score)}
            ${bar('可行动性', item.actionable_score)}
          </div>
        </div>

      `;
    }

    function readerFormat(item, compact) {
      const points = itemKeyPoints(item);
      return `
        <div class="reader-format ${compact ? 'compact' : ''}">
          <div class="reader-block">
            <h4>1. 这篇文章的太长不读</h4>
            <p>${escapeHtml(item.tldr || item.one_line_summary || '')}</p>
          </div>
          <div class="reader-block">
            <h4>2. 核心价值，对我量化的工作能够提供什么样的帮助</h4>
            <p>${escapeHtml(item.core_value || '')}</p>
          </div>
          <div class="reader-block">
            <h4>3. 关键核心点 / 论文或帖子摘要</h4>
            <ol>${points.map((point) => `<li>${escapeHtml(point)}</li>`).join('')}</ol>
          </div>
          <div class="reader-block">
            <h4>4. 原文链接</h4>
            ${referenceHtml(item)}
          </div>
        </div>
      `;
    }

    function itemKeyPoints(item) {
      const points = Array.isArray(item.key_points_list)
        ? item.key_points_list
        : (Array.isArray(item.key_points) ? item.key_points : []);
      const clean = points.filter(Boolean).slice(0, 3);
      return clean.length ? clean : ['需要打开原文进一步确认方法、数据和适用边界。'];
    }

    function referenceHtml(item) {
      const url = item.reference_url || '';
      if (!url) return '<p>暂无可打开链接</p>';
      return `
        <a class="reader-reference" href="${escapeAttr(url)}" target="_blank" rel="noopener noreferrer">打开原文</a>
        <small class="reference-url">${escapeHtml(url)}</small>
      `;
    }

    function bar(label, value) {
      const score = Number(value || 0);
      const width = Math.max(0, Math.min(100, score * 10));
      return `
        <div class="bar">
          <span>${label}</span>
          <div class="bar-track"><div class="bar-fill" style="width: ${width}%"></div></div>
          <b>${score.toFixed(1)}</b>
        </div>
      `;
    }

    function countBy(list, key) {
      return list.reduce((acc, item) => {
        acc[item[key]] = (acc[item[key]] || 0) + 1;
        return acc;
      }, {});
    }

    function averageScore(list) {
      if (!list.length) return 0;
      return list.reduce((sum, item) => sum + Number(item.final_score || 0), 0) / list.length;
    }

    function option(value, label) {
      return `<option value="${escapeAttr(value)}">${escapeHtml(label)}</option>`;
    }

    function sectionButton(section, label, count) {
      return `
        <button class="category-button section-button" type="button" data-section="${escapeAttr(section)}">
          <span>${escapeHtml(label)}</span>
          <span class="count">${count}</span>
        </button>
      `;
    }

    function categoryButton(category, count) {
      return `
        <button class="category-button" type="button" data-category="${escapeAttr(category)}">
          <span>${escapeHtml(category === 'All' ? '全部' : categoryLabel(category))}</span>
          <span class="count">${count}</span>
        </button>
      `;
    }

    function categoryLabel(category) {
      return categoryLabels[category] || category;
    }

    function sectionLabel(sectionKey) {
      const section = (payload.sections || []).find((item) => item.key === sectionKey);
      return section ? section.label : '其他';
    }

    function feedTitle() {
      const parts = [];
      if (state.section !== 'All') parts.push(sectionLabel(state.section));
      if (state.category !== 'All') parts.push(categoryLabel(state.category));
      return parts.length ? parts.join(' / ') : '今日情报';
    }

    function priorityLabel(priority) {
      return priorityLabels[priority] || priority;
    }

    function sourceTypeLabel(sourceType) {
      return sourceTypeLabels[sourceType] || sourceType;
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function escapeAttr(value) {
      return escapeHtml(value).replaceAll('`', '&#096;');
    }

    init();
  </script>
</body>
</html>
