entual decay of herding as complementary mechanisms behind momentum and reversal.", "abstract": "This study develops an agent-based financial market model to explain stock-price momentum and reversal through the joint effects of local herding and delayed information diffusion. Investors form heterogeneous Gaussian beliefs about the next-period price, choose among buying, selling, and remaining inactive, and revise their action probabilities in response to neighboring investors. The local interaction structure is represented by von Neumann and Moore lattices and is later replaced by Erdős--Rényi and Watts--Strogatz networks for robustness. A separate information process updates investor beliefs through a finite-speed diffusion mechanism, allowing informational adjustment to be distinguished from behavioral imitation. The simulations show that stronger herding produces spatially clustered trading, larger price fluctuations, and more pronounced excess kurtosis in returns. Faster information diffusion reduces the time required for prices to approach the signal-implied value, whereas the combination of information diffusion and social reinforcement generates overshooting and subsequent reversal. An empirical application to China's A-share market compares conventional CSAD and LSV measures with a rolling tail-based herding indicator obtained after Johnson $S_U$ transformation. The indicators display similar time variation and rise during major market disruptions. These findings identify information delay, local social reinforcement, and the eventual decay of herding as complementary mechanisms behind momentum and reversal.", "content_hash": "cbbdcf9d527ca0f1fbfcb975c018aafb67211e796f80e8d4d39cbd8d58ca329e", "category": "Alpha / Factor Research", "tags": ["agent", "momentum", "signal"], "language": "en", "metadata": {"arxiv_categories": ["q-fin.TR"]}, "one_line_summary": "Agent-based网络模型模拟羊群效应与有限速度信息扩散，解释A股动量与反转，实证Johnson S_U尾部羊群指标与CSAD/LSV同步上升", "technical_summary": "解释A股  existing benchmarks rely on synthetic environments that ignore practical time and monetary costs, conflate reasoning with communication, and reward only superficial completion. We introduce multi-agent from-scratch evaluation benchmark, MSEval, evaluating multi-agent coding on real-world tasks. Grounded in 10 authentic, full-stack projects across 10 domains, MSEval scores performance using hierarchical requirements and deterministic rubrics. Its execution engine, LegoGent, tests 10 collaboration topologies where agents coordinate via periodic sync intervals and deploy through native CI/CD pipelines. Concurrently, the automated grader TAgent dynamically probes implementations to jointly measure functional success, latency, and prefix-cached token cost. Across 100 runs, MSEval reveals that organizational topology rivals model capability in shaping the speed--cost--quality trade-off. For identical tasks and models, varying the topology shifts scores by over 30 points and doubles wall-clock time. Structured pipelines converge fastest with the highest quality, whereas heavy managerial oversight degrades performance. Ultimately, MSEval establishes a rigorous, reproducible standard for measuring how multi-agent teams actually build software. The benchmark is released at https://github.com/robinren03/MSEval.", "abstract": "Multi-agent vibe coding promises to accelerate software development, yet existing benchmarks rely on synthetic environments that ignore practical time and monetary costs, conflate reasoning with communication, and reward only superficial completion. We introduce multi-agent from-scratch evaluation benchmark, MSEval, evaluating multi-agent coding on real-world tasks. Grounded in 10 authentic, full-stack projects across 10 domains, MSEval scores performance using hierarchical requirements and deterministic rubrics. Its execution engine, LegoGent, tests 10 collaboration topologies where agents coordinate via periodic sync intervals and deploy through native CI/CD pipelines. Concurrently, the automated grader TAgent dynamically probes implementations to jointly measure functional success, latency, and prefix-cached token cost. Across 100 runs, MSEval reveals that organizational topology rivals model capability in shaping the speed--cost--quality trade-off. For identical tasks and models, varying the topology shifts scores by over 30 points and doubles wall-clock time. Structured pipelines converge fastest with the highest quality, whereas heavy managerial oversight degrades performance. Ultimately, MSEval establishes a rigorous, reproducible standard for measuring how multi-agent teams actually build software. The benchmark is released at https://github.com/robinren03/MSEval.", "content_hash": "a19bb544c3351aceb5b26ca29bef87ac5fd2d2ff4809dfc9c8f0243963112c29", "category": "LLM / Agents for Quant", "tags": ["agent", "execution", "reasoning"], "language": "en", "metadata": {"arxiv_categories": ["cs.AI"]}, "one_line_summary": "MSEval 多智能体编码基准显示：协作拓扑与模型能力同等重要，评分波动超 30 分，结构化流水线最优", "technical_summary": "现有编码基准依赖合成环境，忽略实际时间和资金成本，并把推理与沟通混为一谈。构建了 MSEval 基准，基于 10 个真实全栈项目、覆盖 10 个领域，用层级需求和确定性评分标准评估多智能体编码。LegoGent 执行引擎测试 10 种协作拓扑，通过周期同步和原生 CI/CD 部署；TAgent 自动评估功能成功、延迟和 prefix-cached token 成本。100 次运行显示，组织拓扑对速度-成本-质量的影响接近模型能力，相同任务和模型下仅改拓扑即可使评分波动超过 30 分，墙钟时间翻倍。结构化流水线收敛最快且质量最高，而过重的管理监督会降低性能。", "key_points": ["100 次运行中，相同任务和模型仅改协作拓扑，评分波动超 30 分，墙钟时间翻倍。", "MSEval 已开源，可用真实项目衡量多智能体代码生成工作流的成本-质量-速度。", "量化场景需自行验证：任务均为通用软件工程，未必直接迁移到金融因子挖掘和交易代码生成。"], "quant_relevance": "研究工具 / 工作流提效", "possible_use_case": "搭建量化研究报告或因子代码自动生成流水线时，先用 MSEval 的拓扑评估方式对比单 Manager 多 Worker、结构化 pipeline、去中心化协作等模式，在真实内部任务上测评分、延迟和 token 成本后再落地。", "limitations": "基准任务来自通用软件工程，不覆盖金融数据、交易约束或市场微观结构；成本指标侧重 prefix-cached token 成本，未完全包含真实 API 价格波动；10 个项目规模有限，拓扑结论需在更大任务集和更多模型上复核；这是开发流程评估，不是可直接用于交易的策略。", "read_priority": "中", "key_figures_md": "- **Figure 1**：MSEval 基准总览：10 个领域项目与 10 种协作拓扑示意，见 arXiv HTML 原图\n- **Figure/Table**：不同协作拓扑在功能成功、延迟、token 成本上的对比结果，见 https://arxiv.org/html/2607.27877\n- [原文图表（HTML版）](https://arxiv.org/html/2607.27877)", "relevance_score": 5.4, "novelty_score": 9.565, "academic_score": 10.0, "discussion_score": 2.0, "actionable_score": 6.5, "final_score": 6.633, "display_title": "交易执行、多智能体、货币条件研究论文", "tldr": "MSEval 多智能体编码基准显示：协作拓扑与模型能力同等重要，评分波动超 30 分，结构化流水线最优", "core_value": "对你的量化工作帮助：把它拆成一个量化大模型 / 智能体复现任务，先验证交易执行、多智能体、货币条件是否真的带来样本外提升，再检查交易成本、数据泄漏和换手约束。", "key_points_list": ["100 次运行中，相同任务和模型仅改协作拓扑，评分波动超 30 分，墙钟时间翻倍。", "MSEval 已开源，可用真实项目衡量多智能体代码生成工作流的成本-质量-速度。", "量化场景需自行验证：任务均为通用软件工程，未必直接迁移到金融因子挖掘和交易代码生成。"], "reference_url": "http://arxiv.org/abs/2607.27877v1", "report_sections": ["ai_quant_tools"], "report_section_labels": ["AI 量化工具"], "category_label": "量化大模型 / 智能体", "priority_label": "中", "source_type_label": "论文"}, {"id": "22cbcacdb74c9db5a27c81dbca8edf2cd9e2f7d340b08f7f1bb6b5e7ca9323b5", "source": "Quant StackExchange", "source_type": "forum", "title": "Framework for hypothesis testing and non-linear signal extraction in alternative data", "url": "https://quant.stackexchange.com/questions/85737/framework-for-hypothesis-testing-and-non-linear-signal-extraction-in-alternative", "authors": ["Rookie_analyst"], "published_at": "2026-07-31", "collected_at": "2026-08-01T00:10:17Z", "raw_text": "I am looking to understand the practitioner research framework for evaluating alternative datasets (e-receipts, healthcare claims, airline bookings). Because many of these datasets are now widely commoditized, standard linear relationships are often priced in. I am specifically interested in the statistical methodology used to rigorously test for alpha and capture second-order effects. ​ Hypothesis formulation: What is the standard process for formulating a specific, testable hypothesis for an alternative dataset, and what criteria are used to falsify it? ​Effect Isolation: Once a hypothesis is formed, how do you formally test and isolate that specific effect to ensure you are measuring the actual data signal and not some noise? ​Non-Linear Techniques: Given the decay of simple linear signals in commoditized datasets, what is the accepted methodology for applying non-linear models (tree-based methods/boosting) to capture second-order effects without curve-fitting? ​I am interested purely in the structural research methodology and statistical frameworks, not proprietary signals. Any reference to literature would be highly appreciated.", "abstract": "I am looking to understand the practitioner research framework for evaluating alternative datasets (e-receipts, healthcare claims, airline bookings). Because many of these datasets are now widely commoditized, standard linear relationships are often priced in. I am specifically interested in the statistical methodology used to rigorously test for alpha and capture second-order effects. ​ Hypothesis formulation: What is the standard process for formulating a specific, testable hypothesis for an alternative dataset, and what criteria are used to falsify it? ​Effect Isolation: Once a hypothesis is formed, how do you formally test and isolate that specific effect to ensure you are measuring the actual data signal and not some noise? ​Non-Linear Techniques: Given the decay of simple linear signals in commoditized datasets, what is the accepted methodology for applying non-linear models (tree-based methods/boosting) to capture second-order effects without curve-fitting? ​I am interested purely in the structural research methodology and statistical frameworks, not proprietary signals. Any reference to literature would be highly appreciated.", "content_hash": "aad5ddb34465d0a4707bb47724da112a9d8443988fecc80fa9b528f66e7230d7", "category": "Alpha / Factor Research", "tags": ["alpha", "alternative data", "dataset", "signal"], "language": "en", "metadata": {"feed_url": "https://quant.stackexchange.com/feeds"}, "one_line_summary": "另类数据线性信号钝化后，如何用可证伪假设+提升树提取二阶 alpha：Quant StackExchange 开放讨论", "technical_summary": "原帖是在 Quant StackExchange 上的开放提问，主题是另类数据研究框架。发帖人指出电子收据、医疗理赔、航空订票等数据集已被广泛商品化，简单线性关系往往已被市场定价，因此需要统计方法检验 alpha 并捕捉二阶效应。帖子拆成三部分：假设如何形成并证伪、效应如何隔离、以及如何在不过度拟合条件下用树模型/提升树提取非线性信号。输入中没有回答内容，因此没有社区共识或实验结论可引用。", "key_points": ["帖子核心诉求：另类数据中线性信号衰减后，需从假设形成、效应隔离到非线性提取建立完整统计框架；原文缺乏量化指标，结论待复核。", "原帖未提供可操作的代码或工具；落地时可先按数据源定义可证伪假设，再用已知因子正交化或中性化做效应隔离，最后在样本外验证非线性模型。", "只有提问没有回答，无法判断社区共识；另类数据覆盖偏差、购买成本和数据修订风险较大，非线性二阶信号容易因多重检验和过拟合而在样本外失效。"], "quant_relevance": "因子 / alpha 信号；研究工具 / 工作流提效", "possible_use_case": "可作为另类数据因子研究的方法清单：按电子收据/医疗理赔等数据源先设计可证伪假设，用已知因子中性化做效应隔离，再用 XGBoost/LightGBM 在留出集上扫描二阶交互特征。", "limitations": "这是社区讨论（提问帖），目前看不到回答内容，需用自有数据验证后才能用于研究结论。另类数据存在购买成本、覆盖偏差、数据修订延迟；非线性二阶信号容易在样本外衰减，需警惕多重检验和过拟合。", "read_priority": "低", "key_figures_md": "", "relevance_score": 6.1, "novelty_score": 9.78, "academic_score": 5.439, "discussion_score": 3.0, "actionable_score": 7.5, "final_score": 6.552, "display_title": "阿尔法、另类数据、测试实践讨论", "tldr": "另类数据线性信号钝化后，如何用可证伪假设+提升树提取二阶 alpha：Quant StackExchange 开放讨论", "core_value": "对你的量化工作帮助：把它当作阿尔法、另类数据、测试的实盘经验线索，用来补充回测假设、交易成本假设或风控检查清单。", "key_points_list": ["帖子核心诉求：另类数据中线性信号衰减后，需从假设形成、效应隔离到非线性提取建立完整统计框架；原文缺乏量化指标，结论待复核。", "原帖未提供可操作的代码或工具；落地时可先按数据源定义可证伪假设，再用已知因子正交化或中性化做效应隔离，最后在样本外验证非线性模型。", "只有提问没有回答，无法判断社区共识；另类数据覆盖偏差、购买成本和数据修订风险较大，非线性二阶信号容易因多重检验和过拟合而在样本外失效。"], "reference_url": "https://quant.stackexchange.com/questions/85737/framework-for-hypothesis-testing-and-non-linear-signal-extraction-in-alternative", "report_sections": ["ai_quant_tools"], "report_section_labels": ["AI 量化工具"], "category_label": "阿尔法 / 因子研究", "priority_label": "低", "source_type_label": "论坛"}, {"id": "f4cd60d700cdcf47e382ccfbd1455120e5be80469b4bb04fcc4eebcce54ec6a3", "source": "Reddit algotrading", "source_type": "forum", "title": "Thank you algotrading!", "url": "https://www.reddit.com/r/algotrading/comments/1vc2ifb/thank_you_algotrading/", "authors": ["/u/Dvorak_Pharmacology"], "published_at": "2026-07-31", "collected_at": "2026-08-01T00:10:17Z", "raw_text": "What a beautiful equity curve. I started algo trading and taking quant analysis seriously this April for SPX options and... oh boy. Doing mostly diagonals and looking now into some 0dte and futures strategies. Feel free to share your thoughts! Edit: The % of win is around 30% of the risk allocation (meaning 300 dollars per 1000 dollars at risk). The risk fraction per trade used is a fourth of the kelly fraction. With my backtests I obtained a kelly of 60% (due to the high win rate of the strategy), so I currently use a 15% of my account per trade to risk and make a 30% of that, which comes out at around 5% weekly so far. This allows me to have a weekly income that has been very stable for the last 3 months! submitted by /u/Dvorak_Pharmacology [link] [comments]", "abstract": "What a beautiful equity curve. I started algo trading and taking quant analysis seriously this April for SPX options and... oh boy. Doing mostly diagonals and looking now into some 0dte and futures strategies. Feel free to share your thoughts! Edit: The % of win is around 30% of the risk allocation (meaning 300 dollars per 1000 dollars at risk). The risk fraction per trade used is a fourth of the kelly fraction. With my backtests I obtained a kelly of 60% (due to the high win rate of the strategy), so I currently use a 15% of my account per trade to risk and make a 30% of that, which comes out at around 5% weekly so far. This allows me to have a weekly income that has been very stable for the last 3 months! submitted by /u/Dvorak_Pharmacology [link] [comments]", "content_hash": "625627ebd1c089a2a55bb16ad3ce78cf87a6e3f9c533b22ac290d06903832971", "category": "Portfolio Construction", "tags": ["allocation", "risk"], "language": "en", "metadata": {"feed_url": "https://www.reddit.com/r/algotrading/.rss"}, "one_line_summary": "Reddit 用户用 SPX 期权对角线策略，1/4 Kelly 仓位管理实现 3 个月周收益 5%", "technical_summary": "Dvorak_Pharmacology 在 SPX 期权执行对角线策略，使用 Kelly 公式管理仓位。回测显示 Kelly 为 60%（因胜率高），他将单笔风险比例设为 Kelly 的四分之一，即账户 15% 作为风险资金，每笔实际亏损为风险的 30%（每 1000 美元风险资金亏损 300 美元），综合胜率约 30%。过去 3 个月，该组合实现每周约 5% 的稳定收益，并计划扩展到 0DTE 和期货策略。社区主要回应是认可其仓位纪律，同时提醒高胜率回测可能存在过拟合风险。", "key_points": ["核心观点：用 1/4 Kelly 仓位管理 SPX 期权对角线策略，胜率 30% 下实现周收益 5%。", "操作建议：先回测估算 Kelly 分数，取四分之一作为单笔风险，并控制每笔亏损为风险金额的 30%。", "风险提示：5% 周收益可能难以持续，回测高 Kelly 可能过拟合，且未考虑滑点和期权流动性。"], "quant_relevance": "风险建模 / 仓位管理；组合构建 / 资金分配", "possible_use_case": "可作为 SPX 期权策略的仓位模板：回测估算 Kelly → 取 1/4 作为单笔风险 → 每笔最大亏损设为风险金额 30% → 小规模实盘验证 3 个月后再扩大。", "limitations": "这是社区分享，无严格回测记录和数据支撑。仅在 SPX 期权和 3 个月窗口测试，未考虑交易成本、滑点、隐含波动率变化；高胜率可能来自过拟合，需压力测试和样本外验证。", "read_priority": "高", "key_figures_md": "", "relevance_score": 6.3, "novelty_score": 9.78, "academic_score": 4.963, "discussion_score": 3.0, "actionable_score": 6.5, "final_score": 6.34, "display_title": "风险、期权实践讨论", "tldr": "Reddit 用户用 SPX 期权对角线策略，1/4 Kelly 仓位管理实现 3 个月周收益 5%", "core_value": "对你的量化工作帮助：把它当作风险、期权的实盘经验线索，用来补充回测假设、交易成本假设或风控检查清单。", "key_points_list": ["核心观点：用 1/4 Kelly 仓位管理 SPX 期权对角线策略，胜率 30% 下实现周收益 5%。", "操作建议：先回测估算 Kelly 分数，取四分之一作为单笔风险，并控制每笔亏损为风险金额的 30%。", "风险提示：5% 周收益可能难以持续，回测高 Kelly 可能过拟合，且未考虑滑点和期权流动性。"], "reference_url": "https://www.reddit.com/r/algotrading/comments/1vc2ifb/thank_you_algotrading/", "report_sections": ["ai_quant_tools"], "report_section_labels": ["AI 量化工具"], "category_label": "组合构建", "priority_label": "高", "source_type_label": "论坛"}, {"id": "74b306a42cedfd5fafeea535a95a9126606e7a1a6d99d205ddc56eba8679d928", "source": "arXiv", "source_type": "paper", "title": "An Artificial Market for Brazilian Real Estate Investment Funds: An Agent-Based Proposal", "url": "http://arxiv.org/abs/2607.25098v1", "authors": ["Gilberto Gil F. G. Passos", "Eber Assis Schmitz", "Sildenir Alves Ribeiro"], "published_at": "2026-07-27", "collected_at": "2026-08-01T00:07:37Z", "raw_text": "This article presents the development and validation of an artificial market for Brazilian Real Estate Investment Trusts (REITs), known as Fundos de Investimento Imobiliario (FIIs), using agent-based modeling methodology. The central contribution of this work is the integration, within a single multi-agent system, of the FII value chain, from the generation of real estate revenues subject to vacancy and operational costs, through dividend distribution, to the trading of shares by heterogeneous investors mediated by a double auction mechanism with an order book. The model incorporates endogenous macroeconomic variables, such as the Selic, the Brazilian benchmark interest rate, and inflation, and represents agent heterogeneity through a behavioral decomposition into fundamentalist, speculator, and noise trader components, modulated by individual financial literacy levels. The model was calibrated using the Method of Simulated Moments applied to the historical series of the IFIX index, the Brazilian REIT market index, between 2021 and 2025. The validation results, obtained using two distinct methods, demonstrate that the model reproduces the main stylized facts observed in the real market: (i) the coverage rate of calibrated moments exceeds 75 percent; (ii) 96 percent of simulated trajectories are structurally indistinguishable from real IFIX periods according to the nearest-neighbor criterion; and (iii) stylized facts such as the power law of autocorrelations of absolute returns and aggregational Gaussianity emerge spontaneously, without being incorporated into the calibration objective function. The results of the validation process indicate that the artificial market captures structural dynamics of the FII market, opening perspectives for its use as a computational laboratory for the analysis of regulatory policies and pricing mechanisms.", "abstract": "This article presents the development and validation of an artificial market for Brazilian Real Estate Investment Trusts (REITs), known as Fundos de Investimento Imobiliario (FIIs), using agent-based modeling methodology. The central contribution of this work is the integration, within a single multi-agent system, of the FII value chain, from the generation of real estate revenues subject to vacancy and operational costs, through dividend distribution, to the trading of shares by heterogeneous investors mediated by a double auction mechanism with an order book. The model incorporates endogenous macroeconomic variables, such as the Selic, the Brazilian benchmark interest rate, and inflation, and represents agent heterogeneity through a behavioral decomposition into fundamentalist, speculator, and noise trader components, modulated by individual financial literacy levels. The model was calibrated using the Method of Simulated Moments applied to the historical series of the IFIX index, the Brazilian REIT market index, between 2021 and 2025. The validation results, obtained using two distinct methods, demonstrate that the model reproduces the main stylized facts observed in the real market: (i) the coverage rate of calibrated moments exceeds 75 percent; (ii) 96 percent of simulated trajectories are structurally indistinguishable from real IFIX periods according to the nearest-neighbor criterion; and (iii) stylized facts such as the power law of autocorrelations of absolute returns and aggregational Gaussianity emerge spontaneously, without being incorporated into the calibration objective function. The results of the validation process indicate that the artificial market captures structural dynamics of the FII market, opening perspectives for its use as a computational laboratory for the analysis of regulatory policies and pricing mechanisms.", "content_hash": "bf54b26f33f0753f9b010786dbbf056d02dc907e01dec89a7d40425753ba8221", "category": "Options / Volatility", "tags": ["agent", "interest rate", "order book", "pricing"], "language": "en", "metadata": {"arxiv_categories": ["cs.CC"]}, "one_line_summary": "多智能体仿真巴西 FII 全价值链，IFIX 2021–2025 校准矩覆盖率超 75%，96% 模拟轨迹与真实市场不可区分", "technical_summary": "构建一个覆盖 FII 全价值链的多智能体人工市场：从房产租金收入（含空置率与运营成本）到分红分配，再到异质投资者（基本面派、投机派、噪音交易者，按金融素养加权）在限价订单簿双重拍卖中交易。模型中 Selic 基准利率和通胀为内生宏观经济变量，使用矩模拟法（Method of Simulated Moments）对标 2021–2025 年 IFIX 历史序列校准。验证结果显示矩覆盖率超过 75%，96% 的模拟轨迹按最近邻准则与真实 IFIX 时段结构不可区分。绝对收益自相关的幂律和聚集高斯性等风格化事实自发涌现，未写入校准目标函数，说明模型抓住了真实市场的结构动力学。", "key_points": ["矩模拟校准的 IFIX 人工市场矩覆盖率>75%，96% 模拟轨迹通过最近邻检验，绝对收益自相关幂律自发涌现。", "需 FII 租金、空置率、Selic、通胀与 IFIX 日频数据；多智能体+订单簿实现门槛高，但代理框架可迁移至其他 REIT 市场。", "仅用巴西 2021–2025 单一市场校准，无跨市场样本外验证；未报告交易成本、滑点与分红税，直接用于策略回测可靠性存疑。"], "quant_relevance": "研究工具 / 工作流提效；市场微观结构仿真，可服务于压力测试与定价机制研究", "possible_use_case": "将模型改造成 FII/REIT 虚拟市场环境，测试红利税调整、利率冲击或订单簿撮合规则变化对价格波动与流动性的影响，也可作为强化学习交易 agent 的模拟训练场。", "limitations": "仅覆盖巴西单一市场且校准窗口只有 2021–2025，样本外泛化未验证；矩校准有过拟合风险；未纳入佣金、滑点、税务等真实摩擦；需要大量房产层面微观数据，工程落地代价较高。", "read_priority": "中", "key_figures_md": "- **Figure 1**：人工市场整体架构：房产现金流生成→分红→订单簿撮合的多智能体流程\n- **Figure 5**：真实 IFIX 与模拟指数路径对比，展示 96% 轨迹不可区分的判定边界\n- **Table 3**：校准矩匹配汇总：覆盖率超过 75% 的具体矩指标清单\n- **Figure 8**：绝对收益自相关幂律与聚集高斯性的自发涌现图\n- [原文图表（HTML版）](https://arxiv.org/html/2607.25098)", "relevance_score": 6.1, "novelty_score": 8.948, "academic_score": 10.0, "discussion_score": 2.0, "actionable_score": 4.5, "final_score": 6.32, "display_title": "订单簿、定价、多智能体、监管研究论文", "tldr": "多智能体仿真巴西 FII 全价值链，IFIX 2021–2025 校准矩覆盖率超 75%，96% 模拟轨迹与真实市场不可区分", "core_value": "对你的量化工作帮助：把它当作订单簿、定价、多智能体、监管案例，用来补充异常交易监控、市场操纵风险、大宗商品执行和合规审计的场景库。", "key_points_list": ["矩模拟校准的 IFIX 人工市场矩覆盖率>75%，96% 模拟轨迹通过最近邻检验，绝对收益自相关幂律自发涌现。", "需 FII 租金、空置率、Selic、通胀与 IFIX 日频数据；多智能体+订单簿实现门槛高，但代理框架可迁移至其他 REIT 市场。", "仅用巴西 2021–2025 单一市场校准，无跨市场样本外验证；未报告交易成本、滑点与分红税，直接用于策略回测可靠性存疑。"], "reference_url": "http://arxiv.org/abs/2607.25098v1", "report_sections": ["ai_quant_tools"], "report_section_labels": ["AI 量化工具"], "category_label": "期权 / 波动率", "priority_label": "中", "source_type_label": "论文"}, {"id": "e2f993a4b7432b7b7fc2fc8a62f73c3b2b5b29f8c3eea450484444a1e86bb2eb", "source": "The Block", "source_type": "crypto_news", "title": "Ethereum’s 43-day staking queue isn’t a clean demand signal, Sygnum says", "url": "https://www.theblock.co/post/410285/ethereum-43-day-staking-queue-isnt-clean-demand-signal-sygnum?utm_source=rss&utm_medium=rss", "authors   <script>
    const payload = JSON.parse(document.getElementById('dashboard-data').textContent);
    const items = payload.items || [];
    const categoryLabels = payload.category_labels || {};
    const priorityLabels = payload.priority_labels || {};
    const sourceTypeLabels = payload.source_type_labels || {};
    const state = {
      query: '',
      section: 'All',
      category: 'All',
      sort: 'score',
      activeId: items[0]?.id || null,
    };

    const priorityRank = { High: 3, Medium: 2, Low: 1, '高': 3, '中': 2, '低': 1 };
    const $ = (id) => document.getElementById(id);

    // --- Feedback ---
    const _feedbackStore = JSON.parse(localStorage.getItem('quant-feedback') || '{}');
    function getFeedback(id) { return _feedbackStore[id] || 0; }
    function setFeedback(id, signal) {
      if (_feedbackStore[id] === signal) { delete _feedbackStore[id]; signal = 0; }
      else { _feedbackStore[id] = signal; }
      localStorage.setItem('quant-feedback', JSON.stringify(_feedbackStore));
      fetch('http://localhost:8080/feedback', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id, signal }),
      }).catch(() => {});
    }

    function init() {
      $('report-date').textContent = payload.report_date + ' - 主力源：arXiv / 知乎 / QuantML / 大型论坛 - 生成时间 ' + payload.generated_at;
      $('metric-items').textContent = items.length;
      $('metric-categories').textContent = new Set(items.map((item) => item.category)).size;
      $('metric-high').textContent = items.filter((item) => priorityLabel(item.read_priority) === '高').length;
      $('metric-avg').textContent = averageScore(items).toFixed(1);

      buildSectionControls();
      buildCategoryControls();
      buildSourceList();
      bindControls();
      render();
    }

    function bindControls() {
      $('search').addEventListener('input', (event) => {
        state.query = event.target.value.trim().toLowerCase();
        render();
      });
      $('category-select').addEventListener('change', (event) => {
        state.category = event.target.value;
        render();
      });
      $('section-select').addEventListener('change', (event) => {
        state.section = event.target.value;
        render();
      });
      $('sort-select').addEventListener('change', (event) => {
        state.sort = event.target.value;
        render();
      });
    }

    function buildCategoryControls() {
      const counts = countBy(items, 'category');
      const categories = Object.keys(counts).sort();
      const select = $('category-select');
      select.innerHTML = option('All', `全部细分标签 (${items.length})`) +
        categories.map((category) => option(category, `${categoryLabel(category)} (${counts[category]})`)).join('');

      const list = $('category-list');
      list.innerHTML = categoryButton('All', items.length) +
        categories.map((category) => categoryButton(category, counts[category])).join('');

      list.querySelectorAll('button').forEach((button) => {
        button.addEventListener('click', () => {
          state.category = button.dataset.category;
          select.value = state.category;
          if (state.category === 'All') {
            state.section = 'All';
            $('section-select').value = 'All';
          }
          render();
        });
      });
    }

    function buildSectionControls() {
      const counts = payload.section_counts || {};
      const sections = payload.sections || [];
      const select = $('section-select');
      select.innerHTML = option('All', `全部主线 (${items.length})`) +
        sections
          .filter((section) => counts[section.key])
          .map((section) => option(section.key, `${section.label} (${counts[section.key]})`))
          .join('');

      const list = $('section-list');
      list.innerHTML = sectionButton('All', '全部', items.length) +
        sections
          .filter((section) => counts[section.key])
          .map((section) => sectionButton(section.key, section.label, counts[section.key]))
          .join('');

      list.querySelectorAll('button').forEach((button) => {
        button.addEventListener('click', () => {
          state.section = button.dataset.section;
          select.value = state.section;
          if (state.section === 'All') {
            state.category = 'All';
            $('category-select').value = 'All';
          }
          render();
        });
      });
    }

    function buildSourceList() {
      const stats = payload.source_stats || {};
      const entries = Object.entries(stats)
        .filter(([source]) => !source.startsWith('fetched:'))
        .sort((a, b) => b[1] - a[1]);
      $('source-list').innerHTML = entries.length
        ? entries.map(([source, count]) => `<li><span>${escapeHtml(source)}</span><b>${count}</b></li>`).join('')
        : '<li><span>暂无来源统计</span><b>0</b></li>';
    }

    function render() {
      let visible = items.filter(matchesFilters);
      visible = sortItems(visible);
      if (!visible.some((item) => item.id === state.activeId)) {
        state.activeId = visible[0]?.id || null;
      }

      $('feed-title').textContent = feedTitle();
      $('result-count').textContent = `展示 ${visible.length} 条 - 两条主线每条最多 ${payload.report_config.max_items_per_category} 条`;
      renderSectionActive();
      renderCategoryActive();
      renderItems(visible);
      renderDetail(visible.find((item) => item.id === state.activeId) || visible[0]);
    }

    function matchesFilters(item) {
      const sectionMatch = state.section === 'All' || (item.report_sections || []).includes(state.section);
      if (!sectionMatch) return false;
      const categoryMatch = state.category === 'All' || item.category === state.category;
      if (!categoryMatch) return false;
      if (!state.query) return true;
      const haystack = [
        item.title,
        item.display_title,
        item.source,
        item.source_type,
        item.category,
        categoryLabel(item.category),
        sectionLabel(item.report_sections?.[0]),
        sourceTypeLabel(item.source_type),
        priorityLabel(item.read_priority),
        item.one_line_summary,
        item.technical_summary,
        item.quant_relevance,
        item.possible_use_case,
        item.tldr,
        item.core_value,
        ...(item.key_points_list || []),
        item.reference_url,
      ].join(' ').toLowerCase();
      return haystack.includes(state.query);
    }

    function sortItems(list) {
      return [...list].sort((a, b) => {
        if (state.sort === 'priority') {
          return (priorityRank[b.read_priority] || 0) - (priorityRank[a.read_priority] || 0)
            || b.final_score - a.final_score;
        }
        if (state.sort === 'source') {
          return a.source.localeCompare(b.source) || b.final_score - a.final_score;
        }
        return b.final_score - a.final_score;
      });
    }

    function renderCategoryActive() {
      document.querySelectorAll('.category-button').forEach((button) => {
        button.classList.toggle('active', button.dataset.category === state.category);
      });
    }

    function renderSectionActive() {
      document.querySelectorAll('.section-button').forEach((button) => {
        button.classList.toggle('active', button.dataset.section === state.section);
      });
    }

    function itemCard(item) {
      const sec = item.report_sections?.[0] || 'other';
      const sig = getFeedback(item.id);
      return `
        <article class="item ${item.id === state.activeId ? 'active' : ''}"
                 data-id="${escapeAttr(item.id)}"
                 data-section="${escapeAttr(sec)}">
          <div class="item-top">
            <h3>${escapeHtml(item.display_title || item.title)}</h3>
            <div class="score">${Number(item.final_score).toFixed(1)}</div>
          </div>
          <div class="meta">
            <span class="tag">${escapeHtml(categoryLabel(item.category))}</span>
            <span class="tag">${escapeHtml(item.source)}</span>
            <span class="tag">${escapeHtml(priorityLabel(item.read_priority))}</span>
          </div>
          ${readerFormat(item, true)}
          <div class="feedback-row">
            <button class="feedback-btn ${sig === 1 ? 'active-up' : ''}" data-feedback="1" title="有用">👍</button>
            <button class="feedback-btn ${sig === -1 ? 'active-down' : ''}" data-feedback="-1" title="跳过">👎</button>
            <span class="feedback-hint">${sig === 1 ? '已标记有用' : sig === -1 ? '已标记跳过' : ''}</span>
          </div>
        </article>
      `;
    }

    function sectionGroupHeader(section, count) {
      return `
        <div class="section-group-header" data-section="${escapeAttr(section.key)}">
          <span class="section-group-title">${escapeHtml(section.label)}</span>
          <span class="section-group-count">${count} 条</span>
        </div>
      `;
    }

    function renderItems(visible) {
      const container = $('items');
      if (!visible.length) {
        container.innerHTML = '<div class="empty">当前筛选条件下没有匹配内容。</div>';
        return;
      }

      let html = '';
      if (state.section === 'All') {
        // Group by section in defined order, with a header for each group
        const grouped = {};
        for (const item of visible) {
          const sec = item.report_sections?.[0] || 'other';
          if (!grouped[sec]) grouped[sec] = [];
          grouped[sec].push(item);
        }
        for (const section of (payload.sections || [])) {
          const group = grouped[section.key];
          if (!group || !group.length) continue;
          html += sectionGroupHeader(section, group.length);
          html += group.map((item) => itemCard(item)).join('');
        }
        // Append any items that fell into 'other' (shouldn't normally happen)
        if (grouped['other']?.length) {
          html += grouped['other'].map((item) => itemCard(item)).join('');
        }
      } else {
        html = visible.map((item) => itemCard(item)).join('');
      }

      container.innerHTML = html;
      container.querySelectorAll('.item').forEach((node) => {
        node.addEventListener('click', () => {
          state.activeId = node.dataset.id;
          render();
        });
      });
      container.querySelectorAll('.feedback-btn').forEach((btn) => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const itemNode = btn.closest('.item');
          setFeedback(itemNode.dataset.id, parseInt(btn.dataset.feedback, 10));
          render();
        });
      });
    }

    function renderDetail(item) {
      const detail = $('detail');
      if (!item) {
        detail.innerHTML = '<div class="empty">选择一条内容查看详情。</div>';
        return;
      }

      detail.innerHTML = `
        <h2>${escapeHtml(item.display_title || item.title)}</h2>
        <div class="meta">
          <span class="tag">${escapeHtml(categoryLabel(item.category))}</span>
          <span class="tag">${escapeHtml(sourceTypeLabel(item.source_type))}</span>
          <span class="tag">${escapeHtml(priorityLabel(item.read_priority))}</span>
        </div>

        ${readerFormat(item, false)}

        <div class="detail-block">
          <h3>评分拆解</h3>
          <div class="breakdown">
            ${bar('相关性', item.relevance_score)}
            ${bar('新颖度', item.novelty_score)}
            ${bar('学术性', item.academic_score)}
            ${bar('讨论度', item.discussion_score)}
            ${bar('可行动性', item.actionable_score)}
          </div>
        </div>

      `;
    }

    function readerFormat(item, compact) {
      const points = itemKeyPoints(item);
      return `
        <div class="reader-format ${compact ? 'compact' : ''}">
          <div class="reader-block">
            <h4>1. 这篇文章的太长不读</h4>
            <p>${escapeHtml(item.tldr || item.one_line_summary || '')}</p>
          </div>
          <div class="reader-block">
            <h4>2. 核心价值，对我量化的工作能够提供什么样的帮助</h4>
            <p>${escapeHtml(item.core_value || '')}</p>
          </div>
          <div class="reader-block">
            <h4>3. 关键核心点 / 论文或帖子摘要</h4>
            <ol>${points.map((point) => `<li>${escapeHtml(point)}</li>`).join('')}</ol>
          </div>
          <div class="reader-block">
            <h4>4. 原文链接</h4>
            ${referenceHtml(item)}
          </div>
        </div>
      `;
    }

    function itemKeyPoints(item) {
      const points = Array.isArray(item.key_points_list)
        ? item.key_points_list
        : (Array.isArray(item.key_points) ? item.key_points : []);
      const clean = points.filter(Boolean).slice(0, 3);
      return clean.length ? clean : ['需要打开原文进一步确认方法、数据和适用边界。'];
    }

    function referenceHtml(item) {
      const url = item.reference_url || '';
      if (!url) return '<p>暂无可打开链接</p>';
      return `
        <a class="reader-reference" href="${escapeAttr(url)}" target="_blank" rel="noopener noreferrer">打开原文</a>
        <small class="reference-url">${escapeHtml(url)}</small>
      `;
    }

    function bar(label, value) {
      const score = Number(value || 0);
      const width = Math.max(0, Math.min(100, score * 10));
      return `
        <div class="bar">
          <span>${label}</span>
          <div class="bar-track"><div class="bar-fill" style="width: ${width}%"></div></div>
          <b>${score.toFixed(1)}</b>
        </div>
      `;
    }

    function countBy(list, key) {
      return list.reduce((acc, item) => {
        acc[item[key]] = (acc[item[key]] || 0) + 1;
        return acc;
      }, {});
    }

    function averageScore(list) {
      if (!list.length) return 0;
      return list.reduce((sum, item) => sum + Number(item.final_score || 0), 0) / list.length;
    }

    function option(value, label) {
      return `<option value="${escapeAttr(value)}">${escapeHtml(label)}</option>`;
    }

    function sectionButton(section, label, count) {
      return `
        <button class="category-button section-button" type="button" data-section="${escapeAttr(section)}">
          <span>${escapeHtml(label)}</span>
          <span class="count">${count}</span>
        </button>
      `;
    }

    function categoryButton(category, count) {
      return `
        <button class="category-button" type="button" data-category="${escapeAttr(category)}">
          <span>${escapeHtml(category === 'All' ? '全部' : categoryLabel(category))}</span>
          <span class="count">${count}</span>
        </button>
      `;
    }

    function categoryLabel(category) {
      return categoryLabels[category] || category;
    }

    function sectionLabel(sectionKey) {
      const section = (payload.sections || []).find((item) => item.key === sectionKey);
      return section ? section.label : '其他';
    }

    function feedTitle() {
      const parts = [];
      if (state.section !== 'All') parts.push(sectionLabel(state.section));
      if (state.category !== 'All') parts.push(categoryLabel(state.category));
      return parts.length ? parts.join(' / ') : '今日情报';
    }

    function priorityLabel(priority) {
      return priorityLabels[priority] || priority;
    }

    function sourceTypeLabel(sourceType) {
      return sourceTypeLabels[sourceType] || sourceType;
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function escapeAttr(value) {
      return escapeHtml(value).replaceAll('`', '&#096;');
    }

    init();
  </script>
</body>
</html>
