 between 40 to 60% range is acceptable. Obtain the 95% max drawdown as this is the drawdown i will size for And there you have it boys .we have a strategy that may work Step 5 - Portfolio Construction Accumulate a good number of strategies. Measure correlation between the strategies. Correlated measured strictly on drawdown and position overlap. Everything cannot be allowed to bleed on one bad morning. Build a portfolio consisting of atleast 10 strategies each with a correlation between -0.10 to 0.20 . Size the strategies such that the 95% max drawdown does not wipe out your portfolio This is my workflow as of late. It improves as my domain knowledge and expertise expand submitted by /u/Capital-Field3324 [link] [comments]", "content_hash": "61cfd453bf520db1c0efed2f928f170b5d5f323279de8b659be7f5e7167ed731", "category": "Portfolio Construction", "tags": ["backtesting", "dataset", "drawdown", "llm", "optimization", "portfolio", "risk", "slippage"], "language": "en", "metadata": {"feed_url": "https://www.reddit.com/r/algotrading/.rss"}, "one_line_summary": "Reddit 分享 MT5 全流程：15年 OOS 数据+3x3 参数稳健性+1000次蒙特卡洛筛选策略，附严格风控门槛", "technical_summary": "分享一套 MT5 策略开发流水线：数据用 Dukascopy tick 含真实点差，外汇和黄金可追溯到 2008 年、指数到 2012 年，策略以 EA 部署。回测采用 3 年样本内/1 年样本外滚动 WFO，用 3x3 参数热力图检查参数稳健性，要求全局盈利格占比大于 40%、邻域 5/9 盈利。OOS 最大回撤不能超过 IS 最大回撤的 2 倍，且绝对门槛是 15%。通过后拼接 OOS 曲线，对成交历史做 1000 次蒙特卡洛置换，要求业绩排名落在 40%–60% 分位，并用 95% 最大回撤决定仓位。最后组合至少 10 个策略，相关性控制在 -0.10 到 0.20 之间。作者明确说自己没有第三方验证记录，观点需谨慎。", "key_points": ["核心方法：WFO 用 3 年 IS/1 年 OOS，参数敏感性要求 3x3 热力图全局盈利>40%且邻域 5/9 盈利，OOS 最大回撤≤2 倍 IS 且≤15%。", "可直接借鉴：从 MT5 优化器导出参数组合生成热力图筛选、对订单历史做 1000 次蒙特卡洛、按 95% 最大回撤定仓位、组合相关性按回撤和持仓重叠度计算。", "风险提示：作者无第三方验证记录，OOS 拼接和人工阈值容易被过拟合，实盘滑点/佣金假设需用独立数据复核。"], "quant_relevance": "组合构建 / 权重优化；研究工具 / 工作流提效", "possible_use_case": "可将参数热力图+3x3 稳健性门槛复制到现有回测框架，用于 4h/日频 CTA 策略的过拟合筛查；也可用蒙特卡洛 40%–60% 分位淘汰规则和相关性区间 -0.10~0.20 来构建多策略组合。", "limitations": "这是社区讨论，需用数据验证后才能用于研究结论。作者没有第三方业绩验证；WFO 的样本窗口和 OOS 拼接方式可能引入未来函数；40%、5/9、2 倍回撤、15% 等阈值是主观设定；蒙特卡洛基于订单历史重排，未包含真实市场冲击；外汇和黄金市场结构与中国 A 股差异较大。", "read_priority": "高", "key_figures_md": "", "relevance_score": 8.2, "novelty_score": 9.78, "academic_score": 5.5, "discussion_score": 3.0, "actionable_score": 7.5, "final_score": 7.191, "display_title": "回测、回撤、大模型、优化实践讨论", "tldr": "Reddit 分享 MT5 全流程：15年 OOS 数据+3x3 参数稳健性+1000次蒙特卡洛筛选策略，附严格风控门槛", "core_value": "对你的量化工作帮助：把它当作回测、回撤、大模型、优化的实盘经验线索，用来补充回测假设、交易成本假设或风控检查清单。", "key_points_list": ["核心方法：WFO 用 3 年 IS/1 年 OOS，参数敏感性要求 3x3 热力图全局盈利>40%且邻域 5/9 盈利，OOS 最大回撤≤2 倍 IS 且≤15%。", "可直接借鉴：从 MT5 优化器导出参数组合生成热力图筛选、对订单历史做 1000 次蒙特卡洛、按 95% 最大回撤定仓位、组合相关性按回撤和持仓重叠度计算。", "风险提示：作者无第三方验证记录，OOS 拼接和人工阈值容易被过拟合，实盘滑点/佣金假设需用独立数据复核。"], "reference_url": "https://www.reddit.com/r/algotrading/comments/1vtwszg/rate_my_workflow_all_forms_of_criticism_are/", "report_sections": ["ai_quant_tools"], "report_section_labels": ["AI 量化工具"], "category_label": "组合构建", "priority_label": "高", "source_type_label": "论坛"}, {"id": "15cefd5999cae79513c34122cd45fe5dc3e74cfb69f391355799ae9d6e36d5a9", "source": "Quant StackExchange", "source_type": "forum", "title": "How should correlated, regime-dependent return-path forecasts be combined into a trading consensus?", "url": "https://quant.stackexchange.com/questions/85792/how-should-correlated-regime-dependent-return-path-forecasts-be-combined-into-a", "authors": ["Russlan Ramdowar"], "published_at": "2026-08-20", "collected_at": "2026-08-20T23:31:15Z", "raw_text": "This question comes from implementing the consensus engine in iPulse AI, an Open Agentic Investment Research Platform that I'am developing with my team for 3 years now. I mention the platform purpose only to explain the applied setting and context. By “open,” I mean that the research questions, methodology, evaluation procedures, historical forecasts, limitations, results and unsuccessful approaches are intended to be publicly inspectable and subject to external scrutiny. Since launch in November 2025 (2 years after development), I have recorded each production forecast as it was originally issued, together with its timestamp, detailed AI agent configuration, specified Investment Evaluation Framework it's instructed to follow, contemporaneous market and fundamental inputs, and the subsequently realized return path. Everything runs in batches of Deep Analysis, done every two weeks or so. Each agent is intended to produce a structured investment thesis rather than merely classify an asset as going up or down. The current implementation contains 12 distinct agent configurations evaluating 380 assets. One run therefore produces 12 separate theses per asset and 4,560 analyst–asset evaluations overall. The evaluations are launched as a single time-aligned batch, using the same evaluation timestamp and a common set of inputs (Global events starting from model's knowledge cutoff date till date, and asset specific fundamentals and financials). This minimizes differences caused by news or market conditions changing during the run. However, the agents are not genuinely independent: they may share input data while differing in the model (ChatGPT vs Claude vs Gemini vs Grok), investment framework (Value Analysis Framework, Power Dynamics Framework, AI readiness and visionary disruptor framework etc) and mode (web search enabled or not). This dependence is what makes the consensus problem difficult. My initial implementation treated consensus as a democratic vote—effectively a board of AI advisors or (AI Parliament) in which every member had equal weight. I am now looking for statistically grounded criticism and established, implementable methods for aggregating these different forecasts while accounting for shared information, correlated errors and changing performance. Suppose the system contains $m$ systematic research analysts forecasting the same asset over the same horizon. An analyst is not just one model. Each analyst is a configuration consisting of: an LLM or reasoning model; an investment-analysis framework; a retrieval mode, with or without external search; a common set of market and fundamental input data. The input dataset is largely shared, while the model, framework and retrieval configuration can differ. Consequently, the analysts are neither independent nor equally correlated. For example, two analysts using the same investment framework may make similar errors even if they use different underlying models (ChatGPT vs Gemini vs Claude). At forecast origin $t$ , analyst $i$ produces a path of cumulative excess-return forecasts: $$ f_{i,t} = \\left( f_{i,t}(1),\\ldots,f_{i,t}(H) \\right)^\\top . $$ I want to construct a consensus path $$ c_t(h) = \\sum_{i=1}^{m} w_{i,t} f_{i,t}(h), \\qquad w_{i,t}\\geq 0, \\qquad \\sum_{i=1}^{m}w_{i,t}=1. $$ I have considered four possible weighting mechanisms. 1. Equal weighting $$ w_{i,t}=\\frac{1}{m}. $$ This is simple and difficult to overfit, but treats several highly similar analysts as independent confirmations. 2. Weighting by recent historical performance For a specified path-level loss $L_{i,s}$ , one possibility is an exponentially discounted rule such as $$ w_{i,t} \\propto \\exp\\left( -\\eta \\sum_{s This adapts to changing performance, but may chase noise and eliminate temporarily weak analysts. 3. Covariance-aware weighting Let $e_{i,t}(h)$ denote analyst $i$ 's forecast error at horizon $h$ . An integrated error-covariance matrix could be estimated as $$ \\Omega_{ij} = \\sum_{h=1}^{H} a_h\\, \\operatorname{Cov} \\left( e_{i,t}(h),e_{j,t}(h) \\right), $$ followed by $$ w_t = \\arg\\min_{w\\in\\Delta_m} w^\\top\\Omega w, $$ where $\\Delta_m$ is the probability simplex. This accounts for average error dependence, but assumes that the estimated relationship remains relevant in the current macroeconomic environment. 4. Regime-dependent weighting The weights could instead depend on observable or latent state variables $z_t$ : $$ w_t=g(z_t), $$ where $z_t$ might contain volatility, inflation, liquidity, growth or other macroeconomic-state indicators. This could recognize that some analytical frameworks perform better in particular environments, but estimating many conditional weights from a limited history creates substantial overfitting risk. A further complication is the potentially valuable contrarian analyst (The Michael Burry AI for example) . An analyst may have worse unconditional performance than the group but make different errors, or perform particularly well during the relatively rare periods in which the majority suffers a common-mode failure. Weighting analysts only by individual average loss could remove exactly the analyst that provides the most useful conditional diversification. I have started storing every forecast at its original issue time, together with the analyst configuration, contemporaneous macro state and subsequently realized return path. The weights can therefore be evaluated through chronological walk-forward tests rather than fitted and tested on the same observations. For this question, assume that an economically appropriate path-level loss has already been selected. Choosing that loss is a related but separate problem: pointwise MSE can, for example, score a forecast of a useful cyclical pattern poorly when its phase is slightly displaced. Is there an established and practically implementable framework for combining: unequal and partially shared information; correlated forecast errors; regime-dependent analyst skill; and the conditional value of contrarian forecasts? Would the statistically defensible approach be a hierarchical or factor model for the analysts' shared error components combined with dynamic model averaging, a contextual prediction-with-expert-advice algorithm, or a regularized rolling optimization of the combination weights? In particular, how can one distinguish a genuinely diversifying contrarian analyst from a merely noisy one using only chronologically resolved forecasts, while limiting overfitting when the number of market regimes and analyst configurations is large relative to the available history? Related discussions include ensemble techniques for return forecasts , combining forecasts at different horizons , and combining alternative volatility estimates , but they do not appear to address this combination of structured dependence, regime-dependent skill and path forecasts.", "abstract": "This question comes from implementing the consensus engine in iPulse AI, an Open Agentic Investment Research Platform that I'am developing with my team for 3 years now. I mention the platform purpose only to explain the applied setting and context. By “open,” I mean that the research questions, methodology, evaluation procedures, historical forecasts, limitations, results and unsuccessful approaches are intended to be publicly inspectable and subject to external scrutiny. Since launch in November 2025 (2 years after development), I have recorded each production forecast as it was originally issued, together with its timestamp, detailed AI agent configuration, specified Investment Evaluation Framework it's instructed to follow, contemporaneous market and fundamental inputs, and the subsequently realized return path. Everything runs in batches of Deep Analysis, done every two weeks or so. Each agent is intended to produce a structured investment thesis rather than merely classify an asset as going up or down. The current implementation contains 12 distinct agent configurations evaluating 380 assets. One run therefore produces 12 separate theses per asset and 4,560 analyst–asset evaluations overall. The evaluations are launched as a single time-aligned batch, using the same evaluation timestamp and a common set of inputs (Global events starting from model's knowledge cutoff date till date, and asset specific fundamentals and financials). This minimizes differences caused by news or market conditions changing during the run. However, the agents are not genuinely independent: they may share input data while differing in the model ( sing that loss is a related but separate problem: pointwise MSE can, for example, score a forecast of a useful cyclical pattern poorly when its phase is slightly displaced. Is there an established and practically implementable framework for combining: unequal and partially shared information; correlated forecast errors; regime-dependent analyst skill; and the conditional value of contrarian forecasts? Would the statistically defensible approach be a hierarchical or factor model for the analysts' shared error components combined with dynamic model averaging, a contextual prediction-with-expert-advice algorithm, or a regularized rolling optimization of the combination weights? In particular, how can one distinguish a genuinely diversifying contrarian analyst from a merely noisy one using only chronologically resolved forecasts, while limiting overfitting when the number of market regimes and analyst configurations is large relative to the available history? Related discussions include ensemble techniques for return forecasts , combining forecasts at different horizons , and combining alternative volatility estimates , but they do not appear to address this combination of structured dependence, regime-dependent skill and path forecasts.", "content_hash": "8a62db67e0770bcf8fd1ffb0a4e678cccebad53bd6a8df81b2c0156cb71d6fa1", "category": "LLM / Agents for Quant", "tags": ["agent", "dataset", "factor", "forecasting", "liquidity", "llm", "optimization", "reasoning"], "language": "en", "metadata": {"feed_url": "https://quant.stackexchange.com/feeds"}, "one_line_summary": "This question comes from implementing the consensus engine in iPulse AI, an Open Agentic Investment Research Platform that I'am developing with my team for 3 years now.", "technical_summary": "This question comes from implementing the consensus engine in iPulse AI, an Open Agentic Investment Research Platform that I'am developing with my team for 3 years now. I mention the platform purpose only to explain the that the research questions, methodology, evaluation procedures, historical forecasts, limitations, results and unsuccessful approaches are intended to be public..."], "reference_url": "https://quant.stackexchange.com/questions/85792/how-should-correlated-regime-dependent-return-path-forecasts-be-combined-into-a", "report_sections": ["ai_quant_tools"], "report_section_labels": ["AI 量化工具"], "category_label": "量化大模型 / 智能体", "priority_label": "中", "source_type_label": "论坛"}, {"id": "998f6269c887109afb4574ae41d229c064923ee4dccd5ef41f38c7a534d8aa72", "source": "arXiv", "source_type": "paper", "title": "Converting Expert Deliberation into Financial Signals Through A Context-Aware NLP Pipeline", "url": "http://arxiv.org/abs/2608.18911v1", "authors": ["Vivek Batra", "Kristin Chen", "Sanjiv Das", "Samuel Judge", "Harshad Khadilkar", "Sukrit Mittal", "Amir Nasrollahzadeh", "Daniel Ostrov", "Jacob Sisk"], "published_at": "2026-08-19", "collected_at": "2026-08-20T23:24:44Z", "raw_text": "We introduce the CDSP (context-conditional deliberation signal pipeline), converting an investment committee's meeting transcripts into structured predictive features. CDSP segments the meeting transcripts into topical chunks, assigns asset-class context labels using a large language model (LLM), maps financial keywords to a pre-determined taxonomy of labels, and constructs complementary features: sentiment polarity and mention frequency. This feature engineering framework is applied to a dataset spanning 48 monthly committee meetings to predict if global equities will perform better or worse than global bonds in the following month. In experiments with engineered features, raw transcript text, sentence embeddings, and combined representations, the prediction accuracy ranges from 62% to 73%, compared to always choosing stocks, which outperforms bonds 60.4% of the time. The best (73% accurate) model combines sentence embeddings with engineered CDSP features, achieving a 0.73 F1 score (although this is not statistically significant compared to always choosing stocks). Sentiment carries a stronger signal than mention frequency for several taxonomy categories. These findings suggest that experts' deliberations may contain forward-looking information that context-aware NLP can extract.", "abstract": "We introduce the CDSP (context-conditional deliberation signal pipeline), converting an investment committee's meeting transcripts into structured predictive features. CDSP segments the meeting transcripts into topical chunks, assigns asset-class context labels using a large language model (LLM), maps financial keywords to a pre-determined taxonomy of labels, and constructs complementary features: sentiment polarity and mention frequency. This feature engineering framework is applied to a dataset spanning 48 monthly committee meetings to predict if global equities will perform better or worse than global bonds in the following month. In experiments with engineered features, raw transcript text, sentence embeddings, and combined representations, the prediction accuracy ranges from 62% to 73%, compared to always choosing stocks, which outperforms bonds 60.4% of the time. The best (73% accurate) model combines sentence embeddings with engineered CDSP features, achieving a 0.73 F1 score (although this is not statistically significant compared to always choosing stocks). Sentiment carries a stronger signal than mention frequency for several taxonomy categories. These findings suggest that experts' deliberations may contain forward-looking information that context-aware NLP can extract.", "content_hash": "1b16912f148005f9b39711935efae132160cce4122f47a42a81ab894ed54efb6", "category": "LLM / Agents for Quant", "tags": ["dataset", "feature engineering", "large language model", "llm", "signal"], "language": "en", "metadata": {"arxiv_categories": ["cs.LG", "cs.CE"]}, "one_line_summary": "用 LLM 上下文感知 NLP 管线（CDSP）从投委会纪要提取股债信号，月度方向预测最高准确率 73%，但未显著跑赢恒买股票基线", "technical_summary": "将 48 次月度投委会会议纪要通过 CDSP 分块、LLM 标注资产类别、关键词映射到分类体系，生成情绪极性和提及频率特征，用于预测下月全球股票是否跑赢全球债券。输入包括手工特征、原始文本、句子嵌入及组合；最佳组合模型准确率 73%、F1 0.73，但相对恒选股票基线（60.4% 胜率）无统计显著性。情绪对部分分类类别的信号贡献强于提及频率。样本较小且未考虑交易成本。", "key_points": ["最佳组合模型股债方向预测准确率 73%、F1 0.73，但相对恒买股票基线（60.4%）无统计显著性。", "数据要求低，只需 48 次月度投委会会议纪要；LLM 标注与嵌入实现中等，可复现，但需会议转写文本。", "样本仅 48 个月且只覆盖单一股债二分类，未含交易成本，统计显著性缺失，过拟合风险高。"], "quant_relevance": "因子/alpha 信号；组合构建/权重优化", "possible_use_case": "可将 CDSP 应用于内部投委会纪要，生成股债月度方向信号，先做样本外滚动验证，并与恒买股票/60-40 组合对比；也可作为另类情绪因子并入多因子模型。", "limitations": "样本量小（48 个月）且只预测股债二元结果；最佳模型相对基线无统计显著性；未包含交易成本、滑点；会议纪要获取受限；LLM 标注依赖 taxonomy 设计和提示词，主观性强；需警惕过拟合。", "read_priority": "中", "key_figures_md": "- **arXiv HTML 原图**：CDSP 流程示意与各特征组合同预测准确率对比，需查看 https://arxiv.org/html/2608.18911\n- **原文实验对比表**：手工特征、原始文本、句子嵌入及组合表示下的准确率与 F1 对比\n- [原文图表（HTML版）](https://arxiv.org/html/2608.18911)", "relevance_score": 5.4, "novelty_score": 9.565, "academic_score": 10.0, "discussion_score": 2.0, "actionable_score": 7.5, "final_score": 6.833, "display_title": "特征工程、大模型研究论文", "tldr": "用 LLM 上下文感知 NLP 管线（CDSP）从投委会纪要提取股债信号，月度方向预测最高准确率 73%，但未显著跑赢恒买股票基线", "core_value": "对你的量化工作帮助：把它转成一个特征工程实验，对比原始价格特征、差分特征和分数阶差分特征，重点看平稳性、信息保留、样本外泛化和是否引入未来函数。", "key_points_list": ["最佳组合模型股债方向预测准确率 73%、F1 0.73，但相对恒买股票基线（60.4%）无统计显著性。", "数据要求低，只需 48 次月度投委会会议纪要；LLM 标注与嵌入实现中等，可复现，但需会议转写文本。", "样本仅 48 个月且只覆盖单一股债二分类，未含交易成本，统计显著性缺失，过拟合风险高。"], "reference_url": "http://arxiv.org/abs/2608.18911v1", "report_sections": ["ai_quant_tools"], "report_section_labels": ["AI 量化工具"], "category_label": "量化大模型 / 智能体", "priority_label": "中", "source_type_label": "论文"}, {"id": "4eb0a16e199726b61265682f66d111c7bbb5874819d67bdff8b78201e9b0b51a", "source": "arXiv", "source_type": "paper", "title": "Multi-Level Market Making with Reinforcement Learning", "url": "http://arxiv.org/abs/2608.18195v1", "authors": ["Patrick Cheridito", "Moritz Weiss"], "published_at": "2026-08-18", "collected_at": "2026-08-20T23:24:40Z", "raw_text": "We introduce a reinforcement learning framework for market making in a limit order book. Our algorithm aims to maximize trading revenue by dynamically submitting market and limit orders of varying sizes across multiple price levels while controlling inventory size. We use multivariate logistic-normal distributions to model order allocations and employ a deep-set encoder to aggregate features from variable-length order sets into a fixed-dimensional latent representation. Additionally, we incorporate potential-based reward shaping to accelerate learning without altering the optimal policy. We illustrate the performance of the method in three simulated market environments consisting of noise traders who submit random trades, tactical traders who respond to instantaneous volume imbalance, and strategic traders who trade in the direction of an exponentially weighted volume imbalance signal.", "abstract": "We introduce a reinforcement learning framework for market making in a limit order book. Our algorithm aims to maximize trading revenue by dynamically submitting market and limit orders of varying sizes across multiple price levels while controlling inventory size. We use multivariate logistic-normal distributions to model order allocations and employ a deep-set encoder to aggregate features from variable-length order sets into a fixed-dimensional latent representation. Additionally, we incorporate potential-based reward shaping to accelerate learning without altering the optimal policy. We illustrate the performance of the method in three simulated market environments consisting of noise traders who submit random trades, tactical traders who respond to instantaneous volume imbalance, and strategic traders who trade in the direction of an exponentially weighted volume imbalance signal.", "content_hash": "926195bdabd092150e0308c63241d342811c240d6a354b4ec111906804e126d6", "category": "Market Microstructure", "tags": ["limit order book", "order book", "reinforcement learning", "signal"], "language": "en", "metadata": {"arxiv_categories": ["q-fin.TR"]}, "one_line_summary": "用 logistic-normal 分布与 deep-set 编码器实现多档位 RL 做市，在三种模拟 LOB 环境中同时优化收益和库存控制", "technical_summary": "解决限价订单簿做市中多档位订单分配和库存控制的联合决策问题。用多元 logistic-normal 分布对订单分配建模，用 deep-set 编码器把变长订单集映射为固定维度特征，并用基于势函数的 reward shaping 加速训练而不改变最优策略。在包含噪声交易者、战术交易者和战略交易者的三种模拟市场环境中验证，目标是最大化交易收入并控制库存。摘要未给出具体收益、夏普或库存方差指标。", "key_points": ["原文缺量化指标，结论待复核；核心是 logistic-normal 订单分配 + deep-set 编码器 + reward shaping，面向多层级做市。", "需要 LOB 模拟环境或订单簿数据，实现深度中等；可复现性依赖开源代码，目前摘要未给出代码或超参。", "只验证三种模拟市场，未展示真实订单簿样本外、交易成本/滑点、订单取消率，实盘前需严格检查过拟合。"], "quant_relevance": "执行 / 交易成本；风险建模", "possible_use_case": "先在模拟环境复现该 RL 做市器，确认收益和库存风险后再用 Level2 盘口数据做小时级回测；若作者开源，可替换自研做市策略的订单分配模块。", "limitations": "摘要未提供任何收益/夏普/库存方差等量化结果；仅模拟环境，缺少真实订单簿样本外验证；未说明交易成本、滑点、订单取消率假设；多档位同时提交可能放大逆向选择与库存风险；当前无代码/超参，复现成本高。原图见 https://arxiv.org/html/2608.18195", "read_priority": "低", "key_figures_md": "", "relevance_score": 6.1, "novelty_score": 9.355, "academic_score": 9.623, "discussion_score": 2.0, "actionable_score": 4.5, "final_score": 6.344, "display_title": "订单簿、强化学习研究论文", "tldr": "用 logistic-normal 分布与 deep-set 编码器实现多档位 RL 做市，在三种模拟 LOB 环境中同时优化收益和库存控制", "core_value": "对你的量化工作帮助：把它拆成一个市场微观结构复现任务，先验证订单簿、强化学习是否真的带来样本外提升，再检查交易成本、数据泄漏和换手约束。", "key_points_list": ["原文缺量化指标，结论待复核；核心是 logistic-normal 订单分配 + deep-set 编码器 + reward shaping，面向多层级做市。", "需要 LOB 模拟环境或订单簿数据，实现深度中等；可复现性依赖开源代码，目前摘要未给出代码或超参。", "只验证三种模拟市场，未展示真实订单簿样本外、交易成本/滑点、订单取消率，实盘前需严格检查过拟合。"], "reference_url": "http://arxiv.org/abs/2608.18195v1", "report_sections": ["deep_learning_quant"], "report_section_labels": ["深度学习量化未来"], "category_label": "市场微观结构", "priority_label": "低", "source_type_label": "论文"}, {"id": "296359e72ed29c03158455bcdcca0f6d4cff52ddbcae3c41cc8dd26d8712794e", "source": "arXiv", "source_type": "paper", "title": "Mechanistic Interpretability of Structure-Aware Numerical Reasoning in LLaMA 3.1 8B", "url": "http://arxiv.org/abs/2608.18419v1", "authors": ["Rahul Chowdhury", "Timothy A Rupprecht", "Senhao Cao", "Jiahao Liu", "Octavia Camps", "David Bau", "Pu Zhao", "Yanzhi Wang"], "published_at": "2026-08-19", "collected_at": "2026-08-20T23:26:02Z", "raw_text": "Recent work has shown that large language models (LLMs) exhibit strong numerical sequence modeling capabilities and show promise in time-series prediction. While LLMs display in-context learning capabilities, the mechanisms with which they accomplish time-series prediction remain unclear. Specifically, whether they truly understand the underlying structure, which at a minimum requires reasoning over first differences in the sequence of numbers. To study this, we investigate Llama 3.1-8B from a mechanistic interpretability point of view. Mechanistic interpretability is an emerging field concerned with the reverse engineering of the algorithms learned by neural networks such as LLMs. To assess Llamas' numerical sequence modeling capabilities and to facilitate our mechanistic interpretability analysis, we create a sequence modeling task that cannot be solved without picking up structural cues. Specifically, we sample n random numbers and repeat them with an offset. We find that Llama displays strong performance on our tasks suggesting that it can pick up on the underlying structure. To understand the mechanisms that allow it to do so, we perform probing experiments and activation patching based counterfactual analysis. Probing reveals that the model computes and stores first differences in its internal representations without explicit supervision, indicating that it tracks structural information about the sequence. Activation patching reveals that Llama retrieves the relevant first-difference with a mechanism similar to an induction circuit and subsequently adds it to the current value. Notably, our work represents one of the first studies to identify this form of concept induction in LLMs.", "abstract": "Recent work has shown that large language models (LLMs) exhibit strong numerical sequence modeling capabilities and show promise in time-series prediction. While LLMs display in-context learning capabilities, the mechanisms with which they accomplish time-series prediction remain unclear. Specifically, whether they truly understand the underlying structure, which at a minimum requires reasoning over first differences in the sequence of numbers. To study this, we investigate Llama 3.1-8B from a mechanistic interpretability point of view. Mechanistic interpretability is an emerging field concerned with the reverse engineering of the algorithms learned by neural networks such as LLMs. To assess Llamas' numerical sequence modeling capabilities and to facilitate our mechanistic interpretability analysis, we create a sequence modeling task that cannot be solved without picking up structural cues. Specifically, we sample n random numbers and repeat them with an offset. We find that Llama displays strong performance on our tasks suggesting that it can pick up on the underlying structure. To understand the mechanisms that allow it to do so, we perform probing experiments and activation patching based counterfactual analysis. Probing reveals that the model computes and stores first differences in its internal representations without explicit supervision, indicating that it tracks structural information about the sequence. Activation patching reveals that Llama retrieves the relevant first-difference with a mechanism similar to an induction circuit and subsequently adds it to the current value. Notably, our work represents one of the first studies to identify this form of concept induction in LLMs.", "content_hash": "b68802cbb9bb0c209c4e6a5f78a4892e54a06c7c03049530ee3d13475a48bc6e", "category": "LLM / Agents for Quant", "tags": ["neural", "reasoning"], "language": "en", "metadata": {"arxiv_categories": ["cs.LG", "cs.AI"]}, "one_line_summary": "用机理可解释性解码 Llama 3.1-8B 的数值序列推理，发现其内部自行计算一阶差分，为 LLM 时间序列预测提供可验证机制", "technical_summary": "要判断 LLM 做时间序列预测时是真理解结构还是一般模式匹配。构造了 n 个随机数加偏移重复的序列任务，必须在内部计算首差才能解决。对 Llama 3.1-8B 做探针实验，发现其内部表征在无监督下编码一阶差分；激活替换显示它用类 induction circuit 的回路检索相关首差并加到当前值。摘要没有给出任务准确率、误差或样本数，量化结论需查看完整实验。", "key_points": ["用 8B LLaMA 做带偏移随机数序列任务，探针显示内部隐式存储一阶差分，激活替换确认其用 induction circuit 取差分并累加。", "只需构造数值序列和激活探针/替换即可复现，不依赖金融数据；适合评估 LLM 序列外推能力，但需 PyTorch 和模型权重。", "摘要未报告准确率、误差或数据集大小，任务为随机数而非真实金融时序，过度依赖人工结构假设，样本外意义有限。"], "quant_relevance": "研究工具 / 工作流提效、因子 / alpha 信号", "possible_use_case": "在把 LLM 接入因子挖掘前，先用类似差分探针测试其对日频收益序列的结构理解；也可用于评估不同 LLM 的数值序列建模能力。", "limitations": "摘要缺少任务准确率、数据集大小和样本外误差；实验仅针对随机数加偏移的合成任务，未涉及金融序列的噪声、非平稳和交易成本；模型为单一大小的 Llama，不代表更大或更小模型；结论是机制层面，不直接产生可交易 alpha。", "read_priority": "中", "key_figures_md": "- **Figure 1**：序列建模任务示意：随机数序列加偏移重复，需识别结构才能解决\n- **Figure 2**：探针实验：内部表征中一阶差分的线性可探测性\n- **Figure 3**：激活替换/反事实分析：定位负责检索一阶差分并累加的回路；原图见 https://arxiv.org/html/2608.18419\n- [原文图表（HTML版）](https://arxiv.org/html/2608.18419)", "relevance_score": 4.2, "novelty_score": 9.565, "academic_score": 10.0, "discussion_score": 2.0, "actionable_score": 6.5, "final_score": 6.273, "display_title": "大模型研究论文", "tldr": "用机理可解释性解码 Llama 3.1-8B 的数值序列推理，发现其内部自行计算一阶差分，为 LLM 时间序列预测提供可验证机制", "core_value": "对你的量化工作帮助：把它拆成一个量化大模型 / 智能体复现任务，先验证大模型是否真的带来样本外提升，再检查交易成本、数据泄漏和换手约束。", "key_points_list": ["用 8B LLaMA 做带偏移随机数序列任务，探针显示内部隐式存储一阶差分，激活替换确认其用 induction circuit 取差分并累加。", "只需构造数值序列和激活探针/替换即可复现，不依赖金融数据；适合评估 LLM 序列外推能力，但需 PyTorch 和模型权重。", "摘要未报告准确率、误差或数据集大小，任务为随机数而非真实金融时序，过度依赖人工结构假设，样本外意义有限。"], "reference_url": "http://arxiv.org/abs/2608.18419v1", "report_sections": ["ai_quant_tools"], "report_section_labels": ["AI 量化工具"], "category_label": "量化大模型 / 智能体", "priority_label": "中", "source_type_label": "论文"}, {"id": "fb4518e09cb5102e10692845e4e16ba7b90016ee4782cb16a4116f2b6df2d94d", "source": "arXiv", "source_type": "paper", "title": "Towards Reversible Forgetting: Managing Obsolete Knowledge in Continual Enterprise AI Agents", "url": "http://arxiv.org/abs/2608.18177v1", "authors": ["Nilutpaul Sarker Yash", "Tirtho Roy", "Ushashi Bhattacharjee"], "published_at": "2026-08-18", "collected_at": "2026-08-20T23:24:44Z", "raw_text": "Continual learning has traditionally treated forgetting as a failure, emphasizing preservation of previously acquired knowledge as environments evolve. We argue that this objective is incomplete for enterprise AI agents operating in non-stationary environments, where customers, policies, tools, workflows, regulations, and market conditions change over time. Indiscriminate retention can allow obsolete knowledge to influence decisions, creating negative transfer and operational risk. We therefore propose reversible forgetting: a conceptual framework with three operational memory states: active, dormant, and retired, and a reactivation transition that can restore dormant knowledge when its relevance returns. We instantiate the framework as a Hysteretic Reversible Memory Controller that accumulates relevance evidence, uses asymmetric thresholds to prevent state oscillation, tests reactivation in shadow mode, and gates retirement through policy. The framework reduces the influence of obsolete information without conflating temporary suppression with permanent erasure. Finance illustrates the idea: knowledge useful under one market regime may become harmful under another yet regain relevance when similar conditions recur.", "abstract": "Continual learning has traditionally treated forgetting as a failure, emphasizing preservation of previously acquired knowledge as environments evolve. We argue that this objective is incomplete for enterprise AI agents operating in non-stationary environments, where customers, policies, tools, workflows, regulations, and market conditions change over time. Indiscriminate retention can allow obsolete knowledge to influence decisions, creating negative transfer and operational risk. We therefore propose reversible forgetting: a conceptual framework with three operational memory states: active, dormant, and retired, and a reactivation transition that can restore dormant knowledge when its relevance returns. We instantiate the framework as a Hysteretic Reversible Memory Controller that accumulates relevance evidence, uses asymmetric thresholds to prevent state oscillation, tests reactivation in shadow mode, and gates retirement through policy. The framework reduces the influence of obsolete information without conflating temporary suppression with permanent erasure. Finance illustrates the idea: knowledge useful under one market regime may become harmful under another yet regain relevance when similar conditions recur.", "content_hash": "3691399c1f7ca9de428e1d153e869c5e6dc620ff1ad185d181488ac87ce94882", "category": "Risk Management", "tags": ["risk"], "language": "en", "metadata": {"arxiv_categories": ["cs.LG", "cs.MA"]}, "one_line_summary": "HRMC 三态记忆框架让企业 AI agent 可逆遗忘过时知识，以降低市场制度切换下的负迁移风险", "technical_summary": "解决企业 AI agent 在非平稳环境中保留过时知识导致的负迁移和操作风险。设计了三态记忆状态 active、dormant、retired，由 Hysteretic Reversible Memory Controller 积累相关性证据，用非对称阈值防止状态反复切换，reactivation 先在 shadow mode 测试，retirement 通过 policy 门控。金融动机是：一种市场制度下有用的知识可能在其他制度下有害，制度回归后需要重新激活。全文是概念框架，没有实验、回测或精度/夏普等量化指标。", "key_points": ["原文无实验数据；核心是 HRMC 三态记忆，用非对称阈值和影子模式管理过时知识，降低负迁移。", "作为 LLM agent 记忆设计思路可借鉴，但无代码、无数据集、无接口定义，落地需自行实现。", "纯概念论文，未做样本外测试或回测，无法判断对策略收益、风险或执行成本的实际影响。"], "quant_relevance": "风险建模；研究工具 / 工作流提效 —— 帮助 LLM 量化 agent 淘汰过时信息，减少旧制度知识对当前决策的干扰。", "possible_use_case": "在 LLM 量化投研 agent 中加入知识状态管理：市场制度切换时把旧 regime 因子或规则降为 dormant，类似制度出现时先在 shadow mode 验证，再决定是否激活。", "limitations": "纯概念框架，无实验、无基准、无可复现代码；相关性证据、非对称阈值、policy gate 均无工程细节；未讨论交易成本和样本外风险。", "read_priority": "低", "key_figures_md": "", "relevance_score": 5.6, "novelty_score": 9.355, "academic_score": 10.0, "discussion_score": 2.0, "actionable_score": 4.5, "final_score": 6.251, "display_title": "风险、人工智能研究论文", "tldr": "HRMC 三态记忆框架让企业 AI agent 可逆遗忘过时知识，以降低市场制度切换下的负迁移风险", "core_value": "对你的量化工作帮助：把它拆成一个风险管理复现任务，先验证风险、人工智能是否真的带来样本外提升，再检查交易成本、数据泄漏和换手约束。", "key_points_list": ["原文无实验数据；核心是 HRMC 三态记忆，用非对称阈值和影子模式管理过时知识，降低负迁移。", "作为 LLM agent 记忆设计思路可借鉴，但无代码、无数据集、无接口定义，   <script>
    const payload = JSON.parse(document.getElementById('dashboard-data').textContent);
    const items = payload.items || [];
    const categoryLabels = payload.category_labels || {};
    const priorityLabels = payload.priority_labels || {};
    const sourceTypeLabels = payload.source_type_labels || {};
    const state = {
      query: '',
      section: 'All',
      category: 'All',
      sort: 'score',
      activeId: items[0]?.id || null,
    };

    const priorityRank = { High: 3, Medium: 2, Low: 1, '高': 3, '中': 2, '低': 1 };
    const $ = (id) => document.getElementById(id);

    // --- Feedback ---
    const _feedbackStore = JSON.parse(localStorage.getItem('quant-feedback') || '{}');
    function getFeedback(id) { return _feedbackStore[id] || 0; }
    function setFeedback(id, signal) {
      if (_feedbackStore[id] === signal) { delete _feedbackStore[id]; signal = 0; }
      else { _feedbackStore[id] = signal; }
      localStorage.setItem('quant-feedback', JSON.stringify(_feedbackStore));
      fetch('http://localhost:8080/feedback', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id, signal }),
      }).catch(() => {});
    }

    function init() {
      $('report-date').textContent = payload.report_date + ' - 主力源：arXiv / 知乎 / QuantML / 大型论坛 - 生成时间 ' + payload.generated_at;
      $('metric-items').textContent = items.length;
      $('metric-categories').textContent = new Set(items.map((item) => item.category)).size;
      $('metric-high').textContent = items.filter((item) => priorityLabel(item.read_priority) === '高').length;
      $('metric-avg').textContent = averageScore(items).toFixed(1);

      buildSectionControls();
      buildCategoryControls();
      buildSourceList();
      bindControls();
      render();
    }

    function bindControls() {
      $('search').addEventListener('input', (event) => {
        state.query = event.target.value.trim().toLowerCase();
        render();
      });
      $('category-select').addEventListener('change', (event) => {
        state.category = event.target.value;
        render();
      });
      $('section-select').addEventListener('change', (event) => {
        state.section = event.target.value;
        render();
      });
      $('sort-select').addEventListener('change', (event) => {
        state.sort = event.target.value;
        render();
      });
    }

    function buildCategoryControls() {
      const counts = countBy(items, 'category');
      const categories = Object.keys(counts).sort();
      const select = $('category-select');
      select.innerHTML = option('All', `全部细分标签 (${items.length})`) +
        categories.map((category) => option(category, `${categoryLabel(category)} (${counts[category]})`)).join('');

      const list = $('category-list');
      list.innerHTML = categoryButton('All', items.length) +
        categories.map((category) => categoryButton(category, counts[category])).join('');

      list.querySelectorAll('button').forEach((button) => {
        button.addEventListener('click', () => {
          state.category = button.dataset.category;
          select.value = state.category;
          if (state.category === 'All') {
            state.section = 'All';
            $('section-select').value = 'All';
          }
          render();
        });
      });
    }

    function buildSectionControls() {
      const counts = payload.section_counts || {};
      const sections = payload.sections || [];
      const select = $('section-select');
      select.innerHTML = option('All', `全部主线 (${items.length})`) +
        sections
          .filter((section) => counts[section.key])
          .map((section) => option(section.key, `${section.label} (${counts[section.key]})`))
          .join('');

      const list = $('section-list');
      list.innerHTML = sectionButton('All', '全部', items.length) +
        sections
          .filter((section) => counts[section.key])
          .map((section) => sectionButton(section.key, section.label, counts[section.key]))
          .join('');

      list.querySelectorAll('button').forEach((button) => {
        button.addEventListener('click', () => {
          state.section = button.dataset.section;
          select.value = state.section;
          if (state.section === 'All') {
            state.category = 'All';
            $('category-select').value = 'All';
          }
          render();
        });
      });
    }

    function buildSourceList() {
      const stats = payload.source_stats || {};
      const entries = Object.entries(stats)
        .filter(([source]) => !source.startsWith('fetched:'))
        .sort((a, b) => b[1] - a[1]);
      $('source-list').innerHTML = entries.length
        ? entries.map(([source, count]) => `<li><span>${escapeHtml(source)}</span><b>${count}</b></li>`).join('')
        : '<li><span>暂无来源统计</span><b>0</b></li>';
    }

    function render() {
      let visible = items.filter(matchesFilters);
      visible = sortItems(visible);
      if (!visible.some((item) => item.id === state.activeId)) {
        state.activeId = visible[0]?.id || null;
      }

      $('feed-title').textContent = feedTitle();
      $('result-count').textContent = `展示 ${visible.length} 条 - 两条主线每条最多 ${payload.report_config.max_items_per_category} 条`;
      renderSectionActive();
      renderCategoryActive();
      renderItems(visible);
      renderDetail(visible.find((item) => item.id === state.activeId) || visible[0]);
    }

    function matchesFilters(item) {
      const sectionMatch = state.section === 'All' || (item.report_sections || []).includes(state.section);
      if (!sectionMatch) return false;
      const categoryMatch = state.category === 'All' || item.category === state.category;
      if (!categoryMatch) return false;
      if (!state.query) return true;
      const haystack = [
        item.title,
        item.display_title,
        item.source,
        item.source_type,
        item.category,
        categoryLabel(item.category),
        sectionLabel(item.report_sections?.[0]),
        sourceTypeLabel(item.source_type),
        priorityLabel(item.read_priority),
        item.one_line_summary,
        item.technical_summary,
        item.quant_relevance,
        item.possible_use_case,
        item.tldr,
        item.core_value,
        ...(item.key_points_list || []),
        item.reference_url,
      ].join(' ').toLowerCase();
      return haystack.includes(state.query);
    }

    function sortItems(list) {
      return [...list].sort((a, b) => {
        if (state.sort === 'priority') {
          return (priorityRank[b.read_priority] || 0) - (priorityRank[a.read_priority] || 0)
            || b.final_score - a.final_score;
        }
        if (state.sort === 'source') {
          return a.source.localeCompare(b.source) || b.final_score - a.final_score;
        }
        return b.final_score - a.final_score;
      });
    }

    function renderCategoryActive() {
      document.querySelectorAll('.category-button').forEach((button) => {
        button.classList.toggle('active', button.dataset.category === state.category);
      });
    }

    function renderSectionActive() {
      document.querySelectorAll('.section-button').forEach((button) => {
        button.classList.toggle('active', button.dataset.section === state.section);
      });
    }

    function itemCard(item) {
      const sec = item.report_sections?.[0] || 'other';
      const sig = getFeedback(item.id);
      return `
        <article class="item ${item.id === state.activeId ? 'active' : ''}"
                 data-id="${escapeAttr(item.id)}"
                 data-section="${escapeAttr(sec)}">
          <div class="item-top">
            <h3>${escapeHtml(item.display_title || item.title)}</h3>
            <div class="score">${Number(item.final_score).toFixed(1)}</div>
          </div>
          <div class="meta">
            <span class="tag">${escapeHtml(categoryLabel(item.category))}</span>
            <span class="tag">${escapeHtml(item.source)}</span>
            <span class="tag">${escapeHtml(priorityLabel(item.read_priority))}</span>
          </div>
          ${readerFormat(item, true)}
          <div class="feedback-row">
            <button class="feedback-btn ${sig === 1 ? 'active-up' : ''}" data-feedback="1" title="有用">👍</button>
            <button class="feedback-btn ${sig === -1 ? 'active-down' : ''}" data-feedback="-1" title="跳过">👎</button>
            <span class="feedback-hint">${sig === 1 ? '已标记有用' : sig === -1 ? '已标记跳过' : ''}</span>
          </div>
        </article>
      `;
    }

    function sectionGroupHeader(section, count) {
      return `
        <div class="section-group-header" data-section="${escapeAttr(section.key)}">
          <span class="section-group-title">${escapeHtml(section.label)}</span>
          <span class="section-group-count">${count} 条</span>
        </div>
      `;
    }

    function renderItems(visible) {
      const container = $('items');
      if (!visible.length) {
        container.innerHTML = '<div class="empty">当前筛选条件下没有匹配内容。</div>';
        return;
      }

      let html = '';
      if (state.section === 'All') {
        // Group by section in defined order, with a header for each group
        const grouped = {};
        for (const item of visible) {
          const sec = item.report_sections?.[0] || 'other';
          if (!grouped[sec]) grouped[sec] = [];
          grouped[sec].push(item);
        }
        for (const section of (payload.sections || [])) {
          const group = grouped[section.key];
          if (!group || !group.length) continue;
          html += sectionGroupHeader(section, group.length);
          html += group.map((item) => itemCard(item)).join('');
        }
        // Append any items that fell into 'other' (shouldn't normally happen)
        if (grouped['other']?.length) {
          html += grouped['other'].map((item) => itemCard(item)).join('');
        }
      } else {
        html = visible.map((item) => itemCard(item)).join('');
      }

      container.innerHTML = html;
      container.querySelectorAll('.item').forEach((node) => {
        node.addEventListener('click', () => {
          state.activeId = node.dataset.id;
          render();
        });
      });
      container.querySelectorAll('.feedback-btn').forEach((btn) => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const itemNode = btn.closest('.item');
          setFeedback(itemNode.dataset.id, parseInt(btn.dataset.feedback, 10));
          render();
        });
      });
    }

    function renderDetail(item) {
      const detail = $('detail');
      if (!item) {
        detail.innerHTML = '<div class="empty">选择一条内容查看详情。</div>';
        return;
      }

      detail.innerHTML = `
        <h2>${escapeHtml(item.display_title || item.title)}</h2>
        <div class="meta">
          <span class="tag">${escapeHtml(categoryLabel(item.category))}</span>
          <span class="tag">${escapeHtml(sourceTypeLabel(item.source_type))}</span>
          <span class="tag">${escapeHtml(priorityLabel(item.read_priority))}</span>
        </div>

        ${readerFormat(item, false)}

        <div class="detail-block">
          <h3>评分拆解</h3>
          <div class="breakdown">
            ${bar('相关性', item.relevance_score)}
            ${bar('新颖度', item.novelty_score)}
            ${bar('学术性', item.academic_score)}
            ${bar('讨论度', item.discussion_score)}
            ${bar('可行动性', item.actionable_score)}
          </div>
        </div>

      `;
    }

    function readerFormat(item, compact) {
      const points = itemKeyPoints(item);
      return `
        <div class="reader-format ${compact ? 'compact' : ''}">
          <div class="reader-block">
            <h4>1. 这篇文章的太长不读</h4>
            <p>${escapeHtml(item.tldr || item.one_line_summary || '')}</p>
          </div>
          <div class="reader-block">
            <h4>2. 核心价值，对我量化的工作能够提供什么样的帮助</h4>
            <p>${escapeHtml(item.core_value || '')}</p>
          </div>
          <div class="reader-block">
            <h4>3. 关键核心点 / 论文或帖子摘要</h4>
            <ol>${points.map((point) => `<li>${escapeHtml(point)}</li>`).join('')}</ol>
          </div>
          <div class="reader-block">
            <h4>4. 原文链接</h4>
            ${referenceHtml(item)}
          </div>
        </div>
      `;
    }

    function itemKeyPoints(item) {
      const points = Array.isArray(item.key_points_list)
        ? item.key_points_list
        : (Array.isArray(item.key_points) ? item.key_points : []);
      const clean = points.filter(Boolean).slice(0, 3);
      return clean.length ? clean : ['需要打开原文进一步确认方法、数据和适用边界。'];
    }

    function referenceHtml(item) {
      const url = item.reference_url || '';
      if (!url) return '<p>暂无可打开链接</p>';
      return `
        <a class="reader-reference" href="${escapeAttr(url)}" target="_blank" rel="noopener noreferrer">打开原文</a>
        <small class="reference-url">${escapeHtml(url)}</small>
      `;
    }

    function bar(label, value) {
      const score = Number(value || 0);
      const width = Math.max(0, Math.min(100, score * 10));
      return `
        <div class="bar">
          <span>${label}</span>
          <div class="bar-track"><div class="bar-fill" style="width: ${width}%"></div></div>
          <b>${score.toFixed(1)}</b>
        </div>
      `;
    }

    function countBy(list, key) {
      return list.reduce((acc, item) => {
        acc[item[key]] = (acc[item[key]] || 0) + 1;
        return acc;
      }, {});
    }

    function averageScore(list) {
      if (!list.length) return 0;
      return list.reduce((sum, item) => sum + Number(item.final_score || 0), 0) / list.length;
    }

    function option(value, label) {
      return `<option value="${escapeAttr(value)}">${escapeHtml(label)}</option>`;
    }

    function sectionButton(section, label, count) {
      return `
        <button class="category-button section-button" type="button" data-section="${escapeAttr(section)}">
          <span>${escapeHtml(label)}</span>
          <span class="count">${count}</span>
        </button>
      `;
    }

    function categoryButton(category, count) {
      return `
        <button class="category-button" type="button" data-category="${escapeAttr(category)}">
          <span>${escapeHtml(category === 'All' ? '全部' : categoryLabel(category))}</span>
          <span class="count">${count}</span>
        </button>
      `;
    }

    function categoryLabel(category) {
      return categoryLabels[category] || category;
    }

    function sectionLabel(sectionKey) {
      const section = (payload.sections || []).find((item) => item.key === sectionKey);
      return section ? section.label : '其他';
    }

    function feedTitle() {
      const parts = [];
      if (state.section !== 'All') parts.push(sectionLabel(state.section));
      if (state.category !== 'All') parts.push(categoryLabel(state.category));
      return parts.length ? parts.join(' / ') : '今日情报';
    }

    function priorityLabel(priority) {
      return priorityLabels[priority] || priority;
    }

    function sourceTypeLabel(sourceType) {
      return sourceTypeLabels[sourceType] || sourceType;
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function escapeAttr(value) {
      return escapeHtml(value).replaceAll('`', '&#096;');
    }

    init();
  </script>
</body>
</html>
