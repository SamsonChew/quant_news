  <style>
    :root {

      --line: #dadce0;

      --red: #ea4335;
      --yellow: #fbbc04;
      --green: #34a853;

      --radius: 16px;

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background:

        radial-gradient(circle at top right, rgba(251, 188, 4, 0.08), transparent 26%),
        var(--bg);
      color: var(--ink);
      font-family: "Google Sans", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;

    button,
    input,
    select {
      font: inherit;
    }

    .shell {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 5;
      display: grid;
      grid-template-columns: minmax(220px, 1fr) minmax(280px, 620px);
      gap: 24px;
      align-items: center;
      padding: 16px 32px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(18px);
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 12px;
      min-width: 0;
    }

    .brand h1 {
      display: flex;
      gap: 10px;
      align-items: center;
      margin: 0;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.02em;
      white-space: nowrap;
    }

    .brand h1::before {
      content: "";
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background:
        conic-gradient(from 0deg, var(--blue) 0 25%, var(--red) 0 50%, var(--yellow) 0 75%, var(--green) 0 100%);
      box-shadow: inset 0 0 0 7px #fff;
    }

    .date-pill {
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 170px 170px 150px;
      gap: 10px;
    }

    .control {
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel);
      color: var(--ink);
      padding: 0 12px;
      outline: none;
    }

    .control:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.14);
    }

    .layout {
      display: grid;
      grid-template-columns: 260px minmax(420px, 1fr) 420px;
      gap: 22px;
      padding: 24px 32px 36px;
    }

    .rail,
    .detail {
      position: sticky;
      top: 86px;
      height: calc(100vh - 112px);
      overflow: auto;
    }

    .rail,
    .detail,
    .feed {
      min-width: 0;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 18px;
    }

    .metric {
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--panel);
      padding: 12px;
      box-shadow: 0 1px 2px rgba(60, 64, 67, 0.08);
    }

    .metric:nth-child(1) { border-top: 3px solid var(--blue); }
    .metric:nth-child(2) { border-top: 3px solid var(--red); }
    .metric:nth-child(3) { border-top: 3px solid var(--yellow); }
    .metric:nth-child(4) { border-top: 3px solid var(--green); }

    .metric b {
      display: block;
      font-size: 22px;
      line-height: 1;
    }

    .metric span {
      display: block;
      margin-top: 7px;
      color: var(--muted);
      font-size: 12px;
    }

    .section-label {
      margin: 18px 0 8px;
      color: var(--blue);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .category-list {
      display: grid;
      gap: 7px;
    }

    .category-button {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
      width: 100%;
      min-height: 38px;
      border: 1px solid transparent;
      border-radius: 999px;
      background: transparent;
      color: var(--ink);
      padding: 8px 10px;
      text-align: left;
      cursor: pointer;
    }

    .category-button:hover,
    .category-button.active {
      border-color: transparent;
      background: var(--blue-soft);
      color: #174ea6;
    }

    .count {
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .source-list {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .source-list li {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
      font-size: 13px;
    }

    .feed-header {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      margin-bottom: 12px;
    }

    .feed-header h2 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
    }

    .result-count {
      color: var(--muted);
      font-size: 13px;
    }

    .items {
      display: grid;
      gap: 10px;
    }

    .section-group-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 2px 4px;
      margin-top: 10px;
      border-bottom: 2px solid var(--line);
    }

    .section-group-header:first-child {
      margin-top: 0;
    }

    .section-group-title {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .section-group-header[data-section="deep_learning_quant"] .section-group-title { color: var(--blue); }
    .section-group-header[data-section="ai_quant_tools"] .section-group-title { color: var(--green); }
    .section-group-header[data-section="daily_news"] .section-group-title { color: var(--yellow); }

    .section-group-count {
      color: var(--muted);
      font-size: 12px;
    }

    .item {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--panel);
      box-shadow: 0 1px 2px rgba(60, 64, 67, 0.10);
      padding: 18px;
      cursor: pointer;
      transition: border-color 140ms ease, transform 140ms ease, box-shadow 140ms ease;
    }

    .item::before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 4px;
      background: linear-gradient(90deg, var(--blue), var(--red), var(--yellow), var(--green));
    }

    .item[data-section="deep_learning_quant"]::before { background: var(--blue); }
    .item[data-section="ai_quant_tools"]::before { background: var(--green); }
    .item[data-section="daily_news"]::before { background: var(--yellow); }

    .item:hover,
    .item.active {
      border-color: #c6dafc;
      box-shadow: var(--shadow);
      transform: translateY(-2px);
    }

    .item-top {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 14px;
      align-items: start;
    }

    .item h3 {
      margin: 0;
      font-size: 16px;
      line-height: 1.28;
    }

    .score {
      min-width: 54px;
      border-radius: 999px;
      background: var(--blue-soft);
      color: #174ea6;
      padding: 6px 8px;
      text-align: center;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 10px 0;
      color: var(--muted);
      font-size: 12px;
    }

    .tag {
      border: 1px solid transparent;
      border-radius: 999px;
      background: #f1f3f4;
      padding: 3px 8px;
    }

    .tag:nth-child(1) { background: var(--blue-soft); color: #174ea6; }
    .tag:nth-child(2) { background: var(--green-soft); color: #137333; }
    .tag:nth-child(3) { background: var(--yellow-soft); color: #8a5a00; }
    .tag:nth-child(4) { background: var(--red-soft); color: #b3261e; }

    .summary {
      margin: 0;
      color: #30342d;
      font-size: 14px;
      line-height: 1.45;
    }

    .reference-link {
      display: inline-flex;
      width: fit-content;
      border-top: 1px solid var(--line);
      color: var(--blue);
      padding-top: 9px;
      text-decoration: none;
      font-size: 13px;
      font-weight: 800;
    }

      display: grid;

    .reader-reference {
      color: var(--blue);
      text-decoration: none;
      font-size: 13px;
      font-weight: 800;
      overflow-wrap: anywhere;

    .reference-url {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.35;
      overflow-wrap: anywhere;

      border-radius: 18px;
      background: var(--panel);
      box-shadow: var(--shadow);
      padding: 18px;
    }

    .detail h2 {
      margin: 0 0 12px;
      font-size: 20px;
      line-height: 1.2;
    }

    .detail-block {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
    }

    .detail-block h3 {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.02em;
    }

    .detail-block p,
    .detail-block li {
      color: #30342d;
      font-size: 14px;
      line-height: 1.55;
    }

    .detail-block ul {
      margin: 0;
      padding-left: 18px;
    }

    .breakdown {
      display: grid;
      gap: 8px;
    }

    .bar {
      display: grid;
      grid-template-columns: 118px 1fr 40px;
      gap: 8px;
      align-items: center;
      color: var(--muted);
      font-size: 12px;
    }

    .bar-track {
      height: 7px;
      overflow: hidden;
      border-radius: 999px;
      background: #e7eadf;
    }

    .bar-fill {
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--blue), var(--green), var(--yellow), var(--red));
    }

    .open-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 38px;
      margin-top: 16px;
      border: 1px solid var(--blue);
      border-radius: var(--radius);
      color: var(--blue);
      text-decoration: none;
      padding: 0 12px;
      font-weight: 700;
    }

    .feedback-row {
      display: flex;
      gap: 6px;
      align-items: center;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--line);
    }

    .feedback-btn {
      background: #f1f3f4;
      border: 1px solid transparent;
      border-radius: 999px;
      padding: 3px 10px;
      font-size: 13px;
      cursor: pointer;
      transition: background 120ms, border-color 120ms;
    }

    .feedback-btn:hover { background: var(--blue-soft); }
    .feedback-btn.active-up { background: var(--green-soft); border-color: var(--green); }
    .feedback-btn.active-down { background: var(--red-soft); border-color: var(--red); }

    .feedback-hint {
      color: var(--muted);
      font-size: 11px;
    }

    .empty {
      border: 1px dashed var(--line);
      border-radius: var(--radius);
      padding: 28px;
      color: var(--muted);
      background: var(--panel);
    }

    @media (max-width: 1180px) {
      .layout {
        grid-template-columns: 220px 1fr;
      }

      .detail {
        position: static;
        grid-column: 1 / -1;
        height: auto;
      }
    }

    @media (max-width: 820px) {
      .topbar {
        grid-template-columns: 1fr;
        padding: 14px;
      }

      .brand {
        display: grid;
        gap: 4px;
      }

      .brand h1 {
        white-space: normal;
        font-size: 21px;
      }

      .controls {
        grid-template-columns: 1fr;
      }

      .layout {
        grid-template-columns: 1fr;
        padding: 14px;
      }

      .rail,
      .detail {
        position: static;
        height: auto;
      }

      .metric-grid {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>

or the exposure alone Monte Carlo is cheaper at $1\\%$ and hp-FTT at $0.1\\%$, and a solve run for the Greeks yields it for little more than scenario sampling. Sampling pays in variance for each derivative and hp-FTT in rank for each asset, so Monte Carlo keeps low-order Greeks at percent accuracy, rarely observed contracts and many assets.", "content_hash": "17ed8f14e4846db9ec656b4b43a72e4b811d73e2e6dc4c6eae52e6f947b60a36", "category": "Options / Volatility", "tags": ["derivative", "exposure", "factor", "greeks", "pricing", "risk", "variance", "volatility"], "language": "en", "metadata": {"arxiv_categories": ["q-fin.CP", "math.NA", "quant-ph"]}, "one_line_summary": "用 hp 函数张量列（hp-FTT）把最差标的自动赎回结构的续存价值存成分段多项式张量，一次递推求解得到三阶希腊字母，0.1% 精度下比蒙特卡洛与嵌套模拟便宜最多两个数量级", "technical_summary": "worst-of autocallable 的风险管理需要三阶 Greeks 和潜在未来暴露（PFE，即未来价值的尾分位），但蒙特卡洛每求一阶导数就把抽样噪声放大一次，嵌套模拟还会把内层路径的噪声变成分位估计的偏差。做法是直接求解反向定价递推，把续存价值存成 hp 函数张量列，分段多项式核在障碍处切开，使 worst-of 障碍事件以秩 1 精确作用，从而避免用插值或平滑来近似不连续点。对高斯转移证明了达到误差 ε 所需的多项式阶数只按 sqrt(log(1/ε)) 增长，因此阶数增长极慢、单次求解成本可控。一次求解后，把似然比权重对存储值积分即可得到任意 spot 上的任意阶 Greek，不含抽样噪声；未来日期上存下的价值直接替代内层模拟来算 PFE。在 3–5 资产、月度观察的 worst-of 自动赎回上，1% 精度时 delta 仍由蒙特卡洛胜出 10 倍以上、二阶 Greek 互有胜负、三阶 Greek 全部由 hp-FTT 胜出最多两个数量级；0.1% 精度时检查过的每个 Greek 都是 hp-FTT 更便宜，几何布朗运动与局部波动率下结论一致。", "key_points": ["0.1% 精度下 hp-FTT 对每个可检验的 Greek 都比最强蒙特卡洛估计量便宜，三阶 Greek 最多便宜两个数量级；1% 精度下 delta 仍是蒙特卡洛便宜 10 倍以上。", "一次递推求解同时给出全部 spot 上的全部阶 Greeks 和 PFE，无需重复 bump；但需自建 hp-FTT 与分段多项式插值栈，无公开代码，复现门槛中高。", "优势以秩换方差：rank 随资产数增长，测试只覆盖 3–5 资产、月度观察的 worst-of，资产数多或观察频率高时优势收窄；局部波动率下仅数值验证，无误差界，未涉及跳跃、随机波动率与校准误差。"], "quant_relevance": "风险建模（高阶 Greeks / PFE 尾分位）+ 研究工具与工作流提效：用一次反向递推替换 bump-and-revalue 与嵌套蒙特卡洛", "possible_use_case": "挑一个现有 3 资产月度观察的 worst-of autocallable，把 bump-and-revalue 的三阶希腊与嵌套模拟 PFE 换成一次 hp-FTT 反向递推，在 0.1% 精度目标下对比墙钟时间与结果稳定性，再决定是否替换生产环境的希腊计算链路。", "limitations": "目前只能读到摘要，正文图表、误差界常数、具体网格与 rank 设置无法核实；无开源代码，hp-FTT 与障碍处核切分的实现工作量不小。rank 随资产数增长，资产数多或每日观察的合约上蒙特卡洛仍占优。PFE 单独看时 1% 精度下仍是蒙特卡洛更便宜。模型侧只测了 GBM 和局部波动率，跳跃、随机波动率、相关性微笑与校准误差均未讨论，实盘 PFE 尾分位对这些非常敏感。", "read_priority": "中", "key_figures_md": "", "relevance_score": 9.7, "novelty_score": 9.149, "academic_score": 10.0, "discussion_score": 2.0, "actionable_score": 4.5, "final_score": 7.44, "display_title": "衍生品、因子、定价、风险研究论文", "tldr": "用 hp 函数张量列（hp-FTT）把最差标的自动赎回结构的续存价值存成分段多项式张量，一次递推求解得到三阶希腊字母，0.1% 精度下比蒙特卡洛与嵌套模拟便宜最多两个数量级", "core_value": "对你的量化工作帮助：把它拆成一个期权 / 波动率复现任务，先验证衍生品、因子、定价、风险是否真的带来样本外提升，再检查交易成本、数据泄漏和换手约束。", "key_points_list": ["0.1% 精度下 hp-FTT 对每个可检验的 Greek 都比最强蒙特卡洛估计量便宜，三阶 Greek 最多便宜两个数量级；1% 精度下 delta 仍是蒙特卡洛便宜 10 倍以上。", "一次递推求解同时给出全部 spot 上的全部阶 Greeks 和 PFE，无需重复 bump；但需自建 hp-FTT 与分段多项式插值栈，无公开代码，复现门槛中高。", "优势以秩换方差：rank 随资产数增长，测试只覆盖 3–5 资产、月度观察的 worst-of，资产数多或观察频率高时优势收窄；局部波动率下仅数值验证，无误差界，未涉及跳跃、随机波动率与校准误差。"], "reference_url": "http://arxiv.org/abs/2610.42119v1", "report_sections": ["ai_quant_tools"], "report_section_labels": ["AI 量化工具"], "category_label": "期权 / 波动率", "priority_label": "中", "source_type_label": "论文"}, {"id": "08255f95e9284f104e5c324bc50f7cb747e34446963408c15bd4fea6561a2edb", "source": "arXiv", "source_type": "paper", "title": "TradeWar: A Benchmark for Execution-Grounded Trade Negotiation with Adaptive LLM Agents", "url": "http://arxiv.org/abs/2610.42004v1", "authors": ["Xiangyu Kong", "Ruirui Yang", "Xia Hou"], "published_at": "2026-10-30", "collected_at": "2026-11-03T03:50:55Z", "raw_text": "Multi-turn negotiation remains a challenging problem for large language model (LLM) agents. While LLMs can conduct natural-language dialogue, existing benchmarks predominantly assess only agreement rates, overlooking whether negotiated commitments actually create value once executed. To address this gap, we introduce TradeWar, a multi-country simulation benchmark that translates negotiation dialogues into concrete tariff and trade-share policies, enforces capacity and network constraints during settlement, and evaluates outcomes via an Economic Health Index (EHI). To solve this execution-grounded task, we propose TACTIC (Trade-aware Adaptive Consolidation and Theory-of-mind for International Commerce), an agent that iteratively refines its negotiation strategy across episodes-without updating base LLM weights-by leveraging prior experience, opponent behavior, and past settlement outcomes. Despite using zero-shot chain-of-thought (CoT) prompting, PromptLLM attains a 75% agreement rate but only 57.1 final EHI (*100), whereas TACTIC reaches 68.8. Across 20 sequential episodes and three seeds, TACTIC's final EHI improves from 58.2 to 73.2, compared with 65.2 for an ablation without cross-episode updates. Under technology-controls and energy-crisis shocks, TACTIC also exhibits smaller performance degradation than PromptLLM and MemoryLLM. These results indicate that CoT deliberation and interaction memory alone do not fully address delayed execution feedback, whereas settlement-grounded adaptation improves long-horizon negotiation in TradeWar.", "abstract": "Multi-turn negotiation remains a challenging problem for large language model (LLM) agents. While LLMs can conduct natural-language dialogue, existing benchmarks predominantly assess only agreement rates, overlooking whether negotiated commitments actually create value once executed. To address this gap, we introduce TradeWar, a multi-country simulation benchmark that translates negotiation dialogues into concrete tariff and trade-share policies, enforces capacity and network constraints during settlement, and evaluates outcomes via an Economic Health Index (EHI). To solve this execution-grounded task, we propose TACTIC (Trade-aware Adaptive Consolidation and Theory-of-mind for International Commerce), an agent that iteratively refines its negotiation strategy across episodes-without updating base LLM weights-by leveraging prior experience, opponent behavior, and past settlement outcomes. Despite using zero-shot chain-of-thought (CoT) prompting, PromptLLM attains a 75% agreement rate but only 57.1 final EHI (*100), whereas TACTIC reaches 68.8. Across 20 sequential episodes and three seeds, TACTIC's final EHI improves from 58.2 to 73.2, compared with 65.2 for an ablation without cross-episode updates. Under technology-controls and energy-crisis shocks, TACTIC also exhibits smaller performance degradation than PromptLLM and MemoryLLM. These results indicate that CoT deliberation and interaction memory alone do not fully address delayed execution feedback, whereas settlement-grounded adaptation improves long-horizon negotiation in TradeWar.", "content_hash": "61859af0566be4ce8ae23c9f00e21651cf727448945f4fb7e62943eff8ad7a23", "category": "LLM / Agents for Quant", "tags": ["agent", "chain-of-thought", "execution", "large language model", "llm"], "language": "en", "metadata": {"arxiv_categories": ["cs.AI"]}, "one_line_summary": "用结算后经济健康指数（EHI）评估 LLM 谈判 agent：TACTIC 在 20 个 episode 上把 EHI 从 58.2 拉到 73.2，零样本 CoT 协议率 75% 但 EHI 只有 57.1", "technical_summary": "现有 LLM 多轮谈判基准只统计「是否达成协议」，不检验协议落地后是否真的创造价值，导致高分 agent 可能在执行阶段亏钱。TradeWar 构建多国模拟环境，把自然语言谈判结果编译为具体关税与贸易份额政策，在结算阶段施加产能上限与贸易网络约束，再用 Economic Health Index（EHI）为结果打分。TACTIC 不改动基础模型权重，靠跨 episode 累积对手行为、历史策略与过往结算结果来迭代谈判策略。实验显示零样本 CoT 拿到 75% 协议率却只有 57.1 的 EHI（×100），TACTIC 为 68.8；在 20 个连续 episode、3 个随机种子下 TACTIC 终局 EHI 从 58.2 升到 73.2，去掉跨 episode 更新的消融版本只有 65.2。在技术管制与能源危机两类冲击下，TACTIC 的性能退化幅度也小于 PromptLLM 与 MemoryLLM。", "key_points": ["TACTIC 终局 EHI 68.8，零样本 CoT 仅 57.1 却拿到 75% 协议率，证明协议率与执行价值严重脱钩；20 episodes×3 seeds 下 EHI 58.2→73.2，无跨 episode 更新消融为 65.2。", "纯提示工程加外部记忆实现，不微调权重，复现门槛集中在自建结算器与对手模型；若要迁移到交易场景，需自己写撮合/成本层，代码是否开源原文未说明。", "EHI 是自造指标，关税与贸易份额结算跟真实市场收益无映射；仅 20 episodes、3 seeds，未建模交易成本、滑点与资金约束，结论更像 agent 机制验证而非可交易结论。"], "quant_relevance": "研究工具 / 工作流提效：给出「只看协议率不看执行价值」的反例，可直接搬到执行算法与多 agent 交易模拟的评估设计；另涉及执行 / 交易成本中的延迟奖励归因问题。", "possible_use_case": "把「协议率 ≠ 执行价值」的评估框架移植到自有执行算法回测：在回测里增加结算延迟层（T+1 成交、部分成交、冲击成本），用结算后 PnL 而非成交率给执行 agent 打分，并对比「有/无跨回合记忆更新」两版 agent。", "limitations": "EHI 为自定义综合指数，与任何真实资产收益无对应关系，不能当作策略绩效；结算规则是国家间关税与贸易份额，缺乏订单簿、价格冲击与撮合细节；20 个 episode、3 个随机种子样本量偏小，且未报告置信区间；无交易成本、滑点、资金约束建模；原文未说明代码与数据是否开源，跨 episode 记忆机制存在对固定对手策略过拟合的风险。", "read_priority": "中", "key_figures_md": "- **Figure 1**：TradeWar 整体流程：多国谈判对话 → 关税/贸易份额政策编译 → 产能与网络约束结算 → EHI 打分（原图见 https://arxiv.org/html/2610.42004）\n- **Figure 3**：20 个连续 episode 上的 EHI 曲线：TACTIC 58.2→73.2，对比无跨 episode 更新的消融版 65.2\n- **Table 2**：PromptLLM / MemoryLLM / TACTIC 在协议率与终局 EHI 上的对比：75% 协议率对应 57.1 EHI，TACTIC 为 68.8\n- **Table 3**：技术管制与能源危机冲击下的性能退化对比，TACTIC 退化幅度最小\n- [原文图表（HTML版）](https://arxiv.org/html/2610.42004)", "relevance_score": 7.8, "novelty_score": 9.149, "academic_score": 10.0, "discussion_score": 2.0, "actionable_score": 6.5, "final_score": 7.27, "display_title": "交易执行、大模型、能源交易研究论文", "tldr": "用结算后经济健康指数（EHI）评估 LLM 谈判 agent：TACTIC 在 20 个 episode 上把 EHI 从 58.2 拉到 73.2，零样本 CoT 协议率 75% 但 EHI 只有 57.1", "core_value": "对你的量化工作帮助：把它拆成一个量化大模型 / 智能体复现任务，先验证交易执行、大模型、能源交易是否真的带来样本外提升，再检查交易成本、数据泄漏和换手约束。", "key_points_list": ["TACTIC 终局 EHI 68.8，零样本 CoT 仅 57.1 却拿到 75% 协议率，证明协议率与执行价值严重脱钩；20 episodes×3 seeds 下 EHI 58.2→73.2，无跨 episode 更新消融为 65.2。", "纯提示工程加外部记忆实现，不微调权重，复现门槛集中在自建结算器与对手模型；若要迁移到交易场景，需自己写撮合/成本层，代码是否开源原文未说明。", "EHI 是自造指标，关税与贸易份额结算跟真实市场收益无映射；仅 20 episodes、3 seeds，未建模交易成本、滑点与资金约束，结论更像 agent 机制验证而非可交易结论。"], "reference_url": "http://arxiv.org/abs/2610.42004v1", "report_sections": ["ai_quant_tools"], "report_section_labels": ["AI 量化工具"], "category_label": "量化大模型 / 智能体", "priority_label": "中", "source_type_label": "论文"}, {"id": "ba462bbfdce339cc160b9dce2e00ded4e05ddf528c800313c97a351385171546", "source": "Reddit algotrading", "source_type": "forum", "title": "Day 7 of AI/Algo Trading (Paper) - Posting for accountability", "url": "https://www.reddit.com/r/algotrading/comments/1xmes0o/day_7_of_aialgo_trading_paper_posting_for/", "authors": ["/u/Enzobevmax"], "published_at": "2026-11-03", "collected_at": "2026-11-03T04:00:46Z", "raw_text": "Day 7 in the books! A red day across all five day-trading accounts. It's rough out there, guys, I love the grind though. Changes before today: Demoted 2 setups from Testing to the Graveyard (my call): Big Loser VWAP Reclaim Fade (all day), and its higher-volume twin Testing 2 added Failed Prior-Day-Low Break, SPY-Range Regime (long and short legs) as an owner exception, for forward observation only Today: Primary -$614.39 · End-of-day balance $94,880.55 · Running total since Day 1 (10/23): -$773.72 Milestones: M1 (3 green days in a row) 0/3 · M2 (8 of last 10 green) 3/7 Quick answers to common questions: Claude (Opus 5.5) - Python Alpaca API, paper trading, SIP market data (all US exchanges). US stocks + ETFs, intraday only (9:50 AM-3:55 PM ET), long and short, nothing held overnight. Setups built by basic indicators: RSI, VWAP, volume / buy-sell pressure, gaps, opening range, prior-day highs/lows, ATR. Setup Generator - A bot that invented 10 new setups a night (at least 5 long) and trades them on its own paper account. New concept: setups built randomly from random indicators. Paused after 10/28 so the existing ones get tested first. Setup Life Cycle - Idea or generator -> 2-yr backtest (costs in) -> test through replay sessions (20+ of them) -> Testing (paper) -> Primary (paper) -> real money after the milestones. Losers move down to the Graveyard, never deleted. Promoted / Demoted - Promoted = a setup moves up a level after earning it. Demoted = it moves down a level and keeps proving itself on paper there. Avg R - Average result per trade in units of the risk taken, after costs, fees and slippage (factored in already). Break-even win rate - Win rate a setup needs just to not lose money. Avg R w/o best day - Same, with its single best session removed - spots records carried by one big day. Accounts were meant to start at $100k; they could not be reset during earlier testing without conflicts, so some accounts started in a deficit. Things I am still wanting: Always needing setup ideas and influence. My system is very good at making variations of basic plays in an effort to maximize the potential of a setup. Would love your thoughts. Even if you just like a particular indicator! I'm happy to provide feedback on what I have about it as well! More live replays. I run each new setup through 20+ live replay sessions and it's about 98% accurate in terms of same execution. I need more though for better tuning if you know of anything! Quick thoughts: Really love the engagement by everyone across all of the subs. Thank you! I want to share this with everyone so please ask away. Patience. Marathon, not a sprint. I'll always share setups that are successful(so far!) and am an open book! Getting a little tired of these other guys posting success but providing no substance. Warts and all, here! As always, thanks so much for the support and input! Fun stuff! submitted by /u/Enzobevmax [link] [comments]", "abstract": "Day 7 in the books! A red day across all five day-trading accounts. It's rough out there, guys, I love the grind though. Changes before today: Demoted 2 setups from Testing to the Graveyard (my call): Big Loser VWAP Reclaim Fade (all day), and its higher-volume twin Testing 2 added Failed Prior-Day-Low Break, SPY-Range Regime (long and short legs) as an owner exception, for forward observation only Today: Primary -$614.39 · End-of-day balance $94,880.55 · Running total since Day 1 (10/23): -$773.72 Milestones: M1 (3 green days in a row) 0/3 · M2 (8 of last 10 green) 3/7 Quick answers to common questions: Claude (Opus 5.5) - Python Alpaca API, paper trading, SIP market data (all US exchanges). US stocks + ETFs, intraday only (9:50 AM-3:55 PM ET), long and short, nothing held overnight. Setups built by basic indicators: RSI, VWAP, volume / buy-sell pressure, gaps, opening range, prior-day highs/lows, ATR. Setup Generator - A bot that invented 10 new setups a night (at least 5 long) and trades them on its own paper account. New concept: setups built randomly from random indicators. Paused after 10/28 so the existing ones get tested first. Setup Life Cycle - Idea or generator -> 2-yr backtest (costs in) -> test through replay sessions (20+ of them) -> Testing (paper) -> Primary (paper) -> real money after the milestones. Losers move down to the Graveyard, never deleted. Promoted / Demoted - Promoted = a setup moves up a level after earning it. Demoted = it moves down a level and keeps proving itself on paper there. Avg R - Average result per trade in units of the risk taken, after costs, fees and slippage (factored in already). Break-even win rate - Win rate a setup needs just to not lose money. Avg R w/o best day - Same, with its single best session removed - spots records carried by one big day. Accounts were meant to start at $100k; they could not be reset during earlier testing without conflicts, so some accounts started in a deficit. Things I am still wanting: Always needing setup ideas and influence. My system is very good at making variations of basic plays in an effort to maximize the potential of a setup. Would love your thoughts. Even if you just like a particular indicator! I'm happy to provide feedback on what I have about it as well! More live replays. I run each new setup through 20+ live replay sessions and it's about 98% accurate in terms of same execution. I need more though for better tuning if you know of anything! Quick thoughts: Really love the engagement by everyone across all of the subs. Thank you! I want to share this with everyone so please ask away. Patience. Marathon, not a sprint. I'll always share setups that are successful(so far!) and am an open book! Getting a little tired of these other guys posting success but providing no substance. Warts and all, here! As always, thanks so much for the support and input! Fun stuff! submitted by /u/Enzobevmax [link] [comments]", "content_hash": "66eb5e661ac22656175724d418ad66ebf4e3aade443e48f5a592881715a532eb", "category": "Execution / Transaction Cost", "tags": ["backtest", "execution", "market data", "risk", "slippage", "vwap"], "language": "en", "metadata": {"feed_url": "https://www.reddit.com/r/algotrading/.rss"}, "one_line_summary": "Claude 驱动 5 个日内 paper 账户跑到第 7 天：累计 -$773.72，用「生命周期分级 + 去掉最佳日的 Avg R」淘汰策略", "technical_summary": "第 7 天交易日志：作者用 Claude 生成 Python 代码，接入 Alpaca 的 SIP 全交易所行情做日内 paper 交易，五个账户各约 $10 万，交易时段限定 9:50–3:55 ET，只做日内、不留隔夜仓。当天主账户 -$614.39，收盘余额 $94,880.55，自 10/23 起累计 -$773.72；三个连续盈利日、近 10 日 8 绿的里程碑进度分别是 0/3 和 3/7。策略全部由 RSI、VWAP、买卖压力、缺口、开盘区间、前日高低点、ATR 这类基础指标组合而成，另有一个每晚生成 10 个新设定（至少 5 个多头）的生成器，10/28 起暂停。社区关注点集中在两处：策略设定的生命周期怎么管，以及「去掉最佳单日的 Avg R」这种去极值检验；作者对「只晒盈利、不给细节」的帖子表示不满。", "key_points": ["策略评级按「思路或生成器→2 年含成本回测→20+ 次回放会话→paper 测试→paper 主账户→达到里程碑后上实盘」逐级晋升，亏损设定只降级进 Graveyard 不删除。", "可直接借鉴三个剔除运气因素的指标：扣除成本、滑点和手续费后的 Avg R、盈亏平衡所需胜率，以及剔除最佳单日后的 Avg R，用来识别只靠一天大赚撑起的记录。", "五账户无一笔实盘，98% 回放一致性是自报口径；未披露单笔风险占比、样本笔数、滑点模型参数，样本外结论无法复核。"], "quant_relevance": "研究工具 / 工作流提效；执行 / 交易成本", "possible_use_case": "在自己的策略池里加两列审计字段：`avg_R_ex_best_day` 和 `break_even_winrate`，对每条候选策略先剔除贡献最大的单日再算夏普或平均收益，贡献超过总收益 30% 的直接标红降级；另可照搬「回放会话 20 次以上再进 paper」的门槛，作为从回测到模拟盘的强制关卡。", "limitations": "这是个人交易日志，样本只有一个交易者的 7 天记录、5 个 paper 账户，没有任何实盘成交，回放 98% 一致性和「扣除滑点」的假设均由作者自报；未给出每笔风险占比、交易笔数和滑点模型，也未说明 Claude 生成代码与人工判断各占多少；社区讨论的结论需要用数据验证后才能用于研究。", "read_priority": "高", "key_figures_md": "", "relevance_score": 8.0, "novelty_score": 10.0, "academic_score": 5.5, "discussion_score": 3.0, "actionable_score": 7.5, "final_score": 7.175, "display_title": "回测、交易执行、市场数据、风险实践讨论", "tldr": "Claude 驱动 5 个日内 paper 账户跑到第 7 天：累计 -$773.72，用「生命周期分级 + 去掉最佳日的 Avg R」淘汰策略", "core_value": "对你的量化工作帮助：把它当作回测、交易执行、市场数据、风险的实盘经验线索，用来补充回测假设、交易成本假设或风控检查清单。", "key_points_list": ["策略评级按「思路或生成器→2 年含成本回测→20+ 次回放会话→paper 测试→paper 主账户→达到里程碑后上实盘」逐级晋升，亏损设定只降级进 Graveyard 不删除。", "可直接借鉴三个剔除运气因素的指标：扣除成本、滑点和手续费后的 Avg R、盈亏平衡所需胜率，以及剔除最佳单日后的 Avg R，用来识别只靠一天大赚撑起的记录。", "五账户无一笔实盘，98% 回放一致性是自报口径；未披露单笔风险占比、样本笔数、滑点模型参数，样本外结论无法复核。"], "reference_url": "https://www.reddit.com/r/algotrading/comments/1xmes0o/day_7_of_aialgo_trading_paper_posting_for/", "report_sections": ["ai_quant_tools"], "report_section_labels": ["AI 量化工具"], "category_label": "交易执行 / 交易成本", "priority_label": "高", "source_type_label": "论坛"}, {"id": "f463db0fda3ca42bf306a15018c1d1493eeda5a77f895a3b73c8824f2b9b33a7", "source": "arXiv", "source_type": "paper", "title": "Conditional Neural SDEs for Financial Time-Series Generation", "url": "http://arxiv.org/abs/2610.41405v1", "authors": ["Sina Molavipour", "Alireza M. Javid", "Björn Löfdahl", "Mikhail Nechaev"], "published_at": "2026-10-30", "collected_at": "2026-11-03T03:50:27Z", "raw_text": "Conditional generation of time-series paths is a central problem in probabilistic modeling, where the goal is to simulate future trajectories that are both realistic and responsive to external context. It has direct applications in finance and economics. Neural stochastic differential equations provide a natural framework for this task by combining continuous-time stochastic dynamics with learnable drift and diffusion functions. However, directly modeling the target state can be unstable in conditional settings, especially when the target and conditioning variables have strong level dependence, limited training data, or different dimensions.We propose a residualanchor Neural SDE architecture that decomposes the target into a learned conditional anchor and a stochastic residual. The anchor captures the context-dependent baseline, while the Neural SDE (Stochastic Differential Equation) models the residual dynamics around this baseline. This separation reduces the burden on the stochastic dynamics and generalizes spread-based representations to more general conditioning settings.We evaluate the approach on real-world financial time series, including conditional interest-rate scenarios and a comparison with a time-series foundation model. The results show that the proposed model can generate plausible conditional paths, maintain competitive point accuracy, and provide calibrated uncertainty estimates.", "abstract": "Conditional generation of time-series paths is a central problem in probabilistic modeling, where the goal is to simulate future trajectories that are both realistic and responsive to external context. It has direct applications in finance and economics. Neural stochastic differential equations provide a natural framework for this task by combining continuous-time stochastic dynamics with learnable drift and diffusion functions. However, directly modeling the target state can be unstable in conditional settings, especially when the target and conditioning variables have strong level dependence, limited training data, or different dimensions.We propose a residualanchor Neural SDE architecture that decomposes the target into a learned conditional anchor and a stochastic residual. The anchor captures the context-dependent baseline, while the Neural SDE (Stochastic Differential Equation) models the residual dynamics around this baseline. This separation reduces the burden on the stochastic dynamics and generalizes spread-based representations to more general conditioning settings.We evaluate the approach on real-world financial time series, including conditional interest-rate scenarios and a comparison with a time-series foundation model. The results show that the proposed model can generate plausible conditional paths, maintain competitive point accuracy, and provide calibrated uncertainty estimates.", "content_hash": "ec4b2decb7a80958e42412c0656daaf51ef56e1bc046733a104719ca0a335663", "category": "Machine Learning for Finance", "tags": ["foundation model", "interest-rate", "neural", "spread", "time series"], "language": "en", "metadata": {"arxiv_categories": ["stat.ML", "cs.LG"]}, "one_line_summary": "残差锚 Neural SDE 生成条件利率路径，点精度有竞争力但摘要未给数值", "technical_summary": "目标是条件生成未来金融路径，且在目标与条件变量强水平依赖、小样本或维度不一致时保持稳定。做法是把目标拆成学习到的条件锚（上下文基线）和神经 SDE 建模的随机残差，降低随机动力学学习负担。真实数据实验覆盖条件利率情景，并与时间序列基础模型对比；给出的结论是路径合理、点精度有竞争力、不确定性校准较好。原文摘要未披露误差、覆盖率、夏普或样本外划分等具体数值。", "key_points": ["残差锚 Neural SDE 拆条件锚+随机残差，在条件利率序列上生成路径；原文无夏普/误差数值，结论待复核。", "需条件变量与目标序列配对；实现要 SDE 求解器和稳定训练，摘要未给代码，复现门槛中高。", "仅摘要可见，无样本外划分、覆盖率/误差和交易成本；利率低维结果迁移到股票/高频需重验。"], "quant_relevance": "风险建模（条件情景生成）；数据工程（合成路径增强）", "possible_use_case": "接入利率曲线压力测试：用条件锚拟合目标水平，再训练 SDE 生成残差路径，输出带不确定区间的多情景路径。", "limitations": "原文缺乏量化证据，摘要基于定性描述；可见内容只有摘要，未给训练窗口、样本外划分、误差/覆盖率/夏普等指标；无代码和交易约束，生成路径不能直接作为交易信号；条件利率低维场景迁移到股票或高频需重新验证。", "read_priority": "中", "key_figures_md": "- **arXiv HTML**：原图/表需查看 https://arxiv.org/html/2610.41405；摘要未列出具体图号和指标\n- [原文图表（HTML版）](https://arxiv.org/html/2610.41405)", "relevance_score": 7.3, "novelty_score": 9.149, "academic_score": 10.0, "discussion_score": 2.0, "actionable_score": 6.5, "final_score": 7.12, "display_title": "利率衍生品、价差、时间序列、金融时间序列研究论文", "tldr": "残差锚 Neural SDE 生成条件利率路径，点精度有竞争力但摘要未给数值", "core_value": "对你的量化工作帮助：把它拆成一个金融机器学习复现任务，先验证利率衍生品、价差、时间序列、金融时间序列是否真的带来样本外提升，再检查交易成本、数据泄漏和换手约束。", "key_points_list": ["残差锚 Neural SDE 拆条件锚+随机残差，在条件利率序列上生成路径；原文无夏普/误差数值，结论待复核。", "需条件变量与目标序列配对；实现要 SDE 求解器和稳定训练，摘要未给代码，复现门槛中高。", "仅摘要可见，无样本外划分、覆盖率/误差和交易成本；利率低维结果迁移到股票/高频需重验。"], "reference_url": "http://arxiv.org/abs/2610.41405v1", "report_sections": ["deep_learning_quant"], "report_section_labels": ["深度学习量化未来"], "category_label": "金融机器学习", "priority_label": "中", "source_type_label": "论文"}, {"id": "6e3e12c88e39537a0fed74660c650d0df36ffd0f8d812e24064ccb143ecfae05", "source": "arXiv", "source_type": "paper", "title": "Non-Convex Market Makers: Coherence without Convexity, Friction, and Parallel Composition", "url": "http://arxiv.org/abs/2611.00502v1", "authors": ["Peter Cotton"], "published_at": "2026-10-31", "collected_at": "2026-11-03T03:50:23Z", "raw_text": "Cost-function market makers are always assumed convex, and convexity is not what makes them coherent. For a path-independent maker the exact no-arbitrage condition is a chord condition, that every chord slope of the cost lie in the convex hull of payoffs; convexity enters the standard axiomatics through a separate requirement, monotone information incorporation, and dropping it leaves coherent non-convex makers. Rational flow against such a maker trades the convex envelope, so non-convexity costs expressiveness rather than soundness, and a proportional fee of at least the arbitrage depth restores no-arbitrage, which by conjugation is a bid-ask spread with an exact no-trade interval for any cost whatever. Combining fee-bearing makers is an infimal convolution solved by one monotone clearing-price root-find, with sparse participation and a consolidated limit order book as the aggregate, and a deep quadratic co-quoter is Moreau smoothing, which preserves coherence at every depth. Any quoted configuration outside the coherent hull admits a portfolio priced below its worst payoff, so arbitrageurs act as decentralized separation oracles, and coherence is relative to friction and to the cost of finding certificates.", "abstract": "Cost-function market makers are always assumed convex, and convexity is not what makes them coherent. For a path-independent maker the exact no-arbitrage condition is a chord condition, that every chord slope of the cost lie in the convex hull of payoffs; convexity enters the standard axiomatics through a separate requirement, monotone information incorporation, and dropping it leaves coherent non-convex makers. Rational flow against such a maker trades the convex envelope, so non-convexity costs expressiveness rather than soundness, and a proportional fee of at least the arbitrage depth restores no-arbitrage, which by conjugation is a bid-ask spread with an exact no-trade interval for any cost whatever. Combining fee-bearing makers is an infimal convolution solved by one monotone clearing-price root-find, with sparse participation and a consolidated limit order book as the aggregate, and a deep quadratic co-quoter is Moreau smoothing, which preserves coherence at every depth. Any quoted configuration outside the coherent hull admits a portfolio priced below its worst payoff, so arbitrageurs act as decentralized separation oracles, and coherence is relative to friction and to the cost of finding certificates.", "content_hash": "28f4c1c0fe94c2c5fcfb336b7d7d7934ff69ab2bd20e9a3a26945c87502c4b93", "category": "Market Microstructure", "tags": ["limit order book", "order book", "portfolio", "spread"], "language": "en", "metadata": {"arxiv_categories": ["q-fin.MF", "q-fin.TR"]}, "one_line_summary": "证明做市商无套利只需弦条件而非凸性，比例费≥套利深度即可恢复连贯性", "technical_summary": "标准成本函数做市商通常假设成本函数凸，但无套利并不要求凸；对路径无关做市商，精确条件是所有弦斜率落在赔付集合的凸包内。凸性只是通过“单调信息纳入”单独进入公理体系，去掉它仍有连贯的非凸做市商。非凸只损失表达能力，不破坏稳健性；对非凸成本，理性订单流交易其凸包。加收不低于套利深度的比例费可恢复无套利，经共轭变换等价于带精确无交易区间的买卖价差。多个收费做市商合并是下卷积，可用一次单调清算价求根求解，聚合结果可视为含稀疏参与的合并限价订单簿；深度二次联合报价器等价于 Moreau 平滑，任意深度保持连贯。", "key_points": ["把无套利精确化为弦条件：成本函数每条弦斜率须落在赔付凸包，凸性仅对应单调信息纳入，非凸做市商仍连贯。", "可直接用于 AMM/LMSR 报价与合并：费用≥套利深度，合并用一次单调求根；实现需凸包/共轭计算，复现门槛中等。", "摘要无数据集、数值实验与样本外回测；套利深度和证书成本难估，费用低估会重新打开套利，高估则损失成交。"], "quant_relevance": "执行 / 交易成本；风险建模。直接影响成本函数做市商/AMM 的报价与费用设计，并给出多 maker 合并的清算价求解方式。", "possible_use_case": "在 AMM/LMSR 做市模块中，把凸性校验替换为弦条件/凸包校验；给报价加比例费 f≥估计套利深度，并用下卷积+单调求根合并多池报价。", "limitations": "纯理论摘要，未给数据集、数值实验、样本外回测或实盘交易成本；弦条件需计算赔付凸包，套利深度和证书成本在实盘中难精确估计；比例费阈值若低估会重新引入套利，高估则损失成交。", "read_priority": "中", "key_figures_md": "- **HTML 全文**：arXiv HTML 版（含原图）：https://arxiv.org/html/2611.00502\n- [原文图表（HTML版）](https://arxiv.org/html/2611.00502)", "relevance_score": 7.3, "novelty_score": 9.355, "academic_score": 10.0, "discussion_score": 2.0, "actionable_score": 4.5, "final_score": 6.761, "display_title": "订单簿、组合、价差研究论文", "tldr": "证明做市商无套利只需弦条件而非凸性，比例费≥套利深度即可恢复连贯性", "core_value": "对你的量化工作帮助：把它拆成一个市场微观结构复现任务，先验证订单簿、组合、价差是否真的带来样本外提升，再检查交易成本、数据泄漏和换手约束。", "key_points_list": ["把无套利精确化为弦条件：成本函数每条弦斜率须落在赔付凸包，凸性仅对应单调信息纳入，非凸做市商仍连贯。", "可直接用于 AMM/LMSR 报价与合并：费用≥套利深度，合并用一次单调求根；实现需凸包/共轭计算，复现门槛中等。", "摘要无数据集、数值实验与样本外回测；套利深度和证书成本难估，费用低估会重新打开套利，高估则损失成交。"], "reference_url": "http://arxiv.org/abs/2611.00502v1", "report_sections": ["deep_learning_quant"], "report_section_labels": ["深度学习量化未来"], "category_label": "市场微观结构", "priority_label": "中", "source_type_label": "论文"}, {"id": "0bb66a95606233fd944720d2e059d5f603c8b674641f510f135f53d459a64201", "source": "arXiv", "source_type": "paper", "title": "Quantifying Repair Risk in Crypto Option Surfaces", "url": "http://arxiv.org/abs/2611.00958v1", "authors": ["Tenghan Zhong"], "published_at": "2026-10-31", "collected_at": "2026-11-03T03:50:23Z", "raw_text": "Option desks adjust crypto option quotes into price surfaces that remain within bid-ask intervals and satisfy standard no-arbitrage restrictions across strikes before computing Greeks, hedge quantities, or risk measures. For the same quote panel, however, these constraints may admit multiple such surfaces, which we call admissible repairs, with different downstream outputs. We define the resulting variation as repair risk and propose repair-risk validation, a matched framework for quantifying dispersion in Greeks, hedge quantities, and risk measures. The mechanism is finite-difference amplification: two admissible repairs within price distance $\\varepsilon$ can differ in local normalized-strike curvature by $4\\varepsilon/h^2$, where $h$ is local normalized-strike spacing. We evaluate repair risk on Deribit BTC and ETH option chains, using $L_1$ and $L_2$ projections of midpoint prices onto the same admissible set as matched controls. Across 108 matched evaluations spanning 18 sampled calendar months, the median 90th percentile of the scaled spot-gamma gap for $L_2$ versus the $ρ=10$ smoothness-penalized repair is nearly twenty times the matched $L_1$--$L_2$ control. We also instantiate NN-Proj, a neural-projection repair, to test whether learned repairs exhibit repair risk. Despite good held-out fit, its downstream outputs remain distinct from those of classical repairs. Across five seeds with the same training window and architecture, its curvature dispersion exceeds the matched $L_1$--$L_2$ control in 17 of 18 months ($p=1.45\\times10^{-4}$). For a USD 1 million risk reversal, switching from $L_2$ to the $ρ=10$ repair shifts the median 90th-percentile hedge notional by 18.62 basis points of gross spot notional. VaR-style estimates also exhibit greater dispersion across repairs. The repair rule is therefore part of the risk model, not merely a feasibility check.", "abstract": "Option desks adjust crypto option quotes into price surfaces that remain within bid-ask intervals and satisfy standard no-arbitrage restrictions across strikes before computing Greeks, hedge quantities, or risk measures. For the same quote panel, however, these constraints may admit multiple such surfaces, which we call admissible repairs, with different downstream outputs. We define the resulting variation as repair risk and propose repair-risk validation, a matched framework for quantifying dispersion in Greeks, hedge quantities, and risk measures. The mechanism is finite-difference amplification: two admissible repairs within price distance $\\varepsilon$ can differ in local normalized-strike curvature by $4\\varepsilon/h^2$, where $h$ is local normalized-strike spacing. We evaluate repair risk on Deribit BTC and ETH option chains, using $L_1$ and $L_2$ projections of midpoint prices onto the same admissible set as matched controls. Across 108 matched evaluations spanning 18 sampled calendar months, the median 90th percentile of the scaled spot-gamma gap for $L_2$ versus the $ρ=10$ smoothness-penalized repair is nearly twenty times the matched $L_1$--$L_2$ control. We also instantiate NN-Proj, a neural-projection repair, to test whether learned repairs exhibit repair risk. Despite good held-out fit, its downstream outputs remain distinct from those of classical repairs. Across five seeds with the same training window and architecture, its curvature dispersion exceeds the matched $L_1$--$L_2$ control in 17 of 18 months ($p=1.45\\times10^{-4}$). For a USD 1 million risk reversal, switching from $L_2$ to the $ρ=10$ repair shifts the median 90th-percentile hedge notional by 18.62 basis points of gross spot notional. VaR-style estimates also exhibit greater dispersion across repairs. The repair rule is therefore part of the risk model, not merely a feasibility check.", "content_hash": "17a1e544fd965d48700b5ff01768e06a80be5862a7b8fb417a4c30137535b38f", "category": "Risk Management", "tags": ["crypto", "greeks", "neural", "option", "risk", "var"], "language": "en", "metadata": {"arxiv_categories": ["q-fin.PR", "q-fin.RM"]}, "one_line_summary": "同一份加密期权报价能修复出多个合法曲面：Deribit BTC/ETH 上 L2 与 ρ=10 平滑修复的 spot-gamma 离散度达 L1–L2 匹配对照的近 20 倍，100 万美元 risk reversal 对冲名义额中位偏移 18.62 bp", "technical_summary": "问题：期权做市台把报价面板修复成同时满足买价卖价区间与跨执行价无套利约束的价格曲面，再算 Greeks 和对冲量，但同一面板常有多个合法解（admissible repair），下游输出不同。方法：把这种差异定义为 repair risk（修复风险），并给出 matched 验证框架；机制是有限差分放大——两个价差为 ε 的合法修复，局部归一化执行价曲率可差 4ε/h²（h 为局部执行价间距），曲率误差随执行价间距平方倒数放大。实验：在 Deribit BTC 与 ETH 期权链上，以中点价到同一合法集的 L1、L2 投影作为匹配对照，共 108 次配对评估、覆盖 18 个抽样月份，L2 对 ρ=10 平滑惩罚修复的 scaled spot-gamma gap 的 90 分位中位数约为 L1–L2 对照的 20 倍。另构造神经网络投影修复 NN-Proj：留出集拟合很好，但 5 个随机种子下曲率离散度在 18 个月中有 17 个月超过匹配对照（p=1.45×10⁻⁴）。经济量级：100 万美元 risk reversal 从 L2 换成 ρ=10 修复，对冲名义额 90 分位中位数移动 18.62 bp 的现货总名义额；VaR 类估计的跨修复离散度同样变大。结论：修复规则属于风险模型本身，而非仅用于检验可行性。", "key_points": ["同一报价面板存在多个无套利修复，价差 ε 可被 4ε/h² 放大成曲率差，L2 与 ρ=10 修复的 spot-gamma 差距达匹配对照 20 倍", "Deribit 公开期权链即可复现；L1、L2 投影与 ρ 平滑惩罚都有闭式或凸优化解，实现成本低，NN-Proj 需 5 种子重复以测离散度", "仅覆盖 18 个月加密期权、无 PnL 回测；离散度不等于实际亏损，未计入修复规则切换的成本与实盘滑点"], "quant_relevance": "风险建模：Greeks、对冲数量和 VaR 的离散度部分来自报价曲面修复规则，而不只是市场波动；该结论也直接影响对冲执行名义额与交易成本。", "possible_use_case": "在现有加密期权做市或波动率套利流程中加入 repair-risk 验证：对同一报价面板并行跑 L1、L2、ρ=10 三种修复，输出 Greeks 的 90 分位区间，若区间宽度超过内部阈值，就禁止按单一修复的对冲量下单，或按区间上界加对冲缓冲。", "limitations": "样本仅 Deribit BTC/ETH 的 18 个抽样月份，未覆盖极端行情与流动性枯竭期；4ε/h² 是局部线性化放大界，未给出全局误差控制；论文报告的是修复间离散度，未做真实 PnL 或对冲误差回测，无法判断哪种修复事后更优；NN-Proj 的显著性检验只基于 5 个种子、同一训练窗口和架构；VaR 离散度更大只说明估计不稳，未量化对应的资本成本。", "read_priority": "高", "key_figures_md": "- **正文主结果图（arXiv HTML 版 Figure 1 附近）**：L2、ρ=10 平滑修复与 L1–L2 匹配对照的 scaled spot-gamma gap 90 分位分布对比，前者约为后者 20 倍\n- **正文汇总表（18 个月月度结果）**：108 次配  =\\frac{4-36}{96-64}=\\frac{-32}{32}=-1.0\\ \\text{shares(shorting stock)}$$ We plug $\\Delta$ back into the Up equation to find $B$ : \\begin{align*} &(-1.0)(96)+B\\times (1+\\text{interest})=4\\\\ &\\implies -96+B\\times (1+\\text{interest})=4\\\\ &\\implies B\\times (1+\\text{interest})=100 \\end{align*} Because $B$ is positive, we apply the lending rate $r = 0\\%.$ $$B\\times (1+0)=100\\implies B=100$$ The option value at Node $D(Y_{1}^{D})$ is: \\begin{align*} (Y_{1}^{D})&=\\Delta \\times S_{1}+B\\\\ &=(-1.0\\times 80)+100\\\\ &=20.00 \\end{align*} Finally, at $t=0$ , we know our future targets are $(Y_1^U) = 30.91$ and $(Y_1^D) = 20.00.$ Up move: $\\Delta(120) + B \\times (1 + \\text{interest}) = 30.91$ Down move: $\\Delta(80) + B \\times (1 + \\text{interest}) = 20.00$ We calculate $\\Delta$ : $$\\Delta =\\frac{30.91-20.00}{120-80}=\\frac{10.91}{40}\\approx 0.27275\\ \\text{shares}$$ Now, we plug $\\Delta$ into the Down equation to find $B$ : \\begin{align*} &(0.27275)(80)+B\\times (1+\\text{interest})=20\\\\ &\\implies 21.82+B\\times (1+\\text{interest})=20\\\\ &\\implies B\\times (1+\\text{interest})=-1.82 \\end{align*} Because $B$ is negative, we apply the borrowing rate $R = 10\\%$ : $$B=\\frac{-1.82}{1.10}\\approx -1.65$$ The final option price today ( $Y_0$ ) is: $$Y_0=(0.27275\\times 100)-1.65=\\boxed{25.63}$$ My Question Is this method correct?", "abstract": "Background I wish to solve this backward in time from maturity $(t=2)$ to today $(t=0)$ , matching the exact algorithmic logic of a Discrete-Time Backward Stochastic Differential Equation (BSDE). My Attempt Our parameters Stock Price today $(t=0): S_0 = \\\\\\$100$ Tree movement: At each step, the stock either goes up by $20\\%\\ (u = 1.2)$ or down by $20\\%\\ (d = 0.8)$ . Lending Rate: $r = 0%.$ Borrowing Rate: $R = 10\\%$ per step. Derivative Payoff at $t=2$ : A long position in a straddle with a strike price of $K = \\\\\\$100.$ Therefore $$(\\text{Payoff}=|{}S_{2}-100|{})$$ The stock prices es (1+\\text{interest})=4\\\\ &\\implies -96+B\\times (1+\\text{interest})=4\\\\ &\\implies B\\times (1+\\text{interest})=100 \\end{align*} Because $B$ is positive, we apply the lending rate $r = 0\\%.$ $$B\\times (1+0)=100\\implies B=100$$ The option value at Node $D(Y_{1}^{D})$ is: \\begin{align*} (Y_{1}^{D})&=\\Delta \\times S_{1}+B\\\\ &=(-1.0\\times 80)+100\\\\ &=20.00 \\end{align*} Finally, at $t=0$ , we know our future targets are $(Y_1^U) = 30.91$ and $(Y_1^D) = 20.00.$ Up move: $\\Delta(120) + B \\times (1 + \\text{interest}) = 30.91$ Down move: $\\Delta(80) + B \\times (1 + \\text{interest}) = 20.00$ We calculate $\\Delta$ : $$\\Delta =\\frac{30.91-20.00}{120-80}=\\frac{10.91}{40}\\approx 0.27275\\ \\text{shares}$$ Now, we plug $\\Delta$ into the Down equation to find $B$ : \\begin{align*} &(0.27275)(80)+B\\times (1+\\text{interest})=20\\\\ &\\implies 21.82+B\\times (1+\\text{interest})=20\\\\ &\\implies B\\times (1+\\text{interest})=-1.82 \\end{align*} Because $B$ is negative, we apply the borrowing rate $R = 10\\%$ : $$B=\\frac{-1.82}{1.10}\\approx -1.65$$ The final option price today ( $Y_0$ ) is: $$Y_0=(0.27275\\times 100)-1.65=\\boxed{25.63}$$ My Question Is this method correct?", "content_hash": "83c77586c0a9480178a629c8753d7cb789630d03f84e8112ceb2c4f567be7590", "category": "Options / Volatility", "tags": ["derivative", "exposure", "option", "portfolio", "volatility"], "language": "en", "metadata": {"feed_url": "https://quant.stackexchange.com/feeds"}, "one_line_summary": "在二叉树中用借款利率10%、贷款利率0%倒推跨式期权，帖主算出价格25.63美元但未获社区验证", "technical_summary": "这是 Quant StackExchange 上的单个提问，不是已形成共识的社区讨论。帖主构造 S0=100、u=1.2、d=0.8、K=100 的两期二叉树，对跨式组合在到期日取 |S2-100| 的收益。每个节点解 Δ 和现金余额 B，并按 B 的正负选择贷款利率 r=0% 或借款利率 R=10%。倒推得到 Y1U=30.91、Y1D=20.00、Y0=25.63，核心疑问是这种非对称利率处理是否符合离散 BSDE 倒推和无套利定价。目前没有可见回复，因此无社区共识。", "key_points": ["单个提问非共识：按 B 符号选 r/R 倒推得 Y0=25.63，暂无回复验证。", "可复算三节点 Δ 和 B，并用更细树或基准模型核对 25.63 的收敛与无套利一致性。", "若 B 的符号与所用利率不一致，价格会偏差；两期树未含交易成本与离散对冲误差。"], "quant_relevance": "风险建模 / 研究工具：涉及期权定价、对冲比率与不对称资金成本下的倒推流程。", "possible_use_case": "把该倒推逻辑写成 Python 或 Excel 校验脚本：输入 S0、u、d、K、r、R，输出每个节点的 Δ、B、期权价，并做树步数收敛测试。", "limitations": "这是社区讨论，需用数据验证后才能用于研究结论；原帖无回复、无基准价格和代码，25.63 未独立验证；两期树过于粗糙，未考虑交易成本、买卖价差、离散对冲误差与模型风险。", "read_priority": "中", "key_figures_md": "", "relevance_score": 7.3, "novelty_score": 9.78, "academic_score": 5.5, "discussion_score": 3.0, "actionable_score": 4.5, "final_score": 6.321, "display_title": "衍生品、期权、组合、波动率实践讨论", "tldr": "在二叉树中用借款利率10%、贷款利率0%倒推跨式期权，帖主算出价格25.63美元但未获社区验证", "core_value": "对你的量化工作帮助：把它当作衍生品、期权、组合、波动率的实盘经验线索，用来补充回测假设、交易成本假设或风控检查清单。", "key_points_list": ["单个提问非共识：按 B 符号选 r/R 倒推得 Y0=25.63，暂无回复验证。", "可复算三节点 Δ 和 B，并用更细树或基准模型核对 25.63 的收敛与无套利一致性。", "若 B 的符号与所用利率不一致，价格会偏差；两期树未含交易成本与离散对冲误差。"], "reference_url": "https://quant.stackexchange.com/questions/86921/two-period-non-linear-binomial-tree-to-price-a-long-straddle-under-different-bo", "report_sections": ["ai_quant_tools"], "report_section_labels": ["AI 量化工具"], "category_label": "期权 / 波动率", "priority_label": "中", "source_type_label": "论坛"}, {"id": "4de8fd46f1a96337b2b3f763785ac951d1ae9ae7ba350dd065904a6c67c75d92", "source": "arXiv", "source_type": "paper", "title": "AStockArena: Beyond Returns, Can We Entrust Real Capital to the Decisions of Financial Agents?", "url": "http://arxiv.org/abs/2611.00515v1", "authors": ["Zeyu Liu", "Sing Kwong Lai", "Xuanzhi Feng", "HaoYang Shang", "Yang Li", "Zihao Fang", "Xuan Liu"], "published_at": "2026-10-31", "collected_at": "2026-11-03T03:50:55Z", "raw_text": "Large language models (LLMs) are increasingly used in dynamic financial trading, yet real-time trading benchmarks mainly evaluate agents by cumulative returns and risk-adjusted performance. Such outcome metrics cannot show whether trades are faithfully reported, supported by available evidence, and consistent with account states. We introduce AStockArena, a real-time decision-auditing benchmark for continuous trading in China's A-share market. Under shared market conditions and execution constraints, we evaluate 13 open- and closed-source models over 3,198 sequential decisions. AStockArena reconstructsthe actions actually posted to accounts by aligning reports, trade requests, execution responses, and account states, and audits them with eight checks spanning execution traceability (O), evidence sufficiency (RK), and financial meta-awareness (B), combining record verification with consensus expert annotation. Of 1,070 trading points, 72.99% exhibit at least one audit gap; model-level rates range from52.2% to 91.2%, with evidence gaps most prevalent. Historical trade-filtering replay further shows thatportfolio outcomes are sensitive to these flagged trades. Decision-process auditing thus offers a verifiable complement to return-based evaluation of financial agents.", "abstract": "Large language models (LLMs) are increasingly used in dynamic financial trading, yet real-time trading benchmarks mainly evaluate agents by cumulative returns and risk-adjusted performance. Such outcome metrics cannot show whether trades are faithfully reported, supported by available evidence, and consistent with account states. We introduce AStockArena, a real-time decision-auditing benchmark for continuous trading in China's A-share market. Under shared market conditions and execution constraints, we evaluate 13 open- and closed-source models over 3,198 sequential decisions. AStockArena reconstructsthe actions actually posted to accounts by aligning reports, trade requests, execution responses, and account states, and audits them with eight checks spanning execution traceability (O), evidence sufficiency (RK), and financial meta-awareness (B), combining record verification with consensus expert annotation. Of 1,070 trading points, 72.99% exhibit at least one audit gap; model-level rates range from52.2% to 91.2%, with evidence gaps most prevalent. Historical trade-filtering replay further shows thatportfolio outcomes are sensitive to these flagged trades. Decision-process auditing thus offers a verifiable complement to return-based evaluation of financial agents.", "content_hash": "e4dbb4c1f2900de835c5d4ec53584544073bfcc90c9ef6e9cde9c2fa56079263", "category": "Risk Management", "tags": ["execution", "risk"], "language": "en", "metadata": {"arxiv_categories": ["cs.CL", "cs.AI"]}, "one_line_summary": "AStockArena 用 8 项审计检查评估 13 个 LLM 在 A 股的 3198 次交易决策，72.99% 交易点存在至少一项审计缺口", "technical_summary": "针对实时交易基准只看累计收益和风险调整收益、无法判断交易是否真实上报、有无证据支持、是否与账户状态一致的问题，构建了 AStockArena A 股连续交易决策审计基准。对齐报告、交易请求、执行响应和账户状态，还原实际入账动作，并用执行可追溯性（O）、证据充分性（RK）、金融元认知（B）三类共 8 项检查进行审计，结合记录核验与专家共识标注。在相同市场条件和执行约束下评估 13 个开源/闭源模型、3,198 次连续决策。1,070 个交易点中 72.99% 至少存在一项审计缺口，模型层面缺口率 52.2%–91.2%，证据缺口最普遍；历史交易过滤回放显示组合结果对这些被标记交易敏感。", "key_points": ["1,070 个交易点中 72.99% 至少有一项审计缺口，模型缺口率 52.2%–91.2%，证据不足最普遍。", "需对齐报告、请求、执行响应与账户状态，8 项检查可复现，但依赖专家共识标注。", "仅覆盖 A 股、13 个模型；缺口与实盘亏损的因果未验证，回放未计交易成本与滑点。"], "quant_relevance": "风险建模；研究工具 / 工作流提效", "possible_use_case": "在 LLM 交易 agent 上线前搭建审计流水线：对齐交易日志与账户状态，按 O/RK/B 八项检查先剔除证据不足和不可追溯信号，再小资金实盘。", "limitations": "样本仅 A 股、13 个模型、1,070 个交易点；审计依赖专家标注，跨市场泛化未验证；回放未计交易成本与滑点，缺口率不等于策略亏损率。", "read_priority": "中", "key_figures_md": "- **Figure 1**：AStockArena 审计流程：报告、交易请求、执行响应与账户状态对齐\n- **Figure 2**：13 个模型在 1,070 个交易点上的审计缺口率分布（52.2%–91.2%）\n- **Figure 3**：历史交易过滤回放：组合结果对被标记交易的敏感性\n- [原文图表（HTML版）](https://arxiv.org/html/2611.00515)", "relevance_score": 5.6, "novelty_score": 9.355, "academic_score": 10.0, "discussion_score": 2.0, "actionable_score": 4.5, "final_score": 6.251, "display_title": "交易执行、风险、大模型研究论文", "tldr": "AStockArena 用 8 项审计检查评估 13 个 LLM 在 A 股的 3198 次交易决策，72.99% 交易点存在至少一项审计缺口", "core_value": "对你的量化工作帮助：把它拆成一个风险管理复现任务，先验证交易执行、风险、大模型是否真的带来样本外提升，再检查交易成本、数据泄漏和换手约束。", "key_points_list": ["1,070 个交易点中 72.99% 至少有一项审计缺口，模型缺口率 52.2%–91.2%，证据不足最普遍。", "需对齐报告、请求、执行响应与账户状态，8 项检查可复现，但依赖专家共识标注。", "仅覆盖 A 股、13 个模型；缺口与实盘亏损的因果未验证，回放未计交易成本与滑点。"], "reference_url": "http://arxiv.org/abs/2611.00515v1", "report_sections": ["ai_quant_tools"], "report_section_labels": ["AI 量化工具"], "category_label": "风险管理", "priority_label": "中", "source_type_label": "论文"}, {"id": "df99edbb6e83dcc2815f6228a26be00e76929e9fa9e7b17b6337131e0e9c0cec", "source": "arXiv", "source_type": "paper", "title": "Preference-Conditioned Group-Relative Policy Optimization for Terminally Constrained Multi-Objective Control", "url": "http://arxiv.org/abs/2610.41884v1", "authors": ["Md Ragib Rownak", "Sidra Ghayour Bhatti", "Qadeer Ahmed"], "published_at": "2026-10-30", "collected_at": "2026-11-03T03:50:37Z", "raw_text": "Multi-objective optimal control is commonly addressed by reinforcement learning with fixed scalarization weights, requiring a separate training run and constraint enforcement for each trade-off. This letter extends critic-free group-relative policy optimization to terminally constrained multi-objective control: a single preference-conditioned policy is trained over random preferences and returns a feasible approximation of the Pareto front in one run. Three structural results are established. Group normalization after scalarization preserves the prescribed preference, whereas per-objective normalization induces policy-dependent distortion; with pairwise distinct normalization scales, only single-objective preferences remain unchanged. A positive floor prevents the terminal-constraint multiplier from vanishing and renders the penalty exact when the floor exceeds a geometric multiplier. Deterministic terminal violation is bounded by expected stochastic violation plus a term depending on terminal-state curvature and action variance, so stochastic feasibility alone does not certify deterministic execution. On a heavy-duty range-extender powertrain with six stage costs and a terminal state-of-charge band, a representative training run places all 32 preference-grid solutions in band on six cycles inside and outside the training pool. Averaged over ten runs, the method yields more in-band solutions under deterministic execution than a critic-based conditioned baseline with the same terminal-constraint handling.", "abstract": "Multi-objective optimal control is commonly addressed by reinforcement learning with fixed scalarization weights, requiring a separate training run and constraint enforcement for each trade-off. This letter extends critic-free group-relative policy optimization to terminally constrained multi-objective control: a single preference-conditioned policy is trained over random preferences and returns a feasible approximation of the Pareto front in one run. Three structural results are established. Group normalization after scalarization preserves the prescribed preference, whereas per-objective normalization induces policy-dependent distortion; with pairwise distinct normalization scales, only single-objective preferences remain unchanged. A positive floor prevents the terminal-constraint multiplier from vanishing and renders the penalty exact when the floor exceeds a geometric multiplier. Deterministic terminal violation is bounded by expected stochastic violation plus a term depending on terminal-state curvature and action variance, so stochastic feasibility alone does not certify deterministic execution. On a heavy-duty range-extender powertrain with six stage costs and a terminal state-of-charge band, a representative training run places all 32 preference-grid solutions in band on six cycles inside and outside the training pool. Averaged over ten runs, the method yields more in-band solutions under deterministic execution than a critic-based conditioned baseline with the same terminal-constraint handling.", "content_hash": "9eade4dc4db549a450670912f54cdd702ee128ab0d7b740f23a98c4653ab013d", "category": "Portfolio Construction", "tags": ["execution", "optimization", "policy optimization", "reinforcement learning", "variance"], "language": "en", "metadata": {"arxiv_categories": ["eess.SY"]}, "one_line_summary": "偏好条件 GRPO 单次训练覆盖 32 个多目标偏好解，终端 SOC 约束全部落带，可迁移到组合权重优化", "technical_summary": "固定标量化权重的多目标 RL 每换一个权衡点就要重训并重新处理约束，训练成本随偏好网格线性增长。偏好条件化的无 critic 组相对策略优化在随机偏好上训练单个策略，经标量化后的组归一化保持指定偏好，并用正下界避免终端约束乘子消失。终端约束惩罚在下界超过几何乘子时变为精确惩罚；确定性终端违反被界定为期望随机违反加上终端状态曲率与动作方差项。在六阶段成本、终端 SOC 带的重载增程动力总成上，一次代表性训练让 32 个偏好网格解在训练池内外六个循环全部落带；十次运行平均，确定性执行下带内解数量超过同等终端约束处理的 critic 条件基线。原文未给金融数据、夏普、收益或交易成本指标。", "key_points": ["偏好条件 GRPO 单次训练覆盖 32 个偏好解，训练池内外六个循环全部落入终端 SOC 带，十次运行在带内解数量超过 critic 基线", "只需可仿真多目标控制环境与终端约束，无需 critic；迁移到组合需自建收益/风险/换手仿真和约束带", "仅在增程动力总成单一场景测试，无金融数据、交易成本与样本外市场检验；确定性违反上界依赖曲率和动作方差估计"], "quant_relevance": "组合构建 / 权重优化；风险建模。一次训练输出覆盖多个风险-收益偏好的策略，并把终端约束作为硬性带处理；终端违反上界可用于约束执行。", "possible_use_case": "把收益、波动、换手率和终端杠杆/回撤带设为多目标与终端约束，训练偏好条件策略，在 A 股日频组合上跑 32 个偏好网格的滚动样本外测试。", "limitations": "原文只在重载增程动力总成上验证，六个阶段成本与终端 SOC 带均非金融变量；没有交易成本、滑点、市场冲击和真实收益序列；十次运行仅比较带内解数量，未报告夏普、回撤或换手；确定性终端约束上界依赖终端状态曲率和动作方差，估计误差会影响实盘可行性。", "read_priority": "中", "key_figures_md": "- **Figure（原文未给出编号）**：32 个偏好网格解在训练池内外六个循环上的终端 SOC 带约束满足情况，原图见 https://arxiv.org/html/2610.41884\n- **Table（原文未给出编号）**：十次运行确定性执行下在带内解数量对比：本方法 vs critic-based conditioned baseline，原表见 https://arxiv.org/html/2610.41884\n- [原文图表（HTML版）](https://arxiv.org/html/2610.41884)", "relevance_score": 4.2, "novelty_score": 9.149, "academic_score": 10.0, "discussion_score": 2.0, "actionable_score": 6.5, "final_score": 6.19, "display_title": "交易执行、优化、强化学习、方差研究论文", "tldr": "偏好条件 GRPO 单次训练覆盖 32 个多目标偏好解，终端 SOC 约束全部落带，可迁移到组合权重优化", "core_value": "对你的量化工作帮助：把它拆成一个组合构建复现任务，先验证交易执行、优化、强化学习、方差是否真的带来样本外提升，再检查交易成本、数据泄漏和换手约束。", "key_points_list": ["偏好条件 GRPO 单次训练覆盖 32 个偏好解，训练池内外六个循环全部落入终端 SOC 带，十次运行在带内解数量超过 critic 基线", "只需可仿真多目标控制环境与终端约束，无需 critic；迁移到组合需自建收益/风险/换手仿真和约束带", "仅在增程动力总成单一场景测试，无金融数据、交易成本与样本外市场检验；确定性违反上界依赖曲率和动作方差估计"], "reference_url": "http://arxiv.org/abs/2610.41884v1", "report_sections": ["deep_learning_quant"], "report_section_labels": ["深度学习量化未来"], "category_label": "组合构建", "priority_label": "中", "source_type_label": "论文"}, {"id": "d8e35a04154912f38e84ffc181392ab245b26a561c43f2adfd63101a9e1a0f1b", "source": "Decrypt", "source_type": "cryp   <script>
    const payload = JSON.parse(document.getElementById('dashboard-data').textContent);
    const items = payload.items || [];
    const categoryLabels = payload.category_labels || {};
    const priorityLabels = payload.priority_labels || {};
    const sourceTypeLabels = payload.source_type_labels || {};
    const state = {
      query: '',
      section: 'All',
      category: 'All',
      sort: 'score',
      activeId: items[0]?.id || null,
    };

    const priorityRank = { High: 3, Medium: 2, Low: 1, '高': 3, '中': 2, '低': 1 };
    const $ = (id) => document.getElementById(id);

    // --- Feedback ---
    const _feedbackStore = JSON.parse(localStorage.getItem('quant-feedback') || '{}');
    function getFeedback(id) { return _feedbackStore[id] || 0; }
    function setFeedback(id, signal) {
      if (_feedbackStore[id] === signal) { delete _feedbackStore[id]; signal = 0; }
      else { _feedbackStore[id] = signal; }
      localStorage.setItem('quant-feedback', JSON.stringify(_feedbackStore));
      fetch('http://localhost:8080/feedback', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id, signal }),
      }).catch(() => {});
    }

    function init() {
      $('report-date').textContent = payload.report_date + ' - 主力源：arXiv / 知乎 / QuantML / 大型论坛 - 生成时间 ' + payload.generated_at;
      $('metric-items').textContent = items.length;
      $('metric-categories').textContent = new Set(items.map((item) => item.category)).size;
      $('metric-high').textContent = items.filter((item) => priorityLabel(item.read_priority) === '高').length;
      $('metric-avg').textContent = averageScore(items).toFixed(1);

      buildSectionControls();
      buildCategoryControls();
      buildSourceList();
      bindControls();
      render();
    }

    function bindControls() {
      $('search').addEventListener('input', (event) => {
        state.query = event.target.value.trim().toLowerCase();
        render();
      });
      $('category-select').addEventListener('change', (event) => {
        state.category = event.target.value;
        render();
      });
      $('section-select').addEventListener('change', (event) => {
        state.section = event.target.value;
        render();
      });
      $('sort-select').addEventListener('change', (event) => {
        state.sort = event.target.value;
        render();
      });
    }

    function buildCategoryControls() {
      const counts = countBy(items, 'category');
      const categories = Object.keys(counts).sort();
      const select = $('category-select');
      select.innerHTML = option('All', `全部细分标签 (${items.length})`) +
        categories.map((category) => option(category, `${categoryLabel(category)} (${counts[category]})`)).join('');

      const list = $('category-list');
      list.innerHTML = categoryButton('All', items.length) +
        categories.map((category) => categoryButton(category, counts[category])).join('');

      list.querySelectorAll('button').forEach((button) => {
        button.addEventListener('click', () => {
          state.category = button.dataset.category;
          select.value = state.category;
          if (state.category === 'All') {
            state.section = 'All';
            $('section-select').value = 'All';
          }
          render();
        });
      });
    }

    function buildSectionControls() {
      const counts = payload.section_counts || {};
      const sections = payload.sections || [];
      const select = $('section-select');
      select.innerHTML = option('All', `全部主线 (${items.length})`) +
        sections
          .filter((section) => counts[section.key])
          .map((section) => option(section.key, `${section.label} (${counts[section.key]})`))
          .join('');

      const list = $('section-list');
      list.innerHTML = sectionButton('All', '全部', items.length) +
        sections
          .filter((section) => counts[section.key])
          .map((section) => sectionButton(section.key, section.label, counts[section.key]))
          .join('');

      list.querySelectorAll('button').forEach((button) => {
        button.addEventListener('click', () => {
          state.section = button.dataset.section;
          select.value = state.section;
          if (state.section === 'All') {
            state.category = 'All';
            $('category-select').value = 'All';
          }
          render();
        });
      });
    }

    function buildSourceList() {
      const stats = payload.source_stats || {};
      const entries = Object.entries(stats)
        .filter(([source]) => !source.startsWith('fetched:'))
        .sort((a, b) => b[1] - a[1]);
      $('source-list').innerHTML = entries.length
        ? entries.map(([source, count]) => `<li><span>${escapeHtml(source)}</span><b>${count}</b></li>`).join('')
        : '<li><span>暂无来源统计</span><b>0</b></li>';
    }

    function render() {
      let visible = items.filter(matchesFilters);
      visible = sortItems(visible);
      if (!visible.some((item) => item.id === state.activeId)) {
        state.activeId = visible[0]?.id || null;
      }

      $('feed-title').textContent = feedTitle();
      $('result-count').textContent = `展示 ${visible.length} 条 - 两条主线每条最多 ${payload.report_config.max_items_per_category} 条`;
      renderSectionActive();
      renderCategoryActive();
      renderItems(visible);
      renderDetail(visible.find((item) => item.id === state.activeId) || visible[0]);
    }

    function matchesFilters(item) {
      const sectionMatch = state.section === 'All' || (item.report_sections || []).includes(state.section);
      if (!sectionMatch) return false;
      const categoryMatch = state.category === 'All' || item.category === state.category;
      if (!categoryMatch) return false;
      if (!state.query) return true;
      const haystack = [
        item.title,
        item.display_title,
        item.source,
        item.source_type,
        item.category,
        categoryLabel(item.category),
        sectionLabel(item.report_sections?.[0]),
        sourceTypeLabel(item.source_type),
        priorityLabel(item.read_priority),
        item.one_line_summary,
        item.technical_summary,
        item.quant_relevance,
        item.possible_use_case,
        item.tldr,
        item.core_value,
        ...(item.key_points_list || []),
        item.reference_url,
      ].join(' ').toLowerCase();
      return haystack.includes(state.query);
    }

    function sortItems(list) {
      return [...list].sort((a, b) => {
        if (state.sort === 'priority') {
          return (priorityRank[b.read_priority] || 0) - (priorityRank[a.read_priority] || 0)
            || b.final_score - a.final_score;
        }
        if (state.sort === 'source') {
          return a.source.localeCompare(b.source) || b.final_score - a.final_score;
        }
        return b.final_score - a.final_score;
      });
    }

    function renderCategoryActive() {
      document.querySelectorAll('.category-button').forEach((button) => {
        button.classList.toggle('active', button.dataset.category === state.category);
      });
    }

    function renderSectionActive() {
      document.querySelectorAll('.section-button').forEach((button) => {
        button.classList.toggle('active', button.dataset.section === state.section);
      });
    }

    function itemCard(item) {
      const sec = item.report_sections?.[0] || 'other';
      const sig = getFeedback(item.id);
      return `
        <article class="item ${item.id === state.activeId ? 'active' : ''}"
                 data-id="${escapeAttr(item.id)}"
                 data-section="${escapeAttr(sec)}">
          <div class="item-top">
            <h3>${escapeHtml(item.display_title || item.title)}</h3>
            <div class="score">${Number(item.final_score).toFixed(1)}</div>
          </div>
          <div class="meta">
            <span class="tag">${escapeHtml(categoryLabel(item.category))}</span>
            <span class="tag">${escapeHtml(item.source)}</span>
            <span class="tag">${escapeHtml(priorityLabel(item.read_priority))}</span>
          </div>
          ${readerFormat(item, true)}
          <div class="feedback-row">
            <button class="feedback-btn ${sig === 1 ? 'active-up' : ''}" data-feedback="1" title="有用">👍</button>
            <button class="feedback-btn ${sig === -1 ? 'active-down' : ''}" data-feedback="-1" title="跳过">👎</button>
            <span class="feedback-hint">${sig === 1 ? '已标记有用' : sig === -1 ? '已标记跳过' : ''}</span>
          </div>
        </article>
      `;
    }

    function sectionGroupHeader(section, count) {
      return `
        <div class="section-group-header" data-section="${escapeAttr(section.key)}">
          <span class="section-group-title">${escapeHtml(section.label)}</span>
          <span class="section-group-count">${count} 条</span>
        </div>
      `;
    }

    function renderItems(visible) {
      const container = $('items');
      if (!visible.length) {
        container.innerHTML = '<div class="empty">当前筛选条件下没有匹配内容。</div>';
        return;
      }

      let html = '';
      if (state.section === 'All') {
        // Group by section in defined order, with a header for each group
        const grouped = {};
        for (const item of visible) {
          const sec = item.report_sections?.[0] || 'other';
          if (!grouped[sec]) grouped[sec] = [];
          grouped[sec].push(item);
        }
        for (const section of (payload.sections || [])) {
          const group = grouped[section.key];
          if (!group || !group.length) continue;
          html += sectionGroupHeader(section, group.length);
          html += group.map((item) => itemCard(item)).join('');
        }
        // Append any items that fell into 'other' (shouldn't normally happen)
        if (grouped['other']?.length) {
          html += grouped['other'].map((item) => itemCard(item)).join('');
        }
      } else {
        html = visible.map((item) => itemCard(item)).join('');
      }

      container.innerHTML = html;
      container.querySelectorAll('.item').forEach((node) => {
        node.addEventListener('click', () => {
          state.activeId = node.dataset.id;
          render();
        });
      });
      container.querySelectorAll('.feedback-btn').forEach((btn) => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const itemNode = btn.closest('.item');
          setFeedback(itemNode.dataset.id, parseInt(btn.dataset.feedback, 10));
          render();
        });
      });
    }

    function renderDetail(item) {
      const detail = $('detail');
      if (!item) {
        detail.innerHTML = '<div class="empty">选择一条内容查看详情。</div>';
        return;
      }

      detail.innerHTML = `
        <h2>${escapeHtml(item.display_title || item.title)}</h2>
        <div class="meta">
          <span class="tag">${escapeHtml(categoryLabel(item.category))}</span>
          <span class="tag">${escapeHtml(sourceTypeLabel(item.source_type))}</span>
          <span class="tag">${escapeHtml(priorityLabel(item.read_priority))}</span>
        </div>

        ${readerFormat(item, false)}

        <div class="detail-block">
          <h3>评分拆解</h3>
          <div class="breakdown">
            ${bar('相关性', item.relevance_score)}
            ${bar('新颖度', item.novelty_score)}
            ${bar('学术性', item.academic_score)}
            ${bar('讨论度', item.discussion_score)}
            ${bar('可行动性', item.actionable_score)}
          </div>
        </div>

      `;
    }

    function readerFormat(item, compact) {
      const points = itemKeyPoints(item);
      return `
        <div class="reader-format ${compact ? 'compact' : ''}">
          <div class="reader-block">
            <h4>1. 这篇文章的太长不读</h4>
            <p>${escapeHtml(item.tldr || item.one_line_summary || '')}</p>
          </div>
          <div class="reader-block">
            <h4>2. 核心价值，对我量化的工作能够提供什么样的帮助</h4>
            <p>${escapeHtml(item.core_value || '')}</p>
          </div>
          <div class="reader-block">
            <h4>3. 关键核心点 / 论文或帖子摘要</h4>
            <ol>${points.map((point) => `<li>${escapeHtml(point)}</li>`).join('')}</ol>
          </div>
          <div class="reader-block">
            <h4>4. 原文链接</h4>
            ${referenceHtml(item)}
          </div>
        </div>
      `;
    }

    function itemKeyPoints(item) {
      const points = Array.isArray(item.key_points_list)
        ? item.key_points_list
        : (Array.isArray(item.key_points) ? item.key_points : []);
      const clean = points.filter(Boolean).slice(0, 3);
      return clean.length ? clean : ['需要打开原文进一步确认方法、数据和适用边界。'];
    }

    function referenceHtml(item) {
      const url = item.reference_url || '';
      if (!url) return '<p>暂无可打开链接</p>';
      return `
        <a class="reader-reference" href="${escapeAttr(url)}" target="_blank" rel="noopener noreferrer">打开原文</a>
        <small class="reference-url">${escapeHtml(url)}</small>
      `;
    }

    function bar(label, value) {
      const score = Number(value || 0);
      const width = Math.max(0, Math.min(100, score * 10));
      return `
        <div class="bar">
          <span>${label}</span>
          <div class="bar-track"><div class="bar-fill" style="width: ${width}%"></div></div>
          <b>${score.toFixed(1)}</b>
        </div>
      `;
    }

    function countBy(list, key) {
      return list.reduce((acc, item) => {
        acc[item[key]] = (acc[item[key]] || 0) + 1;
        return acc;
      }, {});
    }

    function averageScore(list) {
      if (!list.length) return 0;
      return list.reduce((sum, item) => sum + Number(item.final_score || 0), 0) / list.length;
    }

    function option(value, label) {
      return `<option value="${escapeAttr(value)}">${escapeHtml(label)}</option>`;
    }

    function sectionButton(section, label, count) {
      return `
        <button class="category-button section-button" type="button" data-section="${escapeAttr(section)}">
          <span>${escapeHtml(label)}</span>
          <span class="count">${count}</span>
        </button>
      `;
    }

    function categoryButton(category, count) {
      return `
        <button class="category-button" type="button" data-category="${escapeAttr(category)}">
          <span>${escapeHtml(category === 'All' ? '全部' : categoryLabel(category))}</span>
          <span class="count">${count}</span>
        </button>
      `;
    }

    function categoryLabel(category) {
      return categoryLabels[category] || category;
    }

    function sectionLabel(sectionKey) {
      const section = (payload.sections || []).find((item) => item.key === sectionKey);
      return section ? section.label : '其他';
    }

    function feedTitle() {
      const parts = [];
      if (state.section !== 'All') parts.push(sectionLabel(state.section));
      if (state.category !== 'All') parts.push(categoryLabel(state.category));
      return parts.length ? parts.join(' / ') : '今日情报';
    }

    function priorityLabel(priority) {
      return priorityLabels[priority] || priority;
    }

    function sourceTypeLabel(sourceType) {
      return sourceTypeLabels[sourceType] || sourceType;
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function escapeAttr(value) {
      return escapeHtml(value).replaceAll('`', '&#096;');
    }

    init();
  </script>
</body>
</html>
