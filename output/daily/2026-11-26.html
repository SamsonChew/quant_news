  <title>samson 量化情报台 - 2026-11-26</title>
  <style>
    :root {
      --bg: #ffffff;
      --panel: #ffffff;
      --ink: #202124;
      --muted: #5f6368;
      --line: #dadce0;
      --blue: #1a73e8;
      --red: #ea4335;
      --yellow: #fbbc04;
      --green: #34a853;
      --blue-soft: #e8f0fe;
      --green-soft: #e6f4ea;
      --yellow-soft: #fef7e0;
      --red-soft: #fce8e6;
      --shadow: 0 1px 2px rgba(60, 64, 67, 0.16), 0 8px 24px rgba(60, 64, 67, 0.10);
      --radius: 16px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background:
        radial-gradient(circle at top left, rgba(66, 133, 244, 0.07), transparent 30%),
        radial-gradient(circle at top right, rgba(251, 188, 4, 0.08), transparent 26%),
        var(--bg);
      color: var(--ink);
      font-family: "Google Sans", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    button,
    input,
    select {
      font: inherit;
    }

    .shell {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 5;
      display: grid;
      grid-template-columns: minmax(220px, 1fr) minmax(280px, 620px);
      gap: 24px;
      align-items: center;
      padding: 16px 32px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(18px);
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 12px;
      min-width: 0;
    }

    .brand h1 {
      display: flex;
      gap: 10px;
      align-items: center;
      margin: 0;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.02em;
      white-space: nowrap;
    }

    .brand h1::before {
      content: "";
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background:
        conic-gradient(from 0deg, var(--blue) 0 25%, var(--red) 0 50%, var(--yellow) 0 75%, var(--green) 0 100%);
      box-shadow: inset 0 0 0 7px #fff;
    }

    .date-pill {
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 170px 170px 150px;
      gap: 10px;
    }

    .control {
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel);
      color: var(--ink);
      padding: 0 12px;
      outline: none;
    }

    .control:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.14);
    }

    .layout {
      display: grid;
      grid-template-columns: 260px minmax(420px, 1fr) 420px;
      gap: 22px;
      padding: 24px 32px 36px;
    }

    .rail,
    .detail {
      position: sticky;
      top: 86px;
      height: calc(100vh - 112px);
      overflow: auto;
    }

    .rail,
    .detail,
    .feed {
      min-width: 0;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 18px;
    }

    .metric {
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--panel);
      padding: 12px;
      box-shadow: 0 1px 2px rgba(60, 64, 67, 0.08);
    }

    .metric:nth-child(1) { border-top: 3px solid var(--blue); }
    .metric:nth-child(2) { border-top: 3px solid var(--red); }
    .metric:nth-child(3) { border-top: 3px solid var(--yellow); }
    .metric:nth-child(4) { border-top: 3px solid var(--green); }

    .metric b {
      display: block;
      font-size: 22px;
      line-height: 1;
    }

    .metric span {
      display: block;
      margin-top: 7px;
      color: var(--muted);
      font-size: 12px;
    }

    .section-label {
      margin: 18px 0 8px;
      color: var(--blue);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .category-list {
      display: grid;
      gap: 7px;
    }

    .category-button {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
      width: 100%;
      min-height: 38px;
      border: 1px solid transparent;
      border-radius: 999px;
      background: transparent;
      color: var(--ink);
      padding: 8px 10px;
      text-align: left;
      cursor: pointer;
    }

    .category-button:hover,
    .category-button.active {
      border-color: transparent;
      background: var(--blue-soft);
      color: #174ea6;
    }

    .count {
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .source-list {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .source-list li {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
      font-size: 13px;
    }

    .feed-header {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      margin-bottom: 12px;
    }

    .feed-header h2 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
    }

    .result-count {
      color: var(--muted);
      font-size: 13px;
    }

    .items {
      display: grid;
      gap: 10px;
    }

    .section-group-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 2px 4px;
      margin-top: 10px;
      border-bottom: 2px solid var(--line);
    }

    .section-group-header:first-child {
      margin-top: 0;
    }

    .section-group-title {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .section-group-header[data-section="deep_learning_quant"] .section-group-title { color: var(--blue); }
    .section-group-header[data-section="ai_quant_tools"] .section-group-title { color: var(--green); }
    .section-group-header[data-section="daily_news"] .section-group-title { color: var(--yellow); }

    .section-group-count {
      color: var(--muted);
      font-size: 12px;
    }

    .item {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--panel);
      box-shadow: 0 1px 2px rgba(60, 64, 67, 0.10);
      padding: 18px;
      cursor: pointer;
      transition: border-color 140ms ease, transform 140ms ease, box-shadow 140ms ease;
    }

    .item::before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 4px;
      background: linear-gradient(90deg, var(--blue), var(--red), var(--yellow), var(--green));
    }

    .item[data-section="deep_learning_quant"]::before { background: var(--blue); }
    .item[data-section="ai_quant_tools"]::before { background: var(--green); }
    .item[data-section="daily_news"]::before { background: var(--yellow); }

    .item:hover,
    .item.active {
      border-color: #c6dafc;
      box-shadow: var(--shadow);
      transform: translateY(-2px);
    }

    .item-top {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 14px;
      align-items: start;
    }

    .item h3 {
      margin: 0;
      font-size: 16px;
      line-height: 1.28;
    }

    .score {
      min-width: 54px;
      border-radius: 999px;
      background: var(--blue-soft);
      color: #174ea6;
      padding: 6px 8px;
      text-align: center;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 10px 0;
      color: var(--muted);
      font-size: 12px;
    }

    .tag {
      border: 1px solid transparent;
      border-radius: 999px;
      background: #f1f3f4;
      padding: 3px 8px;
    }

    .tag:nth-child(1) { background: var(--blue-soft); color: #174ea6; }
    .tag:nth-child(2) { background: var(--green-soft); color: #137333; }
    .tag:nth-child(3) { background: var(--yellow-soft); color: #8a5a00; }
    .tag:nth-child(4) { background: var(--red-soft); color: #b3261e; }

    .summary {
      margin: 0;
      color: #30342d;
      font-size: 14px;
      line-height: 1.45;
    }

    .reference-link {
      display: inline-flex;
      width: fit-content;
      border-top: 1px solid var(--line);
      color: var(--blue);
      padding-top: 9px;
      text-decoration: none;
      font-size: 13px;
      font-weight: 800;
    }

    .reader-format {
      display: grid;
      gap: 10px;
      margin-top: 10px;
    }

    .reader-format.compact {
      gap: 8px;
    }

    .reader-block {
      border-top: 1px solid var(--line);
      padding-top: 9px;
    }

    .reader-block:first-child {
      border-top: 0;
      padding-top: 0;
    }

    .reader-block h4 {
      margin: 0 0 5px;
      color: var(--blue);
      font-size: 12px;
      font-weight: 700;
    }

    .reader-block p,
    .reader-block li {
      margin: 0;
      color: #30342d;
      font-size: 13px;
      line-height: 1.5;
    }

    .reader-block ol {
      margin: 0;
      padding-left: 18px;
    }

    .reader-reference {
      color: var(--blue);
      text-decoration: none;
      font-size: 13px;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .reference-url {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .detail {
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--panel);
      box-shadow: var(--shadow);
      padding: 18px;
    }

    .detail h2 {
      margin: 0 0 12px;
      font-size: 20px;
      line-height: 1.2;
    }

    .detail-block {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
    }

    .detail-block h3 {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.02em;
    }

    .detail-block p,
    .detail-block li {
      color: #30342d;
      font-size: 14px;
      line-height: 1.55;
    }

    .detail-block ul {
      margin: 0;
      padding-left: 18px;
    }

    .breakdown {
      display: grid;
      gap: 8px;
    }

    .bar {
      display: grid;
      grid-template-columns: 118px 1fr 40px;
      gap: 8px;
      align-items: center;
      color: var(--muted);
      font-size: 12px;
    }

    .bar-track {
      height: 7px;
      overflow: hidden;
      border-radius: 999px;
      background: #e7eadf;
    }

    .bar-fill {
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--blue), var(--green), var(--yellow), var(--red));
    }

    .open-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 38px;
      margin-top: 16px;
      border: 1px solid var(--blue);
      border-radius: var(--radius);
      color: var(--blue);
      text-decoration: none;
      padding: 0 12px;
      font-weight: 700;
    }

    .feedback-row {
      display: flex;
      gap: 6px;
      align-items: center;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--line);
    }

    .feedback-btn {
      background: #f1f3f4;
      border: 1px solid transparent;
      border-radius: 999px;
      padding: 3px 10px;
      font-size: 13px;
      cursor: pointer;
      transition: background 120ms, border-color 120ms;
    }

    .feedback-btn:hover { background: var(--blue-soft); }
    .feedback-btn.active-up { background: var(--green-soft); border-color: var(--green); }
    .feedback-btn.active-down { background: var(--red-soft); border-color: var(--red); }

    .feedback-hint {
      color: var(--muted);
      font-size: 11px;
    }

    .empty {
      border: 1px dashed var(--line);
      border-radius: var(--radius);
      padding: 28px;
      color: var(--muted);
      background: var(--panel);
    }

    @media (max-width: 1180px) {
      .layout {
        grid-template-columns: 220px 1fr;
      }

      .detail {
        position: static;
        grid-column: 1 / -1;
        height: auto;
      }
    }

    @media (max-width: 820px) {
      .topbar {
        grid-template-columns: 1fr;
        padding: 14px;
      }

      .brand {
        display: grid;
        gap: 4px;
      }

      .brand h1 {
        white-space: normal;
        font-size: 21px;
      }

      .controls {
        grid-template-columns: 1fr;
      }

      .layout {
        grid-template-columns: 1fr;
        padding: 14px;
      }

      .rail,
      .detail {
        position: static;
        height: auto;
      }

      .metric-grid {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>

mum-CVaR、Risk Parity、Most Diversified Portfolio）在主要股票指数上滚动窗口求解权重，排序后拟合 7 种秩-规模（rank-size）函数形式，用标准拟合优度加累积二阶 ε-随机占优（Second-order Stochastic Dominance 的 ε 参数化推广）作为选型判据；再把标定出的秩-规模参数喂给 Random Forest 分类器做逆向识别，评估采用能处理估计窗口重叠的 blocked cross-validation。结论是这些参数能把「最小风险」与「风险分散」两类策略分开，RP 与 MDP 能被识别，而 GMV 与 minimum-CVaR 生成的权重在参数空间里几乎不可分；这说明秩-规模参数可作为组合配置几何的紧凑描述子，但摘要未给出任何分类准确率、拟合 R² 或样本外表现数字。", "key_points": ["四个优化器（GMV、最小 CVaR、风险平价、MDP）× 7 种秩-规模设定了完整扫描，核心发现是秩-规模参数能把「最小风险型」（GMV/最小 CVaR）与「风险分散型」（RP/MDP）分开，但 GMV 与最小 CVaR 之间无法区分，原文未报告具体分类准确率。", "落地成本低：只需要权重序列（可用公开持仓、指数成分权重或自己跑优化器生成），秩-规模拟合与随机森林都是现成工具，blocked cross-validation 也给出了处理滚动窗口重叠的标准做法，容易复现。", "批判点在于只验证了「形状可分类」，没有验证「形状能赚钱」：全文没有夏普、收益、换手或交易成本数字，且 GMV/min-CVaR 不可分意味着逆向识别在最小方差类策略上失效，而这类恰是业界最常用的。"], "quant_relevance": "组合构建 / 权重优化；研究工具 / 工作流提效", "possible_use_case": "拿公募基金季报持仓或指数成分权重，先排序拟合秩-规模分布，再用文中 Random Forest 思路判定其更接近风险平价还是最小方差；也可把秩-规模参数作为监控指标，当某组合的权重形状参数漂移超过阈值时告警「优化器或约束被改动」。", "limitations": "摘要未披露任何样本外表现、分类准确率与拟合优度具体数值，所有结论停在定性层面；测试资产限于主要股票指数，跨资产（信用、商品、多资产）外推未验证；滚动窗口虽用 blocked cross-validation 处理重叠，但指数成分与时变协方差估计误差会直接污染权重排序；GMV 与 minimum-CVaR 的不可分性限制了逆向识别在实务中最常见策略上的用途；秩-规模拟合假设权重尾部服从特定函数形式，权重集中度高（等权/少数大权重）时可能失真。", "read_priority": "中", "key_figures_md": "- **图表见 arXiv HTML 全文（https://arxiv.org/html/2611.34171）**：7 种秩-规模设定在各股票指数滚动窗口上的拟合优度对比（R²/AIC 类指标），用于选出最优函数形式\n- **图表见 arXiv HTML 全文（https://arxiv.org/html/2611.34171）**：累积二阶 ε-随机占优曲线，量化各设定对精确占优条件的满足/违反程度\n- **图表见 arXiv HTML 全文（https://arxiv.org/html/2611.34171）**：Random Forest 逆向识别的混淆矩阵：RP 与 MDP 可分辨，GMV 与 minimum-CVaR 大量互串\n- [原文图表（HTML版）](https://arxiv.org/html/2611.34171)", "relevance_score": 8.0, "novelty_score": 9.78, "academic_score": 10.0, "discussion_score": 2.0, "actionable_score": 6.5, "final_score": 7.456, "display_title": "组合、风险、风险平价、方差研究论文", "tldr": "用 7 种秩-规模分布拟合四类组合权重几何，随机森林从权重反推优化器——风险平价与 MDP 可识别，GMV 与最小 CVaR 混淆", "core_value": "对你的量化工作帮助：把它拆成一个组合构建复现任务，先验证组合、风险、风险平价、方差是否真的带来样本外提升，再检查交易成本、数据泄漏和换手约束。", "key_points_list": ["四个优化器（GMV、最小 CVaR、风险平价、MDP）× 7 种秩-规模设定了完整 dynamics. Policy optimization Phase (AI contribution) employs intermediate asset state representations to derive optimal portfolio allocations via a self-supervised clipped-objective policy-learner, ensuring both effectiveness and computational efficiency. Extensive evaluations on three major index datasets from China's A-share market demonstrate that SCP's superior performance in balancing risk-return trade-offs compared to state-of-the-art baselines. Exploratory and ablation studies further validate the contributions of SCP's key components.", "abstract": "Portfolio management involves balancing diverse financial assets, a critical yet challenging task in quantitative trading. Although deep reinforcement learning has emerged as an active research domain for solving complex sequential decision-making problems over the past decade, deploying reinforcement learning frameworks in non-stationary financial markets raises formidable difficulties. Most existing reinforcement learning-based portfolio management models fail to account for tick-level intraday market dynamics (e.g., order flow imbalances and liquidity fluctuations), which reflect rapid capital movements. Simultaneously, these models suffer from unstable learning processes due to reinforcement learning's inherent high variance. This paper presents a Self-supervised Clipped-objective Portfolio management framework (SCP), which addresses these limitations through a two-phase architecture. Market feature integration phase (application contribution) integrates micro-level market microstructure patterns with macro-level financial indicators to enhance sensitivity to intraday asset trend dynamics. Policy optimization Phase (AI contribution) employs intermediate asset state representations to derive optimal portfolio allocations via a self-supervised clipped-objective policy-learner, ensuring both effectiveness and computational efficiency. Extensive evaluations on three major index datasets from China's A-share market demonstrate that SCP's superior performance in balancing risk-return trade-offs compared to state-of-the-art baselines. Exploratory and ablation studies further validate the contributions of SCP's key components.", "content_hash": "07b5c196877c3919fd8868dd16cb31d961893556bcb4353ccbb5a207bedb6b0e", "category": "Portfolio Construction", "tags": ["liquidity", "microstructure", "optimization", "policy optimization", "portfolio", "reinforcement learning", "risk", "variance"], "language": "en", "metadata": {"arxiv_categories": ["cs.LG"]}, "one_line_summary": "两阶段自监督裁剪目标 RL 框架 SCP：融合盘口微观结构+宏观指标做 A 股指数组合管理，摘要宣称风险收益权衡超越 SOTA 基线但无具体数字", "technical_summary": "现有 RL 组合模型忽略盘口级日内微观结构（订单流不平衡、流动性波动），且训练方差大、不稳定。SCP 用两阶段解决：第一阶段把 tick 级微观结构特征与宏观财务指标融合进状态表示；第二阶段在中间资产状态表示上用自监督裁剪目标策略学习器直接输出组合权重。在 A 股三大指数数据集上，摘要宣称其在风险收益权衡上优于 SOTA 基线，并用消融实验验证关键模块作用——但提供的摘要未披露夏普、年化收益、最大回撤等任何具体数字。", "key_points": ["两阶段框架融合 tick 级微观结构与宏观指标，用裁剪目标策略学习输出权重；但原文缺乏量化指标，结论待复核。", "需要逐笔/分钟盘口数据（订单流不平衡、流动性）加 A 股指数成分股，实现难度中高，可复现性受数据与超参披露限制。", "仅测中国 A 股三大指数，摘要无回测区间、交易成本假设与样本外验证，RL 高方差下过拟合风险高。"], "quant_relevance": "组合构建 / 权重优化；风险建模", "possible_use_case": "在沪深 300/中证 500 成分股上，用公开逐笔或分钟数据复现『订单流不平衡+流动性』特征管线作为状态输入，跑日频再平衡回测对比等权/均值方差基线。", "limitations": "本次仅提供摘要，无夏普、收益、回撤、参数规模等任何量化证据；未披露回测区间、调仓频率、交易成本与滑点假设；仅单一 A 股市场，缺乏跨市场样本外验证；裁剪目标 RL 仍存在高方差与过拟合风险。原图见 https://arxiv.org/html/2611.33652 ，但图表内容未包含在输入中。", "read_priority": "低", "key_figures_md": "", "relevance_score": 7.5, "novelty_score": 9.78, "academic_score": 10.0, "discussion_score": 2.0, "actionable_score": 6.5, "final_score": 7.306, "display_title": "流动性、市场微观结构、优化、组合研究论文", "tldr": "两阶段自监督裁剪目标 RL 框架 SCP：融合盘口微观结构+宏观指标做 A 股指数组合管理，摘要宣称风险收益权衡超越 SOTA 基线但无具体数字", "core_value": "对你的量化工作帮助：把它拆成一个组合构建复现任务，先验证流动性、市场微观结构、优化、组合是否真的带来样本外提升，再检查交易成本、数据泄漏和换手约束。", "key_points_list": ["两阶段框架融合 tick 级微观结构与宏观指标，用裁剪目标策略学习输出权重；但原文缺乏量化指标，结论待复核。", "需要逐笔/分钟盘口数据（订单流不平衡、流动性）加 A 股指数成分股，实现难度中高，可复现性受数据与超参披露限制。", "仅测中国 A 股三大指数，摘要无回测区间、交易成本假设与样本外验证，RL 高方差下过拟合风险高。"], "reference_url": "http://arxiv.org/abs/2611.33652v1", "report_sections": ["deep_learning_quant"], "report_section_labels": ["深度学习量化未来"], "category_label": "组合构建", "priority_label": "低", "source_type_label": "论文"}, {"id": "1be433cb10f66279233be532fa824632a04c3713ead1ac237fb7a01536144860", "source": "arXiv", "source_type": "paper", "title": "Sequential Portfolio Optimizer (SPO-CPU and SPO-GPU): C++ Interior-Point Solvers and Differentiable Layers for Quadratic Cone Programs", "url": "http://arxiv.org/abs/2611.34590v1", "authors": ["Fan Zhao", "Yan Zaretskiy", "Yuwen Chen", "Jerry Shi"], "published_at": "2026-11-25", "collected_at": "2026-11-26T04:42:57Z", "raw_text": "Quadratic cone programs (QCPs) are a practical canonical form for convex optimization, including parametric portfolio problems that must be re-solved to high accuracy as market data change. We present Sequential Portfolio Optimizer (SPO), with SPO-CPU and SPO-GPU the C++ and CUDA realizations of the Clarabel homogeneous-embedding interior-point method. Clarabel is a registered trademark; SPO is our name for these implementations. Each exposes a forward optimizer and an in-solver differentiable layer. The Mehrotra algorithm is unchanged. The contribution is an implementation stack: a reduced two-block vector-Jacobian product with gradients in the original coordinates; a documented variant of the Chen--Goulart--Jones smoothing warm start, applied in equilibrated coordinates; and a GIL-free GPU batch architecture whose isolated throughput is at parity with a warm solver loop up to $B{=}16$. On an RTX A6000, subsequent solves of a $5000$-asset factor-model QP average $24$ ms on SPO-GPU, compared with $98$ ms on Clarabel.rs and $122$ ms on single-thread Gurobi; at $10{,}000$ assets the corresponding GPU time is $59$ ms against $439$ ms for one-thread Mosek. Clarabel.rs, SPO-CPU, and SPO-GPU agree pairwise to $2.2{\\times}10^{-7}$ in relative objective on this family. Against a CVXPYLayers baseline driven by Clarabel, the GPU layer reproduces the solution and the return-gradient on a $5000$-asset factor QP/SOCP, while a subsequent forward-plus-backward step is $101$--$137\\times$ faster at $5000$ assets (and $17$--$30\\times$ at $1000$ assets). The smoothing warm start reduces QP rebalance iterations but can increase them on a large GPU second-order cone. Wall-clock rankings apply to the factor-model family only; an $18$-problem Maros--Mészáros subset is reported as a cross-check. We do not claim a speedup over CuClarabel, and the batch architecture is not a measured throughput improvement.", "abstract": "Quadratic cone programs (QCPs) are a practical canonical form for convex optimization, including parametric portfolio problems that must be re-solved to high accuracy as market data change. We present Sequential Portfolio Optimizer (SPO), with SPO-CPU and SPO-GPU the C++ and CUDA realizations of the Clarabel homogeneous-embedding interior-point method. Clarabel is a registered trademark; SPO is our name for these implementations. Each exposes a forward optimizer and an in-solver differentiable layer. The Mehrotra algorithm is unchanged. The contribution is an implementation stack: a reduced two-block vector-Jacobian product with gradients in the original coordinates; a documented variant of the Chen--Goulart--Jones smoothing warm start, applied in equilibrated coordinates; and a GIL-free GPU batch architecture whose isolated throughput is at parity with a warm solver loop up to $B{=}16$. On an RTX A6000, subsequent solves of a $5000$-asset factor-model QP average $24$ ms on SPO-GPU, compared with $98$ ms on Clarabel.rs and $122$ ms on single-thread Gurobi; at $10{,}000$ assets the corresponding GPU time is $59$ ms against $439$ ms for one-thread Mosek. Clarabel.rs, SPO-CPU, and SPO-GPU agree pairwise to $2.2{\\times}10^{-7}$ in relative objective on this family. Against a CVXPYLayers baseline driven by Clarabel, the GPU layer reproduces the solution and the return-gradient on a $5000$-asset factor QP/SOCP, while a subsequent forward-plus-backward step is $101$--$137\\times$ faster at $5000$ assets (and $17$--$30\\times$ at $1000$ assets). The smoothing warm start reduces QP rebalance iterations but can increase them on a large GPU second-order cone. Wall-clock rankings apply to the factor-model family only; an $18$-problem Maros--Mészáros subset is reported as a cross-check. We do not claim a speedup over CuClarabel, and the batch architecture is not a measured throughput improvement.", "content_hash": "0206de7d6fd2f59bf9905b6b3b9cadbb08c11c802883481319d70ae07aa64876", "category": "Portfolio Construction", "tags": ["factor", "market data", "optimization", "portfolio"], "language": "en", "metadata": {"arxiv_categories": ["math.OC"]}, "one_line_summary": "用 CUDA 重写 Clarabel 内点法，5000 资产因子模型 QP 单次求解 24ms，比 Clarabel.rs 快 4.1 倍、比单线程 Gurobi 快 5.1 倍", "technical_summary": "解决的是参数化组合优化在行情变动后需要高频、高精度重解的问题，只靠通用求解器（Gurobi/Mosek）单线程跑不动。做法是把 Clarabel 的齐次嵌入内点法（Mehrotra 步骤不变）改写成 C++（SPO-CPU）和 CUDA（SPO-GPU）两套实现，并加入三个工程件：两分块降维的 vector-Jacobian product（梯度仍回到原始坐标）、Chen–Goulart–Jones 平滑 warm start 的均衡坐标变体、以及无 GIL 的 GPU 批处理架构。性能上：RTX A6000 上 5000 资产因子模型 QP 后续求解平均 24ms，对比 Clarabel.rs 的 98ms 和单线程 Gurobi 的 122ms；10000 资产时 GPU 59ms，对比单线程 Mosek 439ms。正确性上三种实现（Clarabel.rs / SPO-CPU / SPO-GPU）在该问题族上目标值两两一致到 2.2e-7 相对误差。可微层对比 CVXPYLayers + Clarabel 基线，能复现解和收益梯度，且在 5000 资产上前向+反向一步快 101–137 倍（1000 资产上快 17–30 倍）。", "key_points": ["5000 资产因子 QP 在 RTX A6000 上单次求解 24ms，Clarabel.rs 98ms，单线程 Gurobi 122ms", "C++/CUDA 实现 Clarabel 并暴露可微层，10000 资产 59ms，三实现目标值一致到 2.2e-7", "warm start 在大型 GPU 二阶锥上反而增加迭代；仅测因子模型族，未计实盘成本"], "quant_relevance": "组合构建 / 权重优化；研究工具 / 工作流提效", "possible_use_case": "在日频/盘中再平衡回测中替换 CVXPYLayers+Clarabel 的求解层：把均值-方差或因子模型 QP 写成 QCP 喂给 SPO-GPU，直接拿几十毫秒级的解，再用内嵌可微层算 d(权重)/d(预期收益)，做 alpha 衰减敏感度和组合权重稳定性诊断。", "limitations": "提速结论只在因子模型问题族成立，作者自己在摘要里声明不对 CuClarabel 声称加速、批处理架构也不是实测吞吐提升；平滑 warm start 在大型 GPU 二阶锥上迭代数反而上升；需要 RTX A6000 级 GPU 与 CUDA 栈，工程接入成本高于 pip 装一个求解器；全文没有样本外组合表现、换手率和交易成本测算，2.2e-7 的一致性只覆盖该问题族，不能外推到所有 QP/SOCP 实例。", "read_priority": "高", "key_figures_md": "- **计时基准表（5000 资产因子模型 QP）**：SPO-GPU 24ms vs Clarabel.rs 98ms vs 单线程 Gurobi 122ms\n- **计时基准表（10000 资产）**：SPO-GPU 59ms vs 单线程 Mosek 439ms\n- **可微层对比实验（5000 资产 QP/SOCP）**：前向+反向一步比 CVXPYLayers 快 101–137 倍，1000 资产上快 17–30 倍\n- **交叉校验（18 问题 Maros–Mészáros 子集）**：非因子模型问题族上的 wall-clock 排名交叉验证\n- [原文图表（HTML版）](https://arxiv.org/html/2611.34590)", "relevance_score": 6.1, "novelty_score": 9.78, "academic_score": 10.0, "discussion_score": 2.0, "actionable_score": 7.5, "final_score": 7.086, "display_title": "因子、市场数据、优化、组合研究论文", "tldr": "用 CUDA 重写 Clarabel 内点法，5000 资产因子模型 QP 单次求解 24ms，比 Clarabel.rs 快 4.1 倍、比单线程 Gurobi 快 5.1 倍", "core_value": "对你的量化工作帮助：把它拆成一个组合构建复现任务，先验证因子、市场数据、优化、组合是否真的带来样本外提升，再检查交易成本、数据泄漏和换手约束。", "key_points_list": ["5000 资产因子 QP 在 RTX A6000 上单次求解 24ms，Clarabel.rs 98ms，单线程 Gurobi 122ms", "C++/CUDA 实现 Clarabel 并暴露可微层，10000 资产 59ms，三实现目标值一致到 2.2e-7", "warm start 在大型 GPU 二阶锥上反而增加迭代；仅测因子模型族，未计实盘成本"], "reference_url": "http://arxiv.org/abs/2611.34590v1", "report_sections": ["ai_quant_tools"], "report_section_labels": ["AI 量化工具"], "category_label": "组合构建", "priority_label": "高", "source_type_label": "论文"}, {"id": "7f2423924d661766cf715e05eff156c8397e5496bd70d64b33c394db19620e53", "source": "arXiv", "source_type": "paper", "title": "Efficient Data Fusion in Distributionally Robust Optimization", "url": "http://arxiv.org/abs/2611.34495v1", "authors": ["Buse Şen", "Aras Selvi", "Jean Pauphilet", "Daniel Kuhn"], "published_at": "2026-11-25", "collected_at": "2026-11-26T04:42:57Z", "raw_text": "Decisions under uncertainty increasingly rest on fragmented evidence, such as samples from related but different populations, privacy-protected summary statistics, or complementary statistical descriptions of the same data. Distributionally robust optimization (DRO) can fuse such evidence by constructing one ambiguity set per source and hedging against all distributions in the intersection of these sets. This fusion approach is less conservative than aggregating the sources into a single ambiguity set, but it is computationally demanding. Exact reformulations grow exponentially with the number of sources, and even deciding whether the intersection is nonempty is NP-hard. We show that fusion DRO admits an exact reformulation in which the ambiguity sets are coupled only through functional Lagrange multipliers. Restricting these multipliers to affine decision rules yields upper bounds that decompose across the ambiguity sets, are exact for quadratic losses over Wasserstein balls around Gaussian references, and provably dominate aggregation-based relaxations such as Minkowski sums and balls around mixtures. The approximations admit finite conic reformulations in important special cases and subgradient methods for weakly convex losses, which makes fusion DRO applicable to neural network training. In portfolio, newsvendor, and binary classification experiments, the affine approximation stays close to the exact value wherever the latter is computable, scales far better than exact methods, and outperforms aggregation-based benchmarks out-of-sample.", "abstract": "Decisions under uncertainty increasingly rest on fragmented evidence, such as samples from related but different populations, privacy-protected summary statistics, or complementary statistical descriptions of the same data. Distributionally robust optimization (DRO) can fuse such evidence by constructing one ambiguity set per source and hedging against all distributions in the intersection of these sets. This fusion approach is less conservative than aggregating the sources into a single ambiguity set, but it is computationally demanding. Exact reformulations grow exponentially with the number of sources, and even deciding whether the intersection is nonempty is NP-hard. We show that fusion DRO admits an exact reformulation in which the ambiguity sets are coupled only through functional Lagrange multipliers. Restricting these multipliers to affine decision rules yields upper bounds that decompose across the ambiguity sets, are exact for quadratic losses over Wasserstein balls around Gaussian references, and provably dominate aggregation-based relaxations such as Minkowski sums and balls around mixtures. The approximations admit finite conic reformulations in important special cases and subgradient methods for weakly convex losses, which makes fusion DRO applicable to neural network training. In portfolio, newsvendor, and binary classification experiments, the affine approximation stays close to the exact value wherever the latter is computable, scales far better than exact methods, and outperforms aggregation-based benchmarks out-of-sample.", "content_hash": "91efa07d9b2b6c873c64a576cf004f772db749105b10b1b3c01a8d9139344f73", "category": "Portfolio Construction", "tags": ["hedging", "neural", "optimization", "portfolio"], "language": "en", "metadata": {"arxiv_categories": ["math.OC", "cs.LG"]}, "one_line_summary": "仿射决策规则近似融合 DRO：组合、报童、二分类实验样本外跑赢聚合基准，计算量远低于精确解", "technical_summary": "把每个数据源单独构造成 Wasserstein 模糊集，再对交集做稳健优化，比把多源合并成单个模糊集更不保守，但精确重构随来源数指数增长，甚至判断交集非空是 NP-hard。核心技巧是精确重构中模糊集只通过函数型 Lagrange 乘子耦合；把乘子限制为仿射决策规则，得到可按模糊集分解的上界。该上界在“高斯参考分布周围的 Wasserstein 球 + 二次损失”下精确，并理论支配 Minkowski 和、混合球等聚合松弛；弱凸损失可用次梯度法，重要特例有有限锥重构。组合、报童、二分类实验中，仿射近似在可算精确值的场景接近精确解，扩展性远好于精确法，样本外优于聚合基准；摘要未披露夏普、收益、准确率的具体数值。", "key_points": ["仿射 Lagrange 乘子上界在二次损失+高斯 Wasserstein 球下精确，并支配 Minkowski 和/混合球；原文缺乏样本外夏普等量化指标。", "每个数据源需构造 Wasserstein 球与参考分布；弱凸损失可用次梯度法，特例有有限锥重构，复现依赖凸优化求解器。", "仿射近似仅给上界，非二次/非高斯损失不保证精确；摘要未报告交易成本、调参和样本外夏普，多源交集可能为空。"], "quant_relevance": "组合构建 / 权重优化；风险建模", "possible_use_case": "在组合优化中把行情、基本面、另类数据各自建 Wasserstein 模糊集，用仿射乘子近似求权重，替换现有单模糊集 DRO 做样本外对比。", "limitations": "仿射决策规则只给上界，非二次/非高斯损失不保证精确；实验仅摘要级，未披露交易成本、调参和样本外夏普；多源交集可能为空或计算仍重；需与简单聚合基准做独立复现。", "read_priority": "中", "key_figures_md": "- **arXiv HTML 版**：组合、报童、二分类实验的样本外对比与计算扩展性图表；具体图号需查看 https://arxiv.org/html/2611.34495\n- [原文图表（HTML版）](https://arxiv.org/html/2611.34495)", "relevance_score": 6.1, "novelty_score": 9.78, "academic_score": 10.0, "discussion_score": 2.0, "actionable_score": 6.5, "final_score": 6.886, "display_title": "优化、组合研究论文", "tldr": "仿射决策规则近似融合 DRO：组合、报童、二分类实验样本外跑赢聚合基准，计算量远低于精确解", "core_value": "对你的量化工作帮助：把它拆成一个组合构建复现任务，先验证优化、组合是否真的带来样本外提升，再检查交易成本、数据泄漏和换手约束。", "key_points_list": ["仿射 Lagrange 乘子上界在二次损失+高斯 Wasserstein 球下精确，并支配 Minkowski 和/混合球；原文缺乏样本外夏普等量化指标。", "每个数据源需构造 Wasserstein 球与参考分布；弱凸损失可用次梯度法，特例有有限锥重构，复现依赖凸优化求解器。", "仿射近似仅给上界，非二次/非高斯损失不保证精确；摘要未报告交易成本、调参和样本外夏普，多源交集可能为空。"], "reference_url": "http://arxiv.org/abs/2611.34495v1", "report_sections": ["deep_learning_quant"], "report_section_labels": ["深度学习量化未来"], "category_label": "组合构建", "priority_label": "中", "source_type_label": "论文"}, {"id": "981fb9ea52df2b8e458709fd506f7ec57f8b5be0ec734249c69dcc9d31d1bfbf", "source": "arXiv", "source_type": "paper", "title": "How LLM Agents Reshape Financial Knowledge Graphs: A Survey", "url": "http://arxiv.org/abs/2611.33584v1", "authors": ["Yunbai Zhang", "Heze Ma", "Nan Jiang", "Wenxuan Liu", "Ze Chen", "Yunyi Gao", "Winnie Gao", "Han-Tai Shiao"], "published_at": "2026-11-25", "collected_at": "2026-11-26T04:42:39Z", "raw_text": "Financial knowledge graphs (KGs) link information across sources to support risk assessment, investment research, asset recommendations, and forecasting. Large language models (LLMs) help build these graphs by extracting relationships from text and matching entities across records. Yet a workflow may still prescribe which sources to consult and which checks to run. If the chosen sources lack relevant evidence, even accurate extraction can leave a financial question unanswered. LLM agents can adapt the workflow as evidence emerges. They use the graph and earlier findings to decide where to look next, which claims to verify, and whether to update a record for later use. This is the first survey devoted to how LLM agents reshape the construction, maintenance, and use of financial KGs. Our taxonomy covers Knowledge Graph Construction, Temporal Evolution, Verification, Reconciliation, and Admission, Adaptive Acquisition, and Knowledge Graph Usage. We examine how studies evaluate graph quality, agents' use of evidence, financial task outcomes, and reliability over time. These evaluations show that agents can recover evidence missed in an initial search and revise records as new information arrives. Three questions remain unresolved. How can an agent tell whether it has enough evidence for a financial decision? After a record is corrected, how can the agent identify which earlier conclusions need to change? Which relationships and rules can it reuse in a new graph or domain?", "abstract": "Financial knowledge graphs (KGs) link information across sources to support risk assessment, investment research, asset recommendations, and forecasting. Large language models (LLMs) help build these graphs by extracting relationships from text and matching entities across records. Yet a workflow may still prescribe which sources to consult and which checks to run. If the chosen sources lack relevant evidence, even accurate extraction can leave a financial question unanswered. LLM agents can adapt the workflow as evidence emerges. They use the graph and earlier findings to decide where to look next, which claims to verify, and whether to update a record for later use. This is the first survey devoted to how LLM agents reshape the construction, maintenance, and use of financial KGs. Our taxonomy covers Knowledge Graph Construction, Temporal Evolution, Verification, Reconciliation, and Admission, Adaptive Acquisition, and Knowledge Graph Usage. We examine how studies evaluate graph quality, agents' use of evidence, financial task outcomes, and reliability over time. These evaluations show that agents can recover evidence missed in an initial search and revise records as new information arrives. Three questions remain unresolved. How can an agent tell whether it has enough evidence for a financial decision? After a record is corrected, how can the agent identify which earlier conclusions need to change? Which relationships and rules can it reuse in a new graph or domain?", "content_hash": "1f2fcb34cefac8e33891fbf2ffe37694be85a0dcb9c51df49fb9bc2dd076b24c", "category": "LLM / Agents for Quant", "tags": ["agent", "forecasting", "llm", "risk"], "language": "en", "metadata": {"arxiv_categories": ["q-fin.GN"]}, "one_line_summary": "首篇 LLM agent × 金融知识图谱综述：给出 6 类任务分类法，指出证据充分性判断、记录修正后的结论回溯、跨域规则复用三个问题未解", "technical_summary": "要解决的问题是：金融知识图谱需要跨来源链接信息以支撑风险评估、投研、资产推荐和预测，LLM 能从文本抽取关系、做实体对齐，但固定的抽取工作流无法应对“选定的信息源里根本没有相关证据”的情况——抽取再准也答不出问题。做法是把 LLM agent 引入流程，让它根据已有图谱和先前结论决定下一步查哪里、验证哪些断言、是否回写记录，从而把静态抽取管线变成自适应获取管线。综述据此建立六层分类法：图谱构建、时序演化、验证、对齐与准入、自适应获取、图谱使用，并从图质量、agent 对证据的使用、金融任务表现、跨时间可靠性四个角度梳理评测方式。定性结论是 agent 能找回初次检索遗漏的证据、并随新信息到达修正记录；但原文未给出任何精度、夏普、成本或数据集规模的数字。", "key_points": ["分类法把金融 KG 的 agent 化拆成 6 类任务，其中「自适应获取」是关键增量：agent 依据图谱和既有结论改写检索路径，而非执行预设来源清单；原文未给任何量化指标。", "可用性集中在数据侧：需要实体对齐 + 三元组回写 + 图数据库，且要记录每条边的证据出处；综述层面无开源实现，落地需自建抽取与校验管线，工程量大于模型调参。", "全文仅摘要可读，无数据集规模、无抽取精度、无延迟与 token 成本；且 KG 上游的实体对齐错误会沿「关系→因子」链路放大，缺错误传播的量化分析。"], "quant_relevance": "数据工程 / 研究工具与工作流提效：为「从公告、研报、新闻自动抽取实体关系建图」这条数据管线给出任务分解和评测维度，可直接用来设计内部知识图谱 agent 的模块划分。", "possible_use_case": "用 agent 从 A 股年报和临时公告中抽取「供应商—客户—股东—担保」关系写入图库，按季度增量更新，构造供应链传染与关联方风险因子，在中证 800 成分股上先跑分位数回测，检验高关联度组在下游暴雷事件前 20 个交易日是否有超额回撤。", "limitations": "只拿到摘要：无数据集名称、无抽取 F1、无任务级收益或夏普、无图表，原图需查 arXiv HTML 版 https://arxiv.org/html/2611.33584 ；综述本身不含可复现代码。三个未解问题（证据是否充分、记录修正后哪些旧结论要改、规则能否跨域复用）恰好是实盘最致命的环节——没有结论回溯机制，图谱修正后历史因子值会被静默改写，导致回测不可复现。原文缺乏量化证据，摘要基于定性描述。", "read_priority": "低", "key_figures_md": "", "relevance_score": 6.1, "novelty_score": 9.78, "academic_score": 10.0, "discussion_score": 2.0, "actionable_score": 6.5, "final_score": 6.886, "display_title": "预测、大模型、风险、知识图谱研究论文", "tldr": "首篇 LLM agent × 金融知识图谱综述：给出 6 类任务分类法，指出证据充分性判断、记录修正后的结论回溯、跨域规则复用三个问题未解", "core_value": "对你的量化工作帮助：把它拆成一个量化大模型 / 智能体复现任务，先验证预测、大模型、风险、知识图谱是否真的带来样本外提升，再检查交易成本、数据泄漏和换手约束。", "key_points_list": ["分类法把金融 KG 的 agent 化拆成 6 类任务，其中「自适应获取」是关键增量：agent 依据图谱和既有结论改写检索路径，而非执行预设来源清单；原文未给任何量化指标。", "可用性集中在数据侧：需要实体对齐 + 三元组回写 + 图数据库，且要记录每条边的证据出处；综述层面无开源实现，落地需自建抽取与校验管线，工程量大于模型调参。", "全文仅摘要可读，无数据集规模、无抽取精度、无延迟与 token 成本；且 KG 上游的实体对齐错误会沿「关系→因子」链路放大，缺错误传播的量化分析。"], "reference_url": "http://arxiv.org/abs/2611.33584v1", "report_sections": ["ai_quant_tools"], "report_section_labels": ["AI 量化工具"], "category_label": "量化大模型 / 智能体", "priority_label": "低", "source_type_label": "论文"}, {"id": "314efdf46e4cd3fa0b1cafd80a9c162c71c33a5b4a14f25048b42475b2d94188", "source": "arXiv", "source_type": "paper", "title": "Graph-Informed Deep Factor Model for Statistical Arbitrage", "url": "http://arxiv.org/abs/2611.34209v1", "authors": ["Evelyn Zhu", "Mucheng Zhu", "Brendan Martin", "Mihai Cucuringu"], "published_at": "2026-11-25", "collected_at": "2026-11-26T04:42:39Z", "raw_text": "Statistical arbitrage exploits temporary mispricings between similar assets in the cross-section of daily equity returns. We propose a nonlinear single-factor model, called a Graph-Informed Deep Factor (GIDF) model, whose per-stock loadings have cross-sectional dependence conditional on a latent network. The network captures cross-sectional return dependencies that remain after removing the dominant eigenmodes of the return correlation matrix, thereby providing a complementary representation of inter-asset relationships beyond the leading sources of systematic variation. It is reconstructed from data using a novel method that we call the Factor-Adjusted Dynamic EWMA (FADE). A signed-edge graph attention mechanism then combines the reconstructed network with exogenous firm characteristics and macroeconomic variables. This graph-informed specification is designed to produce residuals that more effectively separate idiosyncratic mean-reverting dynamics from cross-sectional co-movements, yielding economically useful signals for daily statistical arbitrage. In a comprehensive empirical study on daily U.S. equities from 2015 to 2024, GIDF outperforms classical factor models and state-of-the-art deep learning methods, achieving an out-of-sample Sharpe ratio of 1.78 under the canonical Avellaneda--Lee rule.", "abstract": "Statistical arbitrage exploits temporary mispricings between similar assets in the cross-section of daily equity returns. We propose a nonlinear single-factor model, called a Graph-Informed Deep Factor (GIDF) model, whose per-stock loadings have cross-sectional dependence conditional on a latent network. The network captures cross-sectional return dependencies that remain after removing the dominant eigenmodes of the return correlation matrix, thereby providing a complementary representation of inter-asset relationships beyond the leading sources of systematic variation. It is reconstructed from data using a novel method that we call the Factor-Adjusted Dynamic EWMA (FADE). A signed-edge graph attention mechanism then combines the reconstructed network with exogenous firm characteristics and macroeconomic variables. This graph-informed specification is designed to produce residuals that more effectively separate idiosyncratic mean-reverting dynamics from cross-sectional co-movements, yielding economically useful signals for daily statistical arbitrage. In a comprehensive empirical study on daily U.S. equities from 2015 to 2024, GIDF outperforms classical factor models and state-of-the-art deep learning methods, achieving an out-of-sample Sharpe ratio of 1.78 under the canonical Avellaneda--Lee rule.", "content_hash": "188839968a829cc965def3663189fc88dcdc86af9cf93b00c5a63a19ac583bfe", "category": "Alpha / Factor Research", "tags": ["cross-section", "deep learning", "factor", "statistical arbitrage"], "language": "en", "metadata": {"arxiv_categories": ["q-fin.ST"]}, "one_line_summary": "FADE 重构残差相关网络 + 图注意力单因子模型，美股日频统计套利样本外夏普 1.78", "technical_summary": "日频统计套利需要把个股均值回复残差和截面共同波动分开。GIDF 把每只股票的因子载荷设成依赖潜在网络的条件变量，网络由 FADE 从剔除收益相关矩阵主特征模态后的残差依赖中动态重构。带符号边图注意力再把该网络、公司特征和宏观变量合成载荷，输出更干净的异质残差。2015–2024 年美股日频回测中，按 Avellaneda–Lee 规则取得样本外夏普 1.78，优于经典因子模型和对比深度学习模型。", "key_points": ["FADE 剔除主特征模态后用残差网络和带符号图注意力定载荷，2015–2024 美股日频样本外夏普 1.78。", "需日频收益、公司特征与宏观数据；FADE 与图注意力实现中等，可按 Avellaneda–Lee 规则复现回测。", "局限：仅美股 2015–2024 样本外测试，未披露换手、交易成本与滑点，实盘夏普可能显著缩水。"], "quant_relevance": "因子/alpha 信号；组合构建/权重优化", "possible_use_case": "在现有美股日频 stat-arb 流水线中，用 FADE 生成残差相关网络，替换 Avellaneda–Lee 的相关矩阵输入，再回测 GIDF 残差排序组合。", "limitations": "仅摘要可见，未给换手率、交易成本、滑点、容量和多重检验细节；样本仅 2015–2024 美股，网络重构与图注意力超参数可能过拟合；需独立复现并做成本敏感性。", "read_priority": "高", "key_figures_md": "- **arXiv HTML**：原文图表入口：https://arxiv.org/html/2611.34209；摘要仅披露核心样本外夏普对比，未列具体图号\n- [原文图表（HTML版）](https://arxiv.org/html/2611.34209)", "relevance_score": 5.4, "novelty_score": 9.78, "academic_score": 10.0, "discussion_score": 2.0, "actionable_score": 6.5, "final_score": 6.676, "display_title": "深度学习、因子、注意力机制研究论文", "tldr": "FADE 重构残差相关网络 + 图注意力单因子模型，美股日频统计套利样本外夏普 1.78", "core_value": "对你的量化工作帮助：把它拆成一个阿尔法 / 因子研究复现任务，先验证深度学习、因子、注意力机制是否真的带来样本外提升，再检查交易成本、数据泄漏和换手约束。", "key_points_list": ["FADE 剔除主特征模态后用残差网络和带符号图注意力定载荷，2015–2024 美股日频样本外夏普 1.78。", "需日频收益、公司特征与宏观数据；FADE 与图注意力实现中等，可按 Avellaneda–Lee 规则复现回测。", "局限：仅美股 2015–2024 样本外测试，未披露换手、交易成本与滑点，实盘夏普可能显著缩水。"], "reference_url": "http://arxiv.org/abs/2611.34209v1", "report_sections": ["deep_learning_quant"], "report_section_labels": ["深度学习量化未来"], "category_label": "阿尔法 / 因子研究", "priority_label": "高", "source_type_label": "论文"}, {"id": "65fd9db9805538fa5fcc42ee95e2b38b352d12be47aaeda5b4cfaaf2238ae0ab", "source": "arXiv", "source_type": "paper", "title": "CovNovBench: A Benchmark for Evaluating Time Series Foundation Models under Covariate Novelty", "url": "http://arxiv.org/abs/2611.33732v1", "authors": ["Wenhao Pan", "Ravi Kiran Selvam", "Michael W. Mahoney", "Mayank Jauhari", "Mengfei Cao", "Dmitry Efimov", "Boris N. Oreshkin"], "published_at": "2026-11-25", "collected_at": "2026-11-26T04:43:54Z", "raw_text": "Covariate-aware time-series foundation models (TSFMs) condition their forecasts on additional input variables, called covariates, that are supplied over the future horizon. This capability makes them appealing for interventional forecasting, in which a target is predicted under a planned action such as a new product pricing policy or a new patient treatment schedule. We refer to covariates that encode such actions as treatment covariates. Current covariate-aware TSFMs, however, are trained on observed patterns, and their behavior is unclear when future treatment covariates fall outside the range seen in the history. Examples include a numerical treatment that leaves its historical range and a categorical treatment that takes a previously unseen policy. We call this practically common setting covariate novelty, and note that it is not systematically represented in existing benchmarks. We introduce an operational definition of covariate novelty and use it to construct CovNovBench, a benchmark of 88,476 evaluation series generated or filtered from four simulator-based and real-world datasets. The benchmark spans categorical and numerical treatment covariates as well as stable and trending targets. We evaluate six covariate-aware TSFMs zero-shot using point and directional accuracy metrics. No model is consistently reliable in our benchmark: point error almost always increases under covariate novelty, directional performance changes non-uniformly, and the best observed model varies across datasets and metrics. CovNovBench provides a systematic testbed for developing TSFMs that forecast more reliably under covariate novelty.", "abstract": "Covariate-aware time-series foundation models (TSFMs) condition their forecasts on additional input variables, called covariates, that are supplied over the future horizon. This capability makes them appealing for interventional forecasting, in which a target is predicted under a planned action such as a new product pricing policy or a new patient treatment schedule. We refer to covariates that encode such actions as treatment covariates. Current covariate-aware TSFMs, however, are trained on observed patterns, and their behavior is unclear when future treatment covariates fall outside the range seen in the history. Examples include a numerical treatment that leaves its historical range and a categorical treatment that takes a previously unseen policy. We call this practically common setting covariate novelty, and note that it is not systematically represented in existing benchmarks. We introduce an operational definition of covariate novelty and use it to construct CovNovBench, a benchmark of 88,476 evaluation series generated or filtered from four simulator-based and real-world datasets. The benchmark spans categorical and numerical treatment covariates as well as stable and trending targets. We evaluate six covariate-aware TSFMs zero-shot using point and directional accuracy metrics. No model is consistently reliable in our benchmark: point error almost always increases under covariate novelty, directional performance changes non-uniformly, and the best observed model varies across datasets and metrics. CovNovBench provides a systematic testbed for developing TSFMs that forecast more reliably under covariate novelty.", "content_hash": "d3ea7ded7f040389cde3c69e896bbb5fe85d160a8cf7bf98eabad54ddfe51e85", "category": "Machine Learning for Finance", "tags": ["forecasting", "pricing", "simulator", "time series"], "language": "en", "metadata": {"arxiv_categories": ["cs.LG", "stat.ME"]}, "one_line_summary": "CovNovBench 用 88,476 条序列零样本评测 6 个协变量感知时序基础模型，未来协变量超出历史范围时点误差几乎全部上升", "technical_summary": "协变量感知时序基础模型（TSFM）允许把未来区间的外生变量（论文称为 treatment covariate，如新定价政策、新给药方案）直接喂进模型做「干预式预测」。当这些未来协变量落在历史观测范围之外时（数值型越界、类别型出现新取值），模型行为未知，而现有 benchmark 没有系统覆盖这种「协变量新颖性」场景。作者给出 covariate novelty 的可操作定义，并据此从 4 个数据集（模拟器生成 + 真实世界）构建 88,476 条评测序列，覆盖类别型/数值型 treatment covariate 与平稳/趋势型目标。对 6 个协变量感知 TSFM 做零样本评测，指标为点误差与方向准确率：协变量新颖性下点误差几乎总是上升，方向表现变化非一致，最优模型随数据集和指标而变，没有任何模型在所有设定下稳定可靠。", "key_points": ["6 个协变量感知 TSFM 零样本评测：协变量新颖性下点误差几乎全部上升，方向准确率变化不一致，最优模型随数据集与指标切换", "88,476 条序列覆盖类别/数值协变量与平稳/趋势目标，操作定义可直接复用于构造自建评测集", "4 个数据集均为模拟器或非金融场景，未涉及真实市场协变量与交易成本，金融外推性未验证"], "quant_relevance": "研究工具 / 工作流提效；因子 / alpha 信号（情景外推预测的可靠性评估）", "possible_use_case": "把新费率、新合约规则、新停复牌或涨跌停制度作为未来协变量，按 CovNovBench 的 novelty 定义切分 A 股制度变更前后样本，先测现有 TSFM 与你自研时序模型的方向准确率衰减幅度，作为上线前的必备压力测试项。", "limitations": "评测数据全部来自 4 个模拟器或非金融真实数据集，没有任何金融序列、订单簿或行情数据，协变量类型也不包含价格、成交量、宏观因子这类量化常用变量；只做零样本评测，未报告微调后的表现；指标仅点误差与方向准确率，没有夏普、收益、回撤等交易层指标，也未考虑交易成本与滑点；论文未说明代码与数据的具体开源地址与许可，复现成本待确认；协变量新颖性的操作定义本身依赖阈值选择，可能影响结论稳定性。", "read_priority": "中", "key_figures_md": "- **Figure 1**：协变量新颖性示意：历史区间内的 treatment covariate 分布与未来越界/新类别取值的对比\n- **主结果表**：6 个 covariate-aware TSFM 在 4 个数据集上的零样本点误差与方向准确率汇总（含新颖性/非新颖性对照）\n- [原文图表（HTML版）](https://arxiv.org/html/2611.33732)", "relevance_score": 5.4, "novelty_score": 9.78, "academic_score": 10.0, "discussion_score": 2.0, "actionable_score": 6.5, "final_score": 6.676, "display_title": "预测、定价、时间序列研究论文", "tldr": "CovNovBench 用 88,476 条序列零样本评测 6 个协变量感知时序基础模型，未来协变量超出历史范围时点误差几乎全部上升", "core_value": "对你的量化工作帮助：把它拆成一个金融机器学习复现任务，先验证预测、定价、时间序列是否真的带来样本外提升，再检查交易成本、数据泄漏和换手约束。", "key_points_list": ["6 个协变量感知 TSFM 零样本评测：协变量新颖性下点误差几乎全部上升，方向准确率变化不一致，最优模型随数据集与指标切换", "88,476 条序列覆盖类别/数值协变量与平稳/趋势目标，操作定义可直接复用于构造自建评测集", "4 个数据集均为模拟器或非金融场景，未涉及真实市场协变量与交易成本，金融外推性未验证"], "reference_url": "http://arxiv.org/abs/2611.33732v1", "report_sections": ["ai_quant_tools"], "report_section_labels": ["AI 量化工具"], "category_label": "金融机器学习", "priority_label": "中", "source_type_label": "论文"}, {"id": "1b0b57df7f88dc3933f60cce69b1cac0c0b5d287f8769df4892155a6f4767dcd", "source": "arXiv", "source_type": "paper", "title": "Text-Conditioned Low-Rank Adaptation of Time-Series Foundation Models for Multimodal Forecasting", "url": "http://arxiv.org/abs/2611.34206v1", "authors": ["Kunqi Li", "Bin Liang", "Zhidong Li"], "published_at": "2026-11-25", "collected_at": "2026-11-26T04:43:54Z", "raw_text": "Time-series foundation models (TSFMs) provide transferable numerical forecasting priors. However, forecast-relevant information may be conveyed in text without being reflected in the observed series. Many multimodal forecasting methods integrate such context through model inputs or intermediate representations. We investigate a complementary mechanism: text-conditioned parameter adaptation. We propose Context-to-LoRA for Time Series (C2LoRA-TS), which encodes text and generates temporary Low-Rank Adaptation (LoRA) updates for selected weight matrices of a frozen TSFM. Both the numerical backbone and text encoder remain frozen, and the method exactly recovers the frozen TSFM output when context is absent. Evaluated on Time-MMD across nine domains and three TSFM architectures, C2LoRA-TS achieves lower aggregate forecasting error than the frozen-TSFM and Static LoRA baselines for every architecture and seed. Replacing the instance-specific text with a single globally fixed context degrades performance for every architecture. These results support text-conditioned parameter generation as a viable strategy for multimodal forecasting with frozen TSFMs.", "abstract": "Time-series foundation models (TSFMs) provide transferable numerical forecasting priors. However, forecast-relevant information may be conveyed in text without being reflected in the observed series. Many multimodal forecasting methods integrate such context through model inputs or intermediate representations. We investigate a complementary mechanism: text-conditioned parameter adaptation. We propose Context-to-LoRA for Time Series (C2LoRA-TS), which encodes text and generates temporary Low-Rank Adaptation (LoRA) updates for selected weight matrices of a frozen TSFM. Both the numerical backbone and text encoder remain frozen, and the method exactly recovers the frozen TSFM output when context is absent. Evaluated on Time-MMD across nine domains and three TSFM architectures, C2LoRA-TS achieves lower aggregate forecasting error than the frozen-TSFM and Static LoRA baselines for every architecture and seed. Replacing the instance-specific text with a single globally fixed context degrades performance for every architecture. These results support text-conditioned parameter generation as a viable strategy for multimodal forecasting with frozen TSFMs.", "content_hash": "18339903b21304b7bb080cd800986067f55e4e306ceedc7862f0e41dd193ff27", "category": "Machine Learning for Finance", "tags": ["forecasting", "time series"], "language": "en", "metadata": {"arxiv_categories": ["cs.LG"]}, "one_line_summary": "用文本生成 LoRA 更新冻结时序基础模型，Time-MMD 九领域三种架构均降预测误差，可做文本条件化金融时序预测", "technical_summary": "要解决的问题是：预测相关信号可能只在文本里，未反映在历史序列中。做法是冻结时序基础模型和文本编码器，用文本编码器输出生成选定权重矩阵的临时 LoRA 更新；无上下文时精确还原冻结模型输出。在 Time-MMD 九个领域、三种 TSFM 架构上，聚合预测误差低于 frozen-TSFM 和 Static LoRA，且每个架构、每个随机种子都成立。把实例文本换成单一全局固定文本后，所有架构性能下降，说明收益来自实例级文本条件化；摘要未给具体误差数值。", "key_points": ["文本生成临时LoRA、冻结时序骨干；Time-MMD九领域三种架构每个种子均降聚合误差", "量化可用性：可接在现有时序基础模型上，需实例级文本；复现依赖Time-MMD协议，摘要未提代码", "局限：摘要无具体误差与显著性，Time-MMD非金融专用，逐样本生成LoRA有推理开销，未计交易成本"], "quant_relevance": "金融时间序列预测、研究工具 / 工作流提效", "possible_use_case": "在现有时序基础模型上接入财报电话会或新闻文本：先按 Time-MMD 协议复现，再把文本换成金融语料，测试对日频收益/波动率预测的增量。", "limitations": "仅有摘要，未给具体误差、统计显著性和代码；Time-MMD 非金融专用，逐样本生成 LoRA 有额外推理开销，未考虑交易成本与滑点。", "read_priority": "中", "key_figures_md": "- **Figure/Table（摘要未编号）**：九领域×三种 TSFM 架构的聚合预测误差对比，含 frozen-TSFM、Static LoRA 与全局固定文本消融；原图见 https://arxiv.org/html/2611.34206\n- [原文图表（HTML版）](https://arxiv.org/html/2611.34206)", "relevance_score": 5.4, "novelty_score": 9.78, "academic_score": 9.955, "discussion_score": 2.0, "actionable_score": 6.5, "final_score": 6.669, "display_title": "预测、时间序列研究论文", "tldr": "用文本生成 LoRA 更新冻结时序基础模型，Time-MMD 九领域三种架构均降预测误差，可做文本条件化金融时序预测", "core_value": "对你的量化工作帮助：把它拆成一个金融机器学习复现任务，先验证预测、时间序列是否真的带来样本外提升，再检查交易成本、数据泄漏和换手约束。", "key_points_list": ["文本生成临时LoRA、冻结时序骨干；Time-MMD九领域三种架构每个种子均降聚合误差", "量化可用性：可接在现有时序基础模型上，需实例级文本；复现依赖Time-MMD协议，摘要未提代码", "局限：摘要无具体误差与显著性，Time-MMD非金融专   <script>
    const payload = JSON.parse(document.getElementById('dashboard-data').textContent);
    const items = payload.items || [];
    const categoryLabels = payload.category_labels || {};
    const priorityLabels = payload.priority_labels || {};
    const sourceTypeLabels = payload.source_type_labels || {};
    const state = {
      query: '',
      section: 'All',
      category: 'All',
      sort: 'score',
      activeId: items[0]?.id || null,
    };

    const priorityRank = { High: 3, Medium: 2, Low: 1, '高': 3, '中': 2, '低': 1 };
    const $ = (id) => document.getElementById(id);

    // --- Feedback ---
    const _feedbackStore = JSON.parse(localStorage.getItem('quant-feedback') || '{}');
    function getFeedback(id) { return _feedbackStore[id] || 0; }
    function setFeedback(id, signal) {
      if (_feedbackStore[id] === signal) { delete _feedbackStore[id]; signal = 0; }
      else { _feedbackStore[id] = signal; }
      localStorage.setItem('quant-feedback', JSON.stringify(_feedbackStore));
      fetch('http://localhost:8080/feedback', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id, signal }),
      }).catch(() => {});
    }

    function init() {
      $('report-date').textContent = payload.report_date + ' - 主力源：arXiv / 知乎 / QuantML / 大型论坛 - 生成时间 ' + payload.generated_at;
      $('metric-items').textContent = items.length;
      $('metric-categories').textContent = new Set(items.map((item) => item.category)).size;
      $('metric-high').textContent = items.filter((item) => priorityLabel(item.read_priority) === '高').length;
      $('metric-avg').textContent = averageScore(items).toFixed(1);

      buildSectionControls();
      buildCategoryControls();
      buildSourceList();
      bindControls();
      render();
    }

    function bindControls() {
      $('search').addEventListener('input', (event) => {
        state.query = event.target.value.trim().toLowerCase();
        render();
      });
      $('category-select').addEventListener('change', (event) => {
        state.category = event.target.value;
        render();
      });
      $('section-select').addEventListener('change', (event) => {
        state.section = event.target.value;
        render();
      });
      $('sort-select').addEventListener('change', (event) => {
        state.sort = event.target.value;
        render();
      });
    }

    function buildCategoryControls() {
      const counts = countBy(items, 'category');
      const categories = Object.keys(counts).sort();
      const select = $('category-select');
      select.innerHTML = option('All', `全部细分标签 (${items.length})`) +
        categories.map((category) => option(category, `${categoryLabel(category)} (${counts[category]})`)).join('');

      const list = $('category-list');
      list.innerHTML = categoryButton('All', items.length) +
        categories.map((category) => categoryButton(category, counts[category])).join('');

      list.querySelectorAll('button').forEach((button) => {
        button.addEventListener('click', () => {
          state.category = button.dataset.category;
          select.value = state.category;
          if (state.category === 'All') {
            state.section = 'All';
            $('section-select').value = 'All';
          }
          render();
        });
      });
    }

    function buildSectionControls() {
      const counts = payload.section_counts || {};
      const sections = payload.sections || [];
      const select = $('section-select');
      select.innerHTML = option('All', `全部主线 (${items.length})`) +
        sections
          .filter((section) => counts[section.key])
          .map((section) => option(section.key, `${section.label} (${counts[section.key]})`))
          .join('');

      const list = $('section-list');
      list.innerHTML = sectionButton('All', '全部', items.length) +
        sections
          .filter((section) => counts[section.key])
          .map((section) => sectionButton(section.key, section.label, counts[section.key]))
          .join('');

      list.querySelectorAll('button').forEach((button) => {
        button.addEventListener('click', () => {
          state.section = button.dataset.section;
          select.value = state.section;
          if (state.section === 'All') {
            state.category = 'All';
            $('category-select').value = 'All';
          }
          render();
        });
      });
    }

    function buildSourceList() {
      const stats = payload.source_stats || {};
      const entries = Object.entries(stats)
        .filter(([source]) => !source.startsWith('fetched:'))
        .sort((a, b) => b[1] - a[1]);
      $('source-list').innerHTML = entries.length
        ? entries.map(([source, count]) => `<li><span>${escapeHtml(source)}</span><b>${count}</b></li>`).join('')
        : '<li><span>暂无来源统计</span><b>0</b></li>';
    }

    function render() {
      let visible = items.filter(matchesFilters);
      visible = sortItems(visible);
      if (!visible.some((item) => item.id === state.activeId)) {
        state.activeId = visible[0]?.id || null;
      }

      $('feed-title').textContent = feedTitle();
      $('result-count').textContent = `展示 ${visible.length} 条 - 两条主线每条最多 ${payload.report_config.max_items_per_category} 条`;
      renderSectionActive();
      renderCategoryActive();
      renderItems(visible);
      renderDetail(visible.find((item) => item.id === state.activeId) || visible[0]);
    }

    function matchesFilters(item) {
      const sectionMatch = state.section === 'All' || (item.report_sections || []).includes(state.section);
      if (!sectionMatch) return false;
      const categoryMatch = state.category === 'All' || item.category === state.category;
      if (!categoryMatch) return false;
      if (!state.query) return true;
      const haystack = [
        item.title,
        item.display_title,
        item.source,
        item.source_type,
        item.category,
        categoryLabel(item.category),
        sectionLabel(item.report_sections?.[0]),
        sourceTypeLabel(item.source_type),
        priorityLabel(item.read_priority),
        item.one_line_summary,
        item.technical_summary,
        item.quant_relevance,
        item.possible_use_case,
        item.tldr,
        item.core_value,
        ...(item.key_points_list || []),
        item.reference_url,
      ].join(' ').toLowerCase();
      return haystack.includes(state.query);
    }

    function sortItems(list) {
      return [...list].sort((a, b) => {
        if (state.sort === 'priority') {
          return (priorityRank[b.read_priority] || 0) - (priorityRank[a.read_priority] || 0)
            || b.final_score - a.final_score;
        }
        if (state.sort === 'source') {
          return a.source.localeCompare(b.source) || b.final_score - a.final_score;
        }
        return b.final_score - a.final_score;
      });
    }

    function renderCategoryActive() {
      document.querySelectorAll('.category-button').forEach((button) => {
        button.classList.toggle('active', button.dataset.category === state.category);
      });
    }

    function renderSectionActive() {
      document.querySelectorAll('.section-button').forEach((button) => {
        button.classList.toggle('active', button.dataset.section === state.section);
      });
    }

    function itemCard(item) {
      const sec = item.report_sections?.[0] || 'other';
      const sig = getFeedback(item.id);
      return `
        <article class="item ${item.id === state.activeId ? 'active' : ''}"
                 data-id="${escapeAttr(item.id)}"
                 data-section="${escapeAttr(sec)}">
          <div class="item-top">
            <h3>${escapeHtml(item.display_title || item.title)}</h3>
            <div class="score">${Number(item.final_score).toFixed(1)}</div>
          </div>
          <div class="meta">
            <span class="tag">${escapeHtml(categoryLabel(item.category))}</span>
            <span class="tag">${escapeHtml(item.source)}</span>
            <span class="tag">${escapeHtml(priorityLabel(item.read_priority))}</span>
          </div>
          ${readerFormat(item, true)}
          <div class="feedback-row">
            <button class="feedback-btn ${sig === 1 ? 'active-up' : ''}" data-feedback="1" title="有用">👍</button>
            <button class="feedback-btn ${sig === -1 ? 'active-down' : ''}" data-feedback="-1" title="跳过">👎</button>
            <span class="feedback-hint">${sig === 1 ? '已标记有用' : sig === -1 ? '已标记跳过' : ''}</span>
          </div>
        </article>
      `;
    }

    function sectionGroupHeader(section, count) {
      return `
        <div class="section-group-header" data-section="${escapeAttr(section.key)}">
          <span class="section-group-title">${escapeHtml(section.label)}</span>
          <span class="section-group-count">${count} 条</span>
        </div>
      `;
    }

    function renderItems(visible) {
      const container = $('items');
      if (!visible.length) {
        container.innerHTML = '<div class="empty">当前筛选条件下没有匹配内容。</div>';
        return;
      }

      let html = '';
      if (state.section === 'All') {
        // Group by section in defined order, with a header for each group
        const grouped = {};
        for (const item of visible) {
          const sec = item.report_sections?.[0] || 'other';
          if (!grouped[sec]) grouped[sec] = [];
          grouped[sec].push(item);
        }
        for (const section of (payload.sections || [])) {
          const group = grouped[section.key];
          if (!group || !group.length) continue;
          html += sectionGroupHeader(section, group.length);
          html += group.map((item) => itemCard(item)).join('');
        }
        // Append any items that fell into 'other' (shouldn't normally happen)
        if (grouped['other']?.length) {
          html += grouped['other'].map((item) => itemCard(item)).join('');
        }
      } else {
        html = visible.map((item) => itemCard(item)).join('');
      }

      container.innerHTML = html;
      container.querySelectorAll('.item').forEach((node) => {
        node.addEventListener('click', () => {
          state.activeId = node.dataset.id;
          render();
        });
      });
      container.querySelectorAll('.feedback-btn').forEach((btn) => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const itemNode = btn.closest('.item');
          setFeedback(itemNode.dataset.id, parseInt(btn.dataset.feedback, 10));
          render();
        });
      });
    }

    function renderDetail(item) {
      const detail = $('detail');
      if (!item) {
        detail.innerHTML = '<div class="empty">选择一条内容查看详情。</div>';
        return;
      }

      detail.innerHTML = `
        <h2>${escapeHtml(item.display_title || item.title)}</h2>
        <div class="meta">
          <span class="tag">${escapeHtml(categoryLabel(item.category))}</span>
          <span class="tag">${escapeHtml(sourceTypeLabel(item.source_type))}</span>
          <span class="tag">${escapeHtml(priorityLabel(item.read_priority))}</span>
        </div>

        ${readerFormat(item, false)}

        <div class="detail-block">
          <h3>评分拆解</h3>
          <div class="breakdown">
            ${bar('相关性', item.relevance_score)}
            ${bar('新颖度', item.novelty_score)}
            ${bar('学术性', item.academic_score)}
            ${bar('讨论度', item.discussion_score)}
            ${bar('可行动性', item.actionable_score)}
          </div>
        </div>

      `;
    }

    function readerFormat(item, compact) {
      const points = itemKeyPoints(item);
      return `
        <div class="reader-format ${compact ? 'compact' : ''}">
          <div class="reader-block">
            <h4>1. 这篇文章的太长不读</h4>
            <p>${escapeHtml(item.tldr || item.one_line_summary || '')}</p>
          </div>
          <div class="reader-block">
            <h4>2. 核心价值，对我量化的工作能够提供什么样的帮助</h4>
            <p>${escapeHtml(item.core_value || '')}</p>
          </div>
          <div class="reader-block">
            <h4>3. 关键核心点 / 论文或帖子摘要</h4>
            <ol>${points.map((point) => `<li>${escapeHtml(point)}</li>`).join('')}</ol>
          </div>
          <div class="reader-block">
            <h4>4. 原文链接</h4>
            ${referenceHtml(item)}
          </div>
        </div>
      `;
    }

    function itemKeyPoints(item) {
      const points = Array.isArray(item.key_points_list)
        ? item.key_points_list
        : (Array.isArray(item.key_points) ? item.key_points : []);
      const clean = points.filter(Boolean).slice(0, 3);
      return clean.length ? clean : ['需要打开原文进一步确认方法、数据和适用边界。'];
    }

    function referenceHtml(item) {
      const url = item.reference_url || '';
      if (!url) return '<p>暂无可打开链接</p>';
      return `
        <a class="reader-reference" href="${escapeAttr(url)}" target="_blank" rel="noopener noreferrer">打开原文</a>
        <small class="reference-url">${escapeHtml(url)}</small>
      `;
    }

    function bar(label, value) {
      const score = Number(value || 0);
      const width = Math.max(0, Math.min(100, score * 10));
      return `
        <div class="bar">
          <span>${label}</span>
          <div class="bar-track"><div class="bar-fill" style="width: ${width}%"></div></div>
          <b>${score.toFixed(1)}</b>
        </div>
      `;
    }

    function countBy(list, key) {
      return list.reduce((acc, item) => {
        acc[item[key]] = (acc[item[key]] || 0) + 1;
        return acc;
      }, {});
    }

    function averageScore(list) {
      if (!list.length) return 0;
      return list.reduce((sum, item) => sum + Number(item.final_score || 0), 0) / list.length;
    }

    function option(value, label) {
      return `<option value="${escapeAttr(value)}">${escapeHtml(label)}</option>`;
    }

    function sectionButton(section, label, count) {
      return `
        <button class="category-button section-button" type="button" data-section="${escapeAttr(section)}">
          <span>${escapeHtml(label)}</span>
          <span class="count">${count}</span>
        </button>
      `;
    }

    function categoryButton(category, count) {
      return `
        <button class="category-button" type="button" data-category="${escapeAttr(category)}">
          <span>${escapeHtml(category === 'All' ? '全部' : categoryLabel(category))}</span>
          <span class="count">${count}</span>
        </button>
      `;
    }

    function categoryLabel(category) {
      return categoryLabels[category] || category;
    }

    function sectionLabel(sectionKey) {
      const section = (payload.sections || []).find((item) => item.key === sectionKey);
      return section ? section.label : '其他';
    }

    function feedTitle() {
      const parts = [];
      if (state.section !== 'All') parts.push(sectionLabel(state.section));
      if (state.category !== 'All') parts.push(categoryLabel(state.category));
      return parts.length ? parts.join(' / ') : '今日情报';
    }

    function priorityLabel(priority) {
      return priorityLabels[priority] || priority;
    }

    function sourceTypeLabel(sourceType) {
      return sourceTypeLabels[sourceType] || sourceType;
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function escapeAttr(value) {
      return escapeHtml(value).replaceAll('`', '&#096;');
    }

    init();
  </script>
</body>
</html>
