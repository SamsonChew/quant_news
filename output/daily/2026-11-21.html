  <style>
    :root {

      --yellow: #fbbc04;
      --green: #34a853;

        radial-gradient(circle at top right, rgba(251, 188, 4, 0.08), transparent 26%),

      font-family: "Google Sans", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;

    input,
    select {
      font: inherit;
    }

    .shell {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 5;
      display: grid;
      grid-template-columns: minmax(220px, 1fr) minmax(280px, 620px);
      gap: 24px;
      align-items: center;
      padding: 16px 32px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(18px);
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 12px;
      min-width: 0;
    }

    .brand h1 {
      display: flex;
      gap: 10px;
      align-items: center;
      margin: 0;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.02em;
      white-space: nowrap;
    }

    .brand h1::before {
      content: "";
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background:
        conic-gradient(from 0deg, var(--blue) 0 25%, var(--red) 0 50%, var(--yellow) 0 75%, var(--green) 0 100%);
      box-shadow: inset 0 0 0 7px #fff;
    }

    .date-pill {
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 170px 170px 150px;
      gap: 10px;
    }

    .control {
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel);
      color: var(--ink);
      padding: 0 12px;
      outline: none;
    }

    .control:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.14);
    }

    .layout {
      display: grid;
      grid-template-columns: 260px minmax(420px, 1fr) 420px;
      gap: 22px;
      padding: 24px 32px 36px;
    }

    .rail,
    .detail {
      position: sticky;
      top: 86px;
      height: calc(100vh - 112px);
      overflow: auto;
    }

    .rail,
    .detail,
    .feed {
      min-width: 0;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 18px;
    }

    .metric {
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--panel);
      padding: 12px;
      box-shadow: 0 1px 2px rgba(60, 64, 67, 0.08);
    }

    .metric:nth-child(1) { border-top: 3px solid var(--blue); }
    .metric:nth-child(2) { border-top: 3px solid var(--red); }
    .metric:nth-child(3) { border-top: 3px solid var(--yellow); }
    .metric:nth-child(4) { border-top: 3px solid var(--green); }

    .metric b {
      display: block;
      font-size: 22px;
      line-height: 1;
    }

    .metric span {
      display: block;
      margin-top: 7px;
      color: var(--muted);
      font-size: 12px;
    }

    .section-label {
      margin: 18px 0 8px;
      color: var(--blue);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .category-list {
      display: grid;
      gap: 7px;
    }

    .category-button {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
      width: 100%;
      min-height: 38px;
      border: 1px solid transparent;
      border-radius: 999px;
      background: transparent;
      color: var(--ink);
      padding: 8px 10px;
      text-align: left;
      cursor: pointer;
    }

    .category-button:hover,
    .category-button.active {
      border-color: transparent;
      background: var(--blue-soft);
      color: #174ea6;
    }

    .count {
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .source-list {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .source-list li {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
      font-size: 13px;
    }

    .feed-header {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      margin-bottom: 12px;
    }

    .feed-header h2 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
    }

    .result-count {
      color: var(--muted);
      font-size: 13px;
    }

    .items {
      display: grid;
      gap: 10px;
    }

    .section-group-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 2px 4px;
      margin-top: 10px;
      border-bottom: 2px solid var(--line);
    }

    .section-group-header:first-child {
      margin-top: 0;
    }

    .section-group-title {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .section-group-header[data-section="deep_learning_quant"] .section-group-title { color: var(--blue); }
    .section-group-header[data-section="ai_quant_tools"] .section-group-title { color: var(--green); }
    .section-group-header[data-section="daily_news"] .section-group-title { color: var(--yellow); }

    .section-group-count {
      color: var(--muted);
      font-size: 12px;
    }

    .item {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--panel);
      box-shadow: 0 1px 2px rgba(60, 64, 67, 0.10);
      padding: 18px;
      cursor: pointer;
      transition: border-color 140ms ease, transform 140ms ease, box-shadow 140ms ease;
    }

    .item::before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 4px;
      background: linear-gradient(90deg, var(--blue), var(--red), var(--yellow), var(--green));
    }

    .item[data-section="deep_learning_quant"]::before { background: var(--blue); }
    .item[data-section="ai_quant_tools"]::before { background: var(--green); }
    .item[data-section="daily_news"]::before { background: var(--yellow); }

    .item:hover,
    .item.active {
      border-color: #c6dafc;
      box-shadow: var(--shadow);
      transform: translateY(-2px);
    }

    .item-top {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 14px;
      align-items: start;
    }

    .item h3 {
      margin: 0;
      font-size: 16px;
      line-height: 1.28;
    }

    .score {
      min-width: 54px;
      border-radius: 999px;
      background: var(--blue-soft);
      color: #174ea6;
      padding: 6px 8px;
      text-align: center;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 10px 0;
      color: var(--muted);
      font-size: 12px;
    }

    .tag {
      border: 1px solid transparent;
      border-radius: 999px;
      background: #f1f3f4;
      padding: 3px 8px;
    }

    .tag:nth-child(1) { background: var(--blue-soft); color: #174ea6; }
    .tag:nth-child(2) { background: var(--green-soft); color: #137333; }
    .tag:nth-child(3) { background: var(--yellow-soft); color: #8a5a00; }
    .tag:nth-child(4) { background: var(--red-soft); color: #b3261e; }

    .summary {
      margin: 0;
      color: #30342d;
      font-size: 14px;
      line-height: 1.45;
    }

    .reference-link {
      display: inline-flex;
      width: fit-content;
      border-top: 1px solid var(--line);
      color: var(--blue);
      padding-top: 9px;
      text-decoration: none;
      font-size: 13px;
      font-weight: 800;
    }

    .reader-format {
      display: grid;
      gap: 10px;
      margin-top: 10px;
    }

    .reader-format.compact {
      gap: 8px;
    }

    .reader-block {
      border-top: 1px solid var(--line);
      padding-top: 9px;
    }

    .reader-block:first-child {
      border-top: 0;
      padding-top: 0;
    }

    .reader-block h4 {
      margin: 0 0 5px;
      color: var(--blue);
      font-size: 12px;
      font-weight: 700;
    }

    .reader-block p,
    .reader-block li {
      margin: 0;

      margin: 0;
      padding-left: 18px;
    }

    .reader-reference {
      color: var(--blue);
      text-decoration: none;
      font-size: 13px;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .reference-url {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--panel);
      box-shadow: var(--shadow);
      padding: 18px;
    }

    .detail h2 {
      margin: 0 0 12px;
      font-size: 20px;
      line-height: 1.2;
    }

    .detail-block {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
    }

    .detail-block h3 {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.02em;
    }

    .detail-block p,
    .detail-block li {
      color: #30342d;
      font-size: 14px;
      line-height: 1.55;
    }

    .detail-block ul {
      margin: 0;
      padding-left: 18px;
    }

    .breakdown {
      display: grid;
      gap: 8px;
    }

    .bar {
      display: grid;
      grid-template-columns: 118px 1fr 40px;
      gap: 8px;
      align-items: center;
      color: var(--muted);
      font-size: 12px;

    .bar-track {

      border-radius: 999px;
      background: #e7eadf;

      border-radius: inherit;
      background: linear-gradient(90deg, var(--blue), var(--green), var(--yellow), var(--red));

      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 38px;
      margin-top: 16px;
      border: 1px solid var(--blue);
      border-radius: var(--radius);
      color: var(--blue);
      text-decoration: none;
      padding: 0 12px;
      font-weight: 700;

    .feedback-row {
      display: flex;
      gap: 6px;
      align-items: center;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--line);
    }

    .feedback-btn {
      background: #f1f3f4;
      border: 1px solid transparent;
      border-radius: 999px;
      padding: 3px 10px;
      font-size: 13px;
      cursor: pointer;
      transition: background 120ms, border-color 120ms;
    }

    .feedback-btn:hover { background: var(--blue-soft); }
    .feedback-btn.active-up { background: var(--green-soft); border-color: var(--green); }
    .feedback-btn.active-down { background: var(--red-soft); border-color: var(--red); }

    .feedback-hint {
      color: var(--muted);
      font-size: 11px;
    }

    .empty {
      border: 1px dashed var(--line);
      border-radius: var(--radius);
      padding: 28px;
      color: var(--muted);
      background: var(--panel);
    }

    @media (max-width: 1180px) {
      .layout {
        grid-template-columns: 220px 1fr;
      }

      .detail {
        position: static;
        grid-column: 1 / -1;
        height: auto;
      }
    }

    @media (max-width: 820px) {
      .topbar {
        grid-template-columns: 1fr;
        padding: 14px;
      }

      .brand {
        display: grid;
        gap: 4px;
      }

      .brand h1 {
        white-space: normal;
        font-size: 21px;
      }

      .controls {
        grid-template-columns: 1fr;
      }

      .layout {
        grid-template-columns: 1fr;
        padding: 14px;
      }

      .rail,
      .detail {
        position: static;
        height: auto;
      }

      .metric-grid {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>

造配对面板；18 个 LLM、20 数据集约半数通过，约 100 条样本常足够。", "可直接用于金融文本标注验收：需每个样本有多个人类标注和 LLM 标注，按任务跑 IAA 非劣检验；统计流程清晰，复现成本中等。", "结论依赖 IAA 作为“共同信号”代理，未覆盖金融标签的收益/成本；真实任务约半数不通过，直接替换人工可能引入系统性偏差。"], "reference_url": "http://arxiv.org/abs/2611.26073v1", "report_sections": ["ai_quant_tools"], "report_section_labels": ["AI 量化工具"], "category_label": "阿尔法 / 因子研究", "priority_label": "中", "source_type_label": "论文"}, {"id": "fd426fd03daf37eaa0896946847ba4248a02d4c14ed10ceb44af839e85aed4a6", "source": "arXiv", "source_type": "paper", "title": "Optimal Control in Pairs Trading with Negative-Power Utility", "url": "http://arxiv.org/abs/2611.26568v1", "authors": ["Aleksei Kozhevnikov"], "published_at": "2026-11-19", "collected_at": "2026-11-21T03:45:39Z", "raw_text": "We solve a finite-horizon consumption and investment problem in a pairs trading model with an Ornstein-Uhlenbeck spread and utility $U(x)=-x^{-γ}$, $γ>0$. Linearizing the Hamilton-Jacobi-Bellman equation gives explicit formulas for the value function and the optimal feedback control. A budget inequality and concavity verify optimality over all admissible strategies with nonnegative wealth on every finite horizon, without Novikov's condition. Under the optimal feedback, wealth and consumption admit deterministic upper bounds when the interest rate $r$ is at most the mean-reversion rate $κ$. If $r>κ$, each exceeds any prescribed level with positive probability at every time after the start. If $r>\\sqrt{2+γ} κ$, there is an explicit critical horizon at and beyond which expected terminal wealth is infinite, while optimal expected utility is finite. When the critical time falls before maturity, expected wealth at that time is finite exactly when the initial spread is zero. We also show that the suprema of the negative powers of optimal wealth and consumption are integrable on every finite horizon exactly for orders $0\u003cm\\le 1+γ$.", "abstract": "We solve a finite-horizon consumption and investment problem in a pairs trading model with an Ornstein-Uhlenbeck spread and utility $U(x)=-x^{-γ}$, $γ>0$. Linearizing the Hamilton-Jacobi-Bellman equation gives explicit formulas for the value function and the optimal feedback control. A budget inequality and concavity verify optimality over all admissible strategies with nonnegative wealth on every finite horizon, without Novikov's condition. Under the optimal feedback, wealth and consumption admit deterministic upper bounds when the interest rate $r$ is at most the mean-reversion rate $κ$. If $r>κ$, each exceeds any prescribed level with positive probability at every time after the start. If $r>\\sqrt{2+γ} κ$, there is an explicit critical horizon at and beyond which expected terminal wealth is infinite, while optimal expected utility is finite. When the critical time falls before maturity, expected wealth at that time is finite exactly when the initial spread is zero. We also show that the suprema of the negative powers of optimal wealth and consumption are integrable on every finite horizon exactly for orders $0\u003cm\\le 1+γ$.", "content_hash": "8b1f207612fc622c470b1638a788ee72209f631d18cff34d7dcbaaa093701e21", "category": "Statistical Arbitrage", "tags": ["interest rate", "pairs trading", "spread"], "language": "en", "metadata": {"arxiv_categories": ["q-fin.MF", "math.OC"]}, "one_line_summary": "用负幂效用求解 OU 价差配对交易最优控制，给出显式反馈策略并刻画 r>√(2+γ)κ 时财富爆炸的临界期限", "technical_summary": "解决有限期限下配对交易的消费-投资最优控制问题，价差服从 Ornstein-Uhlenbeck 过程，效用函数取负幂形式 U(x)=-x^{-γ}。通过线性化 Hamilton-Jacobi-Bellman 方程，得到值函数和最优反馈控制的显式表达式，并用预算不等式与凹性在非负财富约束下验证全局最优性，不依赖 Novikov 条件。核心结论按利率 r 与均值回复速率 κ 分界：r≤κ 时财富和消费存在确定性上界；r>κ 时在每个正时刻后以正概率超过任意给定水平；r>√(2+γ)κ 时存在显式临界期限，超过该期限后期望终端财富无穷而最优期望效用有限。还证明最优财富与消费的负幂上确界在任意有限期限上可积，当且仅当阶数 0\u003cm≤1+γ。", "key_points": ["OU 价差下负幂效用 HJB 线性化得显式反馈；r>√(2+γ)κ 时存在临界期限使期望终端财富无穷。", "解析解适合做配对交易仓位与风险基准，但需估计 κ、r、γ，复现门槛在随机控制推导。", "依赖连续交易、无摩擦和 OU 参数已知假设，未给校准与交易成本，实盘阈值可能失真。"], "quant_relevance": "组合构建 / 权重优化；风险建模", "possible_use_case": "在配对交易回测中接入：用价差拟合 OU 得 κ，按显式反馈给出目标仓位，并在加入手续费和滑点后检验 r≤κ 的确定性上界是否仍成立。", "limitations": "纯理论推导，无实证回测与夏普；假设连续交易、无摩擦、OU 参数已知，未处理参数估计误差和交易成本；负幂效用对 γ 与财富下界敏感，r>κ 的爆炸结论在离散实盘中需重检。", "read_priority": "中", "key_figures_md": "", "relevance_score": 6.1, "novelty_score": 9.565, "academic_score": 9.926, "discussion_score": 2.0, "actionable_score": 6.5, "final_score": 6.832, "display_title": "价差、最优控制研究论文", "tldr": "用负幂效用求解 OU 价差配对交易最优控制，给出显式反馈策略并刻画 r>√(2+γ)κ 时财富爆炸的临界期限", "core_value": "对你的量化工作帮助：把它拆成一个统计套利复现任务，先验证价差、最优控制是否真的带来样本外提升，再检查交易成本、数据泄漏和换手约束。", "key_points_list": ["OU 价差下负幂效用 HJB 线性化得显式反馈；r>√(2+γ)κ 时存在临界期限使期望终端财富无穷。", "解析解适合做配对交易仓位与风险基准，但需估计 κ、r、γ，复现门槛在随机控制推导。", "依赖连续交易、无摩擦和 OU 参数已知假设，未给校准与交易成本，实盘阈值可能失真。"], "reference_url": "http://arxiv.org/abs/2611.26568v1", "report_sections": ["ai_quant_tools"], "report_section_labels": ["AI 量化工具"], "category_label": "统计套利", "priority_label": "中", "source_type_label": "论文"}, {"id": "4b50587304962a1523c53ba7914bc0526478da788e268e4ac02284bef517a39b", "source": "arXiv", "source_type": "paper", "title": "Path-Independent Deleveraging Rules", "url": "http://arxiv.org/abs/2611.26623v1", "authors": ["Christoph Schlegel", "Akaki Mamageishvili"], "published_at": "2026-11-19", "collected_at": "2026-11-21T03:45:39Z", "raw_text": "We characterise path-independent auto-deleveraging (ADL) rules as an extended log-exponential family. Immunity to account splitting, merging and reopening further restrict the class. Homogeneity (essentially) restricts the class to a one-parameter family ordered by both fairness and platform risk. Its split-proof members continuously interpolate between proportional division and water-filling. Among these rules, decreasing the parameter reduces risk at the cost of increasing inequality in how accounts are treated. This suggests selecting the parameter through an ex-ante calibration to a risk bound on historical data to choose a maximally fair rule subject to that bound. A counterfactual replay of Hyperliquid's ADL episode on 10 October 2025 finds that a range of intermediate parameters significantly improves on the observed allocation in both burden dispersion and subsequent risk statistics.", "abstract": "We characterise path-independent auto-deleveraging (ADL) rules as an extended log-exponential family. Immunity to account splitting, merging and reopening further restrict the class. Homogeneity (essentially) restricts the class to a one-parameter family ordered by both fairness and platform risk. Its split-proof members continuously interpolate between proportional division and water-filling. Among these rules, decreasing the parameter reduces risk at the cost of increasing inequality in how accounts are treated. This suggests selecting the parameter through an ex-ante calibration to a risk bound on historical data to choose a maximally fair rule subject to that bound. A counterfactual replay of Hyperliquid's ADL episode on 10 October 2025 finds that a range of intermediate parameters significantly improves on the observed allocation in both burden dispersion and subsequent risk statistics.", "content_hash": "bdfc7daea32fa82e47aa97b14c8b8951c229956b167ae2769434e013c074d698", "category": "Portfolio Construction", "tags": ["allocation", "historical data", "risk"], "language": "en", "metadata": {"arxiv_categories": ["cs.GT", "q-fin.RM"]}, "one_line_summary": "把路径无关的自动减仓（ADL）规则归约为单参数 log-exponential 族，Hyperliquid 2025-10-10 ADL 事件回放显示中等参数同时改善分摊不均与后续风险指标", "technical_summary": "问题：交易所自动减仓时，按什么规则把破产账户的仓位分摊给对手方账户，才能既路径无关（不因账户拆分、合并、重开而改变结果）又把平台风险控制在界限内。方法：把 ADL 规则刻画为扩展 log-exponential 族，叠加抗拆分、抗合并、抗重开的条件，再用齐次性把可行类压缩为一参数族，该族在等比例分摊与 water-filling 之间连续插值。结论：参数变小降低平台风险，但账户间被分摊的不平等变大，构成单调权衡；因此建议对历史数据做 ex-ante 校准，在风险上界约束下取最公平的参数。实证：对 Hyperliquid 于 2025-10-10 发生的 ADL 事件做反事实回放，一组中间参数在负担分散度（burden dispersion）与后续风险统计上同时优于实际观测到的分配；摘要未给出具体改进幅度数值，需查正文。", "key_points": ["路径无关 ADL 在抗拆分/合并/重开与齐次约束下收敛为单参数 log-exponential 族，参数越小平台风险越低、账户间不平等越大", "只需 ADL 触发时各账户仓位与保证金分配记录（链上公开可得），规则为闭式公式，可高保真复现并接入永续风控与回测", "实证仅覆盖 Hyperliquid 单次 2025-10-10 事件，摘要未给任何夏普/回撤数值，风险上界可事后挑选，跨交易所外推未验证"], "quant_relevance": "风险建模、执行与交易成本。加密永续的强平与 ADL 是实盘尾部风险的直接来源，该框架给出可校准的分配规则族与风险上界参数化方式。", "possible_use_case": "在加密永续组合构建阶段加入 ADL 风险约束：用链上历史 ADL 事件校准该单参数，估算给定持仓结构下被分摊仓位的名义比例与不平等程度，把最坏情形 ADL 损失折算成每个标的的持仓上限，写进现有风控回测的尾部情景模块。", "limitations": "摘要层面没有任何精度、夏普、回撤或成本数字，改进幅度需翻正文；反事实回放只覆盖单交易所（Hyperliquid）单次事件（2025-10-10），样本外与跨所通用性未知；ex-ante 校准所用的风险上界本身是自由参数，存在事后挑选最优参数的风险；未讨论 ADL 后市场冲击、流动性与价差反馈；arXiv 编号 2611.26623 对应 2026 年 11 月，晚于所述事件，属事后研究，引用前需核对版本与数据来源。", "read_priority": "中", "key_figures_md": "- **参数权衡图（HTML 版：https://arxiv.org/html/2611.26623）**：单参数族在平台风险与账户间不平等之间的单调权衡曲线，以及等比例分摊到 water-filling 的连续插值\n- **反事实回放图/表（HTML 版）**：Hyperliquid 2025-10-10 ADL 事件在不同参数下的分摊结果：负担分散度与后续风险统计对比\n- [原文图表（HTML版）](https://arxiv.org/html/2611.26623)", "relevance_score": 4.9, "novelty_score": 9.565, "academic_score": 9.63, "discussion_score": 2.0, "actionable_score": 6.5, "final_score": 6.428, "display_title": "风险研究论文", "tldr": "把路径无关的自动减仓（ADL）规则归约为单参数 log-exponential 族，Hyperliquid 2025-10-10 ADL 事件回放显示中等参数同时改善分摊不均与后续风险指标", "core_value": "对你的量化工作帮助：把它拆成一个组合构建复现任务，先验证风险是否真的带来样本外提升，再检查交易成本、数据泄漏和换手约束。", "key_points_list": ["路径无关 ADL 在抗拆分/合并/重开与齐次约束下收敛为单参数 log-exponential 族，参数越小平台风险越低、账户间不平等越大", "只需 ADL 触发时各账户仓位与保证金分配记录（链上公开可得），规则为闭式公式，可高保真复现并接入永续风控与回测", "实证仅覆盖 Hyperliquid 单次 2025-10-10 事件，摘要未给任何夏普/回撤数值，风险上界可事后挑选，跨交易所外推未验证"], "reference_url": "http://arxiv.org/abs/2611.26623v1", "report_sections": ["ai_quant_tools"], "report_section_labels": ["AI 量化工具"], "category_label": "组合构建", "priority_label": "中", "source_type_label": "论文"}, {"id": "9dab54f107752b8ccecbcc5ba2e7cc9c1678291caf9cba5278fd496e80f8c39f", "source": "Decrypt", "source_type": "crypto_news", "title": "Google Gives Gemini Control of Mac Apps, But Its New AI Agent Comes With Risks", "url": "https://decrypt.co/383733/google-gives-gemini-control-mac-apps-ai-agent", "authors": [], "published_at": "2026-11-20", "collected_at": "2026-11-21T03:50:25Z", "raw_text": "Gemini's new Mac computer-use feature navigates apps, files, and websites in a separate window, but Google's own documentation warns about prompt injection.", "abstract": "Gemini's new Mac computer-use feature navigates apps, files, and websites in a separate window, but Google's own documentation warns about prompt injection.", "content_hash": "e5f8b47913d48eea99316e4a737320316c0bcf2e43295ab2fe47987c8d109ec9", "category": "LLM / Agents for Quant", "tags": ["agent", "prompt"], "language": "en", "metadata": {"feed_url": "https://decrypt.co/feed"}, "one_line_summary": "Gemini 拿到 Mac 桌面操控权限，可在独立窗口操作应用/文件/网页——量化研究自动化多一条落地路径，但 Google 官方文档同时警告提示注入风险", "technical_summary": "解决的是「让 LLM 不止输出文本、而是直接在操作系统上执行多步操作」这一步。做法是把 Gemini 的 computer-use 能力接到 macOS 上，让它在一个独立窗口里打开应用、读写文件、浏览网页并完成跨软件流程。原文只给了功能定位和安全提示两层信息：一是操控范围覆盖应用、文件、网站，二是 Google 自己的文档明确点名 prompt injection（页面或文件里的恶意指令可劫持 agent 行为）。原文未披露任何成功率、延迟、支持机型、发布时间、定价或地区限制等量化指标，属于标题级报道。", "key_points": ["原文缺乏量化指标，结论待复核：全文只有「Gemini 可操控 Mac 应用/文件/网页」和「Google 文档警告 prompt injection」两句事实，无成功率、无版本号、无发布日期。", "对量化研究的直接价值在于把重复的桌面操作串成自动流程：拉行情终端数据、导出 CSV、跑回测脚本、批量下载研报 PDF 并归档，省掉人工点击环节。", "风险点在权限与注入：agent 能读文件、能开网页，意味着恶意网页或脏数据里的指令可被当成任务执行；且报道未说明是否有沙箱、操作确认或审计日志，实盘环境不可直接放权。"], "quant_relevance": "研究工具 / 工作流提效；数据工程", "possible_use_case": "在隔离的 Mac 测试机上先跑低风险链路：让 Gemini 每天开盘前自动打开行情终端导出前一日全A/加密现货日线 CSV → 丢进固定目录 → 触发本地 Python 因子脚本 → 把回测摘要写回 Markdown 日报。全程只用只读数据和本地文件，不接任何下单 API，跑两周看失败率再决定是否扩展。", "limitations": "原文是标题+一句导语的短讯，没有任何实测数据、没有版本号/发布时间/收费方式/支持机型，也没有 prompt injection 的具体案例或防护说明，全部细节需回查 Google 官方文档；此外这是加密媒体的转述报道，非一手技术文档，结论不能直接引用到研究里。另外 computer-use 类 agent 在长链路任务上的稳定性、成本与延迟在业内尚无公开基准，量化场景对可复现性要求高，短期内只适合做辅助而非关键路径。", "read_priority": "中", "key_figures_md": "", "relevance_score": 5.4, "novelty_score": 9.78, "academic_score": 5.695, "discussion_score": 2.0, "actionable_score": 6.5, "final_score": 6.03, "display_title": "大模型、人工智能加密市场新闻情报", "tldr": "Gemini 拿到 Mac 桌面操控权限，可在独立窗口操作应用/文件/网页——量化研究自动化多一条落地路径，但 Google 官方文档同时警告提示注入风险", "core_value": "对你的量化工作帮助：围绕大模型、人工智能补充研究素材，进一步判断是否能转化成因子、回测、风控或工程任务。", "key_poi   <script>
    const payload = JSON.parse(document.getElementById('dashboard-data').textContent);
    const items = payload.items || [];
    const categoryLabels = payload.category_labels || {};
    const priorityLabels = payload.priority_labels || {};
    const sourceTypeLabels = payload.source_type_labels || {};
    const state = {
      query: '',
      section: 'All',
      category: 'All',
      sort: 'score',
      activeId: items[0]?.id || null,
    };

    const priorityRank = { High: 3, Medium: 2, Low: 1, '高': 3, '中': 2, '低': 1 };
    const $ = (id) => document.getElementById(id);

    // --- Feedback ---
    const _feedbackStore = JSON.parse(localStorage.getItem('quant-feedback') || '{}');
    function getFeedback(id) { return _feedbackStore[id] || 0; }
    function setFeedback(id, signal) {
      if (_feedbackStore[id] === signal) { delete _feedbackStore[id]; signal = 0; }
      else { _feedbackStore[id] = signal; }
      localStorage.setItem('quant-feedback', JSON.stringify(_feedbackStore));
      fetch('http://localhost:8080/feedback', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id, signal }),
      }).catch(() => {});
    }

    function init() {
      $('report-date').textContent = payload.report_date + ' - 主力源：arXiv / 知乎 / QuantML / 大型论坛 - 生成时间 ' + payload.generated_at;
      $('metric-items').textContent = items.length;
      $('metric-categories').textContent = new Set(items.map((item) => item.category)).size;
      $('metric-high').textContent = items.filter((item) => priorityLabel(item.read_priority) === '高').length;
      $('metric-avg').textContent = averageScore(items).toFixed(1);

      buildSectionControls();
      buildCategoryControls();
      buildSourceList();
      bindControls();
      render();
    }

    function bindControls() {
      $('search').addEventListener('input', (event) => {
        state.query = event.target.value.trim().toLowerCase();
        render();
      });
      $('category-select').addEventListener('change', (event) => {
        state.category = event.target.value;
        render();
      });
      $('section-select').addEventListener('change', (event) => {
        state.section = event.target.value;
        render();
      });
      $('sort-select').addEventListener('change', (event) => {
        state.sort = event.target.value;
        render();
      });
    }

    function buildCategoryControls() {
      const counts = countBy(items, 'category');
      const categories = Object.keys(counts).sort();
      const select = $('category-select');
      select.innerHTML = option('All', `全部细分标签 (${items.length})`) +
        categories.map((category) => option(category, `${categoryLabel(category)} (${counts[category]})`)).join('');

      const list = $('category-list');
      list.innerHTML = categoryButton('All', items.length) +
        categories.map((category) => categoryButton(category, counts[category])).join('');

      list.querySelectorAll('button').forEach((button) => {
        button.addEventListener('click', () => {
          state.category = button.dataset.category;
          select.value = state.category;
          if (state.category === 'All') {
            state.section = 'All';
            $('section-select').value = 'All';
          }
          render();
        });
      });
    }

    function buildSectionControls() {
      const counts = payload.section_counts || {};
      const sections = payload.sections || [];
      const select = $('section-select');
      select.innerHTML = option('All', `全部主线 (${items.length})`) +
        sections
          .filter((section) => counts[section.key])
          .map((section) => option(section.key, `${section.label} (${counts[section.key]})`))
          .join('');

      const list = $('section-list');
      list.innerHTML = sectionButton('All', '全部', items.length) +
        sections
          .filter((section) => counts[section.key])
          .map((section) => sectionButton(section.key, section.label, counts[section.key]))
          .join('');

      list.querySelectorAll('button').forEach((button) => {
        button.addEventListener('click', () => {
          state.section = button.dataset.section;
          select.value = state.section;
          if (state.section === 'All') {
            state.category = 'All';
            $('category-select').value = 'All';
          }
          render();
        });
      });
    }

    function buildSourceList() {
      const stats = payload.source_stats || {};
      const entries = Object.entries(stats)
        .filter(([source]) => !source.startsWith('fetched:'))
        .sort((a, b) => b[1] - a[1]);
      $('source-list').innerHTML = entries.length
        ? entries.map(([source, count]) => `<li><span>${escapeHtml(source)}</span><b>${count}</b></li>`).join('')
        : '<li><span>暂无来源统计</span><b>0</b></li>';
    }

    function render() {
      let visible = items.filter(matchesFilters);
      visible = sortItems(visible);
      if (!visible.some((item) => item.id === state.activeId)) {
        state.activeId = visible[0]?.id || null;
      }

      $('feed-title').textContent = feedTitle();
      $('result-count').textContent = `展示 ${visible.length} 条 - 两条主线每条最多 ${payload.report_config.max_items_per_category} 条`;
      renderSectionActive();
      renderCategoryActive();
      renderItems(visible);
      renderDetail(visible.find((item) => item.id === state.activeId) || visible[0]);
    }

    function matchesFilters(item) {
      const sectionMatch = state.section === 'All' || (item.report_sections || []).includes(state.section);
      if (!sectionMatch) return false;
      const categoryMatch = state.category === 'All' || item.category === state.category;
      if (!categoryMatch) return false;
      if (!state.query) return true;
      const haystack = [
        item.title,
        item.display_title,
        item.source,
        item.source_type,
        item.category,
        categoryLabel(item.category),
        sectionLabel(item.report_sections?.[0]),
        sourceTypeLabel(item.source_type),
        priorityLabel(item.read_priority),
        item.one_line_summary,
        item.technical_summary,
        item.quant_relevance,
        item.possible_use_case,
        item.tldr,
        item.core_value,
        ...(item.key_points_list || []),
        item.reference_url,
      ].join(' ').toLowerCase();
      return haystack.includes(state.query);
    }

    function sortItems(list) {
      return [...list].sort((a, b) => {
        if (state.sort === 'priority') {
          return (priorityRank[b.read_priority] || 0) - (priorityRank[a.read_priority] || 0)
            || b.final_score - a.final_score;
        }
        if (state.sort === 'source') {
          return a.source.localeCompare(b.source) || b.final_score - a.final_score;
        }
        return b.final_score - a.final_score;
      });
    }

    function renderCategoryActive() {
      document.querySelectorAll('.category-button').forEach((button) => {
        button.classList.toggle('active', button.dataset.category === state.category);
      });
    }

    function renderSectionActive() {
      document.querySelectorAll('.section-button').forEach((button) => {
        button.classList.toggle('active', button.dataset.section === state.section);
      });
    }

    function itemCard(item) {
      const sec = item.report_sections?.[0] || 'other';
      const sig = getFeedback(item.id);
      return `
        <article class="item ${item.id === state.activeId ? 'active' : ''}"
                 data-id="${escapeAttr(item.id)}"
                 data-section="${escapeAttr(sec)}">
          <div class="item-top">
            <h3>${escapeHtml(item.display_title || item.title)}</h3>
            <div class="score">${Number(item.final_score).toFixed(1)}</div>
          </div>
          <div class="meta">
            <span class="tag">${escapeHtml(categoryLabel(item.category))}</span>
            <span class="tag">${escapeHtml(item.source)}</span>
            <span class="tag">${escapeHtml(priorityLabel(item.read_priority))}</span>
          </div>
          ${readerFormat(item, true)}
          <div class="feedback-row">
            <button class="feedback-btn ${sig === 1 ? 'active-up' : ''}" data-feedback="1" title="有用">👍</button>
            <button class="feedback-btn ${sig === -1 ? 'active-down' : ''}" data-feedback="-1" title="跳过">👎</button>
            <span class="feedback-hint">${sig === 1 ? '已标记有用' : sig === -1 ? '已标记跳过' : ''}</span>
          </div>
        </article>
      `;
    }

    function sectionGroupHeader(section, count) {
      return `
        <div class="section-group-header" data-section="${escapeAttr(section.key)}">
          <span class="section-group-title">${escapeHtml(section.label)}</span>
          <span class="section-group-count">${count} 条</span>
        </div>
      `;
    }

    function renderItems(visible) {
      const container = $('items');
      if (!visible.length) {
        container.innerHTML = '<div class="empty">当前筛选条件下没有匹配内容。</div>';
        return;
      }

      let html = '';
      if (state.section === 'All') {
        // Group by section in defined order, with a header for each group
        const grouped = {};
        for (const item of visible) {
          const sec = item.report_sections?.[0] || 'other';
          if (!grouped[sec]) grouped[sec] = [];
          grouped[sec].push(item);
        }
        for (const section of (payload.sections || [])) {
          const group = grouped[section.key];
          if (!group || !group.length) continue;
          html += sectionGroupHeader(section, group.length);
          html += group.map((item) => itemCard(item)).join('');
        }
        // Append any items that fell into 'other' (shouldn't normally happen)
        if (grouped['other']?.length) {
          html += grouped['other'].map((item) => itemCard(item)).join('');
        }
      } else {
        html = visible.map((item) => itemCard(item)).join('');
      }

      container.innerHTML = html;
      container.querySelectorAll('.item').forEach((node) => {
        node.addEventListener('click', () => {
          state.activeId = node.dataset.id;
          render();
        });
      });
      container.querySelectorAll('.feedback-btn').forEach((btn) => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const itemNode = btn.closest('.item');
          setFeedback(itemNode.dataset.id, parseInt(btn.dataset.feedback, 10));
          render();
        });
      });
    }

    function renderDetail(item) {
      const detail = $('detail');
      if (!item) {
        detail.innerHTML = '<div class="empty">选择一条内容查看详情。</div>';
        return;
      }

      detail.innerHTML = `
        <h2>${escapeHtml(item.display_title || item.title)}</h2>
        <div class="meta">
          <span class="tag">${escapeHtml(categoryLabel(item.category))}</span>
          <span class="tag">${escapeHtml(sourceTypeLabel(item.source_type))}</span>
          <span class="tag">${escapeHtml(priorityLabel(item.read_priority))}</span>
        </div>

        ${readerFormat(item, false)}

        <div class="detail-block">
          <h3>评分拆解</h3>
          <div class="breakdown">
            ${bar('相关性', item.relevance_score)}
            ${bar('新颖度', item.novelty_score)}
            ${bar('学术性', item.academic_score)}
            ${bar('讨论度', item.discussion_score)}
            ${bar('可行动性', item.actionable_score)}
          </div>
        </div>

      `;
    }

    function readerFormat(item, compact) {
      const points = itemKeyPoints(item);
      return `
        <div class="reader-format ${compact ? 'compact' : ''}">
          <div class="reader-block">
            <h4>1. 这篇文章的太长不读</h4>
            <p>${escapeHtml(item.tldr || item.one_line_summary || '')}</p>
          </div>
          <div class="reader-block">
            <h4>2. 核心价值，对我量化的工作能够提供什么样的帮助</h4>
            <p>${escapeHtml(item.core_value || '')}</p>
          </div>
          <div class="reader-block">
            <h4>3. 关键核心点 / 论文或帖子摘要</h4>
            <ol>${points.map((point) => `<li>${escapeHtml(point)}</li>`).join('')}</ol>
          </div>
          <div class="reader-block">
            <h4>4. 原文链接</h4>
            ${referenceHtml(item)}
          </div>
        </div>
      `;
    }

    function itemKeyPoints(item) {
      const points = Array.isArray(item.key_points_list)
        ? item.key_points_list
        : (Array.isArray(item.key_points) ? item.key_points : []);
      const clean = points.filter(Boolean).slice(0, 3);
      return clean.length ? clean : ['需要打开原文进一步确认方法、数据和适用边界。'];
    }

    function referenceHtml(item) {
      const url = item.reference_url || '';
      if (!url) return '<p>暂无可打开链接</p>';
      return `
        <a class="reader-reference" href="${escapeAttr(url)}" target="_blank" rel="noopener noreferrer">打开原文</a>
        <small class="reference-url">${escapeHtml(url)}</small>
      `;
    }

    function bar(label, value) {
      const score = Number(value || 0);
      const width = Math.max(0, Math.min(100, score * 10));
      return `
        <div class="bar">
          <span>${label}</span>
          <div class="bar-track"><div class="bar-fill" style="width: ${width}%"></div></div>
          <b>${score.toFixed(1)}</b>
        </div>
      `;
    }

    function countBy(list, key) {
      return list.reduce((acc, item) => {
        acc[item[key]] = (acc[item[key]] || 0) + 1;
        return acc;
      }, {});
    }

    function averageScore(list) {
      if (!list.length) return 0;
      return list.reduce((sum, item) => sum + Number(item.final_score || 0), 0) / list.length;
    }

    function option(value, label) {
      return `<option value="${escapeAttr(value)}">${escapeHtml(label)}</option>`;
    }

    function sectionButton(section, label, count) {
      return `
        <button class="category-button section-button" type="button" data-section="${escapeAttr(section)}">
          <span>${escapeHtml(label)}</span>
          <span class="count">${count}</span>
        </button>
      `;
    }

    function categoryButton(category, count) {
      return `
        <button class="category-button" type="button" data-category="${escapeAttr(category)}">
          <span>${escapeHtml(category === 'All' ? '全部' : categoryLabel(category))}</span>
          <span class="count">${count}</span>
        </button>
      `;
    }

    function categoryLabel(category) {
      return categoryLabels[category] || category;
    }

    function sectionLabel(sectionKey) {
      const section = (payload.sections || []).find((item) => item.key === sectionKey);
      return section ? section.label : '其他';
    }

    function feedTitle() {
      const parts = [];
      if (state.section !== 'All') parts.push(sectionLabel(state.section));
      if (state.category !== 'All') parts.push(categoryLabel(state.category));
      return parts.length ? parts.join(' / ') : '今日情报';
    }

    function priorityLabel(priority) {
      return priorityLabels[priority] || priority;
    }

    function sourceTypeLabel(sourceType) {
      return sourceTypeLabels[sourceType] || sourceType;
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function escapeAttr(value) {
      return escapeHtml(value).replaceAll('`', '&#096;');
    }

    init();
  </script>
</body>
</html>
