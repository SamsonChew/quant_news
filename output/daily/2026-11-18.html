  <style>

      top: 0;

      padding: 16px 32px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(18px);

    .brand {
      display: flex;
      align-items: baseline;
      gap: 12px;
      min-width: 0;

    .brand h1 {
      display: flex;
      gap: 10px;

      margin: 0;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.02em;
      white-space: nowrap;
    }

    .brand h1::before {
      content: "";
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background:
        conic-gradient(from 0deg, var(--blue) 0 25%, var(--red) 0 50%, var(--yellow) 0 75%, var(--green) 0 100%);

      grid-template-columns: 1fr 170px 170px 150px;
      gap: 10px;

    .control {

      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel);
      color: var(--ink);
      padding: 0 12px;
      outline: none;
    }

    .control:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.14);
    }

    .layout {
      display: grid;
      grid-template-columns: 260px minmax(420px, 1fr) 420px;
      gap: 22px;
      padding: 24px 32px 36px;
    }

    .rail,

      position: sticky;
      top: 86px;
      height: calc(100vh - 112px);
      overflow: auto;
    }

    .rail,
    .detail,

      min-width: 0;

      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 18px;
    }

    .metric {
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--panel);
      padding: 12px;
      box-shadow: 0 1px 2px rgba(60, 64, 67, 0.08);

    .metric:nth-child(3) { border-top: 3px solid var(--yellow); }

    .metric b {
      display: block;
      font-size: 22px;
      line-height: 1;
    }

    .metric span {
      display: block;
      margin-top: 7px;
      color: var(--muted);
      font-size: 12px;
    }

    .section-label {

      font-size: 12px;
      font-weight: 700;

      text-align: left;
      cursor: pointer;

    .category-button:hover,

      background: var(--blue-soft);
      color: #174ea6;
    }

      font-size: 18px;
      font-weight: 700;
    }

    .result-count {
      color: var(--muted);
      font-size: 13px;

      display: grid;
      gap: 10px;

    .section-group-header {

      align-items: center;
      padding: 6px 2px 4px;
      margin-top: 10px;
      border-bottom: 2px solid var(--line);

    .section-group-header:first-child {
      margin-top: 0;
    }

    .section-group-title {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .section-group-header[data-section="deep_learning_quant"] .section-group-title { color: var(--blue); }
    .section-group-header[data-section="ai_quant_tools"] .section-group-title { color: var(--green); }
    .section-group-header[data-section="daily_news"] .section-group-title { color: var(--yellow); }

    .section-group-count {
      color: var(--muted);
      font-size: 12px;
    }

    .item {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--panel);
      box-shadow: 0 1px 2px rgba(60, 64, 67, 0.10);
      padding: 18px;
      cursor: pointer;
      transition: border-color 140ms ease, transform 140ms ease, box-shadow 140ms ease;
    }

    .item::before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 4px;
      background: linear-gradient(90deg, var(--blue), var(--red), var(--yellow), var(--green));
    }

    .item[data-section="deep_learning_quant"]::before { background: var(--blue); }
    .item[data-section="ai_quant_tools"]::before { background: var(--green); }
    .item[data-section="daily_news"]::before { background: var(--yellow); }

    .item:hover,
    .item.active {
      border-color: #c6dafc;
      box-shadow: var(--shadow);
      transform: translateY(-2px);
    }

    .item-top {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 14px;
      align-items: start;

    .item h3 {
      margin: 0;
      font-size: 16px;

      padding: 6px 8px;
      text-align: center;
      font-weight: 800;

    }

    .meta {

      margin: 10px 0;

      font-size: 12px;

    .tag {

      line-height: 1.2;

      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid var(--line);

      margin: 0 0 8px;

      font-size: 12px;
      letter-spacing: 0.02em;

      color: #30342d;

      margin: 0;

      display: grid;

      height: 100%;
      border-radius: inherit;

      display: inline-flex;
      align-items: center;

      min-height: 38px;

    .feedback-row {

    .feedback-btn {
      background: #f1f3f4;
      border: 1px solid transparent;
      border-radius: 999px;

      font-size: 13px;
      cursor: pointer;
      transition: background 120ms, border-color 120ms;

    .feedback-btn:hover { background: var(--blue-soft); }
    .feedback-btn.active-up { background: var(--green-soft); border-color: var(--green); }
    .feedback-btn.active-down { background: var(--red-soft); border-color: var(--red); }

    .feedback-hint {
      color: var(--muted);
      font-size: 11px;
    }

    .empty {
      border: 1px dashed var(--line);
      border-radius: var(--radius);
      padding: 28px;
      color: var(--muted);
      background: var(--panel);
    }

    @media (max-width: 1180px) {
      .layout {
        grid-template-columns: 220px 1fr;
      }

      .detail {
        position: static;
        grid-column: 1 / -1;
        height: auto;
      }
    }

    @media (max-width: 820px) {
      .topbar {
        grid-template-columns: 1fr;
        padding: 14px;
      }

      .brand {
        display: grid;
        gap: 4px;
      }

      .brand h1 {
        white-space: normal;
        font-size: 21px;
      }

      .controls {
        grid-template-columns: 1fr;
      }

      .layout {
        grid-template-columns: 1fr;
        padding: 14px;
      }

      .rail,
      .detail {
        position: static;
        height: auto;
      }

      .metric-grid {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>

 "category": "Machine Learning for Finance", "tags": ["execution", "feature engineering", "forecasting", "machine learning", "market data", "risk"], "language": "en", "metadata": {"arxiv_categories": ["cs.CE"]}, "one_line_summary": "把止损止盈规则写进标签构造：执行感知标注 + 专家模型集成，在时间前向测试中风险调整后表现优于方向标签与单模型基线", "technical_summary": "方向预测（涨/跌）与实际下单之间缺一层执行规则和风险控制，模型输出难以直接转成可执行动作，这是要解决的问题。做法是把多资产行情、特征工程与筛选、按品种拆分的专家预测模型、集成学习串成一条管线，关键改动在标签构造：不再用未来价格方向做 y，而是用预设止损、止盈规则下这笔交易的真实结果做 y。模型输出被转成结构化建议，包含方向、入场价、止损、止盈、风险回报比五项。评估用时间前向测试（time-aware forward testing），结论是执行感知标签在风险调整后表现优于传统方向标签，集成管线在关键交易指标上优于单一模型基线；另有一套云端自动化部署证明可日常运行。原文未披露夏普、年化收益、最大回撤、准确率等任何具体数值，也未说明标的池、样本区间与成本假设。", "key_points": ["全文无夏普、收益、精度等任何数字，仅称执行感知标签在时间前向测试中风险调整后优于方向标签，结论待复核。", "可用性取决于能否拿到多资产行情并接受固定止损止盈假设，标签构造逻辑简单可复现，但无代码、无超参、无特征清单。", "把止损止盈阈值写进标签等于把自由参数塞进目标函数，阈值一改标签全变，未披露成本与滑点，过拟合空间大。"], "quant_relevance": "执行 / 交易成本；研究工具 / 工作流提效", "possible_use_case": "把现有日频方向三分类标签替换为「按 ATR 倍数设定止损止盈后的实际盈亏」标签，在自己的股票池上用同一套特征重训 XGBoost，再与方向标签版本对比样本外夏普和盈亏比，先跑一个小市值子池验证方向是否成立。", "limitations": "只拿到摘要，样本区间、标的池、交易成本、滑点假设、止损止盈阈值设定方式全部缺失；时间前向测试的窗口长度和重训频率未说明；结构化输出（入场价、风险回报比）无法从摘要判断是否经过独立样本验证；无开源代码，复现只能靠自行重搭；原文缺乏量化证据，本摘要基于定性描述。", "read_priority": "低", "key_figures_md": "", "relevance_score": 8.0, "novelty_score": 9.565, "academic_score": 10.0, "discussion_score": 2.0, "actionable_score": 7.5, "final_score": 7.613, "display_title": "交易执行、特征工程、预测、机器学习研究论文", "tldr": "把止损止盈规则写进标签构造：执行感知标注 + 专家模型集成，在时间前向测试中风险调整后表现优于方向标签与单模型基线", "core_value": "对你的量化工作帮助：把它转成一个特征工程实验，对比原始价格特征、差分特征和分数阶差分特征，重点看平稳性、信息保留、样本外泛化和是否引入未来函数。", "key_points_list": ["全文无夏普、收益、精度等任何数字，仅称执行感知标签在时间前向测试中风险调整后优于方向标签，结论待复核。", "可用性取决于能否拿到多资产行情并接受固定止损止盈假设，标签构造逻辑简单可复现，但无代码、无超参、无特征清单。", "把止损止盈阈值写进标签等于把自由参数塞进目标函数，阈值一改标签全变，未披露成本与滑点，过拟合空间大。"], "reference_url": "http://arxiv.org/abs/2611.20348v1", "report_sections": ["ai_quant_tools"], "report_section_labels": ["AI 量化工具"], "category_label": "金融机器学习", "priority_label": "低", "source_type_label": "论文"}, {"id": "abab48c636bbba154df9a120aab8dea1eb923b24f15a9b7ce1dedc11231a789e", "source": "arXiv", "source_type": "paper", "title": "The Only Edge Was Memorized in Training: LLM Trading Agents Around Earnings and Bad News", "url": "http://arxiv.org/abs/2611.22177v1", "authors": ["Jackson Wang"], "published_at": "2026-11-17", "collected_at": "2026-11-18T04:02:38Z", "raw_text": "Large language model (LLM) trading agents are tested on news, but news reaches stock prices within minutes, and a benchmark that replays headlines at their publication time finds no alpha in trading on them. Money can then remain in two places, before news whose date is known, such as earnings announcements, and after bad news, if the market's fall went too far. However, studies of LLMs and earnings read documents published with or after the announcement, and studies of reversal sort monthly portfolios, so neither tells whether an agent can trade these moments after costs. In this paper, we test LLM agents at both moments on the same look-ahead-free benchmark, before 598 earnings announcements and after 409 bad-news drops of large US stocks. Every input is cut at the decision close, staged agents are compared with single calls, simple rules and a logistic regression, and every decision is made with and without the stock's name. Across five models from four vendors, no agent beat the simple bets. Before earnings, the agents mostly bought and earned what buying before every announcement earned, and after bad news, a Gemini-based agent called almost every fall an overreaction while no agent picked better dips than buying them all. The only gains came from what the models had memorized in training. Given only the ticker and the dates, a GPT-based model called the direction of 59.2% of the announcements before its training cutoff and 53.3% after it. Agent builders should therefore compare an event agent with the simple bet and test it blind after the training cutoff.", "abstract": "Large language model (LLM) trading agents are tested on news, but news reaches stock prices within minutes, and a benchmark that replays headlines at their publication time finds no alpha in trading on them. Money can then remain in two places, before news whose date is known, such as earnings announcements, and after bad news, if the market's fall went too far. However, studies of LLMs and earnings read documents published with or after the announcement, and studies of reversal sort monthly portfolios, so neither tells whether an agent can trade these moments after costs. In this paper, we test LLM agents at both moments on the same look-ahead-free benchmark, before 598 earnings announcements and after 409 bad-news drops of large US stocks. Every input is cut at the decision close, staged agents are compared with single calls, simple rules and a logistic regression, and every decision is made with and without the stock's name. Across five models from four vendors, no agent beat the simple bets. Before earnings, the agents mostly bought and earned what buying before every announcement earned, and after bad news, a Gemini-based agent called almost every fall an overreaction while no agent picked better dips than buying them all. The only gains came from what the models had memorized in training. Given only the ticker and the dates, a GPT-based model called the direction of 59.2% of the announcements before its training cutoff and 53.3% after it. Agent builders should therefore compare an event agent with the simple bet and test it blind after the training cutoff.", "content_hash": "9e95226631087feafd9b3c052678ca1107b011d30fbfce211d8c6a43cd3b05ac", "category": "LLM / Agents for Quant", "tags": ["agent", "alpha", "large language model", "llm"], "language": "en", "metadata": {"arxiv_categories": ["cs.AI", "cs.MA"]}, "one_line_summary": "LLM 交易代理在 598 次财报前与 409 次暴跌后都未能跑赢简单押注，唯一超额收益来自训练记忆（方向准确率从 59.2% 降到 53.3%）", "technical_summary": "核心问题是：LLM 交易代理在事件驱动场景里能否在计入成本后赚钱。新闻在几分钟内就被定价，剩余 alpha 只可能出现在「日期已知的财报公告前」和「坏消息暴跌过度后的反转」这两个时点。作者搭建了一套无前视（look-ahead-free）基准：598 次美股大盘股财报公告前、409 次坏消息暴跌后，所有输入都截断到决策时点的收盘，对比多阶段 agent、单次调用、简单规则和逻辑回归四类做法，并在给或不给股票代码两种条件下测试 4 家厂商的 5 个模型。结论是没有任何 agent 跑赢简单押注：财报前它们大多直接买入，收益与「每次财报前都买」持平；暴跌后 Gemini 系代理几乎把每次下跌都判为过度反应，但没有一个代理挑出的坑位比「全部买入」更好。唯一显著的超额来自训练记忆——只给 ticker 和日期、不给任何新闻文本时，GPT 系模型对 59.2% 的财报公告判对方向（训练截止前），截止后掉到 53.3%。", "key_points": ["无前视基准下，4 家厂商 5 个模型全部跑不赢「财报前全买」和「暴跌全买」两条简单规则", "评测协议可直接复用：输入截断到决策收盘、强制对照简单押注与逻辑回归、按训练截止日切分盲测", "仅给 ticker 和日期时准确率 59.2% 在训练截止后掉到 53.3%，说明所谓 alpha 基本是记忆残留"], "quant_relevance": "研究工具 / 工作流提效；因子 / alpha 信号", "possible_use_case": "把该协议固化成内部 agent 上线前的强制 checklist——任何 LLM 事件策略先在自建事件库里与「全买」基准、逻辑回归三方对照，并按模型的训练截止日切分做盲测，未通过不进实盘；同时把「只给 ticker + 日期」的记忆探针脚本作为模型选型的常规体检项。", "limitations": "摘要层面未披露交易成本、滑点和持仓期的具体假设，无法判断「平手」是费前还是费后；样本仅 598 次财报、409 次暴跌，且全为美股大盘股，外推到 A 股、小盘股或日内频率需重新验证；测试的 5 个模型版本未列明，结论对新发布模型不一定成立；「agent 基本都在买」说明提示词与架构设计可能过于保守，简单基准或许会低估经过精心设计的 agent。", "read_priority": "高", "key_figures_md": "- **主结果对比表（HTML 全文：https://arxiv.org/html/2611.22177）**：财报前与暴跌后两个场景下，5 个 LLM agent 与「全买」简单规则、逻辑回归的收益与方向准确率横向对比\n- **训练截止前后对比（HTML 全文：https://arxiv.org/html/2611.22177）**：仅给 ticker + 日期的盲测方向准确率：训练截止前 59.2% 对截止后 53.3%，直接量化记忆衰减\n- **事件样本构成（HTML 全文：https://arxiv.org/html/2611.22177）**：598 次财报公告与 409 次坏消息暴跌的样本分布、股票池与决策时点设定\n- [原文图表（HTML版）](https://arxiv.org/html/2611.22177)", "relevance_score": 8.0, "novelty_score": 9.78, "academic_score": 10.0, "discussion_score": 2.0, "actionable_score": 6.5, "final_score": 7.456, "display_title": "阿尔法、大模型、交易智能体研究论文", "tldr": "LLM 交易代理在 598 次财报前与 409 次暴跌后都未能跑赢简单押注，唯一超额收益来自训练记忆（方向准确率从 59.2% 降到 53.3%）", "core_value": "对你的量化工作帮助：把它拆成一个量化大模型 / 智能体复现任务，先验证阿尔法、大模型、交易智能体是否真的带来样本外提升，再检查交易成本、数据泄漏和换手约束。", "key_points_list": ["无前视基准下，4 家厂商 5 个模型全部跑不赢「财报前全买」和「暴跌全买」两条简单规则", "评测协议可直接复用：输入截断到决策收盘、强制对照简单押注与逻辑回归、按训练截止日切分盲测", "仅给 ticker 和日期时准确率 59.2% 在训练截止后掉到 53.3%，说明所谓阿尔法基本是记忆残留"], "reference_url": "http://arxiv.org/abs/2611.22177v1", "report_sections": ["ai_quant_tools"], "report_section_labels": ["AI 量化工具"], "category_label": "量化大模型 / 智能体", "priority_label": "高", "source_type_label": "论文"}, {"id": "3914fbc7db09493ccb960517f89b78a106fe0c0047a960231788c05b97db3483", "source": "arXiv", "source_type": "paper", "title": "MSAR: Next-Scale Autoregressive Forecasting for Time Series via Modular Multi-Scale Decoupling", "url": "http://arxiv.org/abs/2611.20714v1", "authors": ["Fanda Fan", "Kuiye Ding", "Liming Mao", "Bingsong Wang", "Yao Wang", "Xiaorui Wang", "Ruijie Jian", "Zhipeng Liu", "Luqi Gong", "Zhenghua Lu", "Chunjie Luo", "Jianfeng Zhan"], "published_at": "2026-11-16", "collected_at": "2026-11-18T04:01:36Z", "raw_text": "Time series forecasting underpins critical applications in finance, energy, healthcare, and transportation. Although deep models have achieved strong results, most adopt single-scale modeling or restrict multiscale processing to the input side, causing a misalignment between multiscale inputs and single-scale outputs and limiting predictive power. We introduce the Modular Scale-wise Autoregressive Framework (MSAR), a model-agnostic design that forecasts progressively across multiple temporal resolutions. MSAR offers three advantages: (1) scale-wise aligned modeling, which disentangles heterogeneous temporal patterns by aligning inputs and outputs at each scale; (2) scale-wise autoregression, where coarse-scale predictions guide finer-scale forecasting through hierarchical information flow; and (3) a modular architecture, enabling seamless integration with diverse backbones such as CNNs, MLPs, and Transformers. Extensive experiments across a broad set of datasets and forecasting models demonstrate that MSAR achieves consistent improvements in both accuracy and inference efficiency, validating the effectiveness of scale-aligned autoregression for multiscale time series forecasting. The code is available at: https://github.com/Oryxo/MSAR.", "abstract": "Time series forecasting underpins critical applications in finance, energy, healthcare, and transportation. Although deep models have achieved strong results, most adopt single-scale modeling or restrict multiscale processing to the input side, causing a misalignment between multiscale inputs and single-scale outputs and limiting predictive power. We introduce the Modular Scale-wise Autoregressive Framework (MSAR), a model-agnostic design that forecasts progressively across multiple temporal resolutions. MSAR offers three advantages: (1) scale-wise aligned modeling, which disentangles heterogeneous temporal patterns by aligning inputs and outputs at each scale; (2) scale-wise autoregression, where coarse-scale predictions guide finer-scale forecasting through hierarchical information flow; and (3) a modular architecture, enabling seamless integration with diverse backbones such as CNNs, MLPs, and Transformers. Extensive experiments across a broad set of datasets and forecasting models demonstrate that MSAR achieves consistent improvements in both accuracy and inference efficiency, validating the effectiveness of scale-aligned autoregression for multiscale time series forecasting. The code is available at: https://github.com/Oryxo/MSAR.", "content_hash": "f0b9de25328050bf160fd037d720a47e2e235a596c3b9ebafd58d962bd481066", "category": "Machine Learning for Finance", "tags": ["forecasting", "time series"], "language": "en", "metadata": {"arxiv_categories": ["cs.LG"]}, "one_line_summary": "MSAR 把时间序列预测改为由粗到细的尺度自回归，可插 CNN/MLP/Transformer 且代码开源（摘要未给数字）", "technical_summary": "多数深度时序模型只在输入端做多尺度处理，输出仍是单尺度，造成输入输出尺度错配。MSAR 把输入和输出在每个分辨率上对齐，用粗尺度预测指导细尺度预测，形成层次化自回归信息流。架构是模块化的，可接 CNN、MLP、Transformer 等主干。摘要称在广泛数据集和多种预测模型上同时提升准确率与推理效率，但没有给出数据集名称、误差指标或提升幅度。", "key_points": ["原文缺乏量化指标，结论待复核：MSAR 按粗到细尺度自回归，可套 CNN/MLP/Transformer 主干。", "代码已开源于 github.com/Oryxo/MSAR，模型无关，接入现有 CNN/MLP/Transformer 时序预测器即可试；需自建多尺度训练与推理管线。", "摘要未给数据集、预测步长、交易成本与样本外设置，无法判断金融高频/日频真实增益；多尺度分解还可能引入前视偏差。"], "quant_relevance": "因子 / alpha 信号；研究工具 / 工作流提效", "possible_use_case": "在现有日频 alpha 模型上，把单尺度输出替换为 MSAR：先预测周/月粗尺度收益方向，再自回归到日频，比较 RankIC 与换手率。", "limitations": "仅有摘要，缺少具体数据集、误差指标、提升幅度和样本外设置；未考虑交易成本、滑点；金融噪声下多尺度分解有过拟合风险；代码可用但需独立复现。", "read_priority": "中", "key_figures_md": "- **arXiv HTML**：原文图表未在摘要中给出，需打开 https://arxiv.org/html/2611.20714 查看 MSAR 框架图与精度/效率对比图\n- [原文图表（HTML版）](https://arxiv.org/html/2611.20714)", "relevance_score": 6.1, "novelty_score": 9.565, "academic_score": 10.0, "discussion_score": 2.0, "actionable_score": 7.5, "final_score": 7.043, "display_title": "预测、时间序列、Transformer、能源交易研究论文", "tldr": "MSAR 把时间序列预测改为由粗到细的尺度自回归，可插 CNN/MLP/Transformer 且代码开源（摘要未给数字）", "core_value": "对你的量化工作帮助：把它拆成一个金融机器学习复现任务，先验证预测、时间序列、Transformer、能源交易是否真的带来样本外提升，再检查交易成本、数据泄漏和换手约束。", "key_points_list": ["原文缺乏量化指标，结论待复核：MSAR 按粗到细尺度自回归，可套 CNN/MLP/Transformer 主干。", "代码已开源于 github.com/Oryxo/MSAR，模型无关，接入现有 CNN/MLP/Transformer 时序预测器即可试；需自建多尺度训练与推理管线。", "摘要未给数据集、预测步长、交易成本与样本外设置，无法判断金融高频/日频真实增益；多尺度分解还可能引入前视偏差。"], "reference_url": "http://arxiv.org/abs/2611.20714v1", "report_sections": ["ai_quant_tools"], "report_section_labels": ["AI 量化工具"], "category_label": "金融机器学习", "priority_label": "中", "source_type_label": "论文"}, {"id": "82e38ede5a05277d170d1c66517485f2b525f2c6146f5692f37fadccb87d16d7", "source": "arXiv", "source_type": "paper", "title": "Think Once, Act Fast: Cost-Effective Recursive Self-Improvement for Decision Model Harness", "url": "http://arxiv.org/abs/2611.22432v1", "authors": ["Siqi Lai", "Haitao Li", "Hao Liu"], "published_at": "2026-11-17", "collected_at": "2026-11-18T04:02:38Z", "raw_text": "Fast System-1 models enable responsive actions but struggle with complex or unfamiliar tasks. Large language model (LLM)-based System-2 provides strong reasoning capabilities, yet repeated invocation incurs substantial latency and computational costs. To bridge this gap, we propose JevRSI, a System-1/System-2 collaboration framework that transforms LLM reasoning into transferable decision support through recursive harness improvement. A Jev-style System-1 model enables low-latency action selection, while an asynchronous System-2 LLM develops a modular harness. The harness integrates procedures, state memory, and world models to provide decision contexts spanning the past, present, and future. Utility-driven retrieval selects modules based on both contextual relevance and their utility on previous tasks. Environmental feedback guides targeted revisions and enables recursive self-improvement. Experiments across three datasets show that JevRSI consistently improves decision quality, matching or surpassing LLM agents in several settings. It preserves low-latency execution with favorable performance-cost trade-offs. Moreover, System-2 development interventions decrease as the harness evolves, amortizing System-2 costs through continuous improvement. Our project is available at https://github.com/usail-hkust/JevRSI.", "abstract": "Fast System-1 models enable responsive actions but struggle with complex or unfamiliar tasks. Large language model (LLM)-based System-2 provides strong reasoning capabilities, yet repeated invocation incurs substantial latency and computational costs. To bridge this gap, we propose JevRSI, a System-1/System-2 collaboration framework that transforms LLM reasoning into transferable decision support through recursive harness improvement. A Jev-style System-1 model enables low-latency action selection, while an asynchronous System-2 LLM develops a modular harness. The harness integrates procedures, state memory, and world models to provide decision contexts spanning the past, present, and future. Utility-driven retrieval selects modules based on both contextual relevance and their utility on previous tasks. Environmental feedback guides targeted revisions and enables recursive self-improvement. Experiments across three datasets show that JevRSI consistently improves decision quality, matching or surpassing LLM agents in several settings. It preserves low-latency execution with favorable performance-cost trade-offs. Moreover, System-2 development interventions decrease as the harness evolves, amortizing System-2 costs through continuous improvement. Our project is available at https://github.com/usail-hkust/JevRSI.", "content_hash": "97a850261975ae4707fc3b5c3f49f75fc65f13e67411447b424eb7404ac6687e", "category": "LLM / Agents for Quant", "tags": ["execution", "large language model", "llm", "reasoning"], "language": "en", "metadata": {"arxiv_categories": ["cs.AI"]}, "one_line_summary": "JevRSI 用轻量 System-1 快速决策、异步 LLM 迭代可复用 harness，在 3 个数据集上决策质量追平或超过直接调用 LLM agent", "technical_summary": "直接让 LLM 做每一步决策（System-2）推理强但每次调用都付延迟和 token 成本，纯快模型（System-1）反应快却在陌生态势下决策差。JevRSI 把两者拆开：Jev 风格的 System-1 负责低延迟动作选择，异步运行的 LLM System-2 离线构建一个模块化 harness，内含 procedures（流程）、state memory（状态记忆）、world models（世界模型）三类模块，分别提供过去、现在、未来的决策上下文。在线时用 utility-driven retrieval 按「上下文相关性 + 该模块在历史任务上的实际效用」挑选模块拼装上下文，环境反馈再驱动模块做定向修订，形成递归自我改进。结果是在三个数据集上决策质量稳定提升，多个设定下追平或超过纯 LLM agent，同时保持低延迟；随着 harness 成熟，System-2 的开发介入次数下降，LLM 成本被摊薄。摘要未给出任何具体精度、延迟毫秒数或成本下降比例。", "key_points": ["System-1 快速出手 + 异步 LLM 迭代 harness，在 3 个数据集上决策质量追平或超过直接调用 LLM agent，且 System-2 介入次数随 harness 演进递减", "代码已开源在 usail-hkust/JevRSI；需可交互环境提供反馈信号，模块化 harness 便于嵌入自有决策任务，实现门槛主要在环境接口与效用打分设计", "仅能看到摘要：数据集未具名、无精度/延迟/成本下降的具体数字，「摊薄 System-2 成本」的幅度无法验证，图表实际内容未核实"], "quant_relevance": "研究工具 / 工作流提效；执行 / 交易成本（LLM 重复调用的延迟与算力开销）", "possible_use_case": "把 harness 结构搬到交易 agent：System-1 用轻量模型在盘口/因子快照上做动作选择，LLM 离线生成并迭代「事件应对流程 + 历史相似行情记忆 + 行情演化世界模型」三类模块，按历史命中率检索；先在仿真撮合环境跑一个月的分钟级调仓任务，对比纯 LLM agent 的决策延迟与收益。", "limitations": "目前只有摘要，三个数据集名称、决策质量指标（是准确率、累计收益还是任务成功率）、延迟对比全部缺失，无法判断增益幅度；「环境反馈驱动修订」在真实市场中反馈稀疏且带噪，递归自我改进有对历史行情过拟合的风险；utility-driven retrieval 依赖历史效用估计，市场状态切换后旧模块效用可能失效；这是学术基准环境下的结果，未涉及交易成本、滑点与真实撮合延迟，实盘可用性待验证；建议以仓库代码和全文数据复核后再决定是否投入。", "read_priority": "中", "key_figures_md": "", "relevance_score": 6.6, "novelty_score": 9.78, "academic_score": 10.0, "discussion_score": 2.0, "actionable_score": 6.5, "final_score": 7.036, "display_title": "交易执行、大模型研究论文", "tldr": "JevRSI 用轻量 System-1 快速决策、异步 LLM 迭代可复用 harness，在 3 个数据集上决策质量追平或超过直接调用 LLM agent", "core_value": "对你的量化工作帮助：把它拆成一个量化大模型 / 智能体复现任务，先验证交易执行、大模型是否真的带来样本外提升，再检查交易成本、数据泄漏和换手约束。", "key_points_list": ["System-1 快速出手 + 异步 LLM 迭代 harness，在 3 个数据集上决策质量追平或超过直接调用 LLM agent，且 System-2 介入次数随 harness 演进递减", "代码已开源在 usail-hkust/JevRSI；需可交互环境提供反馈信号，模块化 harness 便于嵌入自有决策任务，实现门槛主要在环境接口与效用打分设计", "仅能看到摘要：数据集未具名、无精度/延迟/成本下降的具体数字，「摊薄 System-2 成本」的幅度无法验证，图表实际内容未核实"], "reference_url": "http://arxiv.org/abs/2611.22432v1", "report_sections": ["ai_quant_tools"], "report_section_labels": ["AI 量化工具"], "category_label": "量化大模型 / 智能体", "priority_label": "中", "source_type_label": "论文"}, {"id": "f39c3617e7cdecab19fcca3b28e8de2244a85ffa475cc744616e9f9ae1d51576", "source": "arXiv", "source_type": "paper", "title": "Who Gets the Grid Capacity? Allocating Dynamic Access Among Multiple Virtual Power Plants", "url": "http://arxiv.org/abs/2611.21981v1", "authors": ["Nakul Sreekanth", "Jun He", "Andrew L. Liu", "S. Sivaranjani"], "published_at": "2026-11-16", "collected_at": "2026-11-18T04:02:01Z", "raw_text": "Virtual power plants (VPPs) trade in the same wholesale market and share distribution lines and transformers, and uncoordinated, profit-maximizing VPPs can push a shared transformer past its thermal limit or drive a feeder voltage out of band. The utility, which only observes the front-of-the-meter net injection at each bus, must keep the network safe from that net injection alone. We allocate a 24-hour active and reactive operating envelope to each VPP by a Benders decomposition: the utility sets a trial envelope, each VPP solves its private convex portfolio problem, and the returned value and dual gradient become supporting cuts that rebuild its value function while its schedule, state, and cost stay private. The envelope carries the transformer's thermal state across hours, bounds a joint conditional value-at-risk over forecast uncertainty, and is re-optimized each hour with the current hour committed. On a reduced IEEE-13 feeder with real load and prices, an active-power-only implementation lowers the transformer's peak-temperature CVaR from 254 to 97\\,$^\\circ$C at a 28\\% value give-up and holds the transformer below its limit where nameplate access breaches it.", "abstract": "Virtual power plants (VPPs) trade in the same wholesale market and share distribution lines and transformers, and uncoordinated, profit-maximizing VPPs can push a shared transformer past its thermal limit or drive a feeder voltage out of band. The utility, which only observes the front-of-the-meter net injection at each bus, must keep the network safe from that net injection alone. We allocate a 24-hour active and reactive operating envelope to each VPP by a Benders decomposition: the utility sets a trial envelope, each VPP solves its private convex portfolio problem, and the returned value and dual gradient become supporting cuts that rebuild its value function while its schedule, state, and cost stay private. The envelope carries the transformer's thermal state across hours, bounds a joint conditional value-at-risk over forecast uncertainty, and is re-optimized each hour with the current hour committed. On a reduced IEEE-13 feeder with real load and prices, an active-power-only implementation lowers the transformer's peak-temperature CVaR from 254 to 97\\,$^\\circ$C at a 28\\% value give-up and holds the transformer below its limit where nameplate access breaches it.", "content_hash": "9178e968273154c53a1f660d974062b5ffd0eedd5d06f66a5267da5c1377bd3e", "category": "Risk Management", "tags": ["cvar", "portfolio", "risk", "transformer"], "language": "en", "metadata": {"arxiv_categories": ["eess.SY"]}, "one_line_summary": "用 Benders 分解给多个虚拟电厂分配 24 小时有功/无功运行包络，把配电变压器峰值温度 CVaR 从 254°C 压到 97°C，代价是 28% 的收益让渡", "technical_summary": "问题是：多个虚拟电厂在同一批发市场套利、共用同一条配电线路和变压器，各自追求利润最大化会把变压器推过热点温度上限或把馈线电压顶出允许区间；而电网公司只能在电表前端看到每个节点的净注入，看不到 VPP 内部的调度、状态和成本。做法是把 24 小时的有功与无功运行包络作为分配对象，用 Benders 分解迭代：电网先给一个试探包络，每个 VPP 在包络内解自己的私有凸组合优化，返回的最优值和对应包络约束的对偶梯度构成支撑割，用来在电网侧重建该 VPP 的价值函数，全过程不暴露 VPP 的调度计划、储能状态和成本参数。包络设计上让变压器热状态跨时段传导（本小时温度影响后续可用容量），并对预测不确定性下的联合 CVaR 设上界，每小时用当前小时已锁定的承诺重新优化滚动执行。在带真实负荷与电价的缩减版 IEEE-13 馈线上，只做有功的版本把变压器峰值温度 CVaR 从 254°C 降到 97°C，代价是 28% 的社会价值让渡，并且在按铭牌容量分配会突破温度限值的工况下仍把变压器压在限值以内。", "key_points": ["Benders 对偶割让电网只靠净注入就重建各 VPP 价值函数，峰值温度 CVaR 从 254°C 降到 97°C，代价 28% 价值让渡。", "要求每个 VPP 内部问题是凸的（储能、可调负荷、火电组合），非凸机组或套利逻辑需松弛；真实负荷与电价数据可直接替换。", "仅验证有功、单条缩减版 IEEE-13 馈线，无功与电压耦合未验证；28% 让渡的绝对金额与 VPP 数量扩展性均未给出。"], "quant_relevance": "风险建模；组合构建 / 权重优化（稀缺容量在多个自利主体间的分配与定价）", "possible_use_case": "把包络 + 对偶割结构搬到多策略/多交易台共享保证金与资金额度的场景：风控方只下发每个台子的 24 小时仓位/风险包络，各台子在包络内自优化并回传影子价格，用于跨台子的资金定价与限额再分配。", "limitations": "只在一条缩减版 IEEE-13 馈线上验证，无跨馈线、跨系统样本外测试；仅实现有功版本，无功与电压约束的实际耦合效果未量化；28% 价值让渡只给相对比例，缺绝对金额与对 VPP 盈利可持续性的影响；Benders 迭代次数、收敛速度与 VPP 数量增长的关系未报告，多主体下通信轮次可能成为瓶颈；不确定性以 CVaR 上界处理，但电价与负荷预测模型的误差分布假设未展开；未涉及 VPP 报价策略与市场清算的博弈反馈，若各主体策略性报价，包络的对偶价格可能被操纵。", "read_priority": "低", "key_figures_md": "- **Figure（变压器峰值温度 CVaR 对比）**：按铭牌容量接入 vs. Benders 分配包络下的变压器峰值温度 CVaR：254°C → 97°C；原图见 https://arxiv.org/html/2611.21981\n- **Figure（价值让渡 vs. 安全裕度权衡曲线）**：包络收紧程度与 28% 价值让渡之间的边际替代关系，对应变压器温度被压到限值以下的工作点\n- **Table（IEEE-13 算例汇总）**：缩减版 IEEE-13 馈线上各 VPP 的分配容量、目标值与变压器温度/电压越限统计（真实负荷与电价数据）\n- [原文图表（HTML版）](https://arxiv.org/html/2611.21981)", "relevance_score": 6.8, "novelty_score": 9.565, "academic_score": 9.98, "discussion_score": 2.0, "actionable_score": 5.5, "final_score": 6.85, "display_title": "组合、风险、Transformer研究论文", "tldr": "用 Benders 分解给多个虚拟电厂分配 24 小时有功/无功运行包络，把配电变压器峰值温度 CVaR 从 254°C 压到 97°C，代价是 28% 的收益让渡", "core_value": "对你的量化工作帮助：把它拆成一个风险管理复现任务，先验证组合、风险、Transformer 是否真的带来样本外提升，再检查交易成本、数据泄漏和换手约束。", "key_points_list": ["Benders 对偶割让电网只靠净注入就重建各 VPP 价值函数，峰值温度 CVaR 从 254°C 降到 97°C，代价 28% 价值让渡。", "要求每个 VPP 内部问题是凸的（储能、可调负荷、火电组合），非凸机组或套利逻辑需松弛；真实负荷与电价数据可直接替换。", "仅验证有功、单条缩减版 IEEE-13 馈线，无功与电压耦合未验证；28% 让渡的绝对金额与 VPP 数量扩展性均未给出。"], "reference_url": "http://arxiv.org/abs/2611.21981v1", "report_sections": ["deep_learning_quant"], "report_section_labels": ["深度学习量化未来"], "category_label": "风险管理", "priority_label": "低", "source_type_label": "论文"}, {"id": "2e90565e7821491e10d58a2059eb41f5e9cd6a6fd0a047523cf1504c6251fedf", "source": "arXiv", "source_type": "paper", "title": "Neural Marked Point Processes for Health Insurance Claims", "url": "http://arxiv.org/abs/2611.21326v1", "authors": ["Eva Flonner"], "published_at": "2026-11-16", "collected_at": "2026-11-18T04:01:32Z", "raw_text": "Health insurance claims exhibit temporal dependence, as previous claims may provide information about the timing, type and amount of subsequent claims. Such dependencies are difficult to capture with traditional actuarial models based on aggregated claim counts. We investigate a neural marked point process in which a causal Transformer represents individual claim histories and determines type-specific conditional intensities, allowing for self-excitation and interactions between claim types. The framework also incorporates conditional severity distributions, reporting delays and stochastic medical-cost inflation. We develop a likelihood-based calibration procedure that accounts for incomplete claim reporting and evaluate the model using both simulated and empirical data. A simulation study with 10,000 insurance contracts examines the recovery of known claim dynamics, while an application to MEPS-derived medical-event data assesses predictive performance. The fitted model reproduces the main patterns in claim frequencies and severities, although some discrepancies remain in the tails of the distributions. On the MEPS data, the neural model achieves better predictive performance than two generalized linear model benchmarks in terms of claim-count deviance and expenditure discrimination.", "abstract": "Health insurance claims exhibit temporal dependence, as previous claims may provide information about the timing, type and amount of subsequent claims. Such dependencies are difficult to capture with traditional actuarial models based on aggregated claim counts. We investigate a neural marked point process in which a causal Transformer represents individual claim histories and determines type-specific conditional intensities, allowing for self-excitation and interactions between claim types. The framework also incorporates conditional severity distributions, reporting delays and stochastic medical-cost inflation. We develop a likelihood-based calibration procedure that accounts for incomplete claim reporting and evaluate the model using both simulated and empirical data. A simulation study with 10,000 insurance contracts examines the recovery of known claim dynamics, while an application to MEPS-derived medical-event data assesses predictive performance. The fitted model reproduces the main patterns in claim frequencies and severities, although some discrepancies remain in the tails of the distributions. On the MEPS data, the neural model achieves better predictive performance than two generalized linear model benchmarks in terms of claim-count deviance and expenditure discrimination.", "content_hash": "c18f147d831bd64372fc71c8ea13e697820f9b79982f951e3d13e083dbd80f2f", "category": "Machine Learning for Finance", "tags": ["neural", "transformer"], "language": "en", "metadata": {"arxiv_categories": ["q-fin.RM"]}, "one_line_summary": "因果 Transformer 标记点过程建模医保理赔到达：MEPS 数据上理赔计数 deviance 与支出区分度均优于两个 GLM 基准", "technical_summary": "传统精算模型按聚合理赔计数建模，丢失了「前一次理赔预示下一次理赔时点、类型、金额」的时序依赖。做法是把每个保单看成标记点过程：由一个因果 Transformer 读取个体事件历史，输出分类型的条件强度，同时允许自激发与跨类型交互；再叠加条件严重度分布、报案延迟（reporting delay）和随机医疗成本通胀。标定用考虑理赔未完全上报的似然方法。验证分两步：10,000 份保险合同的模拟实验检验能否还原已知的理赔动态；MEPS 衍生的医疗事件数据上，理赔计数 deviance 和支出区分度两项指标都优于两个 GLM 基准。作者明确写出尾部仍有偏差。", "key_points": ["因果 Transformer 输出分类型条件强度并允许自激发与跨类型交互，在 MEPS 数据上理赔计数 deviance 和支出区分度均优于两个 GLM 基准（原文未给出具体提升百分比）。", "标定是带未上报理赔的似然方法，需要个体级事件流（时点 + 类型 + 金额 + 报案延迟）而非聚合计数表，实现成本高于 GLM，但没有公开代码。", "尾部拟合存在明显偏差，等于极端大额理赔被系统性低估；对尾部风险敏感的定价或资本计量场景，这一缺陷比均值拟合优度更致命。"], "quant_relevance": "因子 / alpha 信号；风险建模", "possible_use_case": "把「分类型条件强度 + 因果 Transformer 历史编码 + 报案延迟似然」这套结构换到逐笔成交数据上：以买单/卖单/撤单为标记类型、以交易所时间戳延迟替代报案延迟，先在一个品种的 tick 数据上复现强度自激发与跨类型交互，再和标准 Hawkes 基线比到达预测的 log-likelihood。", "limitations": "领域是医保精算，与二级市场交易的映射需要自己完成，作者没做任何金融数据实验；只有定性结论「优于两个 GLM」，没有给出 deviance 降幅、AUC 或区分度的具体数字；无公开代码；尾部拟合偏差意味着对极端事件（对应量化的跳跃风险、大单冲击）不可信；报案延迟与医疗通胀模块是行业特化组件，迁移到交易场景需整体替换。", "read_priority": "低", "key_figures_md": "- **Figure（模拟实验）**：10,000 份合同的模拟研究：估计的分类型条件强度与真实生成过程的恢复对比\n- **Table（MEPS 实证）**：神经标记点过程 vs 两个 GLM 基准：理赔计数 deviance 与支出区分度（discrimination）汇总\n- **Figure（拟合诊断）**：理赔频次与严重度的分布拟合对比，尾部出现可见偏差\n- [原文图表（HTML版）](https://arxiv.org/html/2611.21326)", "relevance_score": 5.4, "novelty_score": 9.565, "academic_score": 10.0, "discussion_score": 2.0, "actionable_score": 6.5, "final_score": 6.633, "display_title": "Transformer研究论文", "tldr": "因果 Transformer 标记点过程建模医保理赔到达：MEPS 数据上理赔计数 deviance 与支出区分度均优于两个 GLM 基准", "core_value": "对你的量化工作帮助：把它拆成一个金融机器学习复现任务，先验证 Transformer 是否真的带来样本外提升，再检查交易成本、数据泄漏和换手约束。", "key_points_list": ["因果 Transformer 输出分类型条件强度并允许自激发与跨类型交互，在 MEPS 数据上理赔计数 deviance 和支出区分度均优于两个 GLM 基准（原文未给出具体提升百分比）。", "标定是带未上报理赔的似然方法，需要个体级事件流（时点 + 类型 + 金额 + 报案延迟）而非聚合计数表，实现成本高于 GLM，但没有公开代码。", "尾部拟合存在明显偏差，等于极端大额理赔被系统性低估；对尾部风险敏感的定价或资本计量场景，这一缺陷比均值拟合优度更致命。"], "reference_url": "http://arxiv.org/abs/2611.21326v1", "report_sections": ["deep_learning_quant"], "report_section_labels": ["深度学习量化未来"], "category_label": "金融机器学习", "priority_label": "低", "source_type_label": "论文"}, {"id": "a2d3abbc2ad7546f036b42c1e6310d8550683d69d1a69e75c2c890ec2d00f28f", "source": "arXiv", "source_type": "paper", "title": "Stochastic Modelling of High-frequency (HF) Crypto Limit Order Book (LOB) with General Compound Marked Hawkes Process", "url": "http://arxiv.org/abs/2611.20839v1", "authors": ["Mine Caglar", "Serhat Guldogan", "Anatoliy Swishchuk"], "published_at": "2026-11-16", "collected_at": "2026-11-18T04:01:32Z", "raw_text": "The paper is devoted to the stochastic modelling of high-frequency crypto Limit Order Book (LOB) with general compound marked Hawkes process (GCMHP). We consider marked Hawkes process in a general form. LLN and FCLTs with stochastic and constant centralization are stated. Numerical example for high-frequency LOB dataset for BTC (bitcoin) based on sources from HF crypto LOB data is presented as well. The novelty of the paper lies in the new LLN and FCLTs for the GCMHP, and in the new application associated with high-frequency (HF) crypto LOB.", "abstract": "The paper is devoted to the stochastic modelling of high-frequency crypto Limit Order Book (LOB) with general compound marked Hawkes process (GCMHP). We consider marked Hawkes process in a general form. LLN and FCLTs with stochastic and constant centralization are stated. Numerical example for high-frequency LOB dataset for BTC (bitcoin) based on sources from HF crypto LOB data is presented as well. The novelty of the paper lies in the new LLN and FCLTs for the GCMHP, and in the new application associated with high-frequency (HF) crypto LOB.", "content_hash": "dbe2a64fc4f20451f3ca83630cfbb151b971c6f50902cf67685a489ff6f11845", "category": "Market Microstructure", "tags": ["bitcoin", "crypto", "dataset", "limit order book", "order book"], "language": "en", "metadata": {"arxiv_categories": ["q-fin.MF", "math.PR"]}, "one_line_summary": "用广义复合标记 Hawkes 过程建模 BTC 高频限价订单簿，给出 LLN 与 FCLT，但摘要未披露预测精度或夏普", "technical_summary": "针对加密市场高频限价订单簿的事件到达、订单规模与聚集性建模问题，采用广义复合标记 Hawkes 过程（GCMHP）描述带标记的订单事件流。理论部分给出随机中心化与常数中心化下的大数定律（LLN）和泛函中心极限定理（FCLT），用于刻画高频事件累计量的极限行为。数值部分使用 BTC 高频 LOB 数据做示例，但摘要未报告参数估计误差、拟合优度、仿真/预测精度、回测夏普或交易成本节省等量化结果。", "key_points": ["用广义复合标记 Hawkes 过程建模 BTC 高频 LOB，给出 LLN/FCLT；摘要无精度或夏普数字。", "需逐笔 LOB 事件与标记数据，标定 Hawkes 核和复合标记分布；无代码与参数细节，复现难度高。", "仅给 BTC 数值例，未报告样本外拟合/预测、交易成本与参数稳定性；理论假设可能偏离真实 LOB。"], "quant_relevance": "执行 / 交易成本；风险建模", "possible_use_case": "在 BTC/USDT 逐笔 LOB 数据上标定 GCMHP，生成订单到达与撤单强度仿真路径，用于做市报价间距和库存风险的场景测试；先与标准 Hawkes 基线比较事件强度拟合的 AIC/BIC 与样本外似然。", "limitations": "摘要仅覆盖理论 LLN/FCLT 与 BTC 数值例，未披露参数估计方法、样本区间、样本外误差和交易成本；无代码与数据细节，复现性不足；标记 Hawkes 标定对高频数据质量和计算量要求高，过拟合与市场制度变化风险需独立验证。", "read_priority": "中", "key_figures_md": "- **arXiv HTML**：原文图表入口：https://arxiv.org/html/2611.20839；摘要未列出具体图表编号或性能对比\n- [原文图表（HTML版）](https://arxiv.org/html/2611.20839)", "relevance_score": 5.4, "novelty_score": 9.565, "academic_score": 9.184, "discussion_score": 2.0, "actionable_score": 5.5, "final_score": 6.311, "display_title": "加密资产、订单簿研究论文", "tldr": "用广义复合标记 Hawkes 过程建模 BTC 高频限价订单簿，给出 LLN 与 FCLT，但摘要未披露预测精度或夏普", "core_value": "对你的量化工作帮助：把它拆成一个市场微观结构复现任务，先验证加密资产、订单簿是否真的带来样本外提升，再检查交易成本、数据泄漏和换手约束。", "key_points_list": ["用广义复合标记 Hawkes 过程建模 BTC 高频 LOB，给出 LLN/FCLT；摘要无精度或夏普数字。", "需逐笔 LOB 事件与标记数据，标定 Hawkes 核和复合标记分布；无代码与参数细节，复现难度高。", "仅给 BTC 数值例，未报告样本外拟合/预测、交易成本与参数稳定性；理论假设可能偏离真实 LOB。"], "reference_url": "http://arxiv.org/abs/2611.20839v1", "report_sections": ["deep_learning_quant"], "report_section_labels": ["深度学习量化未来"], "category_label": "市场微观结构", "priority_label": "中", "source_type_label": "论文"}, {"id": "09699eea1cce8e38ddb854892f30f2d1328abb6d1627c855d0e67fc36379cc71", "source": "Quant StackExchange", "source_type": "forum", "title": "Using Tom/Next contracts for daily hedging", "url": "https://quant.stackexchange.com/questions/86947/using-tom-next-contracts-for-daily-hedging", "authors": ["Sishmasquash"], "published_at": "2026-11-17", "collected_at": "2026-11-18T04:12:49Z", "raw_text": "Is it feasible to replicate a daily currency hedging mechanism using tom/next contracts analogous to rolling 1M forwards each month. The approximate PnL for the monthly case would be: [1] SP(t) / F(t,T) - SP(t) / SP(T) excluding holiday adjustments etc. which roughly equates to Forward return - spot return for a given period, assuming the hedged exposure is between t and T. For the daily case it should be ok to use Spot Next outright (treat as a forward) to yield: [2] SP(t) / SN(t) - SP(t) / SP(T) but the treatment changes with TN contracts for T+2 currency pairs when the forward points hedge the period before spot date. How might a similar PnL formula be constructed to find the forward return - spot return for a single day fx exposure in this case? Any help appreciated!", "abstract": "Is it feasible to replicate a daily currency hedging mechanism using tom/next contracts analogous to rolling 1M forwards each month. The approximate PnL for the monthly case would be: [1] SP(t) / F(t,T) - SP(t) / SP(T) excluding holiday adjustments etc. which roughly equates to Forward return - spot return for a given period, assuming the hedged exposure is between t and T. For the daily case it should be ok to use Spot Next outright (treat as a forward) to yield: [2] SP(t) / SN(t) - SP(t) / SP(T) but the treatment changes with TN contracts for T+2 currency pairs when the forward points hedge the period before spot date. How might a similar PnL formula be constructed to find the forward return - spot return for a single day fx exposure in this case? Any help appreciated!", "content_hash": "bac2f275f9489f8acb3495b58b78e088abcb6b6e4e011b73259653362b6a401c", "category": "Risk Management", "tags": ["exposure", "hedging"], "language": "en", "metadata": {"feed_url": "https://quant.stackexchange.com/feeds"}, "one_line_summary": "用 Tom/Next 合约替代 1M forward 做每日 FX 对冲：SN 近似 PnL 可写，T+2 货币对的 TN 分解仍待解", "technical_summary": "这是 Quant StackExchange 的风险管理提问，不是有结论的讨论帖。提问者想把每月滚动 1M forward 的 FX 对冲改成每日滚动 Tom/Next 合约，并给出月度 PnL 近似 [1] SP(t)/F(t,T)-SP(t)/SP(T) 与日度 SN 版本 [2] SP(t)/SN(t)-SP(t)/SP(T)。难点在于 T+2 货币对：TN 的远期点覆盖 spot date 之前的一段，无法直接套用 SN 公式；原帖没有给出答案或社区共识。", "key_points": ["帖子最有价值处是把滚动对冲 PnL 拆成 forward return - spot return，并给出月度[1]与SN日度[2]近似，但无社区答复。", "若做日频FX对冲，先按交割规则区分 SN 与 TN：T+2 货币对用 TN 时需把 forward points 归因到 spot 前区间，再与 spot return 对账。", "无回答且未处理节假日、结算日错配、TN 点差和 roll 成本；T+2 直接套[2]会漏掉 spot 前 forward points，PnL 偏差。"], "quant_relevance": "风险建模：FX 每日滚动对冲的 PnL 归因；执行/交易成本：TN/SN 点差与 roll 成本核算。", "possible_use_case": "在 FX 风险系统里做 A/B 测试：对 T+2 货币对分别用 1M forward 月度 roll 与 TN/SN 日度 roll 回测，比较 PnL 分解误差、点差成本和结算日错配。", "limitations": "这是社区讨论且原帖无回答，需自行推导 TN 在 T+2 下的 PnL 公式；未给数据、货币对、节假日日历和交易成本假设，需用数据验证后才能用于研究结论。", "read_priority": "中", "key_figures_md": "", "relevance_score": 5.4, "novelty_score": 9.78, "academic_score": 4.976, "discussion_score": 3.0, "actionable_score": 4.5, "final_score": 5.672, "display_title": "风险管理实践讨论", "tldr": "用 Tom/Next 合约替代 1M forward 做每日 FX 对冲：SN 近似 PnL 可写，T+2 货币对的 TN 分解仍待解", "core_value": "对你的量化工作帮助：把它当作风险管理的实盘经验线索，用来补充回测假设、交易成本假设或风控检查清单。", "key_points_list": ["帖子最有价值处是把滚动对冲 PnL 拆成 forward return - spot return，并给出月度[1]与SN日度[2]近似，但无社区答复。", "若做日频FX对冲，先按交割规则区分 SN 与 TN：T+2 货币对用 TN 时需把 forward points 归因到 spot 前区间，再与 spot return 对账。", "无回答且未处理节假日、结算日错配、TN 点差和 roll 成本；T+2 直接套[2]会漏掉 spot 前 forward points，PnL 偏差。"], "reference_url": "https://quant.stackexchange.com/questions/86947/using-tom-next-contracts-for-daily-hedging", "report_sections": ["ai_quant_tools"], "report_section_labels": ["AI 量化工具"], "category_label": "风险管理", "priority_label": "中", "source_type_label": "论坛"}, {"id": "603cc5c7a4b647bf2df48c50751866344c0f4eb0be9a3047b8cb4b863108f968", "source": "Decrypt", "source_type": "crypto_news", "title": "Bitcoin Investors Are Capitulating—That’s Historically Been a Bottom Signal", "url": "https://decrypt.co/383466/bitcoin-investors-capitulating-historical-bottom-signal", "authors": [], "published_at": "2026-11-17", "collected_at": "2026-11-18T04:12:50Z", "raw_text": "Glassnode says Bitcoin’s realized losses have reached levels seen only near the 2018, 2020, 2022 and early 2023 lows, as buyers defend the $62,000 to $66,000 range.", "abstract": "Glassnode says Bitcoin’s realized losses have reached levels seen only near the 2018, 2020, 2022 and early 2023 lows, as buyers defend the $62,000 to $66,000 range.", "content_hash": "0ab9d9de9be138aa730ddcbb6afbae48a9ddb086651e8beda3435e4a97ccc359", "category": "Alpha / Factor Research", "tags": ["bitcoin", "signal"], "language": "en", "metadata": {"feed_url": "https://decrypt.co/feed"}, "one_line_summary": "Glassnode 称 BTC 已实现亏损触及 2018/2020/2022/2023 初四次底部同级水平，买方死守 6.2 万–6.6 万美元区间", "technical_summary": "核心矛盾是：链上「已实现亏损」这一成本基础指标是否已进入历史底部区间。Glassnode 用 realized loss 绝对值对标四个历史时点——2018 年熊市底、2020 年 3 月流动性冲击、2022 年 FTX 崩盘、2023 年初低点，判定当前处于投降式抛售（capitulation）阶段。价格层面的对应信息是买方在 62,000–66,000 美元区间防守，即该区间被当作成本换手与止损集中的支撑带。给出的量化锚点只有两个：四个历史可比时点、以及 6.2 万–6.6 万美元的价格防守区间；原文未披露已实现亏损的具体美元金额、统计窗口（日/周/月）和 Z-score 数值。结论方向是「投降常出现在底部附近」，属于典型的左侧反转假设，而非趋势确认。", "key_points": ["已实现亏损量级与 2018、2020、2022、2023 年初四个历史低点同级，价格防守区间锁定在 62,000–66,000 美元。", "可直接构造链上投降因子：realized loss 的 7 日 / 30 日 Z-score 或占市值比例，与资金费率、未平仓合约、稳定币净流入做组合确认，用于左侧建仓或卖出波动率。", "样本仅四个历史事件，且原文未给出亏损绝对金额、统计窗口与发布时间戳；投降信号历史上可提前数周触发，价格仍可能继续下探 15%–30%，单指标入场是主要亏损来源。"], "quant_relevance": "因子 / alpha 信号（链上投降类反转因子）+ 风险建模（下跌尾部与波动率定价）", "possible_use_case": "把 Glassnode realized loss 的 7 日 Z-score 作为特征接入 BTC 日频择时模型：以 2018-01 至 2025-06 为样本，事件定义为 Z-score 进入历史前 5% 分位，统计事件后 20/60 日 forward return 分布与胜率；同时在 62,000–66,000 区间用期权 skew 与资金费率做二次确认，只在高 Z-score 且资金费率转负时开多，否则仅做空波动率。", "limitations": "信息来源极薄：原文正文仅为一句重复的摘要，无具体已实现亏损金额、无统计口径、无时间戳，无法判断数据截止日。样本量四次的统计显著性几乎为零，且四次「底部」中有 2018 与 2022 属于投降后继续下跌数周的案例，信号存在明显提前量。链上 realized loss 依赖交易所标注与 UTXO 聚类质量，跨交易所口径差异会直接扭曲 Z-score。此外新闻媒体对 Glassnode 指标的转述常有选择偏差，需回溯原始 Glassnode 图表与链上数据自行复核后才能进入模型。", "read_priority": "高", "key_figures_md": "", "relevance_score": 4.2, "novelty_score": 9.78, "academic_score": 5.705, "discussion_score": 2.0, "actionable_score": 6.5, "final_score": 5.672, "display_title": "阿尔法 / 因子研究加密市场新闻情报", "tldr": "Glassnode 称 BTC 已实现亏损触及 2018/2020/2022/2023 初四次底部同级水平，买方死守 6.2 万–6.6 万美元区间", "core_value": "对你的量化工作帮助：围绕阿尔法 / 因子研究补充研究素材，进一步判断是否能转化成因子、回测、风控或工程任务。", "key_points_list": ["已实现亏损量级与 2018、2020、2022、2023 年初四个历史低点同级，价格防守区间锁定在 62,000–66,000 美元。", "可直接构造链上投降因子：realized loss 的 7 日 / 30 日 Z-score 或占市值比例，与资金费率、未平仓合约、稳定币净流入做组合确认，用于左侧建仓或卖出波动率。", "样本仅四个历史事件，且原文未给出亏损绝对金额、统计窗口与发布时间戳；投降信号历史上可提前数周触发，价格仍可能继续下探 15%–30%，单指标入场是主要亏损来源。"], "reference_url": "https://decrypt.co/383466/bitcoin-investors-capitulating-historical-bottom-signal", "report_sections": ["daily_news"], "report_section_  / 波动率", "Market Microstructure": "市场微观结构", "Execution / Transaction Cost": "交易执行 / 交易成本", "Machine Learning for Finance": "金融机器学习", "LLM / Agents for Quant": "量化大模型 / 智能体", "Crypto Quant": "加密资产量化", "Data Engineering": "数据工程", "Backtesting / Research Tools": "回测 / 研究工具", "Industry / Career": "行业 / 职业 / 合规", "Unclassified": "未分类"}, "priority_labels": {"High": "高", "Medium": "中", "Low": "低", "高": "高", "中": "中", "低": "低"}, "source_type_labels": {"paper": "论文", "forum": "论坛", "github": "代码仓库", "blog": "博客", "news": "新闻", "social": "社交媒体", "zhihu": "知乎", "x": "X", "quantml": "QuantML", "crypto_news": "加密市场新闻"}, "report_config": {"max_items_per_category": 5, "max_total_items": 60, "executive_brief_items": 5}}</script>
  <script>
    const payload = JSON.parse(document.getElementById('dashboard-data').textContent);
    const items = payload.items || [];
    const categoryLabels = payload.category_labels || {};
    const priorityLabels = payload.priority_labels || {};
    const sourceTypeLabels = payload.source_type_labels || {};
    const state = {
      query: '',
      section: 'All',
      category: 'All',
      sort: 'score',
      activeId: items[0]?.id || null,
    };

    const priorityRank = { High: 3, Medium: 2, Low: 1, '高': 3, '中': 2, '低': 1 };
    const $ = (id) => document.getElementById(id);

    // --- Feedback ---
    const _feedbackStore = JSON.parse(localStorage.getItem('quant-feedback') || '{}');
    function getFeedback(id) { return _feedbackStore[id] || 0; }
    function setFeedback(id, signal) {
      if (_feedbackStore[id] === signal) { delete _feedbackStore[id]; signal = 0; }
      else { _feedbackStore[id] = signal; }
      localStorage.setItem('quant-feedback', JSON.stringify(_feedbackStore));
      fetch('http://localhost:8080/feedback', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id, signal }),
      }).catch(() => {});
    }

    function init() {
      $('report-date').textContent = payload.report_date + ' - 主力源：arXiv / 知乎 / QuantML / 大型论坛 - 生成时间 ' + payload.generated_at;
      $('metric-items').textContent = items.length;
      $('metric-categories').textContent = new Set(items.map((item) => item.category)).size;
      $('metric-high').textContent = items.filter((item) => priorityLabel(item.read_priority) === '高').length;
      $('metric-avg').textContent = averageScore(items).toFixed(1);

      buildSectionControls();
      buildCategoryControls();
      buildSourceList();
      bindControls();
      render();
    }

    function bindControls() {
      $('search').addEventListener('input', (event) => {
        state.query = event.target.value.trim().toLowerCase();
        render();
      });
      $('category-select').addEventListener('change', (event) => {
        state.category = event.target.value;
        render();
      });
      $('section-select').addEventListener('change', (event) => {
        state.section = event.target.value;
        render();
      });
      $('sort-select').addEventListener('change', (event) => {
        state.sort = event.target.value;
        render();
      });
    }

    function buildCategoryControls() {
      const counts = countBy(items, 'category');
      const categories = Object.keys(counts).sort();
      const select = $('category-select');
      select.innerHTML = option('All', `全部细分标签 (${items.length})`) +
        categories.map((category) => option(category, `${categoryLabel(category)} (${counts[category]})`)).join('');

      const list = $('category-list');
      list.innerHTML = categoryButton('All', items.length) +
        categories.map((category) => categoryButton(category, counts[category])).join('');

      list.querySelectorAll('button').forEach((button) => {
        button.addEventListener('click', () => {
          state.category = button.dataset.category;
          select.value = state.category;
          if (state.category === 'All') {
            state.section = 'All';
            $('section-select').value = 'All';
          }
          render();
        });
      });
    }

    function buildSectionControls() {
      const counts = payload.section_counts || {};
      const sections = payload.sections || [];
      const select = $('section-select');
      select.innerHTML = option('All', `全部主线 (${items.length})`) +
        sections
          .filter((section) => counts[section.key])
          .map((section) => option(section.key, `${section.label} (${counts[section.key]})`))
          .join('');

      const list = $('section-list');
      list.innerHTML = sectionButton('All', '全部', items.length) +
        sections
          .filter((section) => counts[section.key])
          .map((section) => sectionButton(section.key, section.label, counts[section.key]))
          .join('');

      list.querySelectorAll('button').forEach((button) => {
        button.addEventListener('click', () => {
          state.section = button.dataset.section;
          select.value = state.section;
          if (state.section === 'All') {
            state.category = 'All';
            $('category-select').value = 'All';
          }
          render();
        });
      });
    }

    function buildSourceList() {
      const stats = payload.source_stats || {};
      const entries = Object.entries(stats)
        .filter(([source]) => !source.startsWith('fetched:'))
        .sort((a, b) => b[1] - a[1]);
      $('source-list').innerHTML = entries.length
        ? entries.map(([source, count]) => `<li><span>${escapeHtml(source)}</span><b>${count}</b></li>`).join('')
        : '<li><span>暂无来源统计</span><b>0</b></li>';
    }

    function render() {
      let visible = items.filter(matchesFilters);
      visible = sortItems(visible);
      if (!visible.some((item) => item.id === state.activeId)) {
        state.activeId = visible[0]?.id || null;
      }

      $('feed-title').textContent = feedTitle();
      $('result-count').textContent = `展示 ${visible.length} 条 - 两条主线每条最多 ${payload.report_config.max_items_per_category} 条`;
      renderSectionActive();
      renderCategoryActive();
      renderItems(visible);
      renderDetail(visible.find((item) => item.id === state.activeId) || visible[0]);
    }

    function matchesFilters(item) {
      const sectionMatch = state.section === 'All' || (item.report_sections || []).includes(state.section);
      if (!sectionMatch) return false;
      const categoryMatch = state.category === 'All' || item.category === state.category;
      if (!categoryMatch) return false;
      if (!state.query) return true;
      const haystack = [
        item.title,
        item.display_title,
        item.source,
        item.source_type,
        item.category,
        categoryLabel(item.category),
        sectionLabel(item.report_sections?.[0]),
        sourceTypeLabel(item.source_type),
        priorityLabel(item.read_priority),
        item.one_line_summary,
        item.technical_summary,
        item.quant_relevance,
        item.possible_use_case,
        item.tldr,
        item.core_value,
        ...(item.key_points_list || []),
        item.reference_url,
      ].join(' ').toLowerCase();
      return haystack.includes(state.query);
    }

    function sortItems(list) {
      return [...list].sort((a, b) => {
        if (state.sort === 'priority') {
          return (priorityRank[b.read_priority] || 0) - (priorityRank[a.read_priority] || 0)
            || b.final_score - a.final_score;
        }
        if (state.sort === 'source') {
          return a.source.localeCompare(b.source) || b.final_score - a.final_score;
        }
        return b.final_score - a.final_score;
      });
    }

    function renderCategoryActive() {
      document.querySelectorAll('.category-button').forEach((button) => {
        button.classList.toggle('active', button.dataset.category === state.category);
      });
    }

    function renderSectionActive() {
      document.querySelectorAll('.section-button').forEach((button) => {
        button.classList.toggle('active', button.dataset.section === state.section);
      });
    }

    function itemCard(item) {
      const sec = item.report_sections?.[0] || 'other';
      const sig = getFeedback(item.id);
      return `
        <article class="item ${item.id === state.activeId ? 'active' : ''}"
                 data-id="${escapeAttr(item.id)}"
                 data-section="${escapeAttr(sec)}">
          <div class="item-top">
            <h3>${escapeHtml(item.display_title || item.title)}</h3>
            <div class="score">${Number(item.final_score).toFixed(1)}</div>
          </div>
          <div class="meta">
            <span class="tag">${escapeHtml(categoryLabel(item.category))}</span>
            <span class="tag">${escapeHtml(item.source)}</span>
            <span class="tag">${escapeHtml(priorityLabel(item.read_priority))}</span>
          </div>
          ${readerFormat(item, true)}
          <div class="feedback-row">
            <button class="feedback-btn ${sig === 1 ? 'active-up' : ''}" data-feedback="1" title="有用">👍</button>
            <button class="feedback-btn ${sig === -1 ? 'active-down' : ''}" data-feedback="-1" title="跳过">👎</button>
            <span class="feedback-hint">${sig === 1 ? '已标记有用' : sig === -1 ? '已标记跳过' : ''}</span>
          </div>
        </article>
      `;
    }

    function sectionGroupHeader(section, count) {
      return `
        <div class="section-group-header" data-section="${escapeAttr(section.key)}">
          <span class="section-group-title">${escapeHtml(section.label)}</span>
          <span class="section-group-count">${count} 条</span>
        </div>
      `;
    }

    function renderItems(visible) {
      const container = $('items');
      if (!visible.length) {
        container.innerHTML = '<div class="empty">当前筛选条件下没有匹配内容。</div>';
        return;
      }

      let html = '';
      if (state.section === 'All') {
        // Group by section in defined order, with a header for each group
        const grouped = {};
        for (const item of visible) {
          const sec = item.report_sections?.[0] || 'other';
          if (!grouped[sec]) grouped[sec] = [];
          grouped[sec].push(item);
        }
        for (const section of (payload.sections || [])) {
          const group = grouped[section.key];
          if (!group || !group.length) continue;
          html += sectionGroupHeader(section, group.length);
          html += group.map((item) => itemCard(item)).join('');
        }
        // Append any items that fell into 'other' (shouldn't normally happen)
        if (grouped['other']?.length) {
          html += grouped['other'].map((item) => itemCard(item)).join('');
        }
      } else {
        html = visible.map((item) => itemCard(item)).join('');
      }

      container.innerHTML = html;
      container.querySelectorAll('.item').forEach((node) => {
        node.addEventListener('click', () => {
          state.activeId = node.dataset.id;
          render();
        });
      });
      container.querySelectorAll('.feedback-btn').forEach((btn) => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const itemNode = btn.closest('.item');
          setFeedback(itemNode.dataset.id, parseInt(btn.dataset.feedback, 10));
          render();
        });
      });
    }

    function renderDetail(item) {
      const detail = $('detail');
      if (!item) {
        detail.innerHTML = '<div class="empty">选择一条内容查看详情。</div>';
        return;
      }

      detail.innerHTML = `
        <h2>${escapeHtml(item.display_title || item.title)}</h2>
        <div class="meta">
          <span class="tag">${escapeHtml(categoryLabel(item.category))}</span>
          <span class="tag">${escapeHtml(sourceTypeLabel(item.source_type))}</span>
          <span class="tag">${escapeHtml(priorityLabel(item.read_priority))}</span>
        </div>

        ${readerFormat(item, false)}

        <div class="detail-block">
          <h3>评分拆解</h3>
          <div class="breakdown">
            ${bar('相关性', item.relevance_score)}
            ${bar('新颖度', item.novelty_score)}
            ${bar('学术性', item.academic_score)}
            ${bar('讨论度', item.discussion_score)}
            ${bar('可行动性', item.actionable_score)}
          </div>
        </div>

      `;
    }

    function readerFormat(item, compact) {
      const points = itemKeyPoints(item);
      return `
        <div class="reader-format ${compact ? 'compact' : ''}">
          <div class="reader-block">
            <h4>1. 这篇文章的太长不读</h4>
            <p>${escapeHtml(item.tldr || item.one_line_summary || '')}</p>
          </div>
          <div class="reader-block">
            <h4>2. 核心价值，对我量化的工作能够提供什么样的帮助</h4>
            <p>${escapeHtml(item.core_value || '')}</p>
          </div>
          <div class="reader-block">
            <h4>3. 关键核心点 / 论文或帖子摘要</h4>
            <ol>${points.map((point) => `<li>${escapeHtml(point)}</li>`).join('')}</ol>
          </div>
          <div class="reader-block">
            <h4>4. 原文链接</h4>
            ${referenceHtml(item)}
          </div>
        </div>
      `;
    }

    function itemKeyPoints(item) {
      const points = Array.isArray(item.key_points_list)
        ? item.key_points_list
        : (Array.isArray(item.key_points) ? item.key_points : []);
      const clean = points.filter(Boolean).slice(0, 3);
      return clean.length ? clean : ['需要打开原文进一步确认方法、数据和适用边界。'];
    }

    function referenceHtml(item) {
      const url = item.reference_url || '';
      if (!url) return '<p>暂无可打开链接</p>';
      return `
        <a class="reader-reference" href="${escapeAttr(url)}" target="_blank" rel="noopener noreferrer">打开原文</a>
        <small class="reference-url">${escapeHtml(url)}</small>
      `;
    }

    function bar(label, value) {
      const score = Number(value || 0);
      const width = Math.max(0, Math.min(100, score * 10));
      return `
        <div class="bar">
          <span>${label}</span>
          <div class="bar-track"><div class="bar-fill" style="width: ${width}%"></div></div>
          <b>${score.toFixed(1)}</b>
        </div>
      `;
    }

    function countBy(list, key) {
      return list.reduce((acc, item) => {
        acc[item[key]] = (acc[item[key]] || 0) + 1;
        return acc;
      }, {});
    }

    function averageScore(list) {
      if (!list.length) return 0;
      return list.reduce((sum, item) => sum + Number(item.final_score || 0), 0) / list.length;
    }

    function option(value, label) {
      return `<option value="${escapeAttr(value)}">${escapeHtml(label)}</option>`;
    }

    function sectionButton(section, label, count) {
      return `
        <button class="category-button section-button" type="button" data-section="${escapeAttr(section)}">
          <span>${escapeHtml(label)}</span>
          <span class="count">${count}</span>
        </button>
      `;
    }

    function categoryButton(category, count) {
      return `
        <button class="category-button" type="button" data-category="${escapeAttr(category)}">
          <span>${escapeHtml(category === 'All' ? '全部' : categoryLabel(category))}</span>
          <span class="count">${count}</span>
        </button>
      `;
    }

    function categoryLabel(category) {
      return categoryLabels[category] || category;
    }

    function sectionLabel(sectionKey) {
      const section = (payload.sections || []).find((item) => item.key === sectionKey);
      return section ? section.label : '其他';
    }

    function feedTitle() {
      const parts = [];
      if (state.section !== 'All') parts.push(sectionLabel(state.section));
      if (state.category !== 'All') parts.push(categoryLabel(state.category));
      return parts.length ? parts.join(' / ') : '今日情报';
    }

    function priorityLabel(priority) {
      return priorityLabels[priority] || priority;
    }

    function sourceTypeLabel(sourceType) {
      return sourceTypeLabels[sourceType] || sourceType;
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function escapeAttr(value) {
      return escapeHtml(value).replaceAll('`', '&#096;');
    }

    init();
  </script>
</body>
</html>
